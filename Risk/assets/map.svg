<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet" id="risk-map">
  <!-- Parchment background -->
  <defs>
    <radialGradient id="parchment" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#f5e6c8"/>
      <stop offset="60%" stop-color="#e8d4a4"/>
      <stop offset="100%" stop-color="#c9a875"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.4  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.08 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <pattern id="oceanTexture" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="url(#parchment)"/>
    </pattern>
    <filter id="territoryShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ocean backdrop -->
  <rect width="1000" height="700" fill="url(#parchment)"/>
  <rect width="1000" height="700" fill="url(#oceanTexture)" opacity="0.4"/>
  <rect width="1000" height="700" filter="url(#grain)" opacity="0.3"/>

  <!-- Decorative ocean labels -->
  <text x="200" y="640" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#8b6f47" opacity="0.55">Pacific Ocean</text>
  <text x="380" y="640" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#8b6f47" opacity="0.55" transform="rotate(-65 380 640)">Atlantic Ocean</text>
  <text x="750" y="640" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#8b6f47" opacity="0.55">Indian Ocean</text>
  <text x="200" y="50" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#8b6f47" opacity="0.55">Arctic Ocean</text>

  <!-- =================== NORTH AMERICA (9 territories) =================== -->
  <g id="northAmerica" data-continent="northAmerica" fill="#fbbf24" stroke="#5b3a0f" stroke-width="1.5" stroke-linejoin="round" filter="url(#territoryShadow)">
    <path id="t-alaska" data-territory="alaska" d="M 30,140 L 90,120 L 150,130 L 200,150 L 210,200 L 170,230 L 130,225 L 90,210 L 60,190 L 35,170 Z"/>
    <path id="t-northwest" data-territory="northwest" d="M 200,150 L 260,130 L 300,150 L 310,180 L 270,200 L 220,195 L 200,175 Z"/>
    <path id="t-greenland" data-territory="greenland" d="M 360,50 L 440,40 L 480,70 L 470,120 L 430,150 L 380,140 L 350,100 Z"/>
    <path id="t-alberta" data-territory="alberta" d="M 200,200 L 240,195 L 270,215 L 260,250 L 220,255 L 195,235 Z"/>
    <path id="t-ontario" data-territory="ontario" d="M 270,215 L 320,210 L 350,235 L 340,270 L 295,275 L 260,250 Z"/>
    <path id="t-quebec" data-territory="quebec" d="M 350,215 L 400,210 L 420,240 L 410,270 L 370,275 L 340,250 Z"/>
    <path id="t-western_us" data-territory="western_us" d="M 180,280 L 240,275 L 280,295 L 275,335 L 220,345 L 175,325 Z"/>
    <path id="t-eastern_us" data-territory="eastern_us" d="M 280,295 L 340,290 L 360,320 L 350,355 L 300,360 L 275,335 Z"/>
    <path id="t-central_america" data-territory="central_america" d="M 235,360 L 280,365 L 295,395 L 270,420 L 230,410 L 215,385 Z"/>
  </g>

  <!-- =================== SOUTH AMERICA (4) =================== -->
  <g id="southAmerica" data-continent="southAmerica" fill="#ef4444" stroke="#5b3a0f" stroke-width="1.5" stroke-linejoin="round" filter="url(#territoryShadow)">
    <path id="t-venezuela" data-territory="venezuela" d="M 340,420 L 395,415 L 410,450 L 395,475 L 360,480 L 335,455 Z"/>
    <path id="t-brazil" data-territory="brazil" d="M 380,475 L 440,475 L 460,510 L 450,555 L 410,565 L 380,540 L 370,505 Z"/>
    <path id="t-peru" data-territory="peru" d="M 335,500 L 385,495 L 400,535 L 380,575 L 345,575 L 325,540 Z"/>
    <path id="t-argentina" data-territory="argentina" d="M 350,580 L 395,575 L 405,615 L 390,650 L 365,660 L 345,625 Z"/>
  </g>

  <!-- =================== EUROPE (7) =================== -->
  <g id="europe" data-continent="europe" fill="#3b82f6" stroke="#5b3a0f" stroke-width="1.5" stroke-linejoin="round" filter="url(#territoryShadow)">
    <path id="t-iceland" data-territory="iceland" d="M 480,120 L 520,115 L 535,140 L 520,160 L 485,160 L 470,140 Z"/>
    <path id="t-scandinavia" data-territory="scandinavia" d="M 555,130 L 595,125 L 615,155 L 605,185 L 570,190 L 550,160 Z"/>
    <path id="t-ukraine" data-territory="ukraine" d="M 615,155 L 680,150 L 720,175 L 720,215 L 685,235 L 635,225 L 605,190 Z"/>
    <path id="t-great_britain" data-territory="great_britain" d="M 505,195 L 540,190 L 555,220 L 540,250 L 510,245 L 495,220 Z"/>
    <path id="t-northern_europe" data-territory="northern_europe" d="M 555,200 L 600,195 L 620,220 L 610,250 L 570,250 L 555,225 Z"/>
    <path id="t-western_europe" data-territory="western_europe" d="M 510,260 L 555,255 L 575,285 L 560,315 L 515,315 L 500,285 Z"/>
    <path id="t-southern_europe" data-territory="southern_europe" d="M 580,260 L 625,255 L 645,285 L 635,315 L 595,320 L 575,295 Z"/>
  </g>

  <!-- =================== AFRICA (6) =================== -->
  <g id="africa" data-continent="africa" fill="#a16207" stroke="#5b3a0f" stroke-width="1.5" stroke-linejoin="round" filter="url(#territoryShadow)">
    <path id="t-north_africa" data-territory="north_africa" d="M 530,355 L 600,350 L 635,375 L 625,415 L 575,425 L 530,405 Z"/>
    <path id="t-egypt" data-territory="egypt" d="M 615,350 L 660,350 L 680,380 L 670,415 L 635,415 L 615,385 Z"/>
    <path id="t-east_africa" data-territory="east_africa" d="M 660,420 L 710,420 L 730,455 L 720,495 L 680,500 L 660,470 Z"/>
    <path id="t-congo" data-territory="congo" d="M 595,440 L 650,440 L 660,475 L 640,510 L 600,505 L 580,470 Z"/>
    <path id="t-south_africa" data-territory="south_africa" d="M 615,535 L 660,530 L 685,560 L 670,595 L 635,600 L 615,575 Z"/>
    <path id="t-madagascar" data-territory="madagascar" d="M 720,545 L 745,540 L 760,570 L 750,600 L 725,595 L 715,570 Z"/>
  </g>

  <!-- =================== ASIA (12) =================== -->
  <g id="asia" data-continent="asia" fill="#22c55e" stroke="#5b3a0f" stroke-width="1.5" stroke-linejoin="round" filter="url(#territoryShadow)">
    <path id="t-ural" data-territory="ural" d="M 720,160 L 765,150 L 790,180 L 785,215 L 745,225 L 720,195 Z"/>
    <path id="t-siberia" data-territory="siberia" d="M 790,115 L 855,105 L 875,135 L 865,170 L 815,180 L 785,150 Z"/>
    <path id="t-yakutsk" data-territory="yakutsk" d="M 855,85 L 905,80 L 925,110 L 920,140 L 875,150 L 855,120 Z"/>
    <path id="t-kamchatka" data-territory="kamchatka" d="M 910,125 L 965,120 L 980,150 L 970,185 L 925,190 L 905,160 Z"/>
    <path id="t-irkutsk" data-territory="irkutsk" d="M 825,170 L 875,165 L 890,200 L 875,230 L 835,235 L 815,205 Z"/>
    <path id="t-afghanistan" data-territory="afghanistan" d="M 720,225 L 770,220 L 790,250 L 780,285 L 740,290 L 720,260 Z"/>
    <path id="t-middle_east" data-territory="middle_east" d="M 675,280 L 730,275 L 755,305 L 745,335 L 705,340 L 680,310 Z"/>
    <path id="t-india" data-territory="india" d="M 750,290 L 800,285 L 820,320 L 810,355 L 775,365 L 755,335 Z"/>
    <path id="t-siam" data-territory="siam" d="M 805,330 L 855,325 L 870,360 L 855,395 L 815,400 L 800,370 Z"/>
    <path id="t-china" data-territory="china" d="M 805,225 L 870,220 L 895,255 L 885,295 L 825,300 L 800,265 Z"/>
    <path id="t-mongolia" data-territory="mongolia" d="M 825,190 L 885,185 L 905,215 L 895,245 L 845,250 L 820,225 Z"/>
    <path id="t-japan" data-territory="japan" d="M 895,225 L 925,220 L 940,250 L 930,280 L 900,275 L 890,250 Z"/>
  </g>

  <!-- =================== AUSTRALIA (4) =================== -->
  <g id="australia" data-continent="australia" fill="#a855f7" stroke="#5b3a0f" stroke-width="1.5" stroke-linejoin="round" filter="url(#territoryShadow)">
    <path id="t-indonesia" data-territory="indonesia" d="M 810,415 L 870,410 L 885,440 L 870,465 L 820,465 L 805,440 Z"/>
    <path id="t-new_guinea" data-territory="new_guinea" d="M 885,395 L 935,390 L 950,420 L 935,450 L 895,445 L 880,420 Z"/>
    <path id="t-western_australia" data-territory="western_australia" d="M 820,475 L 880,470 L 895,505 L 880,540 L 835,545 L 815,510 Z"/>
    <path id="t-eastern_australia" data-territory="eastern_australia" d="M 890,470 L 945,465 L 960,500 L 945,535 L 900,540 L 885,505 Z"/>
  </g>

  <!-- Cross-ocean connector hints (dashed) -->
  <g id="connectors" stroke="#5b3a0f" stroke-width="1" stroke-dasharray="3,3" fill="none" opacity="0.45">
    <line x1="210" y1="170" x2="900" y2="160"/>  <!-- Alaska - Kamchatka -->
    <line x1="470" y1="100" x2="500" y2="135"/>  <!-- Greenland - Iceland -->
    <line x1="425" y1="510" x2="555" y2="395"/>  <!-- Brazil - N. Africa -->
    <line x1="530" y1="285" x2="555" y2="350"/>  <!-- W. Europe - N. Africa -->
  </g>

  <!-- Decorative compass rose (top-right) -->
  <g transform="translate(950,60)" opacity="0.55" fill="#5b3a0f" stroke="#5b3a0f" stroke-width="0.5">
    <circle r="22" fill="none"/>
    <polygon points="0,-20 4,0 0,20 -4,0" fill="#5b3a0f"/>
    <polygon points="-20,0 0,4 20,0 0,-4" fill="#5b3a0f" opacity="0.6"/>
    <text y="-26" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#5b3a0f" stroke="none">N</text>
  </g>

  <!-- Title cartouche (bottom-left) -->
  <g transform="translate(40, 580)" opacity="0.85">
    <rect width="180" height="100" fill="#f5e6c8" stroke="#5b3a0f" stroke-width="2" rx="4"/>
    <text x="90" y="30" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="22" font-weight="bold" fill="#7a1f1f">RISK</text>
    <text x="90" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="9" font-style="italic" fill="#5b3a0f">Single-Player Edition</text>
    <text x="20" y="68" font-family="Georgia, serif" font-size="9" fill="#5b3a0f">N.America 5</text>
    <text x="20" y="80" font-family="Georgia, serif" font-size="9" fill="#5b3a0f">S.America 2</text>
    <text x="20" y="92" font-family="Georgia, serif" font-size="9" fill="#5b3a0f">Africa 3</text>
    <text x="105" y="68" font-family="Georgia, serif" font-size="9" fill="#5b3a0f">Europe 5</text>
    <text x="105" y="80" font-family="Georgia, serif" font-size="9" fill="#5b3a0f">Asia 7</text>
    <text x="105" y="92" font-family="Georgia, serif" font-size="9" fill="#5b3a0f">Australia 2</text>
  </g>
</svg>
