<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet" id="risk-map">
  <!-- Parchment background -->
  <defs>
    <radialGradient id="parchment" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#f5e6c8"/>
      <stop offset="60%" stop-color="#e8d4a4"/>
      <stop offset="100%" stop-color="#c9a875"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.4  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.08 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="territoryShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ocean backdrop -->
  <rect width="1000" height="700" fill="url(#parchment)"/>
  <rect width="1000" height="700" filter="url(#grain)" opacity="0.3"/>

  <!-- Decorative ocean labels -->
  <text x="60" y="460" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#8b6f47" opacity="0.55" transform="rotate(-90 60 460)">Pacific Ocean</text>
  <text x="430" y="480" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#8b6f47" opacity="0.55" transform="rotate(-70 430 480)">Atlantic Ocean</text>
  <text x="790" y="660" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#8b6f47" opacity="0.55">Indian Ocean</text>
  <text x="150" y="60" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#8b6f47" opacity="0.55">Arctic Ocean</text>

  <!-- =================== NORTH AMERICA (9 territories) =================== -->
  <g id="northAmerica" data-continent="northAmerica" fill="#e8b84b" stroke="#4a2f0d" stroke-width="1.5" stroke-linejoin="round" filter="url(#territoryShadow)">
    <!-- Alaska: top-left peninsula -->
    <path id="t-alaska" data-territory="alaska"
      d="M 30,120 L 80,95 L 125,100 L 150,120 L 155,160 L 140,190 L 110,200 L 75,195 L 45,175 L 30,150 Z"/>
    <!-- Northwest Territory: broad central-top strip -->
    <path id="t-northwest" data-territory="northwest"
      d="M 155,100 L 220,85 L 275,95 L 300,120 L 305,160 L 265,180 L 215,185 L 165,175 L 150,145 L 155,115 Z"/>
    <!-- Greenland: top-right large mass -->
    <path id="t-greenland" data-territory="greenland"
      d="M 340,50 L 420,35 L 470,50 L 480,90 L 465,130 L 430,145 L 390,140 L 355,115 L 335,80 Z"/>
    <!-- Alberta: left-center -->
    <path id="t-alberta" data-territory="alberta"
      d="M 155,190 L 205,185 L 240,205 L 245,250 L 215,270 L 170,265 L 148,240 Z"/>
    <!-- Ontario: central -->
    <path id="t-ontario" data-territory="ontario"
      d="M 245,185 L 300,175 L 330,190 L 345,230 L 330,270 L 290,280 L 248,262 L 242,225 Z"/>
    <!-- Quebec: right of ontario -->
    <path id="t-quebec" data-territory="quebec"
      d="M 330,165 L 385,155 L 420,175 L 425,215 L 400,245 L 355,250 L 332,225 Z"/>
    <!-- Western US: left lower -->
    <path id="t-western_us" data-territory="western_us"
      d="M 145,275 L 205,270 L 250,285 L 265,340 L 240,370 L 180,370 L 145,345 L 138,305 Z"/>
    <!-- Eastern US: right lower -->
    <path id="t-eastern_us" data-territory="eastern_us"
      d="M 260,285 L 340,278 L 380,300 L 385,350 L 360,375 L 295,378 L 255,355 L 252,315 Z"/>
    <!-- Central America: bottom -->
    <path id="t-central_america" data-territory="central_america"
      d="M 195,378 L 255,370 L 285,390 L 290,420 L 265,440 L 220,438 L 195,415 L 188,395 Z"/>
  </g>

  <!-- =================== SOUTH AMERICA (4) =================== -->
  <g id="southAmerica" data-continent="southAmerica" fill="#c97c7c" stroke="#4a2f0d" stroke-width="1.5" stroke-linejoin="round" filter="url(#territoryShadow)">
    <!-- Venezuela: top -->
    <path id="t-venezuela" data-territory="venezuela"
      d="M 270,435 L 340,425 L 375,435 L 385,465 L 365,488 L 325,492 L 280,478 L 262,458 Z"/>
    <!-- Brazil: large right side -->
    <path id="t-brazil" data-territory="brazil"
      d="M 330,475 L 410,460 L 450,480 L 465,530 L 455,580 L 415,610 L 370,600 L 335,565 L 318,515 Z"/>
    <!-- Peru: left side -->
    <path id="t-peru" data-territory="peru"
      d="M 260,490 L 320,480 L 345,510 L 345,565 L 315,595 L 270,590 L 248,555 L 245,510 Z"/>
    <!-- Argentina: bottom -->
    <path id="t-argentina" data-territory="argentina"
      d="M 270,600 L 335,590 L 360,615 L 355,665 L 325,690 L 285,688 L 260,660 L 255,625 Z"/>
  </g>

  <!-- =================== EUROPE (7) =================== -->
  <g id="europe" data-continent="europe" fill="#7b8fc2" stroke="#4a2f0d" stroke-width="1.5" stroke-linejoin="round" filter="url(#territoryShadow)">
    <!-- Iceland: island top-center -->
    <path id="t-iceland" data-territory="iceland"
      d="M 480,105 L 520,98 L 540,118 L 530,145 L 500,150 L 478,135 Z"/>
    <!-- Scandinavia: top peninsula -->
    <path id="t-scandinavia" data-territory="scandinavia"
      d="M 548,100 L 590,90 L 620,105 L 625,145 L 600,170 L 565,175 L 545,155 L 540,125 Z"/>
    <!-- Ukraine: large eastern europe -->
    <path id="t-ukraine" data-territory="ukraine"
      d="M 620,100 L 680,92 L 730,108 L 748,145 L 740,195 L 700,215 L 655,210 L 625,185 L 618,148 Z"/>
    <!-- Great Britain: island west -->
    <path id="t-great_britain" data-territory="great_britain"
      d="M 495,165 L 530,158 L 550,182 L 545,218 L 520,228 L 496,212 L 487,188 Z"/>
    <!-- Northern Europe: center -->
    <path id="t-northern_europe" data-territory="northern_europe"
      d="M 555,175 L 598,168 L 622,188 L 625,222 L 598,238 L 558,235 L 540,215 L 542,192 Z"/>
    <!-- Western Europe: bottom-left -->
    <path id="t-western_europe" data-territory="western_europe"
      d="M 505,235 L 552,228 L 575,252 L 570,295 L 540,315 L 505,308 L 488,280 L 492,255 Z"/>
    <!-- Southern Europe: bottom-right -->
    <path id="t-southern_europe" data-territory="southern_europe"
      d="M 585,238 L 638,228 L 665,248 L 668,285 L 645,312 L 598,318 L 572,295 L 575,258 Z"/>
  </g>

  <!-- =================== AFRICA (6) =================== -->
  <g id="africa" data-continent="africa" fill="#b8945a" stroke="#4a2f0d" stroke-width="1.5" stroke-linejoin="round" filter="url(#territoryShadow)">
    <!-- North Africa: top-left, wide -->
    <path id="t-north_africa" data-territory="north_africa"
      d="M 490,328 L 585,320 L 640,332 L 648,368 L 615,395 L 552,400 L 495,385 L 480,355 Z"/>
    <!-- Egypt: top-right -->
    <path id="t-egypt" data-territory="egypt"
      d="M 650,320 L 698,318 L 718,342 L 718,378 L 690,398 L 650,395 L 632,370 L 635,340 Z"/>
    <!-- East Africa: right mid -->
    <path id="t-east_africa" data-territory="east_africa"
      d="M 655,400 L 722,390 L 752,415 L 758,462 L 735,492 L 690,498 L 655,470 L 645,435 Z"/>
    <!-- Congo: central -->
    <path id="t-congo" data-territory="congo"
      d="M 555,408 L 645,400 L 658,432 L 645,475 L 600,488 L 552,472 L 538,442 Z"/>
    <!-- South Africa: bottom-left -->
    <path id="t-south_africa" data-territory="south_africa"
      d="M 565,490 L 648,480 L 670,508 L 665,560 L 630,578 L 575,575 L 548,545 L 548,510 Z"/>
    <!-- Madagascar: island right -->
    <path id="t-madagascar" data-territory="madagascar"
      d="M 740,500 L 768,496 L 782,522 L 778,562 L 755,575 L 732,562 L 728,530 Z"/>
  </g>

  <!-- =================== ASIA (12) =================== -->
  <g id="asia" data-continent="asia" fill="#7aaf82" stroke="#4a2f0d" stroke-width="1.5" stroke-linejoin="round" filter="url(#territoryShadow)">
    <!-- Ural: connects Europe to Siberia -->
    <path id="t-ural" data-territory="ural"
      d="M 750,112 L 800,105 L 825,128 L 825,172 L 795,195 L 755,195 L 735,170 L 738,132 Z"/>
    <!-- Siberia: large central north Asia -->
    <path id="t-siberia" data-territory="siberia"
      d="M 825,88 L 890,75 L 928,95 L 932,140 L 898,168 L 845,172 L 820,148 L 818,108 Z"/>
    <!-- Yakutsk: top-right -->
    <path id="t-yakutsk" data-territory="yakutsk"
      d="M 912,68 L 958,62 L 978,88 L 972,128 L 942,145 L 908,138 L 895,112 L 900,80 Z"/>
    <!-- Kamchatka: far top-right peninsula -->
    <path id="t-kamchatka" data-territory="kamchatka"
      d="M 955,90 L 992,82 L 1002,115 L 998,158 L 965,172 L 940,158 L 938,125 L 948,100 Z"/>
    <!-- Irkutsk: south of Siberia -->
    <path id="t-irkutsk" data-territory="irkutsk"
      d="M 850,175 L 900,168 L 928,192 L 928,232 L 895,248 L 850,245 L 828,222 L 830,192 Z"/>
    <!-- Afghanistan: central west -->
    <path id="t-afghanistan" data-territory="afghanistan"
      d="M 742,198 L 798,192 L 825,215 L 825,258 L 795,278 L 748,278 L 728,255 L 730,218 Z"/>
    <!-- Middle East: south-west asia -->
    <path id="t-middle_east" data-territory="middle_east"
      d="M 668,295 L 728,285 L 758,308 L 762,350 L 732,372 L 688,368 L 660,342 L 658,312 Z"/>
    <!-- India: south-central -->
    <path id="t-india" data-territory="india"
      d="M 760,280 L 820,272 L 848,300 L 845,358 L 810,385 L 768,380 L 745,350 L 748,308 Z"/>
    <!-- Siam: south-east -->
    <path id="t-siam" data-territory="siam"
      d="M 848,318 L 898,308 L 922,335 L 918,378 L 882,398 L 845,388 L 828,360 L 835,332 Z"/>
    <!-- China: large central -->
    <path id="t-china" data-territory="china"
      d="M 828,195 L 898,185 L 938,210 L 945,268 L 910,305 L 855,315 L 818,290 L 812,248 L 820,215 Z"/>
    <!-- Mongolia: north of China -->
    <path id="t-mongolia" data-territory="mongolia"
      d="M 890,155 L 942,148 L 965,172 L 962,212 L 928,232 L 890,228 L 870,205 L 875,168 Z"/>
    <!-- Japan: island chain east -->
    <path id="t-japan" data-territory="japan"
      d="M 958,180 L 985,175 L 998,202 L 995,240 L 970,248 L 950,232 L 948,205 Z"/>
  </g>

  <!-- =================== AUSTRALIA (4) =================== -->
  <g id="australia" data-continent="australia" fill="#a87bc0" stroke="#4a2f0d" stroke-width="1.5" stroke-linejoin="round" filter="url(#territoryShadow)">
    <!-- Indonesia: island chain connecting Asia to Australia -->
    <path id="t-indonesia" data-territory="indonesia"
      d="M 858,410 L 908,400 L 932,420 L 928,452 L 895,462 L 858,452 L 842,432 Z"/>
    <!-- New Guinea: island top-right -->
    <path id="t-new_guinea" data-territory="new_guinea"
      d="M 920,385 L 968,375 L 992,398 L 988,432 L 955,445 L 920,438 L 905,415 Z"/>
    <!-- Western Australia -->
    <path id="t-western_australia" data-territory="western_australia"
      d="M 848,468 L 912,462 L 938,490 L 938,548 L 905,570 L 855,568 L 830,540 L 830,490 Z"/>
    <!-- Eastern Australia -->
    <path id="t-eastern_australia" data-territory="eastern_australia"
      d="M 940,455 L 992,448 L 1010,478 L 1005,548 L 968,568 L 935,555 L 920,518 L 928,478 Z"/>
  </g>

  <!-- Cross-ocean connector hints (dashed) -->
  <g id="connectors" stroke="#4a2f0d" stroke-width="1" stroke-dasharray="4,4" fill="none" opacity="0.5">
    <line x1="92" y1="155" x2="970" y2="128"/>  <!-- Alaska - Kamchatka (top wrap) -->
    <line x1="470" y1="95" x2="498" y2="120"/>  <!-- Greenland - Iceland -->
    <line x1="412" y1="490" x2="495" y2="360"/>  <!-- Brazil - N.Africa -->
    <line x1="540" y1="305" x2="498" y2="338"/>  <!-- W.Europe - N.Africa -->
    <line x1="928" y1="435" x2="928" y2="458"/>  <!-- Siam - Indonesia -->
    <line x1="988" y1="108" x2="970" y2="130"/>  <!-- Kamchatka - Japan (approx) -->
  </g>

  <!-- Decorative compass rose (top-right) -->
  <g transform="translate(965,58)" opacity="0.55" fill="#4a2f0d" stroke="#4a2f0d" stroke-width="0.5">
    <circle r="22" fill="none"/>
    <polygon points="0,-20 4,0 0,20 -4,0" fill="#4a2f0d"/>
    <polygon points="-20,0 0,4 20,0 0,-4" fill="#4a2f0d" opacity="0.6"/>
    <text y="-26" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#4a2f0d" stroke="none">N</text>
  </g>

  <!-- Title cartouche (bottom-left) -->
  <g transform="translate(28, 585)" opacity="0.9">
    <rect width="195" height="108" fill="#f5e6c8" stroke="#4a2f0d" stroke-width="2" rx="5"/>
    <text x="97" y="30" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="24" font-weight="bold" fill="#7a1f1f">RISK</text>
    <text x="97" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="9" font-style="italic" fill="#4a2f0d">Single-Player Edition</text>
    <rect x="14" y="58" width="80" height="14" fill="#e5c185" rx="2"/>
    <text x="54" y="69" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#4a2f0d">N.America 5</text>
    <rect x="14" y="74" width="80" height="14" fill="#d98282" rx="2"/>
    <text x="54" y="85" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#4a2f0d">S.America 2</text>
    <rect x="14" y="90" width="80" height="14" fill="#bda280" rx="2"/>
    <text x="54" y="101" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#4a2f0d">Africa 3</text>
    <rect x="100" y="58" width="80" height="14" fill="#8ca6c2" rx="2"/>
    <text x="140" y="69" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#4a2f0d">Europe 5</text>
    <rect x="100" y="74" width="80" height="14" fill="#9bbfa1" rx="2"/>
    <text x="140" y="85" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#4a2f0d">Asia 7</text>
    <rect x="100" y="90" width="80" height="14" fill="#c9afc9" rx="2"/>
    <text x="140" y="101" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#4a2f0d">Australia 2</text>
  </g>
</svg>
