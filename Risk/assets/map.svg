<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet" id="risk-map">
  <defs>
    <!-- Highlight shadows -->
    <filter id="territoryShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feOffset dx="0.5" dy="1" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Embed the actual board map image as the background -->
  <image href="images/riskmap-1.png" x="0" y="0" width="1000" height="700" preserveAspectRatio="none"/>

  <!-- Interactive SVG paths overlaid on top (styled in CSS with semi-transparency/blend modes) -->
  <!-- Coordinates updated to align perfectly on top of the printed borders in riskmap-1.png -->
  <!-- =================== NORTH AMERICA =================== -->
  <g id="northAmerica" data-continent="northAmerica" stroke="#4a2f0d" stroke-width="1.2" stroke-linejoin="round" filter="url(#territoryShadow)">
    <!-- Alaska -->
    <path id="t-alaska" data-territory="alaska"
      d="M 38,160 L 72,162 L 95,170 L 115,170 L 125,200 L 122,230 L 105,250 L 75,250 L 52,235 L 35,205 Z"/>
    <!-- Northwest Territory -->
    <path id="t-northwest" data-territory="northwest"
      d="M 125,200 L 155,190 L 210,185 L 235,185 L 265,195 L 290,195 L 305,215 L 302,230 L 268,265 L 225,275 L 180,265 L 122,230 Z"/>
    <!-- Greenland -->
    <path id="t-greenland" data-territory="greenland"
      d="M 285,170 L 325,120 L 355,80 L 380,75 L 430,70 L 468,85 L 470,140 L 452,185 L 420,210 L 360,205 L 305,215 Z"/>
    <!-- Alberta -->
    <path id="t-alberta" data-territory="alberta"
      d="M 105,250 L 122,230 L 180,265 L 225,275 L 252,282 L 250,345 L 208,358 L 152,350 L 130,320 Z"/>
    <!-- Ontario -->
    <path id="t-ontario" data-territory="ontario"
      d="M 225,275 L 268,265 L 302,230 L 305,215 L 360,205 L 375,230 L 380,270 L 370,295 L 290,348 L 250,345 L 252,282 Z"/>
    <!-- Quebec -->
    <path id="t-quebec" data-territory="quebec"
      d="M 360,205 L 420,210 L 452,185 L 470,205 L 465,260 L 450,292 L 400,312 L 370,295 L 380,270 L 375,230 Z"/>
    <!-- Western US -->
    <path id="t-western_us" data-territory="western_us"
      d="M 130,320 L 152,350 L 208,358 L 250,345 L 290,348 L 280,432 L 248,458 L 180,450 L 140,430 L 132,390 Z"/>
    <!-- Eastern US -->
    <path id="t-eastern_us" data-territory="eastern_us"
      d="M 290,348 L 370,295 L 400,312 L 392,398 L 368,432 L 332,450 L 280,432 Z"/>
