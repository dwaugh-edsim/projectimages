  <!-- Cross-ocean connector hints (dashed) -->
  <g id="connectors" stroke="#4a2f0d" stroke-width="1" stroke-dasharray="4,4" fill="none" opacity="0.3">
    <line x1="92" y1="205" x2="970" y2="210"/>  <!-- Alaska - Kamchatka -->
    <line x1="470" y1="140" x2="498" y2="220"/>  <!-- Greenland - Iceland -->
    <line x1="412" y1="600" x2="495" y2="480"/>  <!-- Brazil - N.Africa -->
    <line x1="540" y1="410" x2="498" y2="452"/>  <!-- W.Europe - N.Africa -->
    <line x1="882" y1="510" x2="885" y2="500"/>  <!-- Siam - Indonesia -->
  </g>
</svg>
