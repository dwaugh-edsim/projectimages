            height: 350px;
            border: 1px solid var(--border);
            margin-bottom: 30px;
            background: #000;
            overflow: hidden;

            color: var(--text-dim);

            color: #fff;

            color: var(--text);

            border: 1px solid var(--border);
            color: #fff;
            text-align: center;
            font-family: var(--font-mono);
            box-sizing: border-box;
        }
    </style>
</head>

        let currentSlideIndex = 0;
        let currentTab = 'primary';
        let studentSession = { name: '', block: '', judgments: {}, rationales: {} };

        async function initializeSim() {
            const name = document.getElementById('student-name').value.trim();
            const block = document.getElementById('class-block').value;
            const pin = document.getElementById('student-pin').value.trim().toUpperCase();
            
            if (!name || !block || pin.length !== 4) {
                alert("Please complete all fields.");
                return;
            }

            studentSession.name = name;
            studentSession.block = block;
            studentSession.studentPin = pin;
            
            document.getElementById('auth-display').innerText = `USER: ${name.toUpperCase()} (${block})`;
            
            try { await sync("get_state"); } catch (e) {}

            document.getElementById('splash').style.display = 'none';
            buildNav();
            loadSlide(0);
        }

        async function sync(action = "save_state") {
            if (!API_URL) return;
            const payload = {
                action: action,
                missionId: MISSION_DATA.metadata.id,
                studentName: `${studentSession.name} (${studentSession.studentPin})`,
                classCode: studentSession.block,
                state: JSON.stringify({ judgments: studentSession.judgments, responses: studentSession.rationales })
            };
            try {
                const response = (action === "get_state") 
                    ? await fetch(`${API_URL}?action=get_state&missionId=${MISSION_DATA.metadata.id}&studentNameOnly=${studentSession.name}&studentPin=${studentSession.studentPin}&classCode=${studentSession.block}`)
                    : await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                const res = await response.json();
                if (action === "get_state" && res.state) {
                    studentSession.judgments = res.state.judgments || {};
                    studentSession.rationales = res.state.responses || {};
                    updateHistory();
                }
                document.getElementById('sync-status').innerText = "SYNC: SECURE";
            } catch (e) { document.getElementById('sync-status').innerText = "SYNC: OFFLINE"; }
        }

        function buildNav() {
            const rail = document.getElementById('nav-rail');
            rail.innerHTML = '';
            MISSION_DATA.slides.forEach((s, i) => {
                const div = document.createElement('div');
                div.className = 'nav-icon' + (i === 0 ? ' active' : '');
                div.id = `nav-${i}`;
                div.innerText = s.shortTitle;
                div.onclick = () => loadSlide(i);
                rail.appendChild(div);
            });
        }

        function loadSlide(i) {
            currentSlideIndex = i;
            const s = MISSION_DATA.slides[i];
            document.querySelectorAll('.nav-icon').forEach(el => el.classList.remove('active'));
            document.getElementById(`nav-${i}`).classList.add('active');
            
            document.getElementById('mission-id-display').innerText = `CH 0${i+1}`;
            document.getElementById('interaction-prompt').innerText = s.interactionPrompt;
            document.getElementById('btn-option1').innerText = s.options[0];
            document.getElementById('btn-option2').innerText = s.options[1];
            
            document.getElementById('student-rationale').value = studentSession.rationales[i] || '';
            switchTab('primary');
            updateJudgmentUI();
        }

        function switchTab(t) {
            currentTab = t;
            const s = MISSION_DATA.slides[currentSlideIndex];
            const content = s.tabs[t];
            
            document.querySelectorAll('.tab-link').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${t}`).classList.add('active');
            
            let body = content.body
                .replace(/## (.*)/g, '<h2>$1</h2>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\[cite: (\d+)\]/g, (match, id) => `<sup onclick="selectSource(${id})">[${id}]</sup>`)
                .replace(/\n/g, '<br>');
            
            document.getElementById('body-content').innerHTML = body;
            document.getElementById('exhibit-img').src = content.image;
            document.getElementById('exhibit-credit').innerText = `VISUAL RECORD: ${content.credit}`;
            
            // Auto-select first source in tab if any
            const firstCite = content.body.match(/\[cite: (\d+)\]/);
            if (firstCite) selectSource(firstCite[1]);
        }

        function selectSource(id) {
            const source = BIBLIOGRAPHY[id];
            if (!source) return;
            document.getElementById('source-name').innerText = `[${id}] ${source.title}`;
            document.getElementById('source-link').onclick = () => window.open(source.url, '_blank');
            
            // Highlight superscripts in text
            document.querySelectorAll('sup').forEach(el => {
                el.style.color = el.innerText === `[${id}]` ? 'var(--accent)' : 'var(--text-dim)';
                el.style.background = el.innerText === `[${id}]` ? 'var(--accent-dim)' : 'transparent';
            });
        }

        function setJudgment(v) {
            studentSession.judgments[currentSlideIndex] = v;
            updateJudgmentUI();
        }

        function updateJudgmentUI() {
            const v = studentSession.judgments[currentSlideIndex];
            document.getElementById('btn-option1').className = 'option-btn' + (v === 'OPTION_A' ? ' active' : '');
            document.getElementById('btn-option2').className = 'option-btn' + (v === 'OPTION_B' ? ' active' : '');
        }

        function saveProgress() {
            const rationale = document.getElementById('student-rationale').value.trim();
            if (!studentSession.judgments[currentSlideIndex] || rationale.length < 10) {
                alert("Please complete judgment and rationale.");
                return;
            }
            studentSession.rationales[currentSlideIndex] = rationale;
            sync();
            updateHistory();
            if (currentSlideIndex < MISSION_DATA.slides.length - 1) loadSlide(currentSlideIndex + 1);
        }

        function updateHistory() {
            const hist = document.getElementById('protocol-history');
            hist.innerHTML = '<div class="terminal-header" style="margin-bottom: 10px;">Protocol Progress</div>';
            MISSION_DATA.slides.forEach((s, i) => {
                if (studentSession.judgments[i]) {
                    const item = document.createElement('div');
                    item.className = 'history-item';
                    const label = studentSession.judgments[i] === 'OPTION_A' ? s.options[0] : s.options[1];
                    item.innerHTML = `<div class="history-title">CH 0${i+1} // ${s.longTitle}</div><div style="color: var(--accent)">${label}</div>`;
                    hist.appendChild(item);
                }
            });
        }
    </script>
