<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 9 Service Learning — Action Intelligence Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@300;400;700;900&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #f4f1ea;
            --ink: #1a1a1a;
            --accent: #b91c1c; /* Stamped Red */
            --highlight: #16a34a; /* Action Green */
            --border: #d1d5db;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #e5e7eb;
            color: var(--ink);
            line-height: 1.5;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            background: var(--paper);
            padding: 40px;
            border: 2px solid var(--ink);
            box-shadow: 10px 10px 0px rgba(0,0,0,0.1);
            margin-bottom: 40px;
            position: relative;
        }

        .stamp {
            position: absolute;
            top: 20px;
            right: 20px;
            border: 4px solid var(--accent);
            color: var(--accent);
            padding: 5px 15px;
            font-family: 'Roboto Mono', monospace;
            font-weight: 900;
            transform: rotate(5deg);
            text-transform: uppercase;
        }

        h1 {
            font-weight: 900;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: -0.05em;
            margin-bottom: 10px;
        }

        .intro {
            font-size: 1.1rem;
            font-weight: 300;
            max-width: 700px;
        }

        .picker-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--paper);
            border: 1px solid var(--border);
            padding: 0;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 5px 5px 0px rgba(0,0,0,0.1);
            border-color: var(--ink);
        }

        .card-header {
            padding: 20px;
            border-bottom: 1px dashed var(--border);
        }

        .case-num {
            font-family: 'Courier Prime', monospace;
            font-size: 0.8rem;
            color: #6b7280;
        }

        .card h2 {
            font-size: 1.25rem;
            font-weight: 800;
            margin: 5px 0;
        }

        .sdg-label {
            font-family: 'Roboto Mono', monospace;
            font-size: 0.7rem;
            background: var(--ink);
            color: white;
            padding: 2px 8px;
            display: inline-block;
        }

        .card-preview {
            padding: 20px;
            font-size: 0.9rem;
            flex-grow: 1;
            color: #4b5563;
        }

        .card-footer {
            padding: 15px 20px;
            background: #f9fafb;
            border-top: 1px solid var(--border);
            font-family: 'Courier Prime', monospace;
            font-weight: 700;
            text-align: right;
            font-size: 0.85rem;
        }

        /* Overlay / Dossier View */
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            padding: 40px 20px;
            overflow-y: auto;
        }

        .dossier {
            background: var(--paper);
            max-width: 800px;
            margin: 0 auto;
            padding: 60px;
            border: 1px solid var(--ink);
            position: relative;
            box-shadow: 20px 20px 0px rgba(0,0,0,0.3);
        }

        .close-btn {
            position: absolute;
            top: 20px; right: 20px;
            background: var(--ink);
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-family: 'Roboto Mono', monospace;
        }

        .dossier-section {
            margin-bottom: 40px;
        }

        .dossier-section h3 {
            font-family: 'Courier Prime', monospace;
            text-transform: uppercase;
            border-bottom: 2px solid var(--ink);
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .clue-list {
            list-style: none;
            font-family: 'Courier Prime', monospace;
            font-size: 1rem;
        }

        .clue-list li {
            margin-bottom: 10px;
            padding-left: 20px;
            position: relative;
        }

        .clue-list li::before {
            content: ">";
            position: absolute;
            left: 0;
            color: var(--accent);
        }

        .challenge-box {
            background: #fffbeb;
            border: 2px solid #fef3c7;
            padding: 30px;
        }

        .challenge-box h4 {
            color: var(--highlight);
            font-weight: 900;
            font-size: 1.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        @media print {
            .overlay { position: static; display: block; background: none; padding: 0; }
            .dossier { box-shadow: none; border: 2px solid #000; }
            .close-btn { display: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="stamp">CLASSIFIED</div>
        <span class="case-num">DEPT OF CITIZENSHIP / UNIT 1</span>
        <h1>Service Learning Action Intelligence</h1>
        <p class="intro">Research is just step one. Choose your sector, investigate the intelligence gaps, and initiate your 7-Day Action Challenge.</p>
    </header>

    <div id="picker" class="picker-grid">
        <!-- Cards will be injected here -->
    </div>
</div>

<div id="overlay" class="overlay">
    <div id="dossier" class="dossier">
        <button class="close-btn" onclick="closeDossier()">CLOSE FILE</button>
        <div id="dossier-content"></div>
    </div>
</div>

<script>
    const challenges = [
        {
            id: "CIT-001",
            title: "The Battery Scavenger",
            sdg: "SDG 12: Consumption",
            preview: "Locate and divert the hidden 'Toxic Hoard' of lithium from your community's watershed.",
            research: [
                "What is 'Thermal Runaway' in lithium-ion batteries?",
                "Geography: How much of the world's cobalt comes from the DRC?",
                "Policy: What is Extended Producer Responsibility (EPR)?",
                "Politics: Why would a 'Right-Wing' party oppose battery taxes?"
            ],
            action: "Find every dead battery in your home. Safely tape the terminals and deliver them to a certified recycler."
        },
        {
            id: "CIT-002",
            title: "The Tap Audit",
            sdg: "SDG 06: Clean Water",
            preview: "Investigate the gap between municipal luxury and the boil-water reality of Indigenous communities.",
            research: [
                "Infrastructure: Where does our school's water actually come from?",
                "Social Justice: Why have boil-water advisories persisted in places like Neskantaga for 25+ years?",
                "Economics: Cost of 1L of tap water vs. 1L of bottled water in HRM.",
                "Politics: Is water a Human Right or a Commodity? Should it be privatized?"
            ],
            action: "Reduce personal water usage by 25% for 7 days. Time every shower and audit every drop."
        },
        {
            id: "CIT-003",
            title: "The Phantom Load",
            sdg: "SDG 07: Clean Energy",
            preview: "Hunt the 'Vampire' devices that are draining power and increasing carbon footprints in the dark.",
            research: [
                "Science: How many Watts does a phone charger pull when it's plugged in but empty?",
                "Energy Mix: How is electricity generated in Nova Scotia right now? (Coal, Gas, or Wind?)",
                "Economics: What is the annual cost of 'Phantom Load' for an average HRM household?",
                "Politics: Should the government legislate 'Low Standby' power designs for corporations?"
            ],
            action: "Unplug every 'vampire' device in your room (chargers, screens, lamps) every night for 7 nights."
        },
        {
            id: "CIT-004",
            title: "The Wardrobe Reset",
            sdg: "SDG 12: Consumption",
            preview: "Deconstruct the true price of $5 T-shirts and the hidden labor costs of the global garment trade.",
            research: [
                "History: What was the Rana Plaza disaster, and how did it change supply chain transparency?",
                "Environment: Why does a single pair of jeans require 7,500 liters of water?",
                "The Market: How can a shirt cost $5 after paying for cotton, shipping, and labor?",
                "Politics: Should Canada implement 'Labor Rights Tariffs' on unethical imports?"
            ],
            action: "Select only 10 items of clothing. Wear only those items for 7 days to protest disposable fashion."
        },
        {
            id: "CIT-005",
            title: "The Data Diet",
            sdg: "SDG 16: Peace & Justice",
            preview: "Expose the 'Shadow Profiles' and algorithmic biases that harvest your digital identity.",
            research: [
                "Technology: What is a 'Shadow Profile' and how are you tracked without an account?",
                "Law: What is Bill C-27 and how does it aim to protect Canadian youth data?",
                "Sociology: How do algorithms create 'Echo Chambers' that impact democratic elections?",
                "Politics: Should 'Big Tech' be broken up like the monopolies of the 1920s?"
            ],
            action: "Disable all non-essential tracking and notifications on your devices for 7 days. Reclaim your footprint."
        },
        {
            id: "CIT-006",
            title: "The Zero-Waste Audit",
            sdg: "SDG 13: Climate Action",
            preview: "Track the reality of 'Waste Colonialism' and the lifecycle of the plastics in your lunch.",
            research: [
                "Material Science: Difference between 'Biodegradable' and 'Compostable' in an HRM landfill.",
                "Global Ethics: What is 'Waste Colonialism'? Where does Canada ship its plastic trash?",
                "Logistics: What percentage of blue-bag plastic is actually recycled into new products?",
                "Politics: Should Canada ban ALL single-use plastics regardless of business impact?"
            ],
            action: "Zero single-use plastics in your personal meals for 7 days. No wrappers, bottles, or straws."
        }
    ];

    function render() {
        const picker = document.getElementById('picker');
        picker.innerHTML = challenges.map(c => `
            <div class="card" onclick="openDossier('${c.id}')">
                <div class="card-header">
                    <span class="case-num">${c.id}</span>
                    <br>
                    <span class="sdg-label">${c.sdg}</span>
                    <h2>${c.title}</h2>
                </div>
                <div class="card-preview">
                    ${c.preview}
                </div>
                <div class="card-footer">
                    OPEN CASE FILE >
                </div>
            </div>
        `).join('');
    }

    function openDossier(id) {
        const item = challenges.find(c => c.id === id);
        const content = document.getElementById('dossier-content');
        
        content.innerHTML = `
            <div class="dossier-section">
                <span class="case-num">${item.id} // SUBJECT: ${item.title}</span>
                <h1 style="margin-top:20px;">${item.title}</h1>
                <p class="sdg-label">${item.sdg}</p>
            </div>

            <div class="dossier-section">
                <h3>Step 02: Investigative Clues (Academic Research)</h3>
                <ul class="clue-list">
                    ${item.research.map(clue => `<li>${clue}</li>`).join('')}
                </ul>
            </div>

            <div class="dossier-section challenge-box">
                <h4>Step 03: The 7-Day Action Challenge</h4>
                <p>${item.action}</p>
            </div>

            <div class="dossier-section" style="border: 1px solid var(--border); padding: 20px; font-size: 0.85rem;">
                <strong>Step 04: Assessment</strong><br>
                After 7 days, you will merge your data with others in this sector to produce a <em>Collective Impact Report</em> for the community.
            </div>
        `;
        
        document.getElementById('overlay').style.display = 'block';
    }

    function closeDossier() {
        document.getElementById('overlay').style.display = 'none';
    }

    // Close on click outside
    window.onclick = function(event) {
        if (event.target == document.getElementById('overlay')) {
            closeDossier();
        }
    }

    render();
</script>

</body>
</html>
