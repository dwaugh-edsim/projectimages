<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizenship 9 — Heritage Minutes Challenge</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --primary: #f59e0b;
            --primary-glow: rgba(245, 158, 11, 0.3);
            --secondary: #3b82f6;
            --secondary-glow: rgba(59, 130, 246, 0.3);
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #475569;
            --cat-science: #8b5cf6;
            --cat-social: #ec4899;
            --cat-innovation: #06b6d4;
            --cat-women: #f43f5e;
            --cat-modern: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(ellipse at top, #1e293b 0%, #0f172a 70%);
        }

        .login-card {
            background: var(--bg-card);
            border: 2px solid var(--primary);
            box-shadow: 0 0 60px var(--primary-glow), 8px 8px 0 var(--primary);
            padding: 3rem;
            max-width: 480px;
            width: 90%;
            text-align: center;
        }

        .login-card h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .login-card .subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .login-card label {
            display: block;
            text-align: left;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-card select, .login-card input {
            width: 100%;
            padding: 1rem;
            background: var(--bg-input);
            border: 2px solid var(--border);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            transition: border-color 0.2s;
        }

        .login-card select:focus, .login-card input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: var(--bg-dark);
            border: none;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 900;
            font-size: 1.2rem;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .login-btn:hover {
            background: #fbbf24;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .login-btn:disabled {
            background: var(--border);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .app-screen { display: none; }
        .app-screen.active { display: block; }

        .app-header {
            background: var(--bg-card);
            border-bottom: 2px solid var(--primary);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--primary);
        }

        .header-left span {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .score-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--primary);
        }

        .score-display span {
            font-size: 0.7rem;
            color: var(--text-muted);
            display: block;
            text-transform: uppercase;
        }

        .timer-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--secondary);
            min-width: 80px;
            text-align: center;
        }

        .timer-display.warning { color: var(--primary); }
        .timer-display.danger { color: var(--danger); animation: pulse 0.5s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .player-badge {
            background: var(--bg-input);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            border: 2px solid var(--border);
        }

        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .category-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .cat-tab {
            padding: 0.75rem 1.5rem;
            border: 2px solid var(--border);
            background: var(--bg-card);
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .cat-tab:hover { border-color: var(--text-muted); color: var(--text-main); }
        .cat-tab.active { color: var(--bg-dark); }
        .cat-tab[data-cat="science"].active { background: var(--cat-science); border-color: var(--cat-science); }
        .cat-tab[data-cat="social"].active { background: var(--cat-social); border-color: var(--cat-social); }
        .cat-tab[data-cat="innovation"].active { background: var(--cat-innovation); border-color: var(--cat-innovation); }
        .cat-tab[data-cat="women"].active { background: var(--cat-women); border-color: var(--cat-women); }
        .cat-tab[data-cat="modern"].active { background: var(--cat-modern); border-color: var(--cat-modern); }

        .questions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .question-card {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.2s;
        }

        .question-card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
        .question-card.answered { border-color: var(--success); opacity: 0.7; }
        .question-card[data-cat="science"] { border-left: 4px solid var(--cat-science); }
        .question-card[data-cat="social"] { border-left: 4px solid var(--cat-social); }
        .question-card[data-cat="innovation"] { border-left: 4px solid var(--cat-innovation); }
        .question-card[data-cat="women"] { border-left: 4px solid var(--cat-women); }
        .question-card[data-cat="modern"] { border-left: 4px solid var(--cat-modern); }

        .question-header {
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .question-title {
            font-weight: 700;
            font-size: 1rem;
        }

        .points-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            background: var(--primary);
            color: var(--bg-dark);
        }

        .video-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            margin: 0.75rem 1rem;
            border-radius: 6px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            transition: all 0.2s;
        }

        .video-link:hover { background: rgba(239, 68, 68, 0.2); }

        .question-prompt {
            padding: 0 1rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 1rem;
        }

        .answer-section {
            padding: 0 1rem 1rem;
        }

        .answer-section textarea {
            width: 100%;
            min-height: 80px;
            padding: 0.75rem;
            background: var(--bg-input);
            border: 2px solid var(--border);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem;
            border-radius: 8px;
            resize: vertical;
            transition: border-color 0.2s;
        }

        .answer-section textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .submit-answer-btn {
            width: 100%;
            padding: 0.75rem;
            margin-top: 0.75rem;
            background: var(--secondary);
            color: white;
            border: none;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .submit-answer-btn:hover { background: #2563eb; }
        .submit-answer-btn:disabled { background: var(--border); cursor: not-allowed; }

        .answered-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            font-weight: 600;
            font-size: 0.85rem;
            border-radius: 6px;
            margin: 0 1rem 1rem;
        }

        .progress-bar-container {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .progress-info {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .progress-info strong { color: var(--primary); font-size: 1.5rem; }

        .progress-track {
            flex: 1;
            height: 12px;
            background: var(--bg-input);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.5s ease;
            border-radius: 6px;
        }

        .leaderboard-btn {
            padding: 0.75rem 1.5rem;
            background: var(--primary);
            color: var(--bg-dark);
            border: none;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 900;
            font-size: 0.85rem;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .leaderboard-btn:hover { background: #fbbf24; }

        .streak-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: var(--bg-card);
            border: 3px solid var(--primary);
            box-shadow: 0 0 80px var(--primary-glow);
            padding: 2rem 3rem;
            border-radius: 16px;
            text-align: center;
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .streak-popup.show { transform: translate(-50%, -50%) scale(1); }

        .streak-popup h2 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .streak-popup p {
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        .streak-popup .points-earned {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3rem;
            font-weight: 900;
            color: var(--success);
            margin: 1rem 0;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 999;
            display: none;
        }

        .overlay.show { display: block; }

        .footer-bar {
            background: var(--bg-card);
            border-top: 2px solid var(--border);
            padding: 1rem 2rem;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 50;
        }

        .footer-bar span { color: var(--primary); }

        @media (max-width: 768px) {
            .app-header { flex-direction: column; gap: 1rem; }
            .header-right { justify-content: center; }
            .questions-grid { grid-template-columns: 1fr; }
            .category-tabs { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="login-screen" id="loginScreen">
    <div class="login-card">
        <h1>Heritage Minutes</h1>
        <p class="subtitle">Citizenship 9 Challenge</p>
        <label for="studentSelect">Select Your Name</label>
        <select id="studentSelect">
            <option value="">-- Choose your name --</option>
        </select>
        <button class="login-btn" id="startBtn" disabled>Start the Challenge</button>
        <p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted);">Watch the videos. Answer the questions. Climb the leaderboard.</p>
    </div>
</div>

<div class="app-screen" id="appScreen">
    <header class="app-header">
        <div class="header-left">
            <h1>Heritage Minutes Challenge</h1>
            <span>Citizenship 9</span>
        </div>
        <div class="header-right">
            <div class="score-display">
                <span>Score</span>
                <div id="scoreValue">0</div>
            </div>
            <div class="timer-display" id="timerDisplay">00:00</div>
            <div class="player-badge" id="playerBadge">--</div>
            <button class="leaderboard-btn" onclick="showLeaderboard()">Leaderboard</button>
        </div>
    </header>

    <main class="main-content">
        <div class="progress-bar-container">
            <div class="progress-info">
                <strong id="answeredCount">0</strong> / <span id="totalCount">0</span> answered
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div class="progress-info">
                <span id="progressPercent">0%</span>
            </div>
        </div>

        <div class="category-tabs" id="categoryTabs">
            <button class="cat-tab active" data-cat="all">All Minutes</button>
            <button class="cat-tab" data-cat="science">Science & War</button>
            <button class="cat-tab" data-cat="social">Social Justice</button>
            <button class="cat-tab" data-cat="innovation">Innovation</button>
            <button class="cat-tab" data-cat="women">Women in History</button>
            <button class="cat-tab" data-cat="modern">Modern Icons</button>
        </div>

        <div class="questions-grid" id="questionsGrid"></div>
    </main>

    <div class="footer-bar">
        <span>CIT 9</span> — Heritage Minutes Challenge — Answers saved automatically
    </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="streak-popup" id="streakPopup">
    <h2 id="streakTitle">Correct!</h2>
    <div class="points-earned" id="pointsEarned">+100</div>
    <p id="streakMessage">Great observation!</p>
</div>

<script>
const STUDENTS = [
    "Ali Abdelfattah", "Abdul Aboukoura", "Joshua Abraham", "Fatima Al Hilal",
    "Jana Al Raslan", "Mohammad Aljaffal", "Laila Awad", "Huda Bargoth",
    "Kendra Bell", "Delisha Devabattula", "Alia Doaia", "Brody Downs",
    "Leo Ewing", "Clark Feng", "Natalia Filipovic", "Nolan Hamilton",
    "Madhavan Karia", "Kai Kilgour", "Lachlan MacKay", "Lachlan McMahon",
    "Yunho Park", "Remy Perks", "Farhan Rahman", "Jessa Salasalan",
    "Elizabeth Sanyaolu", "Rifa Shahul Mydeen Ali", "Josie Sullivan",
    "Sarah Tiga", "Zankia van der Walt", "Isaac Warner-Comeau", "Evie Wilde-McDowell"
];

const QUESTIONS = [
    {
        id: 1, category: "science", minute: "Wilder Penfield",
        video: "https://www.youtube.com/watch?v=pUOG2g4hj8s",
        prompt: "During Mrs. Gold's brain surgery, what everyday smell tells Dr. Penfield he has found the source of her seizures?",
        points: 100, keywords: ["burnt toast", "toast"]
    },
    {
        id: 2, category: "science", minute: "Halifax Explosion",
        video: "https://www.youtube.com/watch?v=NKc3k3M6R8c",
        prompt: "In Vince Coleman's final telegraph message, what kind of ship does he warn about, and how many people are on the incoming train he is trying to save?",
        points: 150, keywords: ["munitions", "explosives", "300", "train"]
    },
    {
        id: 3, category: "science", minute: "Valour Road",

        prompt: "What was Valour Road's original name, and how many men from that one street received the Victoria Cross in the First World War?",
        points: 150, keywords: ["pine", "three", "3"]
    },
    {
        id: 4, category: "science", minute: "Vimy Ridge",

    {

        points: 200, keywords: ["may", "1918", "killed", "died", "bomb"]

    {
        id: 6, category: "science", minute: "Tommy Prince",

        prompt: "In the Italian farmhouse scene, what disguise does Tommy Prince use when he goes out into the field to repair the broken telephone line under enemy observation, and what everyday object is he carrying?",

    },
    {
        id: 7, category: "social", minute: "Chanie Wenjack",
        video: "https://www.youtube.com/watch?v=5JqHf3p0j9E",

    {

    {

    {

    {

    {

    {

    },
    {
        id: 19, category: "women", minute: "Agnes Macphail",
        video: "https://www.youtube.com/watch?v=8JqHf3p0j9E",
        prompt: "In her visit to the prison, what does Agnes Macphail react to that convinces her the Canadian penal system needs major reform? (Students must describe a specific scene or object from the Minute.)",
        points: 200, keywords: ["toilet", "cell", "bed", "bucket", "conditions"]
    },
    {
        id: 20, category: "modern", minute: "Terry Fox",
        video: "https://www.youtube.com/watch?v=9JqHf3p0j9E",
        prompt: "In the Heritage Minute, how many miles does Terry Fox say he runs each day, and what powerful line does he say about \"where the hurting must stop\"?",
        points: 100, keywords: ["26", "where the hurting"]
    },
    {
        id: 21, category: "modern", minute: "Winnie",
        video: "https://www.youtube.com/watch?v=1JqHf3p0j9E",
        prompt: "What is the name of the young boy who visits Winnie at the London Zoo, and how does this meeting inspire a famous children's story?",
        points: 100, keywords: ["christopher robin", "milne", "pooh", "bear"]
    },
    {
        id: 22, category: "modern", minute: "Jackie Robinson",
        video: "https://www.youtube.com/watch?v=2JqHf3p0j9E",
        prompt: "Which Canadian city and team is Jackie Robinson playing for in the Minute, and what historic \"barrier\" is he breaking by taking the field there?",
        points: 150, keywords: ["montreal", "royals", "colour", "color", "barrier"]
    }
];

let currentPlayer = null;
let playerAnswers = {};
let playerScore = 0;
let timerSeconds = 0;
let timerInterval = null;
let streakCount = 0;

function init() {
    const select = document.getElementById('studentSelect');
    STUDENTS.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
    });

    select.addEventListener('change', () => {
        document.getElementById('startBtn').disabled = !select.value;
    });

    document.getElementById('startBtn').addEventListener('click', startGame);

    document.getElementById('categoryTabs').addEventListener('click', (e) => {
        if (e.target.classList.contains('cat-tab')) {
            document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
            e.target.classList.add('active');
            renderQuestions(e.target.dataset.cat);
        }
    });

    loadProgress();
}

function startGame() {
    const name = document.getElementById('studentSelect').value;
    if (!name) return;

    currentPlayer = name;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').classList.add('active');
    document.getElementById('playerBadge').textContent = name.split(' ')[0];

    loadPlayerData();
    renderQuestions('all');
    updateProgress();
    startTimer();
}

function startTimer() {
    timerInterval = setInterval(() => {
        timerSeconds++;
        const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
        const secs = String(timerSeconds % 60).padStart(2, '0');
        const display = document.getElementById('timerDisplay');
        display.textContent = `${mins}:${secs}`;

        if (timerSeconds > 1800) display.className = 'timer-display danger';
        else if (timerSeconds > 1200) display.className = 'timer-display warning';
    }, 1000);
}

function renderQuestions(category) {
    const grid = document.getElementById('questionsGrid');
    grid.innerHTML = '';

    const filtered = category === 'all' ? QUESTIONS : QUESTIONS.filter(q => q.category === category);
    document.getElementById('totalCount').textContent = QUESTIONS.length;

    filtered.forEach(q => {
        const answered = playerAnswers[q.id];
        const card = document.createElement('div');
        card.className = `question-card ${answered ? 'answered' : ''}`;
        card.dataset.cat = q.category;

        card.innerHTML = `
            <div class="question-header">
                <span class="question-title">${q.minute}</span>
                <span class="points-badge">${q.points} pts</span>
            </div>
            <a href="${q.video}" target="_blank" rel="noopener" class="video-link">
                Watch on YouTube
            </a>
            <p class="question-prompt">${q.prompt}</p>
            <div class="answer-section">
                ${answered ? `
                    <div class="answered-badge">Answered — ${answered.score} pts</div>
                    <textarea readonly>${answered.text}</textarea>
                ` : `
                    <textarea id="answer-${q.id}" placeholder="Type your answer here..."></textarea>
                    <button class="submit-answer-btn" onclick="submitAnswer(${q.id})">Submit Answer</button>
                `}
            </div>
        `;

        grid.appendChild(card);
    });
}

function submitAnswer(questionId) {
    const textarea = document.getElementById(`answer-${questionId}`);
    const answerText = textarea.value.trim();
    if (!answerText) return;

    const question = QUESTIONS.find(q => q.id === questionId);
    const lowerAnswer = answerText.toLowerCase();
    let score = 0;

    question.keywords.forEach(kw => {
        if (lowerAnswer.includes(kw.toLowerCase())) score += Math.floor(question.points / question.keywords.length);
    });

    if (score === 0 && answerText.length > 10) score = Math.floor(question.points * 0.3);

    playerAnswers[questionId] = { text: answerText, score: score };
    playerScore += score;

    if (score > 0) {
        streakCount++;
        if (streakCount >= 3) {
            const bonus = streakCount * 25;
            playerScore += bonus;
            showStreakPopup(streakCount, score + bonus);
        } else {
            showStreakPopup(0, score);
        }
    } else {
        streakCount = 0;
        showStreakPopup(-1, 0);
    }

    document.getElementById('scoreValue').textContent = playerScore;
    saveProgress();
    renderQuestions(document.querySelector('.cat-tab.active').dataset.cat);
    updateProgress();
}

function showStreakPopup(streak, points) {
    const popup = document.getElementById('streakPopup');
    const overlay = document.getElementById('overlay');

    if (streak > 0) {
        document.getElementById('streakTitle').textContent = streak >= 3 ? `${streak} Streak!` : 'Nice!';
        document.getElementById('pointsEarned').textContent = `+${points}`;
        document.getElementById('pointsEarned').style.color = 'var(--success)';
        document.getElementById('streakMessage').textContent = streak >= 3 ? 'You\'re on fire! Keep going!' : 'Great observation!';
    } else if (streak === 0) {
        document.getElementById('streakTitle').textContent = 'Submitted';
        document.getElementById('pointsEarned').textContent = `+${points}`;
        document.getElementById('pointsEarned').style.color = 'var(--text-muted)';
        document.getElementById('streakMessage').textContent = 'Keep watching for more details!';
    } else {
        document.getElementById('streakTitle').textContent = 'No points';
        document.getElementById('pointsEarned').textContent = '+0';
        document.getElementById('pointsEarned').style.color = 'var(--danger)';
        document.getElementById('streakMessage').textContent = 'Watch the video again for key details!';
    }

    overlay.classList.add('show');
    popup.classList.add('show');

    setTimeout(() => {
        popup.classList.remove('show');
        overlay.classList.remove('show');
    }, 2000);
}

function updateProgress() {
    const answered = Object.keys(playerAnswers).length;
    const total = QUESTIONS.length;
    const percent = Math.round((answered / total) * 100);

    document.getElementById('answeredCount').textContent = answered;
    document.getElementById('totalCount').textContent = total;
    document.getElementById('progressPercent').textContent = `${percent}%`;
    document.getElementById('progressFill').style.width = `${percent}%`;
}

function saveProgress() {
    const data = {
        player: currentPlayer,
        answers: playerAnswers,
        score: playerScore,
        time: timerSeconds,
        timestamp: new Date().toISOString()
    };
    localStorage.setItem(`heritage_${currentPlayer}`, JSON.stringify(data));
    saveLeaderboard();
}

function loadPlayerData() {
    const saved = localStorage.getItem(`heritage_${currentPlayer}`);
    if (saved) {
        const data = JSON.parse(saved);
        playerAnswers = data.answers || {};
        playerScore = data.score || 0;
        timerSeconds = data.time || 0;
        document.getElementById('scoreValue').textContent = playerScore;
    }
}

function loadProgress() {
    const lastPlayer = localStorage.getItem('heritage_lastPlayer');
    if (lastPlayer && STUDENTS.includes(lastPlayer)) {
        document.getElementById('studentSelect').value = lastPlayer;
        document.getElementById('startBtn').disabled = false;
    }
}

function saveLeaderboard() {
    let leaderboard = JSON.parse(localStorage.getItem('heritage_leaderboard') || '{}');
    leaderboard[currentPlayer] = {
        score: playerScore,
        answered: Object.keys(playerAnswers).length,
        total: QUESTIONS.length,
        time: timerSeconds,
        timestamp: new Date().toISOString()
    };
    localStorage.setItem('heritage_leaderboard', JSON.stringify(leaderboard));
    localStorage.setItem('heritage_lastPlayer', currentPlayer);
}

function showLeaderboard() {
    const leaderboard = JSON.parse(localStorage.getItem('heritage_leaderboard') || '{}');
    const sorted = Object.entries(leaderboard)
        .sort((a, b) => b[1].score - a[1].score);

    let html = '<div style="padding: 2rem;"><h2 style="font-family: JetBrains Mono; color: var(--primary); margin-bottom: 1.5rem;">LEADERBOARD</h2>';

    sorted.forEach(([name, data], i) => {
        const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}.`;
        const mins = Math.floor(data.time / 60);
        const secs = data.time % 60;
        html += `
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: var(--bg-card); border: 2px solid ${name === currentPlayer ? 'var(--primary)' : 'var(--border)'}; border-radius: 8px; margin-bottom: 0.5rem;">
                <div>
                    <span style="font-family: JetBrains Mono; font-weight: 900; font-size: 1.2rem; margin-right: 1rem;">${medal}</span>
                    <span style="font-weight: 700;">${name}</span>
                </div>
                <div style="text-align: right;">
                    <div style="font-family: JetBrains Mono; font-weight: 900; color: var(--primary);">${data.score} pts</div>
                    <div style="font-size: 0.8rem; color: var(--text-muted);">${data.answered}/${data.total} answered · ${mins}:${String(secs).padStart(2, '0')}</div>
                </div>
            </div>
        `;
    });

    html += '</div>';

    const overlay = document.getElementById('overlay');
    const popup = document.getElementById('streakPopup');

    document.getElementById('streakTitle').textContent = '';
    document.getElementById('pointsEarned').textContent = '';
    document.getElementById('streakMessage').textContent = '';

    popup.innerHTML = html;
    popup.style.maxWidth = '600px';
    popup.style.maxHeight = '80vh';
    popup.style.overflowY = 'auto';
    popup.classList.add('show');
    overlay.classList.add('show');

    overlay.onclick = () => {
        popup.classList.remove('show');
        overlay.classList.remove('show');
        popup.innerHTML = `
            <h2 id="streakTitle"></h2>
            <div class="points-earned" id="pointsEarned"></div>
            <p id="streakMessage"></p>
        `;
        popup.style.maxWidth = '';
        popup.style.maxHeight = '';
        popup.style.overflowY = '';
    };
}

init();
</script>
</body>
</html>
