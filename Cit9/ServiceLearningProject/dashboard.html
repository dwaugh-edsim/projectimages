<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Learning Classroom Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@300;400;600;700;800&display=swap');
        
        :root {
            --slate-950: #020617;
            --slate-900: #0f172a;
            --slate-800: #1e293b;
            --slate-700: #334155;
            --indigo-500: #6366f1;
            --emerald-500: #10b981;
            --amber-500: #f59e0b;
            --border: rgba(255,255,255,0.08);
            --font-mono: 'Courier Prime', monospace;
            --font-sans: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--slate-950);
            color: #f8fafc;
            min-height: 100vh;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-x: hidden;
        }

        header {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border);
            padding: 24px 30px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .header-title h1 {
            font-family: var(--font-mono);
            font-size: 1.4rem;
            color: var(--amber-500);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .header-title p {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        .countdown-timer {
            font-family: var(--font-mono);
            font-size: 1.1rem;
            color: var(--rose-500);
            font-weight: bold;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 8px 16px;
            border-radius: 6px;
        }

        /* Stats grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.3);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .stat-val {
            font-size: 2.2rem;
            font-weight: 800;
            font-family: var(--font-mono);
            color: var(--indigo-500);
        }

        .stat-lbl {
            font-size: 0.78rem;
            text-transform: uppercase;
            color: #64748b;
            letter-spacing: 0.05em;
            margin-top: 4px;
        }

        /* Classroom Grid */
        .classroom-grid {
            flex: 1;
            background: rgba(15, 23, 42, 0.3);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        .student-card {
            background: var(--slate-900);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .student-card:hover {
            transform: translateY(-2px);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .student-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .student-name {
            font-weight: 700;
            font-size: 1.05rem;
            color: #f8fafc;
        }

        .mission-tag {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            background: rgba(255,255,255,0.05);
            padding: 2px 6px;
            border-radius: 4px;
            color: #94a3b8;
        }

        .progress-steps-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin-top: 4px;
        }

        .step-indicator {
            height: 18px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.62rem;
            font-weight: bold;
            text-transform: uppercase;
            font-family: var(--font-mono);
        }

        .step-indicator.done {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--emerald-500);
        }

        .step-indicator.partial {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--amber-500);
        }

        .step-indicator.empty {
            background: rgba(71, 85, 105, 0.15);
            border: 1px solid rgba(71, 85, 105, 0.2);
            color: #64748b;
        }

        .overall-status-badge {
            align-self: flex-start;
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 10px;
            letter-spacing: 0.05em;
        }

        .status-complete {
            background: rgba(16, 185, 129, 0.15);
            color: var(--emerald-500);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-inprogress {
            background: rgba(99, 102, 241, 0.15);
            color: var(--indigo-500);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .status-idle {
            background: rgba(71, 85, 105, 0.15);
            color: #64748b;
            border: 1px solid rgba(71, 85, 105, 0.2);
        }

        .dashboard-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #64748b;
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }

        .upload-input-label {
            background: rgba(255,255,255,0.05);
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid var(--border);
        }

        .upload-input-label:hover {
            background: rgba(255,255,255,0.08);
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>Service Learning Project Status Panel</h1>
            <p>Grade 9 Citizenship · A Block · Live Classroom Projection Screen</p>
        </div>
        <div class="countdown-timer" id="countdownTimer">OVERDUE - Finalizing Grades</div>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-val" id="statRoster">30</div>
            <div class="stat-lbl">Class Roster</div>
        </div>
        <div class="stat-card">
            <div class="stat-val" id="statComplete" style="color:var(--emerald-500)">0</div>
            <div class="stat-lbl">Completed (5/5)</div>
        </div>
        <div class="stat-card">
            <div class="stat-val" id="statInProgress" style="color:var(--indigo-500)">0</div>
            <div class="stat-lbl">In Progress</div>
        </div>
        <div class="stat-card">
            <div class="stat-val" id="statClassRate">0%</div>
            <div class="stat-lbl">Completion Rate</div>
        </div>
    </div>

    <!-- Classroom Grid Layout divided by Groups -->
    <main class="classroom-dashboard-layout" id="dashboardLayout" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; flex: 1; min-height: 500px;">
        <!-- Group 1: Complete -->
        <div class="group-column" style="background: rgba(16, 185, 129, 0.02); border: 1px solid rgba(16, 185, 129, 0.1); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px;">
            <h2 style="font-family: var(--font-mono); font-size: 0.95rem; color: var(--emerald-500); border-bottom: 2px solid rgba(16, 185, 129, 0.2); padding-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; display: flex; justify-content: space-between; align-items: center;">
                <span>🟢 Group 1: Complete</span>
                <span id="countGroup1" style="background: rgba(16, 185, 129, 0.2); padding: 2px 8px; border-radius: 10px; font-size: 0.8rem;">0</span>
            </h2>
            <div class="group-cards" id="groupComplete" style="display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex: 1;"></div>
        </div>

        <!-- Group 2: Almost Done -->
        <div class="group-column" style="background: rgba(99, 102, 241, 0.02); border: 1px solid rgba(99, 102, 241, 0.1); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px;">
            <h2 style="font-family: var(--font-mono); font-size: 0.95rem; color: var(--indigo-500); border-bottom: 2px solid rgba(99, 102, 241, 0.2); padding-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; display: flex; justify-content: space-between; align-items: center;">
                <span>🔵 Group 2: Almost Done</span>
                <span id="countGroup2" style="background: rgba(99, 102, 241, 0.2); padding: 2px 8px; border-radius: 10px; font-size: 0.8rem;">0</span>
            </h2>
            <div class="group-cards" id="groupAlmost" style="display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex: 1;"></div>
        </div>

        <!-- Group 3: Far Behind / Idle -->
        <div class="group-column" style="background: rgba(245, 158, 11, 0.02); border: 1px solid rgba(245, 158, 11, 0.1); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px;">
            <h2 style="font-family: var(--font-mono); font-size: 0.95rem; color: var(--amber-500); border-bottom: 2px solid rgba(245, 158, 11, 0.2); padding-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; display: flex; justify-content: space-between; align-items: center;">
                <span>🟡 Group 3: Needs Action</span>
                <span id="countGroup3" style="background: rgba(245, 158, 11, 0.2); padding: 2px 8px; border-radius: 10px; font-size: 0.8rem;">0</span>
            </h2>
            <div class="group-cards" id="groupBehind" style="display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex: 1;"></div>
        </div>
    </main>

    <footer class="dashboard-footer">
        <div>
            <span>Data Sync: </span>
            <span id="syncMode" style="font-family:var(--font-mono); color:var(--amber-500)">Scanning...</span>
        </div>
        <div>
            <input type="file" id="dashboardFilePicker" style="display:none;" accept=".json,.csv" onchange="loadCachedFile(event)">
            <label for="dashboardFilePicker" class="upload-input-label">Load Offline Roster (JSON/CSV)</label>
        </div>
    </footer>

    <script>
        const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbwwQekbSK1nU7vHMWoowMb49k-75aPQv5zrcAPbNFXC24Akk4jo2un-IYSDReC-JqQ0EA/exec';
        
        const ROSTER = [
            'Farhan', 'Abdul', 'Joshua A', 'Clark', 'Madhavan', 'Remy', 'Yunho', 'Lachlan McM',
            'Lachlan Mac', 'Nolan', 'Laila', 'Josie', 'Huda', 'Brody', 'Leo', 'Elizabeth',
            'Fatima', 'Alia', 'Rifa', 'Sarah', 'Jessa', 'Delisha', 'Kendra', 'Zankia',
            'Evie', 'Jana', 'Ali', 'Kai', 'Natalia', 'Isaac'
        ];

        let studentData = {};

        function initDashboard() {
            ROSTER.forEach(s => {
                studentData[s] = {
                    studentId: s,
                    mission: "",
                    data: {}
                };
            });

            startCountdown();
            fetchData();
        }

        async function fetchData() {
            const syncEl = document.getElementById('syncMode');
            try {
                syncEl.textContent = 'Connecting cloud webhook...';
                const res = await fetch(`${WEBHOOK_URL}?action=GET_ALL_PROGRESS`);
                const raw = await res.json();
                
                const latestMap = {};
                raw.forEach(r => {
                    const sid = r.StudentId || r.studentId;
                    if (!sid || sid === 'MKS-11-STUDENT') return;
                    const ts = r.Timestamp || "";
                    if (!latestMap[sid] || ts > latestMap[sid].Timestamp) {
                        latestMap[sid] = r;
                    }
                });

                Object.keys(latestMap).forEach(sid => {
                    if (studentData[sid]) {
                        const rec = latestMap[sid];
                        let ref = {};
                        if (rec.ReflectionJSON) {
                            try { ref = JSON.parse(rec.ReflectionJSON); } catch(e){}
                        } else if (rec.data) {
                            ref = rec.data;
                        }
                        studentData[sid].mission = rec.MissionTitle || ref.topic || ref.missionSelect || "";
                        studentData[sid].data = ref;
                    }
                });
                syncEl.textContent = 'Live Synced';
                syncEl.style.color = 'var(--emerald-500)';
            } catch(e) {
                console.error("Dashboard cloud sync failed, reading local json", e);
                if (window.location.protocol === 'file:') {
                    syncEl.textContent = 'Offline (Load File Below)';
                    syncEl.style.color = 'var(--rose-500)';
                    console.log("Local fetch skipped on file:// protocol due to browser security policies. Please use the Load Offline button.");
                } else {
                    try {
                        const localRes = await fetch('live_student_data.json');
                        const localData = await localRes.json();
                        localData.forEach(item => {
                            const sid = item.studentId;
                            if (studentData[sid]) {
                                studentData[sid].mission = item.mission || "";
                                studentData[sid].data = item.data || {};
                            }
                        });
                        syncEl.textContent = 'Cached JSON';
                        syncEl.style.color = 'var(--indigo-500)';
                    } catch(err) {
                        syncEl.textContent = 'Offline (Upload File Below)';
                        syncEl.style.color = 'var(--rose-500)';
                    }
                }
            }

            renderGrid();
        }

        function renderGrid() {
            const g1 = document.getElementById('groupComplete');
            const g2 = document.getElementById('groupAlmost');
            const g3 = document.getElementById('groupBehind');

            g1.innerHTML = '';
            g2.innerHTML = '';
            g3.innerHTML = '';

            let completedCount = 0;
            let inProgressCount = 0;
            let group1Count = 0;
            let group2Count = 0;
            let group3Count = 0;

            ROSTER.forEach(sid => {
                const s = studentData[sid];
                const d = s.data;

                const why = d.selectionWhy || "";
                const q1 = d.q_1 || "";
                const q2 = d.q_2 || "";
                const log = d.recordLog || "";
                const measure = d.measureData || "";
                const reflect = d.reflectionText || "";

                // Boolean completion checks
                const step1Ok = why.length > 10;
                const step2Ok = q1.length > 10 && q2.length > 10;
                const step3Ok = log.length > 15;
                const step4Ok = measure.length > 5;
                const step5Ok = reflect.length > 20;

                const s1Class = step1Ok ? 'done' : why.length > 0 ? 'partial' : 'empty';
                const s2Class = step2Ok ? 'done' : (q1.length > 0 || q2.length > 0) ? 'partial' : 'empty';
                const s3Class = step3Ok ? 'done' : log.length > 0 ? 'partial' : 'empty';
                const s4Class = step4Ok ? 'done' : measure.length > 0 ? 'partial' : 'empty';
                const s5Class = step5Ok ? 'done' : reflect.length > 0 ? 'partial' : 'empty';

                const doneCount = [step1Ok, step2Ok, step3Ok, step4Ok, step5Ok].filter(Boolean).length;

                let statusText = "Idle";
                let statusClass = "status-idle";
                let targetGroup = g3;

                if (doneCount === 5) {
                    statusText = "Complete";
                    statusClass = "status-complete";
                    completedCount++;
                    targetGroup = g1;
                    group1Count++;
                } else if (doneCount >= 3) {
                    statusText = "Almost Done";
                    statusClass = "status-inprogress";
                    inProgressCount++;
                    targetGroup = g2;
                    group2Count++;
                } else {
                    statusText = why.length > 0 ? "Started" : "Idle";
                    statusClass = why.length > 0 ? "status-inprogress" : "status-idle";
                    if (why.length > 0) inProgressCount++;
                    targetGroup = g3;
                    group3Count++;
                }

                const card = document.createElement('div');
                card.className = 'student-card';
                card.innerHTML = `
                    <div>
                        <div class="student-header">
                            <span class="student-name">${sid}</span>
                            <span class="mission-tag">${s.mission ? s.mission.substring(0, 7) : 'CIT-???'}</span>
                        </div>
                        <div class="progress-steps-row">
                            <div class="step-indicator ${s1Class}" title="Step 1: Plan">P</div>
                            <div class="step-indicator ${s2Class}" title="Step 2: Research">R</div>
                            <div class="step-indicator ${s3Class}" title="Step 3: Action Log">L</div>
                            <div class="step-indicator ${s4Class}" title="Step 4: Measure">M</div>
                            <div class="step-indicator ${s5Class}" title="Step 5: Reflect">E</div>
                        </div>
                    </div>
                    <span class="overall-status-badge ${statusClass}">${statusText}</span>
                `;
                targetGroup.appendChild(card);
            });

            document.getElementById('countGroup1').textContent = group1Count;
            document.getElementById('countGroup2').textContent = group2Count;
            document.getElementById('countGroup3').textContent = group3Count;

            document.getElementById('statComplete').textContent = completedCount;
            document.getElementById('statInProgress').textContent = inProgressCount;
            document.getElementById('statRoster').textContent = ROSTER.length;
            
            const rate = Math.round((completedCount / ROSTER.length) * 100);
            document.getElementById('statClassRate').textContent = `${rate}%`;
        }

        function loadCachedFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const json = JSON.parse(e.target.result);
                    json.forEach(item => {
                        const sid = item.studentId || item.StudentId;
                        if (studentData[sid]) {
                            studentData[sid].mission = item.mission || item.MissionTitle || "";
                            studentData[sid].data = item.data || JSON.parse(item.ReflectionJSON || '{}');
                        }
                    });
                    document.getElementById('syncMode').textContent = 'Cache Loaded';
                    document.getElementById('syncMode').style.color = 'var(--indigo-500)';
                    renderGrid();
                    alert("Dashboard roster updated from offline file!");
                } catch(err) {
                    alert("Failed to parse file. Make sure it's valid JSON.");
                }
            };
            reader.readAsText(file);
        }

        function startCountdown() {
            const targetDate = new Date("2026-06-09T23:59:59").getTime();
            const el = document.getElementById("countdownTimer");
            
            function update() {
                const now = new Date().getTime();
                const diff = targetDate - now;
                if (diff < 0) {
                    el.textContent = "OVERDUE - FINAL AUDITING";
                    return;
                }
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                
                el.textContent = `${days}d ${hours}h ${minutes}m ${seconds}s remaining`;
            }
            update();
            setInterval(update, 1000);
        }

        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
