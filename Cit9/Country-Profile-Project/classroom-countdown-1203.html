<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Countdown to 12:03 PM</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    color: #ffea00;
    font-family: "Impact", "Arial Black", sans-serif;
    overflow: hidden;
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  #label {
    font-size: 6vw;
    letter-spacing: 0.1em;
    color: #ffea00;
    margin-bottom: 2vh;
    text-shadow: 0 0 20px #ffea00;
  }
  #clock {
    font-size: 22vw;
    line-height: 1;
    font-weight: 900;
    letter-spacing: 0.05em;
    text-shadow: 0 0 40px #ffea00, 0 0 80px #ff8c00;
  }
  #target {
    font-size: 5vw;
    margin-top: 3vh;
    color: #fff;
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div id="label">TIME UNTIL 3:35 PM 🦆</div>
    <div id="clock">--:--:--</div>
    <div id="target">Class ends at 3:35 PM</div>
  </div>
<script>
  function pad(n) { return String(n).padStart(2, '0'); }

  function tick() {
    const now = new Date();
    const target = new Date(now);
    target.setHours(15, 35, 0, 0);
    if (now >= target) {
      document.getElementById('clock').textContent = "00:00:00";
      document.getElementById('label').textContent = "IT'S 3:35 PM! 🦆";
      return;
    }
    let diff = Math.floor((target - now) / 1000);
    const h = Math.floor(diff / 3600);
    diff %= 3600;
    const m = Math.floor(diff / 60);
    const s = diff % 60;
    document.getElementById('clock').textContent =
      pad(h) + ':' + pad(m) + ':' + pad(s);
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
