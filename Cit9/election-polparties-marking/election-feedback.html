            margin-bottom: 0.4rem;
            font-weight: 600;
            text-transform: uppercase;

            border-radius: 8px;

            border-color: var(--accent);
        }

            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
        }
        .btn-login:hover { opacity: 0.9; }
        .error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 0.75rem;
            display: none;

            padding: 2rem;

            margin-bottom: 0.3rem;

            letter-spacing: 2px;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 1rem;

            background: rgba(16, 185, 129, 0.15);

            font-size: 1.4rem;

            font-size: 0.95rem;

            color: var(--text-muted);

            padding: 2rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.75rem;
            border-top: 1px solid var(--glass-border);

</head>

function login() {
    var nameInput = document.getElementById('login-name').value.trim();
    var pinInput = document.getElementById('login-pin').value.trim().toUpperCase();
    var errorEl = document.getElementById('login-error');

    if (!nameInput || !pinInput) { errorEl.style.display = 'block'; errorEl.textContent = 'Please enter both your name and PIN.'; return; }

    var student = roster.find(function(s) {
        return s.name.toLowerCase() === nameInput.toLowerCase() && s.pin === pinInput;
    });

    if (!student) { errorEl.style.display = 'block'; errorEl.textContent = 'Name or PIN not recognized. Check your spelling and try again.'; return; }

    var fb = feedback[student.name];
    if (!fb) { errorEl.style.display = 'block'; errorEl.textContent = 'Feedback not found for this student. Contact Mr. Waugh.'; return; }

    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('feedback-page').style.display = 'block';

    document.getElementById('fb-name').textContent = student.name;
    document.getElementById('fb-party').textContent = student.party;
    document.getElementById('fb-role').textContent = student.role;

    var outHtml = '';
    fb.outcomes.forEach(function(o) {
        var quoteHtml = o.quote ? '<div class="quote">' + o.quote + '</div>' : '';
        outHtml += '<div class="outcome-card">' +
            '<div class="outcome-label">' + o.label + '</div>' +
            '<div class="grade-badge">' + o.grade + '</div>' +
            '<h2>' + o.title + '</h2>' +
            '<p>' + o.text + '</p>' +
            quoteHtml +
            '</div>';
    });
    document.getElementById('fb-outcomes').innerHTML = outHtml;
    document.getElementById('fb-closing').textContent = fb.closing;
}
</script>
