<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>COMMANDER DASHBOARD | LEO 1752</title>
    <!-- TEACHER: Use your same API URL here -->
    <script>const API_URL = "https://script.google.com/macros/s/AKfycbxwkUZifC73ZyLXbdBBIrtS85dxSvp5UJNT1lYlg1xGpffFkqSfzZFdXsOwx4D-KtBE/exec";</script>
    
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Roboto:wght@400;700&family=Courier+Prime&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0c0c0c;
            --accent: #FFD700;
            --text: #e0e0e0;
            --card-bg: #1a1a1a;
            --border: #333;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Roboto', sans-serif;
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Merriweather', serif;
            color: var(--accent);
            margin: 0;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            gap: 15px;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: #888;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .filter-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(255, 215, 0, 0.1);
        }

        .download-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'Courier Prime', monospace;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            text-align: left;
            padding: 15px;
            background: #222;
            color: var(--accent);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        tr:hover {
            background: #252525;
        }

        .progress-bar {
            height: 6px;
            background: #333;
            border-radius: 3px;
            width: 100px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
        }

        .verdict-tag {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .verdict-CROWN { background: #442222; color: #ff8888; }
        .verdict-DEFENSE { background: #224422; color: #88ff88; }

        #stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
        }

        .stat-val { font-size: 1.5rem; font-weight: bold; color: var(--accent); }
        .stat-label { font-size: 0.7rem; color: #888; text-transform: uppercase; margin-top: 5px; }

        .loading {
            text-align: center;
            padding: 50px;
            color: var(--accent);
            font-family: 'Courier Prime', monospace;
        }

        .text-view-container {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
        }

        .text-view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .text-view-header h2 {
            margin: 0;
            color: var(--accent);
            font-family: 'Merriweather', serif;
        }

        .block-section {
            margin-bottom: 30px;
        }

        .block-title {
            font-family: 'Merriweather', serif;
            color: var(--accent);
            font-size: 1.1rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .student-card {
            background: #222;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 3px solid var(--accent);
        }

        .student-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .student-name {
            font-weight: bold;
            color: var(--accent);
            font-size: 1rem;
        }

        .student-meta {
            font-size: 0.75rem;
            color: #888;
        }

        .exhibit-entry {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #333;
        }

        .exhibit-entry:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .exhibit-label {
            font-weight: bold;
            color: var(--accent);
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        .exhibit-decision {
            font-family: 'Courier Prime', monospace;
            color: #fff;
            margin-bottom: 4px;
        }

        .exhibit-rationale {
            color: #aaa;
            font-size: 0.85rem;
            line-height: 1.5;
            padding-left: 10px;
            border-left: 2px solid #444;
        }

        .student-verdict {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }

        .verdict-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
        }

        .verdict-value {
            font-weight: bold;
            font-size: 0.9rem;
        }

        .verdict-CROWN-text { color: #ff8888; }
        .verdict-DEFENSE-text { color: #88ff88; }
        .verdict-progress-text { color: #888; }
    </style>
</head>
<body>

    <div class="header">
        <h1>COMMANDER DASHBOARD</h1>
        <div class="controls">
            <button class="filter-btn active" onclick="filterClass('ALL')">ALL BLOCKS</button>
            <button class="filter-btn" onclick="filterClass('A Block (Waugh)')">A BLOCK</button>
            <button class="filter-btn" onclick="filterClass('C Block (Waugh)')">C BLOCK</button>
            <button class="filter-btn" onclick="filterClass('D Block (Hargreaves)')">D BLOCK</button>
            <button class="download-btn" onclick="downloadCSV()">DOWNLOAD CSV</button>
            <button class="download-btn" onclick="showTextView()">TEXT VIEW</button>
        </div>
    </div>

    <div id="stats">
        <div class="stat-card"><div id="stat-total" class="stat-val">0</div><div class="stat-label">Total Agents</div></div>
        <div class="stat-card"><div id="stat-active" class="stat-val">0</div><div class="stat-label">Active This Hour</div></div>
        <div class="stat-card"><div id="stat-guilty" class="stat-val">0</div><div class="stat-label">Crown Verdicts</div></div>
        <div class="stat-card"><div id="stat-innocent" class="stat-val">0</div><div class="stat-label">Defense Verdicts</div></div>
    </div>

    <div id="loading" class="loading">ESTABLISHING SECURE CONNECTION...</div>
    
    <div id="text-view" class="text-view-container" style="display:none;">
        <div class="text-view-header">
            <h2>STUDENT RESPONSES</h2>
            <button class="download-btn" onclick="downloadTXT()">DOWNLOAD TXT</button>
        </div>
        <div id="text-content"></div>
    </div>
    
    <table id="dash-table" style="display:none;">
        <thead>
            <tr>
                <th>Agent</th>
                <th>Block</th>
                <th>Progress</th>
                <th>Last Decision</th>
                <th>Final Verdict</th>
                <th>Timestamp</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>

    <script>
        let allData = [];
        let currentFilter = 'ALL';

        async function refreshData() {
            try {
                const response = await fetch(`${API_URL}?action=get_dashboard`);
                allData = await response.json();
                document.getElementById('loading').style.display = 'none';
                if (document.getElementById('text-view').style.display !== 'none') {
                    renderTextView();
                } else {
                    document.getElementById('dash-table').style.display = 'table';
                    renderTable();
                }
            } catch (e) {
                document.getElementById('loading').innerText = "CONNECTION FAILED. CHECK API URL.";
            }
        }

        function filterClass(block) {
            currentFilter = block;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(block.split(' ')[0]) || (block === 'ALL' && btn.innerText === 'ALL BLOCKS'));
            });
            if (document.getElementById('text-view').style.display !== 'none') {
                renderTextView();
            } else {
                renderTable();
            }
        }

        function togglePin(id) {
            const el = document.getElementById('pin-' + id);
            el.style.display = el.style.display === 'none' ? 'inline' : 'none';
        }

        function renderTable() {
            const body = document.getElementById('table-body');
            body.innerHTML = '';
            
            const filtered = allData.filter(d => currentFilter === 'ALL' || d.block === currentFilter);
            
            // Stats
            document.getElementById('stat-total').innerText = filtered.length;
            document.getElementById('stat-guilty').innerText = filtered.filter(d => d.verdict === 'CROWN').length;
            document.getElementById('stat-innocent').innerText = filtered.filter(d => d.verdict === 'DEFENSE').length;
            
            // Find recent activity (last hour)
            const oneHourAgo = new Date(Date.now() - 3600000);
            document.getElementById('stat-active').innerText = filtered.filter(d => new Date(d.timestamp) > oneHourAgo).length;

            // Group by student (get latest entry for each)
            const latestByStudent = {};
            filtered.forEach(d => {
                if (!latestByStudent[d.codename] || new Date(d.timestamp) > new Date(latestByStudent[d.codename].timestamp)) {
                    latestByStudent[d.codename] = d;
                }
            });

            Object.values(latestByStudent).sort((a,b) => {
                const progressA = Object.keys(a.choices).length;
                const progressB = Object.keys(b.choices).length;
                if (progressA !== progressB) return progressB - progressA;
                return new Date(b.timestamp) - new Date(a.timestamp);
            }).forEach(student => {
                const choices = Object.keys(student.choices).length;
                const progressPct = Math.min(100, (choices / 9) * 100);
                
                // Extract the PIN for the reveal feature
                const pinPart = (student.codename.match(/\(([^)]+)\)/) || [])[1] || "****";
                const displayName = student.codename.split('(')[0].trim();
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="font-weight:bold; color:var(--accent);">
                        ${displayName} 
                        <span class="pin-display" id="pin-${student.codename.replace(/\W/g,'')}" style="display:none; color:#888; font-family:'Courier Prime'; font-size:0.7rem; margin-left:10px;">(${pinPart})</span>
                        <button onclick="togglePin('${student.codename.replace(/\W/g,'')}')" style="background:none; border:none; color:#555; cursor:pointer; font-size:0.8rem; padding:0 5px;" title="Reveal Code">👁️</button>
                    </td>
                    <td><span style="font-size:0.7rem; color:#888;">${student.block}</span></td>
                    <td>
                        <div class="progress-bar"><div class="progress-fill" style="width:${progressPct}%"></div></div>
                        <div style="font-size:0.6rem; margin-top:4px;">${choices}/9 EXHIBITS</div>
                    </td>
                    <td><span style="font-family:'Courier Prime'; font-size:0.7rem;">${student.verdict || 'IN PROGRESS'}</span></td>
                    <td>
                        ${student.verdict ? `<span class="verdict-tag verdict-${student.verdict}">${student.verdict}</span>` : '---'}
                        ${student.rationales && student.rationales['final_rationale'] ? `<div style="font-size:0.75rem; color:#aaa; margin-top:5px; max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${student.rationales['final_rationale'].replace(/"/g, '&quot;')}">${student.rationales['final_rationale']}</div>` : ''}
                    </td>
                    <td style="font-size:0.7rem; color:#666;">${new Date(student.timestamp).toLocaleString()}</td>
                `;
                body.appendChild(row);
            });
        }

        function downloadCSV() {
            const filtered = allData.filter(d => currentFilter === 'ALL' || d.block === currentFilter);
            let csv = "Timestamp,Block,Student,Decisions,Rationales,FinalVerdict,FinalRationale\n";
            
            filtered.forEach(d => {
                const finalRationale = d.rationales ? (d.rationales['final_rationale'] || '') : '';
                csv += `"${d.timestamp}","${d.block}","${d.codename}","${JSON.stringify(d.choices).replace(/"/g, '""')}","${JSON.stringify(d.rationales).replace(/"/g, '""')}","${d.verdict}","${finalRationale.replace(/"/g, '""')}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', `Leo_1752_Progress_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function showTextView() {
            const textView = document.getElementById('text-view');
            const dashTable = document.getElementById('dash-table');
            
            if (textView.style.display === 'none') {
                textView.style.display = 'block';
                dashTable.style.display = 'none';
                renderTextView();
            } else {
                textView.style.display = 'none';
                dashTable.style.display = 'table';
            }
        }

        function renderTextView() {
            const filtered = allData.filter(d => currentFilter === 'ALL' || d.block === currentFilter);
            const textContent = document.getElementById('text-content');
            
            if (filtered.length === 0) {
                textContent.innerHTML = '<p style="color:#888; text-align:center; padding:40px;">No data available.</p>';
                return;
            }

            const latestByStudent = {};
            filtered.forEach(d => {
                if (!latestByStudent[d.codename] || new Date(d.timestamp) > new Date(latestByStudent[d.codename].timestamp)) {
                    latestByStudent[d.codename] = d;
                }
            });

            const byBlock = {};
            Object.values(latestByStudent).forEach(d => {
                if (!byBlock[d.block]) byBlock[d.block] = [];
                byBlock[d.block].push(d);
            });

            let html = '';
            Object.keys(byBlock).sort().forEach(block => {
                html += `<div class="block-section">`;
                html += `<div class="block-title">${block}</div>`;

                byBlock[block].sort((a, b) => a.codename.localeCompare(b.codename)).forEach(student => {
                    const displayName = student.codename.split('(')[0].trim();
                    const choices = student.choices || {};
                    const rationales = student.rationales || {};
                    const verdict = student.verdict || 'IN PROGRESS';
                    const verdictClass = verdict === 'CROWN' ? 'verdict-CROWN-text' : verdict === 'DEFENSE' ? 'verdict-DEFENSE-text' : 'verdict-progress-text';

                    html += `<div class="student-card">`;
                    html += `<div class="student-header">`;
                    html += `<span class="student-name">${displayName}</span>`;
                    html += `<span class="student-meta">${student.block} | ${new Date(student.timestamp).toLocaleString()}</span>`;
                    html += `</div>`;

                    Object.keys(choices).sort().forEach(exhibit => {
                        const decision = choices[exhibit] || 'N/A';
                        const rationale = rationales[exhibit] || '';
                        
                        html += `<div class="exhibit-entry">`;
                        html += `<div class="exhibit-label">EXHIBIT ${exhibit}</div>`;
                        html += `<div class="exhibit-decision">${decision}</div>`;
                        if (rationale) {
                            html += `<div class="exhibit-rationale">${rationale}</div>`;
                        }
                        html += `</div>`;
                    });

                    const finalRationale = rationales['final_rationale'] || '';
                    html += `<div class="student-verdict">`;
                    html += `<span class="verdict-label">Final Verdict: </span>`;
                    html += `<span class="verdict-value ${verdictClass}">${verdict}</span>`;
                    if (finalRationale) {
                        html += `<div class="exhibit-rationale" style="margin-top: 10px; font-style: italic;"><strong>Closing Statement:</strong> ${finalRationale}</div>`;
                    }
                    html += `</div>`;
                    html += `</div>`;
                });

                html += `</div>`;
            });

            textContent.innerHTML = html;
        }

        function downloadTXT() {
            const filtered = allData.filter(d => currentFilter === 'ALL' || d.block === currentFilter);
            
            if (filtered.length === 0) {
                alert('No data to export.');
                return;
            }

            const latestByStudent = {};
            filtered.forEach(d => {
                if (!latestByStudent[d.codename] || new Date(d.timestamp) > new Date(latestByStudent[d.codename].timestamp)) {
                    latestByStudent[d.codename] = d;
                }
            });

            const byBlock = {};
            Object.values(latestByStudent).forEach(d => {
                if (!byBlock[d.block]) byBlock[d.block] = [];
                byBlock[d.block].push(d);
            });

            let txt = 'LEO 1752 - STUDENT RESPONSES\n';
            txt += `Generated: ${new Date().toLocaleString()}\n`;
            txt += '='.repeat(50) + '\n\n';

            Object.keys(byBlock).sort().forEach(block => {
                txt += `BLOCK: ${block}\n`;
                txt += '-'.repeat(50) + '\n\n';

                byBlock[block].sort((a, b) => a.codename.localeCompare(b.codename)).forEach(student => {
                    const displayName = student.codename.split('(')[0].trim();
                    const choices = student.choices || {};
                    const rationales = student.rationales || {};
                    const verdict = student.verdict || 'IN PROGRESS';

                    txt += `  ${displayName}\n`;
                    txt += `  Block: ${student.block} | Time: ${new Date(student.timestamp).toLocaleString()}\n`;
                    txt += '\n';

                    Object.keys(choices).sort().forEach(exhibit => {
                        const decision = choices[exhibit] || 'N/A';
                        const rationale = rationales[exhibit] || '';
                        
                        txt += `    EXHIBIT ${exhibit}: ${decision}\n`;
                        if (rationale) {
                            txt += `    > ${rationale}\n`;
                        }
                        txt += '\n';
                    });

                    const finalRationale = rationales['final_rationale'] || '';
                    txt += `  VERDICT: ${verdict}\n`;
                    if (finalRationale) {
                        txt += `  CLOSING STATEMENT: ${finalRationale}\n`;
                    }
                    txt += '\n' + '='.repeat(50) + '\n\n';
                });
            });

            const blob = new Blob([txt], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', `Leo_1752_Responses_${new Date().toISOString().split('T')[0]}.txt`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        refreshData();
        setInterval(refreshData, 30000); // Auto-refresh every 30 seconds
    </script>
</body>
</html>
