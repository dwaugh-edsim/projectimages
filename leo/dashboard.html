<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>COMMANDER DASHBOARD | LEO 1752</title>
    <!-- TEACHER: Use your same API URL here -->
    <script>const API_URL = "https://script.google.com/a/macros/gnspes.ca/s/AKfycbxwkUZifC73ZyLXbdBBIrtS85dxSvp5UJNT1lYlg1xGpffFkqSfzZFdXsOwx4D-KtBE/exec";</script>
    
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Roboto:wght@400;700&family=Courier+Prime&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0c0c0c;
            --accent: #FFD700;
            --text: #e0e0e0;
            --card-bg: #1a1a1a;
            --border: #333;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Roboto', sans-serif;
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Merriweather', serif;
            color: var(--accent);
            margin: 0;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            gap: 15px;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: #888;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .filter-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(255, 215, 0, 0.1);
        }

        .download-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'Courier Prime', monospace;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            text-align: left;
            padding: 15px;
            background: #222;
            color: var(--accent);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        tr:hover {
            background: #252525;
        }

        .progress-bar {
            height: 6px;
            background: #333;
            border-radius: 3px;
            width: 100px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
        }

        .verdict-tag {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .verdict-CROWN { background: #442222; color: #ff8888; }
        .verdict-DEFENSE { background: #224422; color: #88ff88; }

        #stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
        }

        .stat-val { font-size: 1.5rem; font-weight: bold; color: var(--accent); }
        .stat-label { font-size: 0.7rem; color: #888; text-transform: uppercase; margin-top: 5px; }

        .loading {
            text-align: center;
            padding: 50px;
            color: var(--accent);
            font-family: 'Courier Prime', monospace;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>COMMANDER DASHBOARD</h1>
        <div class="controls">
            <button class="filter-btn active" onclick="filterClass('ALL')">ALL BLOCKS</button>
            <button class="filter-btn" onclick="filterClass('A Block (Waugh)')">A BLOCK</button>
            <button class="filter-btn" onclick="filterClass('C Block (Waugh)')">C BLOCK</button>
            <button class="filter-btn" onclick="filterClass('D Block (Hargreaves)')">D BLOCK</button>
            <button class="download-btn" onclick="downloadCSV()">DOWNLOAD CSV</button>
        </div>
    </div>

    <div id="stats">
        <div class="stat-card"><div id="stat-total" class="stat-val">0</div><div class="stat-label">Total Agents</div></div>
        <div class="stat-card"><div id="stat-active" class="stat-val">0</div><div class="stat-label">Active This Hour</div></div>
        <div class="stat-card"><div id="stat-guilty" class="stat-val">0</div><div class="stat-label">Crown Verdicts</div></div>
        <div class="stat-card"><div id="stat-innocent" class="stat-val">0</div><div class="stat-label">Defense Verdicts</div></div>
    </div>

    <div id="loading" class="loading">ESTABLISHING SECURE CONNECTION...</div>
    
    <table id="dash-table" style="display:none;">
        <thead>
            <tr>
                <th>Agent</th>
                <th>Block</th>
                <th>Progress</th>
                <th>Last Decision</th>
                <th>Final Verdict</th>
                <th>Timestamp</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>

    <script>
        let allData = [];
        let currentFilter = 'ALL';

        async function refreshData() {
            try {
                const response = await fetch(`${API_URL}?action=get_dashboard`);
                allData = await response.json();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('dash-table').style.display = 'table';
                renderTable();
            } catch (e) {
                document.getElementById('loading').innerText = "CONNECTION FAILED. CHECK API URL.";
            }
        }

        function filterClass(block) {
            currentFilter = block;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(block.split(' ')[0]) || (block === 'ALL' && btn.innerText === 'ALL BLOCKS'));
            });
            renderTable();
        }

        function renderTable() {
            const body = document.getElementById('table-body');
            body.innerHTML = '';
            
            const filtered = allData.filter(d => currentFilter === 'ALL' || d.block === currentFilter);
            
            // Stats
            document.getElementById('stat-total').innerText = filtered.length;
            document.getElementById('stat-guilty').innerText = filtered.filter(d => d.verdict === 'CROWN').length;
            document.getElementById('stat-innocent').innerText = filtered.filter(d => d.verdict === 'DEFENSE').length;
            
            // Find recent activity (last hour)
            const oneHourAgo = new Date(Date.now() - 3600000);
            document.getElementById('stat-active').innerText = filtered.filter(d => new Date(d.timestamp) > oneHourAgo).length;

            // Group by student (get latest entry for each)
            const latestByStudent = {};
            filtered.forEach(d => {
                if (!latestByStudent[d.codename] || new Date(d.timestamp) > new Date(latestByStudent[d.codename].timestamp)) {
                    latestByStudent[d.codename] = d;
                }
            });

            Object.values(latestByStudent).sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp)).forEach(student => {
                const choices = Object.keys(student.choices).length;
                const progressPct = Math.min(100, (choices / 9) * 100);
                
                // Strip the (PIN) from the codename for privacy
                const displayName = student.codename.split('(')[0].trim();
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="font-weight:bold; color:var(--accent);">${displayName}</td>
                    <td><span style="font-size:0.7rem; color:#888;">${student.block}</span></td>
                    <td>
                        <div class="progress-bar"><div class="progress-fill" style="width:${progressPct}%"></div></div>
                        <div style="font-size:0.6rem; margin-top:4px;">${choices}/9 EXHIBITS</div>
                    </td>
                    <td><span style="font-family:'Courier Prime'; font-size:0.7rem;">${student.verdict || 'IN PROGRESS'}</span></td>
                    <td>
                        ${student.verdict ? `<span class="verdict-tag verdict-${student.verdict}">${student.verdict}</span>` : '---'}
                    </td>
                    <td style="font-size:0.7rem; color:#666;">${new Date(student.timestamp).toLocaleString()}</td>
                `;
                body.appendChild(row);
            });
        }

        function downloadCSV() {
            const filtered = allData.filter(d => currentFilter === 'ALL' || d.block === currentFilter);
            let csv = "Timestamp,Block,Student,Decisions,Rationales,FinalVerdict\n";
            
            filtered.forEach(d => {
                csv += `"${d.timestamp}","${d.block}","${d.codename}","${JSON.stringify(d.choices).replace(/"/g, '""')}","${JSON.stringify(d.rationales).replace(/"/g, '""')}","${d.verdict}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', `Leo_1752_Progress_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        refreshData();
        setInterval(refreshData, 30000); // Auto-refresh every 30 seconds
    </script>
</body>
</html>
