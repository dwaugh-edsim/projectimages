ly protecting people.", "feedback": "Good analysis of the Crown's motivations. The evidence of economic protectionism is significant because it undermines the Crown's claimed public safety objective. Under the Sparrow framework, the Crown must demonstrate a compelling and substantial objective - protecting government revenue from competition doesn't qualify."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "the ôFrozen Rightsö argument can be seen as treating Indigenous rights as stuck in the past, while modern legal interpretation supports evolving, living rights.", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "the argument leans toward Leo because treaty rights are meant to support a modern, living livelihood, not just historical activities.", "feedback": "Good engagement with the moderate livelihood question. The R v Marshall decision is central - the Court recognized that treaty rights include the ability to earn a moderate livelihood, not just bare subsistence. To strengthen your analysis, consider how the scale of the operation matters and what 'moderate' means in the context of the modern economy."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "the Crown likely fails the justification step because it did not clearly show proper consultation or minimal impairment of the treaty right.", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "JOSH (JOSH)": {"name": "JOSH", "pin": "JOSH", "block": "A Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "The words 'any other thing' make clear that Article 4 intended to include 'any other thing' that the Mi'kmaq could have to sell. They could have provided a full list of items in the treaty but did not, which means its intended to have a broad meaning. I can't see why that can't include cannibis which is a legal product to sell in the province.", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "No, 'public safety' is not a valid argument. The product was tested and no evidence was found that it was unsafe.  Cannabis sales in Nova Scotia totaled $127.1 million for the year ended March 31, 2025. This provides important funding for the government so it will encourage people to buy the cannabis it sells through the Nova Scotia Liquor Commission instead of from other sources. The 'public safety' argument is part of a marketing campaign by the government to encourage the purchase of 'safe' product through its retailers.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "The UN Declaration on the Rights of Indigenous Peoples says in Article 3 that Indigenous people have the right to self determination. They create their own laws and customs and can live by those. A sacred fire is a spritual boundary of great significance in Mi'kmaw culture. When a Mi'kmaw person dies a Sacred Fire is lit and is kept burning for four days. During this period, the spirit of the deceased person is making its final visits to people and places it has known during its life on Earth, and the Sacred Fire acts as a beacon so that the spirit can find its way back. The Sacred Fire marks a boundary and has a set of rules around how it is treated and managed. It is a legal boundary in indigenous law.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "CROWN", "rationale": "I don't think this is a valid analogy. In 1760, gunpowder, lead and muskets were products used by the Mi'kmaq for hunting and to protect their territory. These were essential tools for their livelihoods. I would not argue that cannibis is essential to Mi'kmaq people's livelihood. It is a recreational product for personal consumption. Evaluating the safety of something for optional use and personal consumption is very different from the saftey of products used for livelihood and survival.The first is optional and the second is necessary.", "feedback": "You've identified a distinction between historical musket trade and modern cannabis regulation. However, consider the counter-argument: the Crown accepted musket trade in 1760 despite genuine safety concerns, which suggests that treaty trade was never limited by safety standards. The musket analogy demonstrates that the Crown has historically accepted Indigenous trade in goods it considered dangerous."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "CROWN", "rationale": "The government has fiduciary duties to indigenous people and also to the general public. The government has a fiduciary duty to manage public assets with care and in the public interest. The money the government gets from cannabis sales funds public infrastructure, programs and more. So you could say that even if the 'fiduciary duty' is being used to protect profits, that is the government fufilling its obligations to the public.", "feedback": "You've defended the Province's regulatory role. However, consider the evidence: the lab reports show no safety issues, and the NSLC sales data suggests economic motives. The Sparrow Test requires the Crown to demonstrate that its actions serve a compelling public purpose, not just protect government revenue."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "Yes it does. The law changes over time in order to keep up with society. Judges interpret laws differently over time. When the law on theft was first written in canadian criminal law, no one imagined it would include crytocurrency someday. The wording in Article 4 of the Peace and Friendship treaty of 1752 was broad and written to include 'any other thing'. That language shows intention for interpretation. Otherwise they would have listed all the 'other things' in the treaty. Understanding the treaty to only include things that were traded back then is freezing the law in history and not allowing it to change and evolve like other Candian laws do.", "feedback": "Good understanding of the tension between frozen and evolving interpretations. The key insight is that freezing rights at 1752 creates an absurd outcome: Indigenous peoples would be denied the ability to participate in the modern economy. The Supreme Court has consistently rejected this approach in cases like R v Marshall."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "CROWN", "rationale": "Moderate livelihood does not mean accumulating wealth. In the Marshall case the decision says \"What is contemplated is not a right to trade generally for economic gain, but rather a right to trade for necessaries.\" There is evidence of low cannabis sales at the NSLC stores near Leo's business which means Leo is making an economic gain from his business. Cannabis is not necessary, it's not the same as fish or other food sources. Leo's business is more than what is meant by a modereate livelihood.", "feedback": "You've raised the question of whether Leo's business exceeds 'moderate livelihood.' However, the Supreme Court in R v Marshall specifically rejected limiting treaty rights to subsistence activities. What constitutes 'reasonable' must be understood in contemporary economic terms."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "The Crown did not meet the requirement for justifiction. The 'public safety' arguement is not valid. And even if it were, there was no consultation with the community, and they prioritized the goverment's interest in tax revenue over the Mi'kmaw right to trade.", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "JOSHUA (ABCD)": {"name": "JOSHUA", "pin": "ABCD", "block": "D Block (Hargreaves)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "I support the Defense due to Article 4 of the 1752 Treaty, which lets the Mi'kmaq trade at the Truckhouse for both \"necessaries\" and \"any other thing.\" \"Any other thing\" isn't restricted to certain items, making it pretty wide open. The idea was that the Mi'kmaq could take part in trade while avoiding exploitation. With cannabis being a legally sellable item now, it fits under those trade rights protected by the treaty. So, the treaty backs up the Mi'kmaq's ongoing right to trade all sorts of stuff, even contemporary items like cannabis.", "feedback": "Good focus on the Truckhouse provision as evidence of ongoing trade rights. The treaty's guarantee of free liberty to bring goods for sale is central to Leo's case. To deepen your analysis, think about how the Crown might distinguish between the 1752 Truckhouse system (government-controlled trading posts) and Leo's independent shop. The key difference the Crown would emphasize is regulation."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "I support the Defense because an independent lab report discovered no proof that the cannabis was unsafe. It had no pesticides, no mold, and its THC content was correctly labeled. So, these results undermine the Crown's assertion that the raid was necessary for public safety. The product meeting safety standards indicates the raid wasn't mainly about health. Rather, it looks like the issue was about control and profits from sales. Hence, the Public Safety argument doesn't hold up against the lab evidence.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "I'm for the defense since the Sacred Fire is seen as a spiritual boundary in Mi'kmaw culture. According to the exhibit, stepping over it is a major disrespectùmeaning it has serious cultural and spiritual importance. Given that Indigenous rights protect their practices, crossing the Sacred Fire turned what was initially a legal matter into a human rights issue. Also, the blockades that happened afterward show that community members see their land and leadership as distinct from the provinceÆs control. So, the Sacred Fire served as a legal boundary, representing their laws, traditions, and rights that the community expected others to honor.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "I support the Defense because LeoÆs testimony argues against the \"Empty Box Theory.\" This theory states that Indigenous rights only count if a judge acknowledges them. Leo insists that the Mi'kmaq possess complete, continuous rights that don't rely on colonial approval. Leo uses a response to the 'Musket' comparison û the Crown mentions it as if it proves something legal, though they originally used force to oppress rights. However, whether rights exist isnÆt decided by old military strength; itÆs about laws, treaties, and Indigenous self-governance. So, LeoÆs point that his \"box is FULL of inherent rights\" makes a much stronger case compared to the Crown's outdated reasoning.", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "I support the Defence because the CrownÆs argument about \"chaos\" and fiduciary duty seems more focused on controlling the market and protecting provincial profits than actually safeguarding the public. Exhibit B's lab report proved LeoÆs cannabis met safety standards, showing no real public health risk. The CrownÆs warnings about unregulated shops appear speculative and aimed at maintaining their monopoly. So, while the province says theyÆre protecting people, the evidence points to the fiduciary duty being used mainly to shield the ProvinceÆs economic interests, not public safety.", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "I support the Defence since the \"Frozen Rights\" approach in R. v. Googoo treats Treaty rights like they're stuck in 1752. According to this case, because the Mi'kmaq didn't trade cannabis back then, they can't do it now. This makes Treaty rights seem like museum pieces instead of something alive and adaptable. It ignores how treaties need to grow with economic and social changes. Evidence actually points towards Treaty rights being flexible and dynamic agreements. Therefore, viewing these rights as frozen in time is too strict and doesnÆt fit the idea of what treaty protection is supposed to be about.", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "I back the Defense because the Marshall decision confirmed that Treaty rights can beat out provincial regulations. This was clear when Donald Marshall Jr. could fish for a ômoderate livelihood.ö Leo says his cannabis business would fund his community, elders, and economic development, which fits the Marshall ruling on moderate livelihood. Just like Marshall, Leo wants to create stable income for his people through Treaty rights. So, his business counts as a moderate livelihood too, protected by the Treaty, even if the province disagrees.", "feedback": "Strong application of the R v Marshall precedent. The Supreme Court's definition of 'moderate livelihood' as encompassing necessities supplemented by amenities is deliberately flexible. Leo's argument that his business supports community members and funds services fits well within this framework. The Court in Marshall rejected limiting treaty rights to subsistence-level activities."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "I support the Defence because, under the Sparrow Test, the Crown needs to show that limiting an Aboriginal right is justified and that it upheld the Honour of the Crown, including proper consultation. The exhibit points out that the Crown skipped consultation and used too much force during the raid, meaning Step 2 of the Sparrow Test wasn't met. Even if the Crown says it was just enforcing the law, Sparrow requires more than just asserting authority û it needs to respect Indigenous rights as well. Because the Crown failed to consult properly and used excessive force, the justification requirement isn't met at all.", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "JAIVEER (WASD)": {"name": "Jaiveer", "pin": "WASD", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "\"Any other thing\" means the Mi'kmaq can sell more than just the items listed, concluding that it can include cannabis today. Because laws should change over time, selling cannabis can be seen as part of their right to trade.", "feedback": "Strong use of the Living Tree Doctrine. You correctly identify that treaty interpretation should evolve with the times. To strengthen your analysis, reference how the Supreme Court applied this in R v Marshall - the Court noted that treaty rights must be interpreted in a way that reconciles Indigenous and Crown interests over time. Consider also what the Crown might argue about the original intent of the treaty makers."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "CROWN", "rationale": "The Crown can argue that even if the lab shows no pesticides or mould, \"public safety\" still applies because cannabis sales can be unregulated and outside government control. So the raid can still be argued to enforce legal rules, not just product safety.", "feedback": "You've raised valid concerns about regulation and public safety. However, consider this tension: if the treaty protects the right to trade, and the product is demonstrably safe, does the Province's interest in regulation outweigh a constitutionally protected treaty right? The Sparrow Test requires the Crown to show that their infringement is justified - not just that regulation is preferable."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "The \"Sacred Fire\" is seen as a legal boundary because in Mi'kmaw culture it represents a cultural line that should not be crossed, so entering it turns the raid into a rights violation.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "The \"Musket\" argument is a valid legal analogy because the treaty allowed trade of items like \"gunpowder, lead, and muskets\" in 1760, even though they were dangerous, so the Crown can't say cannabis is \"too dangerous\" now.", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "CROWN", "rationale": "The \"Fiduciary Duty\" can be argued that it is about protecting people and public safety, and not making profit. They say that without regulation there could be a \"flood of unregulated shops.\"", "feedback": "You've defended the Province's regulatory role. However, consider the evidence: the lab reports show no safety issues, and the NSLC sales data suggests economic motives. The Sparrow Test requires the Crown to demonstrate that its actions serve a compelling public purpose, not just protect government revenue."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "CROWN", "rationale": "The \"Frozen Rights\" argument can be seen as not about treating people as \"museum pieces,\" but instead about keeping treaty rights based on what was actually agreed to in 1752.", "feedback": "You've identified the Crown's concern about expanding treaty rights. However, the 'Frozen Rights' approach has been consistently criticized by the Supreme Court. In R v Marshall, the Court explicitly rejected the idea that treaty rights are limited to the specific practices of 1752. The Living Tree Doctrine recognizes that treaty provisions must be interpreted in light of changing circumstances."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "Leo can argue that his business does qualify as a \"Moderate Livelihood,\" because it is helping pay for food, housing, schooling, and elder care, which are basic community needs. Also, the term was left vague by the government to avoid giving up power.", "feedback": "Strong application of the R v Marshall precedent. The Supreme Court's definition of 'moderate livelihood' as encompassing necessities supplemented by amenities is deliberately flexible. Leo's argument that his business supports community members and funds services fits well within this framework. The Court in Marshall rejected limiting treaty rights to subsistence-level activities."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "No, the Crown did not use \"Minimal Impairment\" because the exhibit says they \"never called the Chief before the raid\" and just sent the police instead of discussing it. They could have just talked, because they did not try to co-develop safety rules.", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "JON (DUDE)": {"name": "Jon", "pin": "DUDE", "block": "A Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "Because when the 1752 treaty was signed, truckhouses were made where Mi'kmaq could exchange goods without being cheated. As well if the Wampum is the true record, then the Mi'kmaq are Sovereign Partners and partners don't need a license from their partner to do business on their land. As well the treaty states that the Mi'kmaq have free liberty to sell anything they want to.", "feedback": "Excellent work connecting the Living Tree Doctrine to the Truckhouse provision. You've identified the core tension - whether 'any other thing' can evolve to include modern goods. To deepen your thinking: consider how the Crown might use the ejusdem generis rule to argue that 'any other thing' should only include items similar to skins, feathers, and fish. Anticipating this counter-argument would make your position even stronger."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "Even though the province has its own act, The Chief stated that they regulate cannabis on their land and the band has the right to self-government and the right to manage its own economy. As well, the government claims the raid was for public health, but results showed there was no harm to public health so the raid was actually for protecting the Province's Tax Monopoly", "feedback": "Good point about Band Council authority and self-government. The right of Indigenous communities to regulate their own economic activities is supported by UNDRIP Article 3. Consider also how this connects to the broader question: if the Band Council has authorized the sale and the product is safe, what legitimate interest does the Province have in shutting it down?"}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "Because the fire is a spiritual boundary and stepping over it is a desecration and turns a legal raid into a human rights crisis. As well, the community states that the government raids their businesses but ignores the countless missing women and this frames the raid as part of a larger history of colonial violence and not just a drug case.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "Yes it is because if the Mi'kmaq was trusted to protect deadly weapons, then why all the sudden are they not trusted to trade cannabis safely. As well, Leo states that for 200 years they made them dependent and now that we fund our own elders and you call us criminals. He's fighting the empty box theory the idea that rights are empty until a judge says they exist. Leo says his box is full of rights.", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "It is used to protect their profits because they're upset of the huge loss in sales near Millbrook because Leo doesn't pay provincial tax and his product is cheaper. This proves their motive that the province is using police force to crush a business competitor rather than solve a safety issue.  This proves they care way more about their profits rather than the safety of its people which is embarassing. The government argues that if Leo wins than the province will be filled with unregulated shops and the Province argues its Fiduciary Duty is to protect everyone from an unregulated market but the reality is they are trying to protect their profits because they know they will lose sales because of the \"unregulated\" shops.", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "Even though in the R. V. Googoo the judge ruled because the Mi'kmaq didn't trade cannabis in 1752 then they don't have a right to it today, but the treaty stated that the Mi'kmaq have free liberty to trade anything they want and cannabis is definelty something so The Crown's strongest weapon isn't as strong as they think it is. The government is trying the frozen rights approach and they're doing this because they know the treaty rights favour the Mi'kmaq so they want to freeze them to get the upper hand. Freezing the rights makes the treaties feel like history that belongs in a museum.", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "Leo's business qualifies as moderate because his business provides food, clothing and housing but his business doesn't give him unlimited wealth. The government argues that his business is too big to be moderate but Leo counters that to fix schools in the community you need a modern economy, not just enough to buy bread. The term moderate was left very vague by the government to avoid giving up power (shocker). If the court adopts a broad definition, it will help First Nations to move toward independence but a narrow definition will keep them dependent on governmnet funding.", "feedback": "Good engagement with the moderate livelihood question. The R v Marshall decision is central - the Court recognized that treaty rights include the ability to earn a moderate livelihood, not just bare subsistence. To strengthen your analysis, consider how the scale of the operation matters and what 'moderate' means in the context of the modern economy."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "The government didn't consult with the Chief before the raid at all and they didn't try to develop safety rules together instead they sent the police. Under the Honour of the Crown, the government must speak to its partners first. The government raided them because of safety but in reality it was for revenue because there was no harm to public safety at all so if the court finds the raid was for revenue, the \"Compelling Objective\" step of the Sparrow Test fails completely.", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "JULIANNE (WASH)": {"name": "Julianne", "pin": "WASH", "block": "A Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "The Mi'kmaw people as Sovereign Partners do not need the permission of the Crown to sell on their own land, and the treaty clearly states that the Mi'kmaw may sell anything they saw fit.", "feedback": "Great insight about the sovereign partnership framework. Understanding the Mi'kmaq as partners rather than subjects is crucial. The Wampum records and nation-to-nation relationship support this view. Consider also how the Honour of the Crown doctrine requires the government to interpret treaties in good faith, as the Mi'kmaq would have understood them at signing."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "The Defense had permission by its own Band Council to sell cannabis on the reserve which the Band Council has a right to allow as they govern their own land. The government had no right to raid them as they were in their rights to sell and were doing so in a safe way.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "The government overstepped a huge boundary and ignored both Mi'kmaw rights and their communities cultural needs.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "If guns are not too dangerous to sell, then neither is cannabis. If the judge rules in the governments favour then they would be ignoring Mi'kmaw claim and saying that the government is more official than the Indigenous people and their rights.", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "The 'Fiduciary Duty' is being used to protect profits not people, the government is only worried about losing money to the Mi'kmaw not about the health of the public.", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "It does treat people museum pieces because its like freezing womens right to vote as if they aren't still there. By freezing it it says that that right never existed as a right in the first place.", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "It does qualify as a moderate livelihood because it is his business and the way he makes his money to survive and help his community. By telling him that he can't do this it is saying that the Indigenous people cannot strive for more like a white person would.", "feedback": "Strong application of the R v Marshall precedent. The Supreme Court's definition of 'moderate livelihood' as encompassing necessities supplemented by amenities is deliberately flexible. Leo's argument that his business supports community members and funds services fits well within this framework. The Court in Marshall rejected limiting treaty rights to subsistence-level activities."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "The Crown did not use Minimal Impairment as they just stormed the place without speaking to the Chief first. If they had of just spoken to the Chief he would have allowed them to search in a more peaceful and honorable way.", "feedback": "Good analysis of the Sparrow Test application. The Province's failure to consult with the Mi'kmaq before the raid is a significant weakness in their position. To strengthen your analysis, explicitly walk through each element of the Sparrow Test and identify where the Crown's case falls short."}}}, "KEVIN (CHIG)": {"name": "Kevin", "pin": "CHIG", "block": "A Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "CROWN", "rationale": "if the mikmaq have the ability to sell anything  the mikmaq abstain the right it breaks more law than just if they were unable to sell it. giving the mikmaq the right to to sell anything makes keeping the country safe difficult because they could just sell anything that could be harmful to other people that the law trys to prevent like weapons drugs and other dangerous items.", "feedback": "You've identified an important concern about public safety and regulation. However, consider this: the Living Tree Doctrine and cases like R v Marshall have established that treaty rights can override provincial regulations. The key question isn't whether cannabis is dangerous, but whether the Province has a compelling and justified reason to infringe on a treaty right. Think about what level of evidence the Crown would need to meet the Sparrow Test."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "CROWN", "rationale": "the raid  was valid because it was to prevent dangerous events and for public safed and  to keep regulations. they also had a warent to raid the truck house.", "feedback": "You've raised valid concerns about regulation and public safety. However, consider this tension: if the treaty protects the right to trade, and the product is demonstrably safe, does the Province's interest in regulation outweigh a constitutionally protected treaty right? The Sparrow Test requires the Crown to show that their infringement is justified - not just that regulation is preferable."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "CROWN", "rationale": "This argument is about missing and murdered indigenous women and talk about how the government raids their indigenous business but ignores missing indigenous people. But I believe that the indigenous are just trying to making reason that make the government look bad. Like how they says the store the government raided provided jobs and funding for elder even tho stores owned by the goverment did the same thing.", "feedback": "You've identified the tension between Indigenous spiritual practices and Canadian law enforcement. However, Canadian courts have increasingly recognized Indigenous legal traditions as relevant to legal proceedings. The Supreme Court has acknowledged that the Honour of the Crown requires sensitivity to Indigenous perspectives. While the Sacred Fire may not be a formal legal boundary under Canadian statute, it represents a legitimate expression of Mi'kmaw law that courts are increasingly willing to consider."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "CROWN", "rationale": "i choose for the crown because back in they day the mikmaq did trade for guns but back in the day guns were regularly sold and givent to people unless the went to people who produced it but now humans were more modernized so now we can mass produce dangerouse weapons making them more of a risk for the public. guns are also a different subject than cannabis because guns have no ilegal substances that can change how a person reacts to a situation rather than a gun would.", "feedback": "You've identified a distinction between historical musket trade and modern cannabis regulation. However, consider the counter-argument: the Crown accepted musket trade in 1760 despite genuine safety concerns, which suggests that treaty trade was never limited by safety standards. The musket analogy demonstrates that the Crown has historically accepted Indigenous trade in goods it considered dangerous."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "CROWN", "rationale": "I think its being used to protect the people because I can understand the way that they need to take down unregulated shops because if they didn't regulate it the shops are able to sell anything that was illegal to buy before which is now becoming avaliable for the public to buy making the law that was originally place for public safety pointless.", "feedback": "You've defended the Province's regulatory role. However, consider the evidence: the lab reports show no safety issues, and the NSLC sales data suggests economic motives. The Sparrow Test requires the Crown to demonstrate that its actions serve a compelling public purpose, not just protect government revenue."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "CROWN", "rationale": "I believe it does not because they government  Is only pointing out the past that they did not sell the cannabis because in the past people never got hooked on the drug untill it became popularized for the public which then caused mikmaq truck houses to start selling them.", "feedback": "You've identified the Crown's concern about expanding treaty rights. However, the 'Frozen Rights' approach has been consistently criticized by the Supreme Court. In R v Marshall, the Court explicitly rejected the idea that treaty rights are limited to the specific practices of 1752. The Living Tree Doctrine recognizes that treaty provisions must be interpreted in light of changing circumstances."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "CROWN", "rationale": "the business doesn't qualify as a moderate livelihood because the store does have the necessaries but because they sell other illegal products like cannabis their able to sell other things just for profit with out the government knowing and it also provides hazards such as people who might end up buying weapons that are dangerous and causing catastrophic events", "feedback": "You've raised the question of whether Leo's business exceeds 'moderate livelihood.' However, the Supreme Court in R v Marshall specifically rejected limiting treaty rights to subsistence activities. What constitutes 'reasonable' must be understood in contemporary economic terms."}}}, "KOEN (LORI)": {"name": "koen", "pin": "LORI", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "The legal reason for siding with the defence is that, on the article it claims that indians have free liberty to trade with any settlement, this does not confirm that they cannot trade within their own settlement or any other settlement. And they can trade anything that they have to sell. These articles have been renewed and confirmed forever. which means that the Mi'kmaw have the right to trade.", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "As long as this Cannabis is confirmed to be safe and tested consistently to confirm that it is \"safe\" for use, means that this raid was unlawful due to the fact that the test came back negative. This evidence shows that any police action agaist these shops under the claim that the cannabis is unsafe will be unlawful and illegal.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "CROWN", "rationale": "The reasoning that the sacred fire is a legal boundary, cannot be used as a type of defence, this is because any religious evidence cannot be used as a type of \"hard truth\" because it is not scientifically proven. A fact of the matter is that the reasoning of the cannabis shops provide jobs and money for their community does not hold any weight because you wouldn't be able to sell cocanie just because it helps your family.", "feedback": "You've identified the tension between Indigenous spiritual practices and Canadian law enforcement. However, Canadian courts have increasingly recognized Indigenous legal traditions as relevant to legal proceedings. The Supreme Court has acknowledged that the Honour of the Crown requires sensitivity to Indigenous perspectives. While the Sacred Fire may not be a formal legal boundary under Canadian statute, it represents a legitimate expression of Mi'kmaw law that courts are increasingly willing to consider."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "CROWN", "rationale": "The musket argument does not work because of the fact that these muskets may have been sold for the prupose of hunting or self defence, and due to the fact of the lack of evidence, this would make it so the musket can be seen as a type of tool that is used for hunting and protecting. Again a person cannot use religious reasoning as a form of defence, even If the feather is seen as binding, this does not mean that the defendent cannot lie.", "feedback": "You've identified a distinction between historical musket trade and modern cannabis regulation. However, consider the counter-argument: the Crown accepted musket trade in 1760 despite genuine safety concerns, which suggests that treaty trade was never limited by safety standards. The musket analogy demonstrates that the Crown has historically accepted Indigenous trade in goods it considered dangerous."}}}, "KADEN (CHUD)": {"name": "Kaden", "pin": "CHUD", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "the Article states that any indigenous person has the free liberty to sell any thing the have to sell so based off just that Leo is realisticly in the right", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "Due too some lab findings this 'public safety' argument to raid an indigenous legal business is very much invalid since before the raid they did a safety check list finding nothing not safe so this raid was based entirely off the government wanting to keep a business  monopoly on cannabis", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}}}, "KULAY CRUZ (CRUZ)": {"name": "Kulay cruz", "pin": "CRUZ", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "Unless explicitly stated that Cannibis cannot be sold in truck houses, the wording \"Any other thing\" states that anything else like for example, Cannibis, is legally included.", "feedback": "Good focus on the Truckhouse provision as evidence of ongoing trade rights. The treaty's guarantee of free liberty to bring goods for sale is central to Leo's case. To deepen your analysis, think about how the Crown might distinguish between the 1752 Truckhouse system (government-controlled trading posts) and Leo's independent shop. The key difference the Crown would emphasize is regulation."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "The trading post had no unsafe products that would've distrupted public safety. Which makes the arrests and seized asssets illegal", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "Under the treaties that are still in effect today, the MI''kmaw and first nation people are considered equals. and in the legal analysis, the raided businesses are the business of the crown, while the murdered and missing indigenous women or not, crosses the treaties that were signed by the crown", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "IN the past the british actively traded gunpowder, lead, and muskets which, is protected by the treaties. and cannabis which is at a lower level of danger compared to fire arms, means that under the treaties and previous precedent of trade with fire arms with the british Cannibis is fully legal to be traded", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "from reports gathered from NSLC The crown is forcing, \"Unauthorized\" shops to shut down, to maintain their monopoly over liquor", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "Tge frozen rights arguement does treat the people as museum pieces, as the main foundation for that arguement is the empty box theory, which is fundamentaly wrong as the treaties are still in effect today and not something to be proven as the treaties also say that the Mi'kmaq/indigenous people are a sovereign, and equal governing bodyy", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "Leo's business does qualify as a Moderate livelihood, as although it is a larger amount of currency, the money isn't being used for extravagancies and, in Leo's counter he is also implying that the excess money isn't going to be held by him but put into modern schools, and the economy of the reserves, which would leave him with only enough for a \"moderate livelihood\"", "feedback": "Strong application of the R v Marshall precedent. The Supreme Court's definition of 'moderate livelihood' as encompassing necessities supplemented by amenities is deliberately flexible. Leo's argument that his business supports community members and funds services fits well within this framework. The Court in Marshall rejected limiting treaty rights to subsistence-level activities."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "The Crown has over-stepped it's authority as a government. Precisely because the Crown does not have the right to police its laws on a self-governing body, the Crown itself has acknowledged, and even then, the justification of shutting down unregulated businesses is false, as the Indigenous people have the right to trade, to make a moderate living, and shutting down a business that's trying to do exactly that is a violation of the treaties and rights of the Indigneous people and their land.", "feedback": "Good analysis of the Sparrow Test application. The Province's failure to consult with the Mi'kmaq before the raid is a significant weakness in their position. To strengthen your analysis, explicitly walk through each element of the Sparrow Test and identify where the Crown's case falls short."}}}, "KYLE PARSONS (PUCK)": {"name": "Kyle Parsons", "pin": "PUCK", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "The treaty clearly says the MiÆkmaq have the ôfree libertyö to sell ôany other thing they have to sell.ö This means their right to trade isnÆt limited to just old items like skins or fish. Using the Living Tree idea, this right should grow over time, so it can include modern things too. This shows the treaty still protects their right to trade today.", "feedback": "Strong use of the Living Tree Doctrine. You correctly identify that treaty interpretation should evolve with the times. To strengthen your analysis, reference how the Supreme Court applied this in R v Marshall - the Court noted that treaty rights must be interpreted in a way that reconciles Indigenous and Crown interests over time. Consider also what the Crown might argue about the original intent of the treaty makers."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "The lab report shows the cannabis was safe, with no pesticides or mould, so the raid wasnÆt really about public safety. The MiÆkmaq community had already decided through their own leadership that they could control cannabis on their land, which shows their right to govern themselves. This means the raid was more about the province trying to control and profit, not about protecting people.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "The raid ignored the communityÆs sacred fire and their cultural practices, turning a legal action into a human rights issue. The shop supports the community with jobs and elder care, showing itÆs more than just a business. Stopping it would disrespect their culture and rights, making the case about fairness and self-government, not just cannabis.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "The MiÆkmaq have a long history of trading even dangerous items like muskets under treaty agreements, so calling cannabis ôtoo dangerousö isnÆt fair. LeoÆs Eagle Feather shows that their laws and promises are real and binding. This proves their rights are full and real, not empty, and the raid ignores their self-government and cultural authority.", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "The evidence shows the ProvinceÆs main concern is protecting its own profits, not public safety. LeoÆs shop is safe and supports the community, so the raid was really about stopping competition, not keeping people healthy. This proves the CrownÆs actions were unfair and ignored the MiÆkmaqÆs right to self-governance.", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "CROWN", "rationale": "The Crown relies on the principle that rights must be based on what existed in 1752, as in R. v. Googoo (2024). Since the MiÆkmaq did not trade cannabis then, the Province argues they have no automatic right to trade it today. This approach ensures laws are applied consistently and prevents businesses from operating outside regulations, protecting public safety and maintaining legal order.", "feedback": "You've identified the Crown's concern about expanding treaty rights. However, the 'Frozen Rights' approach has been consistently criticized by the Supreme Court. In R v Marshall, the Court explicitly rejected the idea that treaty rights are limited to the specific practices of 1752. The Living Tree Doctrine recognizes that treaty provisions must be interpreted in light of changing circumstances."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "In R v Marshall (1999), the court said First Nations have a right to earn a ômoderate livelihood,ö and that should be understood in todayÆs world. Living costs are much higher now, so it doesnÆt make sense to limit that right to just basic survival like food and clothing. Leo can argue that running a larger business is a modern way to support himself and his community, including creating jobs and helping fund things like education. This shows that treaties are still meaningful today and should be interpreted in a way that reflects modern life.", "feedback": "Strong application of the R v Marshall precedent. The Supreme Court's definition of 'moderate livelihood' as encompassing necessities supplemented by amenities is deliberately flexible. Leo's argument that his business supports community members and funds services fits well within this framework. The Court in Marshall rejected limiting treaty rights to subsistence-level activities."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "In R v Marshall (1999), First Nations were given the right to earn a ômoderate livelihood,ö and that should apply to todayÆs costs, not just basic survival. Leo can argue his business helps support his community, not just himself. Under R v Sparrow (1990), the government is also supposed to consult First Nations before taking action, but they didnÆt talk to the Chief before the raid. Section 35 of the Constitution Act, 1982 protects these rights, so Leo can say the Province is ignoring them using the Cannabis Control Act.", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "KYRA (ABCD)": {"name": "Kyra", "pin": "ABCD", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "CROWN", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "CROWN", "rationale": "I picked the crown because they were trying to keep peace. They ended fighting, gave protection, and provided food and gifts. They also let the MiÆkmaq continue hunting and fishing. They made rules to keep things organized, like using their courts.", "feedback": "You've articulated the Crown's position on treaty interpretation. Your concern about the scope of 'any other thing' is a legitimate legal argument. However, the Supreme Court has consistently ruled that treaties should be interpreted as the Indigenous signatories would have understood them, not through a narrow legalistic lens. The Mi'kmaq oral tradition and Wampum records suggest they understood this as a broad trade guarantee."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "CROWN", "rationale": "Even though the lab report shows the product was safe [10], the Province can still argue the raid was justified because the business was unregulated and outside the legal system set by the Cannabis Act, which is meant to protect public safety overall.", "feedback": "You've raised valid concerns about regulation and public safety. However, consider this tension: if the treaty protects the right to trade, and the product is demonstrably safe, does the Province's interest in regulation outweigh a constitutionally protected treaty right? The Sparrow Test requires the Crown to show that their infringement is justified - not just that regulation is preferable."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "CROWN", "rationale": "The Sacred Fire is a legal boundary in MiÆkmaq culture because it shows the area is protected under their own laws, and crossing it is seen as breaking those rules. However, I choose the Crown because they would argue that, even though the Sacred Fire is important, provincial laws still apply and must be enforced", "feedback": "You've identified the tension between Indigenous spiritual practices and Canadian law enforcement. However, Canadian courts have increasingly recognized Indigenous legal traditions as relevant to legal proceedings. The Supreme Court has acknowledged that the Honour of the Crown requires sensitivity to Indigenous perspectives. While the Sacred Fire may not be a formal legal boundary under Canadian statute, it represents a legitimate expression of Mi'kmaw law that courts are increasingly willing to consider."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "CROWN", "rationale": "The musket argument is historically interesting, but not a strong legal analogy. Treaty rights are interpreted in their historical context, not as a broad right to trade any modern product (17). While muskets were traded then, that does not create a protected right to sell cannabis today, especially since it is regulated under laws like the Cannabis Act.", "feedback": "You've identified a distinction between historical musket trade and modern cannabis regulation. However, consider the counter-argument: the Crown accepted musket trade in 1760 despite genuine safety concerns, which suggests that treaty trade was never limited by safety standards. The musket analogy demonstrates that the Crown has historically accepted Indigenous trade in goods it considered dangerous."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "CROWN", "rationale": "The Crown firmly maintains that cannabis must remain strictly regulated to protect public safety. Allowing unauthorized sales risks unsafe products and loss of control over age restrictions.", "feedback": "You've defended the Province's regulatory role. However, consider the evidence: the lab reports show no safety issues, and the NSLC sales data suggests economic motives. The Sparrow Test requires the Crown to demonstrate that its actions serve a compelling public purpose, not just protect government revenue."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "CROWN", "rationale": "Yes, the ôFrozen Rightsö argument can make it seem like Indigenous peoples are treated like ômuseum piecesö because it only looks at the past. I support the CrownÆs side. The Crown believes rights should stay based on what was agreed to in history. This keeps the law clear, fair, and consistent", "feedback": "You've identified the Crown's concern about expanding treaty rights. However, the 'Frozen Rights' approach has been consistently criticized by the Supreme Court. In R v Marshall, the Court explicitly rejected the idea that treaty rights are limited to the specific practices of 1752. The Living Tree Doctrine recognizes that treaty provisions must be interpreted in light of changing circumstances."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "CROWN", "rationale": "IÆm on the CrownÆs side because LeoÆs business is too large and profit-driven to count as a ômoderate livelihood.ö The ruling in R v Marshall limits that right to basic needs, not full-scale commercial operations.", "feedback": "You've raised the question of whether Leo's business exceeds 'moderate livelihood.' However, the Supreme Court in R v Marshall specifically rejected limiting treaty rights to subsistence activities. What constitutes 'reasonable' must be understood in contemporary economic terms."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "CROWN", "rationale": "Yes, the Crown can argue they met the justification part of the Sparrow Test. They would say they were protecting public safety, which is a valid reason. They could also argue that laws were already clear, so consultation wasnÆt needed. The Crown would say they were balancing Indigenous rights with public safety and that the raid was necessary to enforce the law.", "feedback": "You've defended the Province's enforcement actions, but consider the Sparrow Test carefully. The failure to consult before conducting a raid is a significant gap in the Crown's justification. Even if the Province had a valid objective, the Sparrow framework requires that less intrusive options be considered first. Negotiation or co-regulation would have been less impairing alternatives."}}}, "LAYAL (ABCD)": {"name": "LAYAL", "pin": "ABCD", "block": "D Block (Hargreaves)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "The wording of Article 4 appears to favor the defence because the treaty uses broad language rather than limiting trade to a specific list of products. This article states that the Mikmaq ¿shall have free liberty to bring for Sale... skins, feathers, fowl, fish, or ANY OTHER THING they have to sell.¿ this suggests that the right to trade was intended to be flexible and not restricted to these items only, which means the inclusion of cannabis should be permitted.", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}}}, "LUCIE (FISH)": {"name": "LUCIE", "pin": "FISH", "block": "D Block (Hargreaves)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "According to Article 4 it sates that \"the tribunal shall not be in hindered from, but have FREE LIBERTY OF HUNTING & FISHING as usual: and if they think a TRUCKHOUSE needful... they shall have the same built... and the said Indians shall have free liberty to bring for Sale to Halifax or any other Settlement... Skins, feathers, fowl, fish or ANY OTHER THING they have to sell.\". the any other thing in this article is general and vague enough to encompass anything and indigenous person sells.", "feedback": "Good focus on the Truckhouse provision as evidence of ongoing trade rights. The treaty's guarantee of free liberty to bring goods for sale is central to Leo's case. To deepen your analysis, think about how the Crown might distinguish between the 1752 Truckhouse system (government-controlled trading posts) and Leo's independent shop. The key difference the Crown would emphasize is regulation."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "the  tactical officers sizing many products and arresting multiple people under the operation against the unregulated business was unjust due to Leo's band having a BCR stating they can regulate cannabis on their land alone, as well as the crown claiming the raid was for public safety but the independent lab reports that there was no pesticides, no mold and the TCH was (accurate), this means that the product were safe and the raid was not about health.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "Leos band is self governing and they argue that the provincial rules stop once the you reach the highway boundary, the band responded with a sacred fire lit in the doorway of the Leos trading post with was well within their rights and freedoms. since the raid overstepped the Mi'kmaq peoples rights and freedoms it becomes a matter of human right violations.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "the Musket precedent was a trade in 1760 that the British trade with the mi'kmaq people. the British traded Musket, lead and gunpowder, back in 1760. so now Leo is wondering if how cannabis is 'too dangerous' to trade today.", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "the excuse that justice officials use saying they want to protect people from an unregulated market is a weak one at best, while its fine to want to regulate markets that run illegally or doing something illegal this is nothing the case with Leos shop; Leos store is being run and regulated by the bands government as they have the illegal means to do so.", "feedback": "Good analysis of the Crown's motivations. The evidence of economic protectionism is significant because it undermines the Crown's claimed public safety objective. Under the Sparrow framework, the Crown must demonstrate a compelling and substantial objective - protecting government revenue from competition doesn't qualify."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "The treats, articles and act have been made a long time ago, these treaties were promises made to the mi'kmaq people and they need to be up held accordingly. For the crown to fully dismiss the rights the mi'kmaq people have cause of the treaties is very much a vilation", "feedback": "Good understanding of the tension between frozen and evolving interpretations. The key
