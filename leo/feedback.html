<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>STUDENT FEEDBACK PORTAL | Situation Room</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Roboto:wght@400;700&family=Courier+Prime&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0c0c0c; --accent:#FFD700; --text:#e0e0e0; --card-bg:#1a1a1a; --border:#333; --success:#88ff88; --info:#88ccff; }
        body { margin:0; background:var(--bg); color:var(--text); font-family:'Roboto',sans-serif; padding:40px; min-height:100vh; }
        .header { display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--accent); padding-bottom:20px; margin-bottom:30px; }
        h1 { font-family:'Merriweather',serif; color:var(--accent); margin:0; letter-spacing:2px; }
        .logout-btn { background:transparent; border:1px solid var(--border); color:#888; padding:8px 16px; cursor:pointer; border-radius:4px; font-size:0.8rem; transition:0.3s; }
        .logout-btn:hover { border-color:var(--accent); color:var(--accent); }
        .login-container { max-width:400px; margin:100px auto; background:var(--card-bg); padding:40px; border-radius:8px; border-left:4px solid var(--accent); }
        .login-container h2 { font-family:'Merriweather',serif; color:var(--accent); margin:0 0 30px 0; text-align:center; }
        .form-group { margin-bottom:20px; }
        .form-group label { display:block; color:#888; font-size:0.75rem; text-transform:uppercase; margin-bottom:8px; letter-spacing:1px; }
        .form-group input, .form-group select { width:100%; background:#222; border:1px solid var(--border); color:var(--text); padding:12px; border-radius:4px; font-family:'Courier Prime',monospace; font-size:1rem; box-sizing:border-box; }
        .form-group input:focus, .form-group select:focus { outline:none; border-color:var(--accent); }
        .login-btn { width:100%; background:var(--accent); color:#000; border:none; padding:14px; font-weight:bold; cursor:pointer; border-radius:4px; font-family:'Courier Prime',monospace; font-size:1rem; text-transform:uppercase; letter-spacing:2px; }
        .login-btn:hover { background:#ffed4a; }
        .login-btn:disabled { background:#555; cursor:not-allowed; }
        .error-message { color:#ff8888; font-size:0.85rem; margin-top:15px; text-align:center; display:none; }
        .feedback-container { display:none; max-width:900px; margin:0 auto; }
        .student-welcome { background:var(--card-bg); padding:25px; border-radius:8px; border-left:4px solid var(--accent); margin-bottom:30px; }
        .student-welcome h2 { font-family:'Merriweather',serif; color:var(--accent); margin:0 0 10px 0; }
        .student-welcome p { color:#888; margin:0; font-size:0.9rem; }
        .project-section { margin-bottom:40px; }
        .project-header { font-family:'Merriweather',serif; color:var(--accent); font-size:1.3rem; border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:20px; text-transform:uppercase; letter-spacing:1px; }
        .question-card { background:var(--card-bg); border-radius:6px; padding:20px; margin-bottom:15px; border-left:3px solid var(--accent); }
        .question-label { font-weight:bold; color:var(--accent); font-size:0.95rem; margin-bottom:12px; }
        .student-answer { background:#222; padding:12px; border-radius:4px; margin-bottom:15px; font-size:0.9rem; line-height:1.5; color:#ccc; }
        .student-answer-label { font-size:0.7rem; color:#666; text-transform:uppercase; margin-bottom:6px; letter-spacing:1px; }
        .feedback-comment { background:#1f2a1f; padding:15px; border-radius:4px; border-left:3px solid var(--success); font-size:0.9rem; line-height:1.6; }
        .feedback-label { font-size:0.7rem; color:var(--success); text-transform:uppercase; margin-bottom:8px; letter-spacing:1px; font-weight:bold; }
        .no-data { text-align:center; padding:50px; color:#888; }
        .verdict-badge { display:inline-block; padding:4px 10px; border-radius:4px; font-size:0.75rem; font-weight:bold; text-transform:uppercase; margin-left:10px; }
        .verdict-CROWN { background:#442222; color:#ff8888; }
        .verdict-DEFENSE { background:#224422; color:#88ff88; }
        .verdict-SUBMITTED { background:#224422; color:#88ff88; }
        .verdict-IN_PROGRESS { background:#333; color:#aaa; }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="header"><h1>FEEDBACK PORTAL</h1></div>
        <div class="login-container">
            <h2>STUDENT LOGIN</h2>
            <div class="form-group">
                <label for="block-select">Select Your Block</label>
                <select id="block-select"><option value="">Loading blocks...</option></select>
            </div>
            <div class="form-group">
                <label for="student-name">Your Name (as entered)</label>
                <input type="text" id="student-name" placeholder="e.g., Abdel, Abigail" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="student-pin">Your PIN Code</label>
                <input type="password" id="student-pin" placeholder="e.g., AAAW" maxlength="10" autocomplete="off">
            </div>
            <button class="login-btn" id="login-btn" onclick="attemptLogin()">ACCESS FEEDBACK</button>
            <div class="error-message" id="error-message"></div>
        </div>
    </div>
    <div id="feedback-screen" style="display:none;">
        <div class="header">
            <h1>YOUR FEEDBACK</h1>
            <div class="controls"><button class="logout-btn" onclick="logout()">LOGOUT</button></div>
        </div>
        <div class="feedback-container" id="feedback-container">
            <div class="student-welcome" id="student-welcome"></div>
            <div id="feedback-content"></div>
        </div>
    </div>
<script>
const FEEDBACK_DATA = {"AIDEN (KING)": {"name": "AIDEN", "pin": "KING", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "Yes, because cannabis is a natural resource, similar to things like animal skins, feathers and other traditional idems. If people have the right to sell and use those resources, then they should also have the right to sell cannabis too.", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "if the cannabis is tested and shown to be safe, then there is no real public safety risk. Without that risk, they did not have a reason to take it from tehm. so the raid was been unlawful", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "CROWN", "rationale": "They are using their spiritual boundaries to try to defend against the rules and the law, but that cannot De treated as a proven legal fact on its own. while those beliefs may be important to their community, they would still need good evidence and legal reasoning to support their position.", "feedback": "You've identified the tension between Indigenous spiritual practices and Canadian law enforcement. However, Canadian courts have increasingly recognized Indigenous legal traditions as relevant to legal proceedings. The Supreme Court has acknowledged that the Honour of the Crown requires sensitivity to Indigenous perspectives. While the Sacred Fire may not be a formal legal boundary under Canadian statute, it represents a legitimate expression of Mi'kmaw law that courts are increasingly willing to consider."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "CROWN", "rationale": "They could of used the muskets for hunting or self defence and due to the fact of the lack of evidence, so it would make it so the muskets are seen as a weapon for hunting and protecting, also they cant use religious reasoning as a form of defence.", "feedback": "You've identified a distinction between historical musket trade and modern cannabis regulation. However, consider the counter-argument: the Crown accepted musket trade in 1760 despite genuine safety concerns, which suggests that treaty trade was never limited by safety standards. The musket analogy demonstrates that the Crown has historically accepted Indigenous trade in goods it considered dangerous."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "CROWN", "rationale": "As long as the shops stay on the reserves it is up to the mikmaw what happens to their shops but if their shops start to spread it will start to become a problem because it will increase the amount of unregulated cannabis coming to NS", "feedback": "You've defended the Province's regulatory role. However, consider the evidence: the lab reports show no safety issues, and the NSLC sales data suggests economic motives. The Sparrow Test requires the Crown to demonstrate that its actions serve a compelling public purpose, not just protect government revenue."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "In reality culture naturally changes over time. So saying their rights are frozen ignores modern development and can limit indigenous peoples from practicing rights in todayÆs world", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "as if only it's a small scale and supports a reasonable living, not large commercial business, meaning people can earn a reasonable living but not make operation with unlimated profit.", "feedback": "Good engagement with the moderate livelihood question. The R v Marshall decision is central - the Court recognized that treaty rights include the ability to earn a moderate livelihood, not just bare subsistence. To strengthen your analysis, consider how the scale of the operation matters and what 'moderate' means in the context of the modern economy."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "No, because if they didnÆt try negotiation first then they likely failed minimal impairment because they used stronger actions then necessary they could of talked first before doing anything else", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "ALEXIS (ABCD)": {"name": "Alexis", "pin": "ABCD", "block": "A Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "For the defence, Article 4Æs phrase ôany other thingö should be read broadly and in favour of the Mi'kmaq, meaning it includes modern trade goods like cannabis. Because the treaty in Mi'kma'ki was meant to ensure survival through fair trade, the right must evolve with todayÆs economy rather than be limited to 1752 goods. Therefore, cannabis can be argued to fall within this protected ôright to trade.ö", "feedback": "Strong use of the Living Tree Doctrine. You correctly identify that treaty interpretation should evolve with the times. To strengthen your analysis, reference how the Supreme Court applied this in R v Marshall - the Court noted that treaty rights must be interpreted in a way that reconciles Indigenous and Crown interests over time. Consider also what the Crown might argue about the original intent of the treaty makers."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "For the defence, the ôpublic safetyö argument is not supported by the evidence. The independent lab report found no pesticides, no mould, and accurate THC levels, showing the cannabis met safety standards. This weakens the ProvinceÆs justification and supports the argument that the raid was not truly about safety,.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "the Sacred Fire is a legal boundary because it represents MiÆkmaw law, authority, and protection over the space. Indigenous communities have the right to maintain their own legal systems, so crossing the fire without consent violates that authority. Therefore, when officers crossed it, they breached the jurisdiction and rights of the Mi'kmaq, not just a physical space.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "For the defence, the ômusketö argument makes sense because it shows that rights should update with time instead of staying stuck in 1752. Just like old tools can have modern versions, the MiÆkmaq right to trade can include modern goods like cannabis for the Mi'kmaq. This supports LeoÆs point that their rights are real and active, not ôemptyö until a court says so.", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "For the defence, the ôfiduciary dutyö claim is more focused on protecting provincial profits than public safety. The Armstrong Directive says ôpublic confidence in the regulated market must be maintained,ö which leads to protecting the NSLCÆs market. NSLC reports also show lost sales near Millbrook, suggesting the raid was about competition, not safety.", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}}}, "ANANYA M. (OKOK)": {"name": "ANANYA M.", "pin": "OKOK", "block": "A Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "CROWN", "rationale": "I believe the crown would argue that \"any other thing\" does NOT legally include cannabis because it should be interpreted to mean things similar to whatÆs listed, such as fish and animal products. What they stated is really limited to natural resources.", "feedback": "You've articulated the Crown's position on treaty interpretation. Your concern about the scope of 'any other thing' is a legitimate legal argument. However, the Supreme Court has consistently ruled that treaties should be interpreted as the Indigenous signatories would have understood them, not through a narrow legalistic lens. The Mi'kmaq oral tradition and Wampum records suggest they understood this as a broad trade guarantee."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "I believe the Public Safety argument is not valid because the lab report clearly shows that the Mi'kmaq's use of drugs is not laced with any harmful substances, such as Fentanyl. It has the primary compound of cannabis, which is THC. Meaning the Government conducted this raid to enforce control over the Mi'kmaq people.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "The Sacred Fire is a legal boundary because it marks a spiritual space that should not be crossed. When officers stepped over it, they disrespected MiÆkmaq laws and traditions. The evidence is that itÆs called a ôspiritual boundary,ö and crossing it is a ôprofound desecration.ö", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "The musket argument is valid because their rights already exist and can change over time. It shows rights are not empty. The evidence is Leo saying their rights are ôinherent.ö", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}}}, "ANGELA (ABCD)": {"name": "ANGELA", "pin": "ABCD", "block": "D Block (Hargreaves)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "Yes \"any other thing\" does include cannabis because of the vauge wording of this statement it said to be allowed for Leo to trade and sell cannabis.", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "The Public Safety argument isn't valid because it contained no pesticides, no mould, and had an accurate of THC, showing us that the product was safe and the raid was focused on protecting the Province's Tax Monopoly instead of health. It also shows how Leo was given approval by the indigenous law under the BCR which gives the band the right to self government and management to its own economy.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "In the primary section, we are given that the Sacred fire is a legal boundary because crossing it turns the raid into a human rights crisis.  The legal analysis also mentions how the community views these raids as a part of history colonial violence and not just a drug case.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "The musket analogy is saying that since gunpowder, lead, and muskets, (literal weapons) were traded back then, cannabis cannot be called as a \"too dangerous\" item to be traded now. This shows how the crown just uses \"safety\" as an excuse to ban competition. therefore, yes it is a valid legal analogy.", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "The Fiduciary Duty is used to protect profits because The Armstrong Directive ordered the police to shutdown unauthorized apps to keep up the \"public confidence in the regulated market\", showing us that the crowns osent care about the people or the public and just cares about their profit or their bank account. They aregue that they want to prevent chaos and unregulated money telling us that their main focus is money.", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "The frozen rights does treat people as museum pieces because the law must evolve. The law should be allowed to change overtime just because it wasn't allowed back then dosent mean it still shouldn't be allowed now. Just like how in the intelligence section it is mentioned that they suggest a growing movement for the Economiv Sovereignty.", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "yes, Leos buisness falls under the moderate livlihood because le explains how the community needs a modern economy to fix its schools, and communities not just enough money to buy bread and since the court defined moderate livelihood as \"necessaries\" like food, housing and clothing, it would make sense that Leos business would qualify as a moderate livelihood.", "feedback": "Strong application of the R v Marshall precedent. The Supreme Court's definition of 'moderate livelihood' as encompassing necessities supplemented by amenities is deliberately flexible. Leo's argument that his business supports community members and funds services fits well within this framework. The Court in Marshall rejected limiting treaty rights to subsistence-level activities."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "The Crown did not meet the requirements for justifications with applying the sparrow test because to past step 2, they need to prove its actions are justified by meeting specific rules such as priority, minimal impairment, and consultation. But it is shown in the intelligence part that they never even called the chief before the raid leading them to fail the consultation part. They also decided to send harsh tactical units getting them to also fail the minimal impairment part.", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "ABDEL (AAAW)": {"name": "Abdel", "pin": "AAAW", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "The Living Tree Doctrine says that the phrase ANY OTHER THING in the Treaty must change over time. For example, telegraphs now include the internet, and skins now include cannabis, which is a legal commodity. The Wampum record shows that the Mi'kmaq are sovereign partners, not subjects. This means that they don't need a provincial license to trade on their own land that hasn't been ceded to anyone else. So, Mr. Francis's modern Truckhouse is not covered by the Nova Scotia Cannabis Control Act.", "feedback": "Excellent work connecting the Living Tree Doctrine to the Truckhouse provision. You've identified the core tension - whether 'any other thing' can evolve to include modern goods. To deepen your thinking: consider how the Crown might use the ejusdem generis rule to argue that 'any other thing' should only include items similar to skins, feathers, and fish. Anticipating this counter-argument would make your position even stronger."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "The Public Safety argument fails because the lab report Exhibit C shows no contaminants, no mold, and a 0.0% public safety warning. This shows that the raid was for tax enforcement, not health reasons.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "The Sacred Fire is a legal boundary because it protects unceded land from Mi'kmaw Indigenous law, which is protected by the 1752 Treaty and the idea that sovereign partners should not cross each other's spiritual borders without permission.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "The Musket argument is correct the Crown can't say that cannabis is too dangerous to trade today when the same Treaty protected trade in muskets and gunpowder, which were real weapons of war, in 1760. Safety is not a principle, but a reason.", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "The Crown's Fiduciary Duty is being used to protect profits for the provinces not people. The Armstrong Directive puts the NSLC monopoly ahead of public health and the safe lab results show that the raid was for economic reasons, not safety reasons.", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "The Frozen Rightsáargument treats Indigenous people like museum pieces by making their Treaty rights stay the same since 1752. The Living Tree Doctrine says that rights must change over time. If they don't then reconciliation is a lie and new Indigenous businesses can be killed before they even get started.", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "Leo's business is a Moderate Livelihood under Marshall 1999 because it pays for elder care, creates jobs, and ends colonial dependency. This is exactly what the Treaty right to trade was meant to protect. Defining moderate narrowly keeps Indigenous people begging defining it broadly builds sovereign nations.", "feedback": "Strong application of the R v Marshall precedent. The Supreme Court's definition of 'moderate livelihood' as encompassing necessities supplemented by amenities is deliberately flexible. Leo's argument that his business supports community members and funds services fits well within this framework. The Court in Marshall rejected limiting treaty rights to subsistence-level activities."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "The Crown failed minimal impairment because they didn't talk to the Band before the raid they just sent police. The Sparrow Test and the Honour of the Crown say that a single phone call to the Chief could have led to the creation of safety rules that would have stopped this whole crisis. Sending tactical officers instead of negotiators is the worst thing that could happen not the best.", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "ABIGAIL (ABIS)": {"name": "Abigail", "pin": "ABIS", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "The treaties say that Mi'Kmaq have the right to tread anything", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "At first I was on the side of the police because they were just doing their job stopping unregulated business but I don't under stand who the businesses are not regulated in the lab report shows that their product is completely safe, there fore I'm siding with Leo.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "The Mi'Kmaq are are practicing their rights and culture while also trying to support them selves and their community. They are not doing anything to hurt people and their protesting is just trying to get their voices heard for once are years of being over looked.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "CROWN", "rationale": "The judge is going off of facts and laws and the Mi'Kmaq goes of their culture and inhabiting right. They may have a point on cannabis being safer they trading guns and ammo but times change and so does the trade.", "feedback": "You've identified a distinction between historical musket trade and modern cannabis regulation. However, consider the counter-argument: the Crown accepted musket trade in 1760 despite genuine safety concerns, which suggests that treaty trade was never limited by safety standards. The musket analogy demonstrates that the Crown has historically accepted Indigenous trade in goods it considered dangerous."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "CROWN", "rationale": "It's the provinces job to protect the people of Nova Scotia and the it's youth and that exactly what they are doing. Yes they may have other movtives like their back account but it's also protecting people. At the same time if they had such a concern for unregulated goods they would try to come to an agreement to make new laws for the greater good of both sides.", "feedback": "You've defended the Province's regulatory role. However, consider the evidence: the lab reports show no safety issues, and the NSLC sales data suggests economic motives. The Sparrow Test requires the Crown to demonstrate that its actions serve a compelling public purpose, not just protect government revenue."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "A good Law would evolve with the times alowing growth to happen with the economic growth. Withhold Mi'Kmaq to the same laws as 1752  is not allowing them to improve where as they have no laws restricting their own growth.", "feedback": "Good understanding of the tension between frozen and evolving interpretations. The key insight is that freezing rights at 1752 creates an absurd outcome: Indigenous peoples would be denied the ability to participate in the modern economy. The Supreme Court has consistently rejected this approach in cases like R v Marshall."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "It's not right for the government making laws that can and will sway in their direction when it comes down to it. Mi'Kmaq should also have the same rights of improvement of their culture and community as the province does.", "feedback": "Good engagement with the moderate livelihood question. The R v Marshall decision is central - the Court recognized that treaty rights include the ability to earn a moderate livelihood, not just bare subsistence. To strengthen your analysis, consider how the scale of the operation matters and what 'moderate' means in the context of the modern economy."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "The province only cares about it's own growth and earning money not allowing the MI'Kmaq to earn themselves a living. If the province cared about helping the Mi'Kmaq they would have taken gradual steps towards a communication of making laws that would regulate but now completely ristrict the selling of cannabis.", "feedback": "Good analysis of the Sparrow Test application. The Province's failure to consult with the Mi'kmaq before the raid is a significant weakness in their position. To strengthen your analysis, explicitly walk through each element of the Sparrow Test and identify where the Crown's case falls short."}}}, "AIDEN  MERLIN (KING)": {"name": "Aiden  Merlin", "pin": "KING", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "Yes, because cannabis is a natural resource, similar to things like animal skins, feathers and other traditional idems. If people have the right to sell and use those resources, then they should also have the right to sell cannabis too.", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "No. The lab report shows the product was safe, so the ôpublic safetyö argument isnÆt valid.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}}}, "ANTHONY (COOL)": {"name": "Anthony", "pin": "COOL", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "yes, because canabis is a thing like skins fathers and more. to have the right to any other thing they have to sell.", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "Provincial authorities saw it as a routine raid on an unregulated business, while many in the community viewed it as a violation of Indigenous sovereignty and an act of colonial enforcement on reserve land.", "feedback": "You've identified key issues with the Crown's public safety argument. To strengthen your position, connect this more explicitly to the Sparrow Test - the Crown must show both a valid objective AND that their actions minimally impair the treaty right. If the product is safe, it's hard to argue that a police raid was the least intrusive option."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "The Sacred Fire marked a spiritual boundary; crossing it turned the raid, in the communityÆs view, from law enforcement into a violation of MiÆkmaw rights and sovereignty, prompting blockades to assert that provincial authority does not extend onto reserve land.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "The ômusket argumentö is partly valid. Courts (e.g., R v Sparrow and R v Marshall) accept that Indigenous rights can evolve into modern forms.", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "CROWN", "rationale": "The fiduciary duty is argued as protecting public safety, not profits. In R v Sparrow, the Court allows regulation if it serves valid goals like safety or conservation.", "feedback": "You've defended the Province's regulatory role. However, consider the evidence: the lab reports show no safety issues, and the NSLC sales data suggests economic motives. The Sparrow Test requires the Crown to demonstrate that its actions serve a compelling public purpose, not just protect government revenue."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "Yes. The ôfrozen rightsö approach treats rights as fixed in 1752, which the Supreme Court rejected in R v Sparrow and R v Marshall, both of which affirm that treaty rights are living and adaptable, not museum pieces.", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "No. In R v Marshall, ômoderate livelihoodö applies to treaty-based activities like fishing, not unrelated commercial cannabis retail, and it remains subject to regulation and limits.", "feedback": "Strong application of the R v Marshall precedent. The Supreme Court's definition of 'moderate livelihood' as encompassing necessities supplemented by amenities is deliberately flexible. Leo's argument that his business supports community members and funds services fits well within this framework. The Court in Marshall rejected limiting treaty rights to subsistence-level activities."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "No. Under R v Sparrow, the Crown must show a valid objective, minimal impairment, and honour of the Crown (including consultation). Skipping consultation and using excessive force would likely mean the Crown did not meet the justification requirement.", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "BAASHIQ (NINE)": {"name": "Baashiq", "pin": "NINE", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "The treaty was that they could exchange goods with out being cheated and if that what the treaty was the government should follow their end of the treaty. So technically the indingonus people can sell canobus becuause the treaty said \"could exchange goods\" without spacifieing what they can or cant exchange like canobus.", "feedback": "Strong use of the Living Tree Doctrine. You correctly identify that treaty interpretation should evolve with the times. To strengthen your analysis, reference how the Supreme Court applied this in R v Marshall - the Court noted that treaty rights must be interpreted in a way that reconciles Indigenous and Crown interests over time. Consider also what the Crown might argue about the original intent of the treaty makers."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "The public Safty isn't valid because when they raided the lab and didn't see any pesticides and mould and if the products was safe the raid shouldn't be about heath. So the search wasn't valid.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}}}, "BENOIT (DICE)": {"name": "BENOIT", "pin": "DICE", "block": "D Block (Hargreaves)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "IÆm on LeoÆs side because in Article 4 it says ôANY OTHER THINGö and since they werenÆt specific on what any other things is so technically Leo didnÆt do anything wrong.", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "The public safety argument was not valid. The lab found no pesticide, mould and actuate THC levels indicating that itÆs safe for consumers and that it was done for other reasons like money.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "The Sacred Fire is a legal boundary because in MiÆkmaw culture it represents a boundary that should not be crossed. When the Sacred Fire was lit in the doorway after the raid, crossing over it was viewed as a ôprofound desecrationö. Since itÆs part of their culture it was seen as a violation of of their human rights.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "The Musket argument is not valid because since the the treaty still stands today then cannabis shouldnÆt be considered as ôtoo dangerousö.", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "The Fiduciary Dutyis is only protecting profits. If people buy from Leo then they wonÆt buy it from the province (NSLC). This indicates that they will lose profit which is what they are trying to protect.", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "Yes, the Frozen Rights argument treats treatyÆs like museum pieces instead of a law thatÆs put in place to this day. Although they didnÆt sell cannabis in 1752 they should be aloud to sell it today because itÆs in the law that itÆs protected.", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "Yes, LeoÆs business does qualify as a ôModerate Livelihoodö. Since the government has a vague definition of the word ôModerateö it gives First Nations power because then the government doesnÆt know what they are fighting about, therefore no argument.", "feedback": "Strong application of the R v Marshall precedent. The Supreme Court's definition of 'moderate livelihood' as encompassing necessities supplemented by amenities is deliberately flexible. Leo's argument that his business supports community members and funds services fits well within this framework. The Court in Marshall rejected limiting treaty rights to subsistence-level activities."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "The crown did not meet the requirements for the Justification. They didnÆt meet the requirements because the crown skipped step 2. Meaning they skipped having a valid objective, priority and no consultation.", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "BILLY (JOHN)": {"name": "BILLY", "pin": "JOHN", "block": "D Block (Hargreaves)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "CROWN", "rationale": "Fiduciary duty was first created to protect people. It legally forces trustees to put vulnerable clients' interests ahead of their own money, as shown by the Legal Information Institute. However, modern corporations often use it to protect profits, since executives feel pressured to maximize investor wealth above all else. Today, a major shift is happening. Courts and lawmakers are rewriting the rules, including Canada's corporate laws and UN environmental standards, to force companies to balance money with the well-being of workers, communities, and the planet.  cited evidence-cornell.edu", "feedback": "You've defended the Province's regulatory role. However, consider the evidence: the lab reports show no safety issues, and the NSLC sales data suggests economic motives. The Sparrow Test requires the Crown to demonstrate that its actions serve a compelling public purpose, not just protect government revenue."}}}, "BUCHAN (IANB)": {"name": "BUCHAN", "pin": "IANB", "block": "D Block (Hargreaves)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "Article 4 states \"and the said Indians shall have free liberty to bring for Sale to Halifax or any other Settlement... Skins, feathers, fowl, fish or ANY OTHER THING they have to sell.\" If cannabis is what they are trying to sell, it would fall under \"any other thing'.", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "The lab report reading  \"Lab Report. Findings:Pesticides (None), Mould (None), THC (Accurate)\" shows that there was no public safety risk in the cannabis that was being sold. This means that the raid was unfair, and there was no reason for the provincial government to step in and tyr to override Indigenous Law.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "CROWN", "rationale": "From the article \"TALKING STICK - \nABOUT BEING A FIREKEEPER\", there is no mention about any legal work or boundary that makes the fire special under the law. While it is a sacred part of Mi'kmaq culture, it is not a legal entity.", "feedback": "You've identified the tension between Indigenous spiritual practices and Canadian law enforcement. However, Canadian courts have increasingly recognized Indigenous legal traditions as relevant to legal proceedings. The Supreme Court has acknowledged that the Honour of the Crown requires sensitivity to Indigenous perspectives. While the Sacred Fire may not be a formal legal boundary under Canadian statute, it represents a legitimate expression of Mi'kmaw law that courts are increasingly willing to consider."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "CROWN", "rationale": "The musket argument states that because muskets weren't considered too dangerous in the past, how could cannabis be considered too dangerous to sell or trade today by the statement, \"gunpowder, lead, and musketswith the Mi'kmaq.. If the Treaty protected the trade of deadly weapons then, [17] how can cannabis be 'too dangerous' to trade today?\". This statement is not valid however, because the safety and health standards in 1760 are much different than today's. We know more about danger and safety today, so cannabis is considered too dangerous.", "feedback": "You've identified a distinction between historical musket trade and modern cannabis regulation. However, consider the counter-argument: the Crown accepted musket trade in 1760 despite genuine safety concerns, which suggests that treaty trade was never limited by safety standards. The musket analogy demonstrates that the Crown has historically accepted Indigenous trade in goods it considered dangerous."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "I think there is a combination of both people and profits being protected in the crowns argument. While it would protect the people by protecting them from unregulated stores, as in the argument \"They argue that if Leo wins, the province will be flooded with unregulated shops.\", it would also help Canadian businesses survive and not be overrun by Indigenous shops that could charge cheaper rates by not having to pay taxes. \" Because Leo doesn't pay provincial tax, his product is cheaper.\" Therefore, the crown is acting more in defense of its profits than its people.", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "Since 1752, nearly 300 years have passed. This much time causes man changes in the world, so saying that because something was a certain way in 1752 it must stay the same is unfair. (The site for \"Museum pieces\" does not work).  This is an unfair claim by the governement, because many other laws and rights have evolved over time, so these laws should as well.", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "CROWN", "rationale": "The law states that a moderate livelihood includes enough to provide nesscessites for living (The accusedÆs treaty rights are limited to securing ônecessariesö (which should  be construed in the modern context as equivalent to a moderate livelihood)), which the size of Leos trade post is too big for. His shop does not fall under the requirements for a \"moderate livelihood.", "feedback": "You've raised the question of whether Leo's business exceeds 'moderate livelihood.' However, the Supreme Court in R v Marshall specifically rejected limiting treaty rights to subsistence activities. What constitutes 'reasonable' must be understood in contemporary economic terms."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "From the intelligence, \"Intelligence shows the Province never called the Chief before the raid. [24]. They didn't co-develop safety rules; they just sent tactical units.\" we can see that the goverenment did not follow the supreme court by proving and justifying their actions. By not using the Sparrow Test , they acted above the law. Therefore, the defense is favored.", "feedback": "Good analysis of the Sparrow Test application. The Province's failure to consult with the Mi'kmaq before the raid is a significant weakness in their position. To strengthen your analysis, explicitly walk through each element of the Sparrow Test and identify where the Crown's case falls short."}}}, "CALLUM (LLLL)": {"name": "CALLUM", "pin": "LLLL", "block": "A Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "ôAny other thingö is broad language that supports a flexible, ongoing MiÆkmaq right to trade. From the MiÆkmaq perspective, it protects the ability to trade modern goods, not just items from 1752. Based on this, cannabis can be included as part of that treaty-protected trade right.", "feedback": "Strong use of the Living Tree Doctrine. You correctly identify that treaty interpretation should evolve with the times. To strengthen your analysis, reference how the Supreme Court applied this in R v Marshall - the Court noted that treaty rights must be interpreted in a way that reconciles Indigenous and Crown interests over time. Consider also what the Crown might argue about the original intent of the treaty makers."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "If lab findings show the cannabis was clean, accurately labeled, and within safe potency limits, the ôpublic safetyö argument is weak. This evidence suggests there was no real health risk to justify the raid. Instead, it supports the view that the enforcement was about control and jurisdiction, not safety.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "CROWN", "rationale": "The Sacred Fire is a cultural and spiritual symbol, but it does not have legal authority to block police enforcement of the law. Provincial officers still have jurisdiction to carry out lawful actions on public or regulated land. Therefore, it represents cultural significance, not a legal boundary that can stop enforcement.", "feedback": "You've identified the tension between Indigenous spiritual practices and Canadian law enforcement. However, Canadian courts have increasingly recognized Indigenous legal traditions as relevant to legal proceedings. The Supreme Court has acknowledged that the Honour of the Crown requires sensitivity to Indigenous perspectives. While the Sacred Fire may not be a formal legal boundary under Canadian statute, it represents a legitimate expression of Mi'kmaw law that courts are increasingly willing to consider."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "The analogy is valid because it shows that Indigenous rights exist inherently, not only when recognized by courts. Section 35 supports that these rights are pre-existing and must be upheld. The R v Sparrow confirms courts protect rights rather than create them.", "feedback": "Good engagement with the historical analogy argument. The key insight is that the Crown cannot selectively apply safety standards - if dangerous goods were acceptable in 1760, the Crown needs a principled reason why cannabis is different today. Consider how this connects to the Living Tree Doctrine: just as muskets were the dangerous goods of their era, cannabis is a regulated good of ours."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "CROWN", "rationale": "The fiduciary duty is being used to protect public health and safety by ensuring only regulated, tested products are sold. Under laws like the Cannabis Act, the province is responsible for preventing harm from unsafe or illegal markets. This shows the focus is on protecting people, not generating profit.", "feedback": "You've defended the Province's regulatory role. However, consider the evidence: the lab reports show no safety issues, and the NSLC sales data suggests economic motives. The Sparrow Test requires the Crown to demonstrate that its actions serve a compelling public purpose, not just protect government revenue."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "The ôFrozen Rightsö idea is unfair because it locks treaty rights in the past instead of letting them change over time. Indigenous rights should grow and adapt with modern life. The R v Marshall shows courts can interpret treaties in a modern way, not just old history.", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "CROWN", "rationale": "A ômoderate livelihoodö in R v Marshall means small-scale income for basic needs, not a large commercial business. If LeoÆs cannabis operation is making significant profit or operating like a storefront business, it goes beyond that limit. Therefore, it would not qualify as a treaty-protected moderate livelihood.", "feedback": "You've raised the question of whether Leo's business exceeds 'moderate livelihood.' However, the Supreme Court in R v Marshall specifically rejected limiting treaty rights to subsistence activities. What constitutes 'reasonable' must be understood in contemporary economic terms."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "Under the R v Sparrow test, the Crown must also show proper consultation and minimal impairment of rights. If the Crown used force and did not consult the MiÆkmaq community, Step 2 fails because it did not respect the Honour of the Crown. This means the justification is weak, even if public safety is claimed.", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "CASHTON (CASH)": {"name": "CASHTON", "pin": "CASH", "block": "D Block (Hargreaves)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "Yes, the absolute and capitalized text of Article 4 explicitly grants the freedom to trade any modern commercial good.\n\nEvidence- Article 4 states that the Tribe \"shall have FREE LIBERTY to bring for Sale to Halifax or any other Settlement, Skins, feathers, fowl, fish or ANY OTHER THING they have to sell.\"\n\nReasoning- Article 4 protects the \"FREE LIBERTY\" to sell \"ANY OTHER THING\" without hindrance. Forcing Leo to get a provincial license violates this explicit freedom. Under the \"Living Tree\" doctrine, this trading right must evolve to include modern legal commodities like cannabis.", "feedback": "Strong use of the Living Tree Doctrine. You correctly identify that treaty interpretation should evolve with the times. To strengthen your analysis, reference how the Supreme Court applied this in R v Marshall - the Court noted that treaty rights must be interpreted in a way that reconciles Indigenous and Crown interests over time. Consider also what the Crown might argue about the original intent of the treaty makers."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "The Crown's \"Public Safety\" argument is entirely invalid.\n\nEvidence- The independent Lab Report shows Pesticides (None), Mould (None), and THC (Accurate). Operationally, Leo is authorized by a Band Council Resolution (BCR) and UNDRIP Article 3\n\nReasoning- Since the product is certified safe, the raid was not about health; it was an act of colonial aggression to protect the Province's tax monopoly. The Band holds proper legal justification to regulate its own economy on its land", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "The Sacred Fire constitutes a valid legal and jurisdictional boundary separating sovereign territory from provincial reach.\n\nEvidence- The fire forms a spiritual boundary within territory where provincial enforcement stops. Red Dresses frame the raid as systemic colonial violence rather than a drug case, while intelligence proves the shop funds vital community jobs and elder care.\n\nReasoning- Overstepping the Sacred Fire escalates a more regulatory business dispute into a major human rights crisis. Because the community operates on unceded land under a sacred treaty, provincial justification cannot cross this boundary to dismantle an economy that directly supports Indigenous welfare and self determination.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "Yes, the Musket Precedent is a highly valid legal analogy that completely refutes the Crown's safety argument.\n\nEvidence- The British actively traded deadly items like gunpowder, lead, and muskets with the Mi'kmaq. LeoÆs testimony, bound by the eagle feather oath, challenges the \"Empty Box Theory\" by asserting that Indignous rights are inherently full.\n\nReasoning-  If treaty frameworks historically protected the commerce of weapons the crown cannot claim a modern product like cannabis is \"too dangerous\" to trade. The safety excuse is more a colonial text to suppress economic competition, and rejecting this analogy devalues Indigenous legal traditions in favor of colonial interests.", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "The Province is using its fiduciary duty as a cover to eliminate business competition and protect government profits rather than public safety.\n\nEvidence- Internal Armstrong Directive memos order police to shut down shops because \"Public confidence in the regulated market must be maintained,\" while NSLC intelligence reports show a \"significant loss in sales near Millbrook\" because LeoÆs product is cheaper and does not include provincial tax.\n\nReasoning- This proves that the CrownÆs true motivation is financial loss, not a public health emergency. The government is using the police force as an economic tool to crush a cheaper business competitor and protect their NSLC monopoly, showing that \"fiduciary duty\" is being used to safeguard government revenue instead of protecting regular citizens.", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "The \"Frozen Rights\" argument treats Indigenous communities like static museum pieces by completely cutting off their ability to grow and survive in the modern economy.\n\nEvidence- The text states that protesters argue \"the law must evolve\" because if the government freezes rights in the past, \"they can effectively kill any new Indigenous business,\" sparking a larger movement for \"Economic Sovereignty.\"\n\nReasoning- If a law stops a group of people from starting new businesses or adapting to modern markets, it forces them to stay stuck in a historical era. This evidence shows that treating treaties like unchanging museum exhibits actively harms living communities by taking away their economic independence and blocking their right to a livelihood today.", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "Leo's business qualifies under the \"Moderate Livelihood\" standard because restricting it with a narrow definition is just a political tactic to keep First Nations financially dependent.\n\nEvidence- The intelligence text reveals that the term \"Moderate\" was left vague by the government to \"avoid giving up power,\" and t
