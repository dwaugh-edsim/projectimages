f or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "MYLES (QWER)": {"name": "myles", "pin": "QWER", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "the treaty was renewed and confirmed forever and they also have free liberity to sell bring for Sale to Halifax or any other Settlement... Skins, feathers, fowl, fish or ANY OTHER THING they shall have to sell.", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "The defenseÆs position is more persuasive because Exhibit C shows the cannabis was free of contaminants and accurately labeled, undermining the claim that the raid was necessary for public safety. This supports the inference that the enforcement action was driven less by health concerns and more by a conflict over jurisdiction and regulatory authority.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "CROWN", "rationale": "The CrownÆs position is stronger because it emphasizes that laws must be applied consistently, regardless of cultural or political context, to maintain public order and legal certainty. While the communityÆs response is significant, it does not override the ProvinceÆs legal authority to enforce its regulations.", "feedback": "You've identified the tension between Indigenous spiritual practices and Canadian law enforcement. However, Canadian courts have increasingly recognized Indigenous legal traditions as relevant to legal proceedings. The Supreme Court has acknowledged that the Honour of the Crown requires sensitivity to Indigenous perspectives. While the Sacred Fire may not be a formal legal boundary under Canadian statute, it represents a legitimate expression of Mi'kmaw law that courts are increasingly willing to consider."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "The defense is more persuasive because it ties treaty historyùsuch as the 1760 trade in weaponsùto present-day economic rights, highlighting a potential inconsistency in how ôdangerö is defined and regulated. Combined with LeoÆs testimony and the cultural significance of the Eagle Feather, it frames the issue as one of inherent rights and legal recognition, rather than simple regulatory compliance.", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "CROWN", "rationale": "The Crown is more persuasive because it argues that allowing unregulated cannabis sales could undermine the entire legal framework, leading to inconsistent enforcement and broader risks to public order. Even if financial motives are suggested, the Province can justify its actions through its fiduciary duty to ensure a controlled, accountable market rather than a fragmented system.", "feedback": "You've defended the Province's regulatory role. However, consider the evidence: the lab reports show no safety issues, and the NSLC sales data suggests economic motives. The Sparrow Test requires the Crown to demonstrate that its actions serve a compelling public purpose, not just protect government revenue."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "CROWN", "rationale": "The Crown is more persuasive because cases like R. v. Googoo (2024) provide a concrete legal precedent supporting the ôFrozen Rightsö approach, which courts may feel bound to follow. This grounds their position in current law, whereas the defenseÆs argument depends more on evolving interpretations that have not yet been fully recognized by the courts.", "feedback": "You've identified the Crown's concern about expanding treaty rights. However, the 'Frozen Rights' approach has been consistently criticized by the Supreme Court. In R v Marshall, the Court explicitly rejected the idea that treaty rights are limited to the specific practices of 1752. The Living Tree Doctrine recognizes that treaty provisions must be interpreted in light of changing circumstances."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "The defence for Leo is stronger because the text shows that Treaty rights are ômodern laws that can defeat provincial regulations,ö meaning his argument has legal weight under the Marshall decision. It also supports that a ômoderate livelihoodö includes more than basic survival, since Leo argues a modern economy is needed to improve things like community schools, not just ôenough to buy bread.ö", "feedback": "Strong application of the R v Marshall precedent. The Supreme Court's definition of 'moderate livelihood' as encompassing necessities supplemented by amenities is deliberately flexible. Leo's argument that his business supports community members and funds services fits well within this framework. The Court in Marshall rejected limiting treaty rights to subsistence-level activities."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "The defence for Leo is stronger because the text shows the Province ônever called the Chief before the raidö and failed to consult, which goes against the Honour of the Crown requirement to work with Indigenous partners. It also says the evidence against Leo was ôpurely economic,ö meaning the government may fail the Sparrow TestÆs ôcompelling objectiveö step if there was no real safety risk.", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "ROSE (ROSE)": {"name": "rose", "pin": "ROSE", "block": "A Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "Yes it does because the treaty states that they could sell what they wanted in their stores on their land. Cannibals is apart of their culture there for they should be able to sell it.", "feedback": "You've taken a clear position on the treaty interpretation question. To s function initBlocks() {
    const blocks = new Set();
    Object.values(FEEDBACK_DATA).forEach(s => blocks.add(s.block));
    const select = document.getElementById('block-select');
    select.innerHTML = '<option value="">-- Select Block --</option>';
    [...blocks].sort().forEach(block => {
        const opt = document.createElement('option');
        opt.value = block; opt.textContent = block; select.appendChild(opt);
    });
}
function attemptLogin() {
    const block = document.getElementById('block-select').value;
    const name = document.getElementById('student-name').value.trim();
    const pin = document.getElementById('student-pin').value.trim().toUpperCase();
    const errorEl = document.getElementById('error-message');
    const btn = document.getElementById('login-btn');
    if (!block || !name || !pin) { errorEl.textContent = 'Please fill in all fields.'; errorEl.style.display = 'block'; return; }
    btn.disabled = true; btn.textContent = 'VERIFYING...'; errorEl.style.display = 'none';
    const nameUpper = name.toUpperCase();
    let found = null;
    for (const [key, student] of Object.entries(FEEDBACK_DATA)) {
        if (student.block === block && student.name.toUpperCase() === nameUpper && student.pin === pin) { found = { key, ...student }; break; }
    }
    if (!found) { errorEl.textContent = 'No matching student found. Check your name, PIN, and block.'; errorEl.style.display = 'block'; btn.disabled = false; btn.textContent = 'ACCESS FEEDBACK'; return; }
    currentStudent = found; showFeedbackScreen();
}
function showFeedbackScreen() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('feedback-screen').style.display = 'block';
    const welcome = document.getElementById('student-welcome');
    welcome.innerHTML = '<h2>Welcome, ' + escapeHtml(currentStudent.name) + '</h2><p>' + escapeHtml(currentStudent.block) + ' | ' + escapeHtml(currentStudent.project) + '</p>';
    const content = document.getElementById('feedback-content');
    let html = '<div class="project-section"><div class="project-header">' + escapeHtml(currentStudent.project) + '</div>';
    const feedbackEntries = Object.values(currentStudent.feedback);
    if (feedbackEntries.length === 0) { html += '<p class="no-data">No responses found.</p>'; }
    else {
        feedbackEntries.forEach(entry => {
            html += '<div class="question-card"><div class="question-label">' + escapeHtml(entry.question) + ' <span class="verdict-badge verdict-' + entry.verdict + '">' + entry.verdict + '</span></div>';
            html += '<div class="student-answer-label">Your Response</div><div class="student-answer">' + escapeHtml(entry.rationale) + '</div>';
            html += '<div class="feedback-comment"><div class="feedback-label">Teacher Feedback</div><div>' + escapeHtml(entry.feedback) + '</div></div></div>';
        });
    }
    if (currentStudent.verdict) {
        const v = currentStudent.verdict.toString().toUpperCase();
        const vClass = v.includes('CROWN') ? 'verdict-CROWN' : v.includes('DEFENSE') ? 'verdict-DEFENSE' : 'verdict-IN_PROGRESS';
        html += '<div style="margin-top:20px;padding:15px;background:var(--card-bg);border-radius:6px;border-left:3px solid var(--accent);"><span style="font-size:0.75rem;color:#888;text-transform:uppercase;">Final Verdict: </span><span class="verdict-badge ' + vClass + '">' + escapeHtml(v) + '</span></div>';
    }
    html += '</div>'; content.innerHTML = html; document.getElementById('feedback-container').style.display = 'block';
}
function logout() {
    currentStudent = null;
    document.getElementById('feedback-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'block';
    document.getElementById('student-name').value = '';
    document.getElementById('student-pin').value = '';
    document.getElementById('login-btn').disabled = false;
    document.getElementById('login-btn').textContent = 'ACCESS FEEDBACK';
}
function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
document.getElementById('student-pin').addEventListener('keypress', function(e) { if (e.key === 'Enter') attemptLogin(); });
initBlocks();
</script>
</body>
</html>
