 insight is that freezing rights at 1752 creates an absurd outcome: Indigenous peoples would be denied the ability to participate in the modern economy. The Supreme Court has consistently rejected this approach in cases like R v Marshall."}}}, "LENA (FOOD)": {"name": "lena", "pin": "FOOD", "block": "A Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "The phrase ôany other thingö is broad and, under the Living Tree Doctrine and R v Marshall, could evolve to include modern goods tied to a livelihood. However, courts have not definitively ruled that cannabis is included, making this a strong but unsettled argument. It supports a modern interpretation of treaty trade, but not an unlimited one.", "feedback": "Strong use of the Living Tree Doctrine. You correctly identify that treaty interpretation should evolve with the times. To strengthen your analysis, reference how the Supreme Court applied this in R v Marshall - the Court noted that treaty rights must be interpreted in a way that reconciles Indigenous and Crown interests over time. Consider also what the Crown might argue about the original intent of the treaty makers."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "The independent lab report showing no contaminants weakens the CrownÆs claim that the raid was necessary for immediate health risks. However, under R v Sparrow, public safety can include broader concerns like regulation and distribution, not just product quality. This means the safety argument is weakened, but not completely invalid.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "The Sacred Fire represents a MiÆkmaq assertion of legal and cultural authority, reinforcing their claim to self-governance. The United Nations Declaration on the Rights of Indigenous Peoples supports this as an interpretive principle, particularly regarding Indigenous legal traditions and autonomy. However, it does not automatically override Canadian law, making this a strong but not decisive legal argument.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "Historical trade in muskets suggests treaty commerce was not strictly limited by modern safety standards. This analogy supports a broader interpretation of trade rights but is not binding legal precedent. Courts may view it as persuasive context rather than definitive proof.", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": ding community needs could fit this definition, but its scale may be challenged by the Crown. This makes LeoÆs claim plausible, but not guaranteed.", "feedback": "Strong application of the R v Marshall precedent. The Supreme Court's definition of 'moderate livelihood' as encompassing necessities supplemented by amenities is deliberately flexible. Leo's argument that his business supports community members and funds services fits well within this framework. The Court in Marshall rejected limiting treaty rights to subsistence-level activities."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "The ProvinceÆs failure to consult weakens its position under the R v Sparrow framework. Less intrusive options, like negotiation or co-regulation, were likely available. While not automatically fatal, this significantly undermines the justification for the raid.", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "MADIHA (MADI)": {"name": "MADIHA", "pin": "MADI", "block": "D Block (Hargreaves)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "The \" any other\" thing can include cannabis because article 4 says the Mi'kamq can sell \"skins, feathers, fowl, fish or any other thingsthey have to sell\". the words \"any other thing\" are really broad and don't say what can be or cant be sold . and since cannabis is something that can be sold today, so I think it can be included under \" any other thing\" this supports leo's argument that he has treaty right to trade cannabis.", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "The public safety report is very strong because the lab report found ''no pesticides, mould, and the accurate THC levels''. this shows that the cannabis were tested and considered safe because the product did not have any major safety issues, the raid seems less about protecting public health and more about enforcing provincial rules on cannabis sales.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "The scared fire is a legal boundary it is very important in Mikmaq culture. The evidence says the stepping over the fire is a serious sign of disrespect and violation of human rights. because of this the community sees the fire as a boundary that should not be crossed. this is why many people felt the raid was not just a legal issue, but also a violation of their traditions and rights.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "The musket argument is a valid anology. the evidence says that the British traded \"gunpowder, lead and muskets\" with the mikmaqi in 1760. since muskets were dangerous weapons, it seems unfair to say that cannabis is too dangerous to be traded today. this supports leo's arguments that the crown is using safety as a reason to limit a trade that could be protected by treaty rights.", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "The fiduciary duty is being used more to protect the profits. The evidence shows that the NSLC was losing sales near Millbrook because Leo's shop was cheaper since he didn't pay provincial tax. It also says the crowns memo focused on keeping \"public confidence is the regulated market\" which sounds more like protecting the system then the safety. this suggests that the province is trying to protects it monopoly instead of just public health.", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "The frozen Rights arguments treats people like museum peices. The evidence says  R. v. Googoo (2024) says Mi'kmaq only have rights for things they traded in 1752, like cannabis is excluded because it wasn't traded back then. It also says this is a \"frozen Right\" approach that treat treaty rights like a museum exhibit instead of a living law, this littrally shows that the crowns is limiting indigenous people rights instead of letting them change with time.", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "Leo's business can count as a \"moderate livelihood\". the evidence from the Marshall case says a moderate livelihood includes things ike food, clothing and housing. it also says treaty rights can support his community, like funding schools and elder care, which shows it is more then just personal profit. This supports the idea that his business fits a modern \" moderate livelihood\"", "feedback": "Strong application of the R v Marshall precedent. The Supreme Court's definition of 'moderate livelihood' as encompassing necessities supplemented by amenities is deliberately flexible. Leo's argument that his business supports community members and funds services fits well within this framework. The Court in Marshall rejected limiting treaty rights to subsistence-level activities."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "The crown did not fully meet the sparrow test. The evidence shows they did not consult with the chief before the raid, which fails the consultation requirement. It also shows they used tacticle officers instead of using less harmful options. This fails minimal impairment because the crown used a heavy police raid instead of a smaller and a safer approach. the evidence also suggests the real goal was protecting the NSCL tax system, not public safety. this shows that the crown did not properly justify limiting Leo's treaty rights.", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "MAE (BALL)": {"name": "MAE", "pin": "BALL", "block": "A Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "The reasoning for this is that they signed the treaty, and it is important to the indigenous culture that they get the supplies they want and need.  This includes cannabis and it was writen in the wampum agrement and the written one", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "Public confidence in the regulated market and the drop in NSLC sales suggests the shutdown may also be about protecting government cannabis sales, not just public safety.", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "its suck in the past, like a museum exhibit, by refusing to allow those rights to grow or to modern economic life.", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}}}, "MATEO (YOLO)": {"name": "MATEO", "pin": "YOLO", "block": "A Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "CROWN spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "The musket argument is legally valid as a principle, Indigenous rights exist inherently, independent of court acknowledgment", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "CROWN", "rationale": "the Fiduciary Duty is being invoked to protect people, not profits. The Province frames its duty as safeguarding citizens from the dangers of an unregulated market rather than maximizing economic gain.", "feedback": "You've defended the Province's regulatory role. However, consider the evidence: the lab reports show no safety issues, and the NSLC sales data suggests economic motives. The Sparrow Test requires the Crown to demonstrate that its actions serve a compelling public purpose, not just protect government revenue."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "Yes, the æFrozen RightsÆ argument effectively treats people as æmuseum piecesÆ, because it denies the MiÆkmaq the ability to adapt their treaty rights to modern contexts.", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "CROWN", "rationale": "LeoÆs business does not qualify as a ôModerate Livelihoodö, because it is oriented toward commercial expansion rather than basic subsistence.", "feedback": "You've raised the question of whether Leo's business exceeds 'moderate livelihood.' However, the Supreme Court in R v Marshall specifically rejected limiting treaty rights to subsistence activities. What constitutes 'reasonable' must be understood in contemporary economic terms."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "No, the Crown did not justify the infringement. Evidence shows they skipped consultation and used excessive force", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "MICHAEL (ABCD)": {"name": "Michael", "pin": "ABCD", "block": "A Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "CROWN", "rationale": "They are still subject to follow the laws, if they were aloud to sell anything then they could sell iligal things such as fentanyl, guns and weapons if they are aloud to sell anything that they want. The reason NSLC is aloud to sell canabus is because it is regulated by the government and they follow all of the nessisary regulations.", "feedback": "You've identified an important concern about public safety and regulation. However, consider this: the Living Tree Doctrine and cases like R v Marshall have established that treaty rights can override provincial regulations. The key question isn't whether cannabis is dangerous, but whether the Province has a compelling and justified reason to infringe on a treaty right. Think about what level of evidence the Crown would need to meet the Sparrow Test."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "CROWN", "rationale": "The raid was valid because it was for public safety and regulations, they also had valed warents to go make stop them from selling iligal weed.", "feedback": "You've raised valid concerns about regulation and public safety. However, consider this tension: if the treaty protects the right to trade, and the product is demonstrably safe, does the Province's interest in regulation outweigh a constitutionally protected treaty right? The Sparrow Test requires the Crown to show that their infringement is justified - not just that regulation is preferable."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "CROWN", "rationale": "This argument about missing indigenous women has nothing to do with them raiding truck houses, they are just trying to make the governemnt look bad and make it seam like they don't care about them while that is not true. And just because this is providing money to nursing homes doesn't mean that it should not be shut down if it is iligal.", "feedback": "You've identified the tension between Indigenous spiritual practices and Canadian law enforcement. However, Canadian courts have increasingly recognized Indigenous legal traditions as relevant to legal proceedings. The Supreme Court has acknowledged that the Honour of the Crown requires sensitivity to Indigenous perspectives. While the Sacred Fire may not be a formal legal boundary under Canadian statute, it represents a legitimate expression of Mi'kmaw law that courts are increasingly willing to consider."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "CROWN", "rationale": "Just because they are able to sell guns doesn't mean that they should be able to sell weed, they are two completely separate things and they should be treated separate, even though some people may think that guns are more deadly it doesn't give them the right to seel anything that someone may deam is less deadly.", "feedback": "You've identified a distinction between historical musket trade and modern cannabis regulation. However, consider the counter-argument: the Crown accepted musket trade in 1760 despite genuine safety concerns, which suggests that treaty trade was never limited by safety standards. The musket analogy demonstrates that the Crown has historically accepted Indigenous trade in goods it considered dangerous."}}}, "MRWAUGH (XOXO)": {"name": "MRWAUGH", "pin": "XOXO", "block": "A Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "r2getgnbhsrdfyjrsymjnrwsyjrswynmsrhgmnrsymn", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}}}, "MYSHA (BAKA)": {"name": "MYSHA", "pin": "BAKA", "block": "D Block (Hargreaves)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "I think it is for the defense because the right to trade was for all things as the land was originally of the mi'kmaq people. The right to trade was on everything.", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "I believe the situation is for the defense as the officers entered on reserve land where they weren't welcomed and their way of handling the situation was aggressive and disrespectful to the peace and friendship treaty.", "feedback": "You've identified key issues with the Crown's public safety argument. To strengthen your position, connect this more explicitly to the Sparrow Test - the Crown must show both a valid objective AND that their actions minimally impair the treaty right. If the product is safe, it's hard to argue that a police raid was the least intrusive option."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "it is a boundary decided by mi'kmaq law for their safety and security which was not respected.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "yes,  Leo has many rights that are being ignored and abused.", "feedback": "Good engagement with the historical analogy argument. The key insight is that the Crown cannot selectively apply safety standards - if dangerous goods were acceptable in 1760, the Crown needs a principled reason why cannabis is different today. Consider how this connects to the Living Tree Doctrine: just as muskets were the dangerous goods of their era, cannabis is a regulated good of ours."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "I believe the province is using the fiduciary duty to get profits as they find its okay to abuse the fiduciary duty if it means they make money by the same actions. and they ( province/NSLC) lose profit if people buy from Leo.", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "yes it does as rights don't simply change because they weren't used before.", "feedback": "Good understanding of the tension between frozen and evolving interpretations. The key insight is that freezing rights at 1752 creates an absurd outcome: Indigenous peoples would be denied the ability to participate in the modern economy. The Supreme Court has consistently rejected this approach in cases like R v Marshall."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "Leo is indeed the Marshall of cannabis as his business does support moderate livelihood.", "feedback": "Strong application of the R v Marshall precedent. The Supreme Court's definition of 'moderate livelihood' as encompassing necessities supplemented by amenities is deliberately flexible. Leo's argument that his business supports community members and funds services fits well within this framework. The Court in Marshall rejected limiting treaty rights to subsistence-level activities."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "no they did not meet the requirement as they skipped the process and jumped to aggressive tactics.", "feedback": "Good analysis of the Sparrow Test application. The Province's failure to consult with the Mi'kmaq before the raid is a significant weakness in their position. To strengthen your analysis, explicitly walk through each element of the Sparrow Test and identify where the Crown's case falls short."}}}, "MADINA MIRZA (INNA)": {"name": "Madina Mirza", "pin": "INNA", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "The Phrase \"ANY OTHER THING they shall have to sell\" is intentionally broad, with no limits written. Using the Living Tree Doctrine, the meaning should envolve, just like old terms adapt to modern realities. Since Mikmaq have a protected right to trade, and cannabis is a modern economic good, it can fall under \"any other thing\". Limiting it to 1752 items would unfairly \"freeze\" Indigenous rights in the past.", "feedback": "Strong use of the Living Tree Doctrine. You correctly identify that treaty interpretation should evolve with the times. To strengthen your analysis, reference how the Supreme Court applied this in R v Marshall - the Court noted that treaty rights must be interpreted in a way that reconciles Indigenous and Crown interests over time. Consider also what the Crown might argue about the original intent of the treaty makers."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "Th Lab Report findings directly weaken the Crowns claim: ┤┤ no pesticides, no mould, acurat THC levels.┤┤ That shows the product was safe for consummers, so ┤┤public safety┤┤ isnt supported by evidance in this case. This suggests the real issue is control and taxation, not health risks, especially since the Band already authorized the operation through a BCR.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "The Sacred Fire is a legal boundry under Indigenous law. The text says that it is a ┤┤spiritual boundry┤┤ and that crossing it is a ┤┤profound desecration┤┤, showing it has binding authority in Mikmaw governance. The community also set up ┤┤blockades... asserting that provincial rules stop at the highway boundry┤┤, proving they are enforcing their own jurisdiction.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "The musket analogy is strong because it shows the Treaty protected trade in even dangerous goods. Evidence: the British allowed trade of ôgunpowder, lead, and musketsö, items clearly more harmful than cannabis. If those were permitted under Treaty relations, then banning cannabis as ôtoo dangerousö is inconsistent, supporting LeoÆs claim that the right to trade includes modern goods.", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "The fiduciary duty is being used to protect profits and monopoly control. Evidence: the Armstrong Directive says ôPublic confidence in the regulated market must be maintainedö, suggesting focus on the government-run system. Also, NSLC reports show ôa significant loss in sales near Millbrookö, proving the Province has a financial motive to shut down LeoÆs cheaper, untaxed business.", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "Yes, the ┤┤Frozen Rights┤┤ argument treats Indigenous people like museum pieces. the text itself says it ┤┤ treat Treaty rights lik a museum exhibit... rather than a living law┤┤. By limiting rights only to what existed in 1752, it blocks modern economic activity, supporting protesters claim that ┤┤the law must envolve┤┤ and not trap Indigenous rights in th past.", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "CROWN", "rationale": "Leos business likely does not qualify as a ┤┤moderate livlihood.┤┤The Court defined it as ┤┤necessaries like food, clothing, and housing but not walth┤┤. The Crown argues ┤┤Leos shop is too big to be moderate┤┤, suggesting it goes beyond basic needs and enters large scale commercial activity.", "feedback": "You've raised the question of whether Leo's business exceeds 'moderate livelihood.' However, the Supreme Court in R v Marshall specifically rejected limiting treaty rights to subsistence activities. What constitutes 'reasonable' must be understood in contemporary economic terms."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "The Crown did not use minimal impairment. ┤┤the Province never called the Chief before the raid┤┤ and ┤┤┤they didnt try to co-develop safety rules; they just sent the police┤┤. Under the Honour of the Crown, they had a duty to consult first, meaning a less harmful option like negotiation was clarly available but ignored.", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "NICHOLAS (AAAA)": {"name": "NICHOLAS", "pin": "AAAA", "block": "D Block (Hargreaves)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "Test", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}}}, "NOAH PINTER (NOAH)": {"name": "Noah Pinter", "pin": "NOAH", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "CROWN", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "CROWN", "rationale": "The phrase \"any other thing\" must be interpreted within historical context, which was intended to provide for a moderate livihood rather than a modern commercial industry. Under the Marshall decision, treaty rights are not absolute and do not grant a license to bypass provincial health and safety regulations governing controlled substances like cannabis. Furthermore, the \"Living Tree\" doctrine allows for the evolution of how a right is exercised, but it does not permit the creation of entirely new commercial rights for products that were not integral to Mi'kmaw culture or trade at the time of the treaty.", "feedback": "You've identified an important concern about public safety and regulation. However, consider this: the Living Tree Doctrine and cases like R v Marshall have established that treaty rights can override provincial regulations. The key question isn't whether cannabis is dangerous, but whether the Province has a compelling and justified reason to infringe on a treaty right. Think about what level of evidence the Crown would need to meet the Sparrow Test."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "CROWN", "rationale": "The \"Public Safety\" argument is legally valid because safety is defined by the existence of a continuous, government-mandated regulatory system rather than an isolated lab report. While Exhibit C shows a clean batch, it does not account for the systemic requirements of the Cannabis Act, such as age-gate verification, inventory tracking, and standardized quality control across the entire supply chain. Therefore, the stateÆs \"compelling and substantial\" objective to regulate a controlled substance remains a lawful justification for enforcement, as private testing cannot replace the oversight provided by provincial licensing.", "feedback": "You've raised valid concerns about regulation and public safety. However, consider this tension: if the treaty protects the right to trade, and the product is demonstrably safe, does the Province's interest in regulation outweigh a constitutionally protected treaty right? The Sparrow Test requires the Crown to show that their infringement is justified - not just that regulation is preferable."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "CROWN", "rationale": "The \"Sacred Fire\" represents a spiritual boundary rather than a legal one, and it cannot be used to obstruct the enforcement of provincial laws of general application. While the community views crossing the fire as a desecration, the state's jurisdictional authority to execute a valid search warrant on-reserve remains unchanged by cultural or religious protocols. From a legal standpoint, spiritual perimeters do not create \"no-go zones\" for law enforcement, as the rule of law requires consistent application of public safety regulations across all territories. Thus, the raid was a lawful exercise of authority over an unregulated commercial enterprise, independent of the siteÆs spiritual framing.", "feedback": "You've identified the tension between Indigenous spiritual practices and Canadian law enforcement. However, Canadian courts have increasingly recognized Indigenous legal traditions as relevant to legal proceedings. The Supreme Court has acknowledged that the Honour of the Crown requires sensitivity to Indigenous perspectives. While the Sacred Fire may not be a formal legal boundary under Canadian statute, it represents a legitimate expression of Mi'kmaw law that courts are increasingly willing to consider."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "CROWN", "rationale": "The \"Musket Precedent\" is a flawed legal analogy because it confuses the method of a right with the content of a right. While the 1760 trade included gunpowder and muskets, these were provided for the specific, treaty-protected purpose of \"hunting and fishing\" as a means of survival. Cannabis, by contrast, is a modern, recreational controlled substance that does not facilitate traditional harvesting activities or the \"moderate livelihood\" established in R. v. Marshall. Furthermore, even if an analogy were drawn, the state has the clear constitutional authority to regulate dangerous or sensitive goods, just as it now regulates the modern possession of muskets to ensure the paramount objective of public safety.", "feedback": "You've identified a distinction between historical musket trade and modern cannabis regulation. However, consider the counter-argument: the Crown accepted musket trade in 1760 despite genuine safety concerns, which suggests that treaty trade was never limited by safety standards. The musket analogy demonstrates that the Crown has historically accepted Indigenous trade in goods it considered dangerous."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "CROWN", "rationale": "Fiduciary Duty is being exercised to protect the integrity of a regulated market, which is the only way to guarantee public health and safety across the province. While intelligence from NSLC reports shows a loss in sales, which is argued that this \"tax monopoly\" is actually a public service; tax revenue from cannabis is used to fund the very healthcare and social systems that protect all citizens. The Armstrong Directive makes it clear that \"public confidence\" is essential to a functioning legal market. If unregulated shops are allowed to flourish by bypassing taxes and oversight, it creates a \"legal vacuum\" where the state can no longer ensure product quality or keep profits out of the hands of organized crime. Therefore, it is asserted that the motive is not \"crushing a competitor,\" but fulfilling its legal obligation to maintain a single, safe, and accountable standard for controlled substances in Nova Scotia.", "feedback": "You've defended the Province's regulatory role. However, consider the evidence: the lab reports show no safety issues, and the NSLC sales data suggests economic motives. The Sparrow Test requires the Crown to demonstrate that its actions serve a compelling public purpose, not just protect government revenue."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "CROWN", "rationale": "The \"Frozen Rights\" approach is a necessary legal standard to ensure historical continuity, requiring that protected activities be integral to the distinctive culture at the time of the treaty. Rather than creating \"museum pieces,\" this standard maintains the rule of law by preventing a \"legal vacuum\" where unregulated modern industries can bypass the safety and tax frameworks that apply to all citizens. Until a right is specifically proven in court, it asserts its duty to fill the \"empty box\" of Section 35 with provincial regulations to protect the broader public.", "feedback": "You've identified the Crown's concern about expanding treaty rights. However, the 'Frozen Rights' approach has been consistently criticized by the Supreme Court. In R v Marshall, the Court explicitly rejected the idea that treaty rights are limited to the specific practices of 1752. The Living Tree Doctrine recognizes that treaty provisions must be interpreted in light of changing circumstances."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "CROWN", "rationale": "LeoÆs enterprise far exceeds the legal definition of a \"Moderate Livelihood\" as established in R. v. Marshall. Under that precedent, treaty rights are restricted to securing \"necessaries\" such as food and housing, specifically excluding the pursuit of \"unlimited wealth\" or large-scale industrial accumulation. Evidence from intelligence reports suggests the shopÆs scale, funding entire community infrastructures like schools and elder care transforms it into a high level commercial operation rather than a subsistence-based right. Furthermore, it is argued that because the right is not \"unlimited,\" the province retains the jurisdictional authority to regulate and tax any commercial activity that moves beyond the narrow scope of personal sustenance into the realm of a competitive market.", "feedback": "You've raised the question of whether Leo's business exceeds 'moderate livelihood.' However, the Supreme Court in R v Marshall specifically rejected limiting treaty rights to subsistence activities. What constitutes 'reasonable' must be understood in contemporary economic terms."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "CROWN", "rationale": "We maintain that the decision to prioritize law enforcement over consultation was a necessary response to an ongoing breach of the Cannabis Control Act. Under the Sparrow test, the Crown argues that \"Minimal Impairment\" does not require the government to exhaust every possible conversation while an unregulated market continues to pose systemic risks to public safety and the integrity of the regulated regime. We have asserted that its Fiduciary Duty is to the public at large, necessitating immediate action to uphold the Rule of Law and maintain \"public confidence in the regulated market\". From our  perspective, \"talking\" to a business operating outside of the provincial licensing framework would undermine the very regulations that ensure standardized quality control and age verification. Therefore, the raid was not an act of bad faith, but a proportional and necessary enforcement measure to address a \"compelling and substantial\" objective that simple consultation could not resolve.", "feedback": "You've defended the Province's enforcement actions, but consider the Sparrow Test carefully. The failure to consult before conducting a raid is a significant gap in the Crown's justification. Even if the Province had a valid objective, the Sparrow framework requires that less intrusive options be considered first. Negotiation or co-regulation would have been less impairing alternatives."}}}, "RAHAF (WOOW)": {"name": "RAHAF", "pin": "WOOW", "block": "D Block (Hargreaves)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "Cannabis can be interpreted to be included in article 4, which gives the Mi┤kmaq  the right to sell skins, feathers, fowl, fish and ¿ANY OTHER THING they have to sell¿. this phrase is broad and does not restrict the products that can be traded. It can be argued that treaty rights should evolve over time through the Living Tree Doctrine. in 1752, the Mi┤kmaq traded in the goods they had during that time. but modern economies also have upgraded goods that were not available when the treaty was written. the treaty would not benefit Mi┤kmaq people in today┤s world if it was restricted to only the products listed in 1752.  The defense also cites Wampum Belts, used by indigenous people to record treaties and as a symbol of nation-nation relationships based on mutual respect and partnership. The defense argues that cannabis should be treated as a modern trade good protected by the treaty right to earn a livelihood because the treaty promised the Mi┤kmaq the ¿free liberty\" to sell their goods and included the open ended phrase ¿any other thing they have to sell¿", "feedback": "Strong use of the Living Tree Doctrine. You correctly identify that treaty interpretation should evolve with the times. To strengthen your analysis, reference how the Supreme Court applied this in R v Marshall - the Court noted that treaty rights must be interpreted in a way that reconciles Indigenous and Crown interests over time. Consider also what the Crown might argue about the original intent of the treaty makers."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "The lab report found ¿no pesticides, no mould and the accurate THC levels¿. this indicates that the cannabis was tested and considered safe which tells us the raid was not about health instead it was about protecting the provinces tax monopoly. The defense says the raid itself was less about protecting public health and more about enforcing provincial rules on cannabis sales.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "CROWN", "rationale": "The Crown would argue that the Sacred Fire is an important spiritual symbol, but not a legal boundary recognized by Canadian law. In Mi'kmaw culture, the Sacred Fire is used in ceremonies, is a beacon for spirits and is treated with great respect, according to the Firekeeper teachings. But the evidence doesn't say a Sacred Fire creates legal jurisdiction or stops police from enforcing provincial laws. The crown would argue that while officers ought to respect cultural and religious practices, the authority of law comes from Canadian law and the courts, not from spiritual ceremonies. so the Sacred Fire might be a cultural boundary but it is not a legal boundary.", "feedback": "You've identified the tension between Indigenous spiritual practices and Canadian law enforcement. However, Canadian courts have increasingly recognized Indigenous legal traditions as relevant to legal proceedings. The Supreme Court has acknowledged that the Honour of the Crown requires sensitivity to Indigenous perspectives. While the Sacred Fire may not be a formal legal boundary under Canadian statute, it represents a legitimate expression of Mi'kmaw law that courts are increasingly willing to consider."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "The musket analogy is a powerful legal argument, the defense says, because it undercuts the Crown's claim that cannabis is too dangerous to be covered by treaty protections. there are records from the 1760s showing that the British were trading muskets, gunpowder, and lead with the Mi'kmaq. These things were much more dangerous than cannabis. they were weapons that could kill. If the Crown allowed and profited from the trade of weapons with the Mi'kmaq, then it cannot be inconsistent to say that cannabis can be restricted on the basis of safety concerns. The defense says safety is not the real concern, it's control over Mi'kmaw economic activity. Since Article 4 guarantees the Mi'kmaq \"free liberty\" to sell \"any other thing they have to sell,\" cannabis should be treated as a modern trade good protected by the treaty.", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "The defense says the Province is using fiduciary duty as a smokescreen to protect profits, not people. Exhibit E shows the Armstrong Directive told police to concentrate on shutting down illegal cannabis shops and stated that \"public confidence in the regulated market must be maintained.\" The language, the defense says, is about protecting the governmentÆs cannabis market, not public safety. Intelligence reports also indicate that NSLC sales were down near Millbrook because LeoÆs products were less expensive. This suggests that Leo's business was in competition with the Province's monopoly. Legal experts quoted in Source [26] also say that cannabis rights on First Nations land are still unresolved and that heavy-handed enforcement could violate treaty rights. The defense argues that if the government's primary concern were safety, it would focus on testing and regulation rather than shutting down Indigenous-owned businesses that support jobs and elder care.", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "The defense says that the \"Frozen Rights\" approach does treat Indigenous people like meseum pieces by limiting treaty rights to activities that existed in 1752. Exhibit F specifically notes that this approach treats treaty rights \"like a meseum exhibit instead of a living law.\" Leo's lawyers should argue that treaties were meant to estsblish a relationship that continues, not to trap the Mi;kmaq in the past.", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "Treaty rights are supposed to be living and adaptable, not frozen in time, so Leo's business does qualify as a \"moderate livelihood\" fishery. The Supreme Court points out that treaty rights must be interpreted in the context of modern- day life, and that they have a \"modern counterpart\" that reflects how people live today (paragraph 83). Leo's lawyers should argue that if his fishing provides only enough income to support himself and his family, then that is consistent with the idea of a moderate livelihood and limiting him to historical subsistence levels would ignore the ongoing nature of treaty rights.", "feedback": "Strong application of the R v Marshall precedent. The Supreme Court's definition of 'moderate livelihood' as encompassing necessities supplemented by amenities is deliberately flexible. Leo's argument that his business supports community members and funds services fits well within this framework. The Court in Marshall rejected limiting treaty rights to subsistence-level activities."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "The defense would argue that the Crown failed the justification test because it did not show that the limitation was in fact necessary or minimally impairing. The trial judge found the evidence \"casts some doubt as to whether the restriction was necessary as a conservation measure\" and suggested \"more appropriate measures could have been taken à that would not impose such a hardship\". This means that the Crown failed to meet its burden to show that the infringement was justified under Sparrow. Aboriginal priority in fishing must be respected after conservation needs.", "feedback": "Good analysis of the Sparrow Test application. The Province's failure to consult with the Mi'kmaq before the raid is a significant weakness in their position. To strengthen your analysis, explicitly walk through each element of the Sparrow Test and identify where the Crown's case falls short."}}}, "RYDER (RSDP)": {"name": "RYDER", "pin": "RSDP", "block": "D Block (Hargreaves)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "CROWN", "rationale": "Leo argues that the phrase \"any other thing\" in Article 4 is broad enough to include modern goods like cannabis because the treaty guarantees the Mi'kmaq the right to trade goods at the Truckhouse and does not limit that right to only the products that existed in 1752. He believes the treaty created a lasting right to trade, meaning new trade goods can be included as long as the right itself is respected.", "feedback": "You've articulated the Crown's position on treaty interpretation. Your concern about the scope of 'any other thing' is a legitimate legal argument. However, the Supreme Court has consistently ruled that treaties should be interpreted as the Indigenous signatories would have understood them, not through a narrow legalistic lens. The Mi'kmaq oral tradition and Wampum records suggest they understood this as a broad trade guarantee."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "The public safety argument appears weak because the lab findings showed that the cannabis products met safety standards. The tests did not find evidence of contamination or dangerous substances. This suggests that public safety was not the main issue identified by the lab evidence.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "CROWN", "rationale": "The Sacred Fire is considered a legal boundary because, in Mi'kmaw culture, it represents a protected spiritual space and a sign of Indigenous authority on the land. The evidence states that \"stepping over it is a profound desecration,\" showing that crossing the fire violates important Mi'kmaw laws and traditions. Because officers crossed this boundary during the raid, many community members viewed the event as more than law enforcementùit became a human rights and treaty rights issue.", "feedback": "You've identified the tension between Indigenous spiritual practices and Canadian law enforcement. However, Canadian courts have increasingly recognized Indigenous legal traditions as relevant to legal proceedings. The Supreme Court has acknowledged that the Honour of the Crown requires sensitivity to Indigenous perspectives. While the Sacred Fire may not be a formal legal boundary under Canadian statute, it represents a legitimate expression of Mi'kmaw law that courts are increasingly willing to consider."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "The musket argument is a valid legal analogy because treaty rights are generally understood to adapt to modern times rather than being limited to the exact tools and goods used when treaties were signed. Leo argues that if Mi'kmaq people once traded with muskets and other goods available at the time, modern products can be today's equivalent for exercising the same right to trade. This supports the defense's position that treaty rights are not \"empty\" and should evolve with changing economic conditions.", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "The defense argues that the Province's warnings about \"chaos\" focus on protecting government control and tax revenue rather than addressing specific evidence of harm. Leo could point to the community's successful operation of the business to fund elders and local programs as evidence that the trade benefits the community. Therefore, the defense would argue that the Province is using \"fiduciary duty\" to justify limiting treaty rights and economic competition rather than protecting public safety.", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "The defense argues that the \"Frozen Rights\" approach treats Mi'kmaq treaty rights like a \"museum exhibit\" by limiting them to activities that existed in 1752. Leo would argue that treaty rights are living rights that should adapt to modern forms of trade, rather than treating Indigenous peoples as if their cultures and economies cannot change over time.", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "The defense argues that Leo's business qualifies as a \"moderate livelihood\" because it generates income to support community members and fund services, similar to how the Marshall decision recognized treaty-based economic activity. The Crown argues that the Marshall ruling applied to fishing and does not automatically extend to cannabis sales, especially in a regulated market.", "feedback": "Strong application of the R v Marshall precedent. The Supreme Court's definition of 'moderate livelihood' as encompassing necessities supplemented by amenities is deliberately flexible. Leo's argument that his business supports community members and funds services fits well within this framework. The Court in Marshall rejected limiting treaty rights to subsistence-level activities."}}}, "REILEY (NOAH)": {"name": "Reiley", "pin": "NOAH", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "CROWN", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "CROWN", "rationale": "The argument for \"Any other thing\" may be somewhat valid, but the argument for cannabis being a skin is not really valid.  Also, it's worth considering that cannabis wouldn't have been around when treaties were made, so it shouldn't be included in the selling.", "feedback": "You've articulated the Crown's position on treaty interpretation. Your concern about the scope of 'any other thing' is a legitimate legal argument. However, the Supreme Court has consistently ruled that treaties should be interpreted as the Indigenous signatories would have understood them, not through a narrow legalistic lens. The Mi'kmaq oral tradition and Wampum records suggest they understood this as a broad trade guarantee."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "CROWN", "rationale": "According to the lab, the weed is safe, however, according to youth smoking rates, the sale of it is what is unsafe, not the weed itself.", "feedback": "You've raised valid concerns about regulation and public safety. However, consider this tension: if the treaty protects the right to trade, and the product is demonstrably safe, does the Province's interest in regulation outweigh a constitutionally protected treaty right? The Sparrow Test requires the Crown to show that their infringement is justified - not just that regulation is preferable."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "Because stepping over it would be disrespecting culture.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "CROWN", "rationale": "It's not a valid legal analogy. Trading guns on indigenous land still falls under federal law, and weed shops should follow the same.", "feedback": "You've identified a distinction between historical musket trade and modern cannabis regulation. However, consider the counter-argument: the Crown accepted musket trade in 1760 despite genuine safety concerns, which suggests that treaty trade was never limited by safety standards. The musket analogy demonstrates that the Crown has historically accepted Indigenous trade in goods it considered dangerous."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "CROWN", "rationale": "It is being used to protect people. Unregulated weed shops can lead to people getting weed who shouldn't, stats back this up, with Nova Scotia having a high youth smoking rates.", "feedback": "You've defended the Province's regulatory role. However, consider the evidence: the lab reports show no safety issues, and the NSLC sales data suggests economic motives. The Sparrow Test requires the Crown to demonstrate that its actions serve a compelling public purpose, not just protect government revenue."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "CROWN", "rationale": "While arguing that rights should be \"unfrozen\" is fair, selling weed without proper regulations can be unsafe, and no culture is limited by limiting weed sales, as it wasn't around back then.", "feedback": "You've identified the Crown's concern about expanding treaty rights. However, the 'Frozen Rights' approach has been consistently criticized by the Supreme Court. In R v Marshall, the Court explicitly rejected the idea that treaty rights are limited to the specific practices of 1752. The Living Tree Doctrine recognizes that treaty provisions must be interpreted in light of changing circumstances."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "It does count as a \"moderate livelihood\", as he is running the business to survive in and have a decent life, not to be filthy rich.", "feedback": "Strong application of the R v Marshall precedent. The Supreme Court's definition of 'moderate livelihood' as encompassing necessities supplemented by amenities is deliberately flexible. Leo's argument that his business supports community members and funds services fits well within this framework. The Court in Marshall rejected limiting treaty rights to subsistence-level activities."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "CROWN", "rationale": "While they could've talked, there is reason for the raids and it can be seen in statistics. We see that Nova Scotia has the highest rate of youth smoking weed, being a whopping 30%, and because of that, the less weed stores the better, and keeping a tight government regulation on weed is going to be the safest decision for Canadians,", "feedback": "You've defended the Province's enforcement actions, but consider the Sparrow Test carefully. The failure to consult before conducting a raid is a significant gap in the Crown's justification. Even if the Province had a valid objective, the Sparrow framework requires that less intrusive options be considered first. Negotiation or co-regulation would have been less impairing alternatives."}}}, "RIVER THOMAS (DEWO)": {"name": "River thomas", "pin": "DEWO", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "the evidence and arguments for the indigenous people sustaining their right to the ability to sell anything they please as stated in treaties is most definitely the winning argument with much more favour leaning towards keeping the regulations of treaties therefore allowing the continued sale of cannabis", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "from the evidence provided and previous information from exhibit A we can see that it should be considered a treaty right to sell marijuana, the most important evidence in this section is most definitely the fact that the raids happened to get dangerous / spiked weed off of the local market according to the crown, but when lab results came back the weed was perfectly normal and minimally harmful by average standards for drug safety", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "the protests done (form this evidence at least) although may be obstructive they are not violent nor requiring of any sort of resistance from the government, the people feel that the shop is important to their community and that the raids were unjust which caused the protesting from the local indigenous population", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "more protestation from the defence is helping further by bringing up more comparisons to more treaty acts to further strengthen the argument that the sale of cannabis is a treaty right, also using indigenous law traditions to help strengthen Leo's arguments for his store being a right originating from treaties", "feedback": "Good engagement with the historical analogy argument. The key insight is that the Crown cannot selectively apply safety standards - if dangerous goods were acceptable in 1760, the Crown needs a principled reason why cannabis is different today. Consider how this connects to the Living Tree Doctrine: just as muskets were the dangerous goods of their era, cannabis is a regulated good of ours."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "from all the evidence provided we can tell that although they may say that they are acting with the motive of public health safety and is instead probably deeper that possibly even a malicious want to shut down community stores so that governmentally run and owned stores like NSLC can retain more profit", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "I think the most morally positive action to take would be to allow for the laws to change so that their contents still apply not in the exact way they did but in a way that could rightfully and justly apply to modern standards", "feedback": "Good understanding of the tension between frozen and evolving interpretations. The key insight is that freezing rights at 1752 creates an absurd outcome: Indigenous peoples would be denied the ability to participate in the modern economy. The Supreme Court has consistently rejected this approach in cases like R v Marshall."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "I think the ruling that the stores should only be allowed to stay active to provide for  a \"moderate livelihood\" mosty properly defended by a good counter from Leo with his defense that the community likes the shop and that its extra income can help to build a better economy for his reservation and community.", "feedback": "Strong application of the R v Marshall precedent. The Supreme Court's definition of 'moderate livelihood' as encompassing necessities supplemented by amenities is deliberately flexible. Leo's argument that his business supports community members and funds services fits well within this framework. The Court in Marshall rejected limiting treaty rights to subsistence-level activities."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "seeing as due legal process was clearly not followed with the owners and chief not being informed of the raid nor any attempt to properly develop safety rules with the input of the community the police unjustly raided the shops instead, and after many of their justifications fell through its very clear that this case has a deep root in discriminatory injustice", "feedback": "Good analysis of the Sparrow Test application. The Province's failure to consult with the Mi'kmaq before the raid is a significant weakness in their position. To strengthen your analysis, explicitly walk through each element of the Sparrow Test and identify where the Crown's case falls short."}}}, "RUBY (NECK)": {"name": "Ruby", "pin": "NECK", "block": "A Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "Article 4 of the peace and friendship treaty of 1752 says any other thing which is broad and not limited to just old items like fish or skins. Using the living tree doctrine.", "feedback": "Strong use of the Living Tree Doctrine. You correctly identify that treaty interpretation should evolve with the times. To strengthen your analysis, reference how the Supreme Court applied this in R v Marshall - the Court noted that treaty rights must be interpreted in a way that reconciles Indigenous and Crown interests over time. Consider also what the Crown might argue about the original intent of the treaty makers."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "From the defense view the lab report exhibit c shows no pesticides, no mould, and correct THC levels, so there is no clear health risk. Because of this the crownÆs public safety reason for the raid is less.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "It represents Indigenous law and sacred space, so crossing it can be seen as violating cultural rights and the legal-human rights conflict.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "If muskets were allowed in treaty trade, then the treaty likely meant broad freedom to trade different kinds of goods, not just limited items. It seems not right for the crown to allow dangerous goods in the past but restrict modern legal ones like cannabis now.", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the
