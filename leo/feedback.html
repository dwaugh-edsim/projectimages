hat while a broad definition empowers First Nations, a narrow definition \"keeps them dependent on government funding.\"\n\nReasoning-  This evidence proves that the strict limits the Crown wants to enforce are not about fairness, but about maintaining control. Because the \"Moderate Livelihood\" standard is meant to protect economic survival, it must be interpreted broadly to support community independence, making Leo's self-funded business fully legitimate.", "feedback": "Strong application of the R v Marshall precedent. The Supreme Court's definition of 'moderate livelihood' as encompassing necessities supplemented by amenities is deliberately flexible. Leo's argument that his business supports community members and funds services fits well within this framework. The Court in Marshall rejected limiting treaty rights to subsistence-level activities."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "The Crown completely failed to meet the legal requirements for justification because they prioritized government profits over constitutional rights and used immediate force instead of communication.\n\nEvidence- The intelligence report explicitly states that the Province \"never called the Chief before the raid\" and instead \"just sent tactical units.\" It also reveals that the CrownÆs actual goal was \"protecting the NSLC tax monopoly rather than safety.\"\n\nReasoning- Under the legal Priority rule, a constitutional treaty right must always come before government profit. Because the Crown chose to protect their tax revenues and use aggressive force instead of co-developing safety rules with the community, their justification completely falls apart under the Sparrow Test.", "feedback": "Good analysis of the Sparrow Test application. The Province's failure to consult with the Mi'kmaq before the raid is a significant weakness in their position. To strengthen your analysis, explicitly walk through each element of the Sparrow Test and identify where the Crown's case falls short."}}}, "CHRISTOPHER (CHIP)": {"name": "CHRISTOPHER", "pin": "CHIP", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "Yes, because cannabis is a natural resource, similar to things like animal skins, feathers, and other traditional items. It people have the right to sell and use those resources, then they should also have the right to sell cannabis too.", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "If the cannabis was tested and shown to be safe, then there is no real public safety risk, Without that risk, they did not have a reason to take it from them. So the raid would have been unlawful.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "CROWN", "rationale": "They are using their spiritual boundaries to try and defend against the rules and the law, but that cannot be treated as a proven legal fact on its own. While those beliefs may be important to their community, they would still need good evidence and legal reasoning to support their position.", "feedback": "You've identified the tension between Indigenous spiritual practices and Canadian law enforcement. However, Canadian courts have increasingly recognized Indigenous legal traditions as relevant to legal proceedings. The Supreme Court has acknowledged that the Honour of the Crown requires sensitivity to Indigenous perspectives. While the Sacred Fire may not be a formal legal boundary under Canadian statute, it represents a legitimate expression of Mi'kmaw law that courts are increasingly willing to consider."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "CROWN", "rationale": "They could have used the muskets for hunting or self defence and due to the fact of the lack of evidence it would have made it so the muskets are seen as a weapon for hunting and protecting. Also they can't use religious reasoning as a form of defence.", "feedback": "You've identified a distinction between historical musket trade and modern cannabis regulation. However, consider the counter-argument: the Crown accepted musket trade in 1760 despite genuine safety concerns, which suggests that treaty trade was never limited by safety standards. The musket analogy demonstrates that the Crown has historically accepted Indigenous trade in goods it considered dangerous."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "As long as the shops stay on the reserves it is up to the Mi'kmaw what happens to their shops but if their shops start to spread that will start to become a problem because this will increase the amount of unregulated weed coming to Nova Scotia which can cause a big health risk.", "feedback": "Good analysis of the Crown's motivations. The evidence of economic protectionism is significant because it undermines the Crown's claimed public safety objective. Under the Sparrow framework, the Crown must demonstrate a compelling and substantial objective - protecting government revenue from competition doesn't qualify."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "In reality,, culture naturally changes over time. So saying the rights are frozen ignores modern developments and can limit Indigenous peoples from practicing rights in today's world.", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "As if only it's a small scale and supports a reasonable living, not large commercial business. Meaning people can earn a reasonable living but not make a operation with unlimited profit.", "feedback": "Good engagement with the moderate livelihood question. The R v Marshall decision is central - the Court recognized that treaty rights include the ability to earn a moderate livelihood, not just bare subsistence. To strengthen your analysis, consider how the scale of the operation matters and what 'moderate' means in the context of the modern economy."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "No, because if they didn't try to negotiate first then they would have likely failed minimal impairment because they used stronger actions than necessary, and they could of talked first before doing anything else.", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "CONNOR (ABCD)": {"name": "CONNOR", "pin": "ABCD", "block": "A Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "Article 4 says any other thing so itÆs not just about fish or skins. With the living tree idea it can use modern things too.", "feedback": "Strong use of the Living Tree Doctrine. You correctly identify that treaty interpretation should evolve with the times. To strengthen your analysis, reference how the Supreme Court applied this in R v Marshall - the Court noted that treaty rights must be interpreted in a way that reconciles Indigenous and Crown interests over time. Consider also what the Crown might argue about the original intent of the treaty makers."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "The lab report shows no pesticides, no mould, and good THC levels. So there is no health risk. Because of this the crowns reason for the raid was on public safety is weaker.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "It represents Indigenous law and space. So crossing it can be seen as breaking rights and showing a fight between laws.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "If muskets were allowed in trade then the treaty meant freedom to trade many goods. It is unfair for the crown to allow bad items in the past but not allow modern legal ones like cannabis now.", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "The point about falling NSLC sales say the shutdown may be about protecting government cannabis sales and not public safety.", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "Yes it treats Indigenous rights like they are stuck in the past. Not allowing them to grow and apply to modern life.", "feedback": "Good understanding of the tension between frozen and evolving interpretations. The key insight is that freezing rights at 1752 creates an absurd outcome: Indigenous peoples would be denied the ability to participate in the modern economy. The Supreme Court has consistently rejected this approach in cases like R v Marshall."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "Leo can say a moderate livelihood. That means enough money for basic needs today. His cannabis shop is just a modern way to earn that", "feedback": "Strong application of the R v Marshall precedent. The Supreme Court's definition of 'moderate livelihood' as encompassing necessities supplemented by amenities is deliberately flexible. Leo's argument that his business supports community members and funds services fits well within this framework. The Court in Marshall rejected limiting treaty rights to subsistence-level activities."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "The defence says the crown should have talked first instead of doing a raid. If they could have solved issues another way the raid wasnÆt the least harmful choice.", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "COVA (KIKI)": {"name": "COVA", "pin": "KIKI", "block": "A Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "they don't seem like they actually got the license legitemately or care what the mikmaq think", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "They had not many reasons other than tax to raid", "feedback": "You've identified key issues with the Crown's public safety argument. To strengthen your position, connect this more explicitly to the Sparrow Test - the Crown must show both a valid objective AND that their actions minimally impair the treaty right. If the product is safe, it's hard to argue that a police raid was the least intrusive option."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "it seems the raid did a lot against the mikmaq", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "Leo is right and the guns are used for safety", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "CROWN", "rationale": "the worry about more shops then necassary may draw in a lot more attention than Canada would want", "feedback": "You've defended the Province's regulatory role. However, consider the evidence: the lab reports show no safety issues, and the NSLC sales data suggests economic motives. The Sparrow Test requires the Crown to demonstrate that its actions serve a compelling public purpose, not just protect government revenue."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "it treats idigenous peoples rights like they can be taken away at any moment", "feedback": "Good understanding of the tension between frozen and evolving interpretations. The key insight is that freezing rights at 1752 creates an absurd outcome: Indigenous peoples would be denied the ability to participate in the modern economy. The Supreme Court has consistently rejected this approach in cases like R v Marshall."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "its hard to tell with how vague the term is, but with how legitamate his business may be, I'd say it counts", "feedback": "Good engagement with the moderate livelihood question. The R v Marshall decision is central - the Court recognized that treaty rights include the ability to earn a moderate livelihood, not just bare subsistence. To strengthen your analysis, consider how the scale of the operation matters and what 'moderate' means in the context of the modern economy."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "No, their reasons were completely unjustified and needed a better reason or not do it, because this is really harmful", "feedback": "Good analysis of the Sparrow Test application. The Province's failure to consult with the Mi'kmaq before the raid is a significant weakness in their position. To strengthen your analysis, explicitly walk through each element of the Sparrow Test and identify where the Crown's case falls short."}}}, "CAITLYN (ABCD)": {"name": "Caitlyn", "pin": "ABCD", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "CROWN", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "CROWN", "rationale": "I picked the crown because they were trying to keep peace. They ended fighting, gave protection, and provided food and gifts. They also let the MiÆkmaq continue hunting and fishing. They made rules to keep things organized, like using their courts.", "feedback": "You've articulated the Crown's position on treaty interpretation. Your concern about the scope of 'any other thing' is a legitimate legal argument. However, the Supreme Court has consistently ruled that treaties should be interpreted as the Indigenous signatories would have understood them, not through a narrow legalistic lens. The Mi'kmaq oral tradition and Wampum records suggest they understood this as a broad trade guarantee."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "CROWN", "rationale": "Even though the lab report shows the product was safe [10], the Province can still argue the raid was justified because the business was unregulated and outside the legal system set by the Cannabis Act, which is meant to protect public safety overall.", "feedback": "You've raised valid concerns about regulation and public safety. However, consider this tension: if the treaty protects the right to trade, and the product is demonstrably safe, does the Province's interest in regulation outweigh a constitutionally protected treaty right? The Sparrow Test requires the Crown to show that their infringement is justified - not just that regulation is preferable."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "CROWN", "rationale": "The Sacred Fire is a legal boundary in MiÆkmaq culture because it shows the area is protected under their own laws, and crossing it is seen as breaking those rules. However, I choose the Crown because they would argue that, even though the Sacred Fire is important, provincial laws still apply and must be enforced", "feedback": "You've identified the tension between Indigenous spiritual practices and Canadian law enforcement. However, Canadian courts have increasingly recognized Indigenous legal traditions as relevant to legal proceedings. The Supreme Court has acknowledged that the Honour of the Crown requires sensitivity to Indigenous perspectives. While the Sacred Fire may not be a formal legal boundary under Canadian statute, it represents a legitimate expression of Mi'kmaw law that courts are increasingly willing to consider."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "CROWN", "rationale": "The musket argument is historically interesting, but not a strong legal analogy. Treaty rights are interpreted in their historical context, not as a broad right to trade any modern product .  While muskets were traded then, that does not create a protected right to sell cannabis today, especially since it is regulated under laws like the Cannabis Act.", "feedback": "You've identified a distinction between historical musket trade and modern cannabis regulation. However, consider the counter-argument: the Crown accepted musket trade in 1760 despite genuine safety concerns, which suggests that treaty trade was never limited by safety standards. The musket analogy demonstrates that the Crown has historically accepted Indigenous trade in goods it considered dangerous."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "CROWN", "rationale": "The Crown firmly maintains that cannabis must remain strictly regulated to protect public safety. Allowing unauthorized sales risks unsafe products and loss of control over age restrictions.", "feedback": "You've defended the Province's regulatory role. However, consider the evidence: the lab reports show no safety issues, and the NSLC sales data suggests economic motives. The Sparrow Test requires the Crown to demonstrate that its actions serve a compelling public purpose, not just protect government revenue."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "CROWN", "rationale": "Yes, the ôFrozen Rightsö argument can make it seem like Indigenous peoples are treated like ômuseum piecesö because it only looks at the past. I support the CrownÆs side. The Crown believes rights should stay based on what was agreed to in history. This keeps the law clear, fair, and consistent", "feedback": "You've identified the Crown's concern about expanding treaty rights. However, the 'Frozen Rights' approach has been consistently criticized by the Supreme Court. In R v Marshall, the Court explicitly rejected the idea that treaty rights are limited to the specific practices of 1752. The Living Tree Doctrine recognizes that treaty provisions must be interpreted in light of changing circumstances."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "CROWN", "rationale": "IÆm on the CrownÆs side because LeoÆs business is too large and profit-driven to count as a ômoderate livelihood.ö The ruling in R v Marshall limits that right to basic needs, not full-scale commercial operations.", "feedback": "You've raised the question of whether Leo's business exceeds 'moderate livelihood.' However, the Supreme Court in R v Marshall specifically rejected limiting treaty rights to subsistence activities. What constitutes 'reasonable' must be understood in contemporary economic terms."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "CROWN", "rationale": "Yes, the Crown can argue they met the justification part of the Sparrow Test. They would say they were protecting public safety, which is a valid reason. They could also argue that laws were already clear, so consultation wasnÆt needed. The Crown would say they were balancing Indigenous rights with public safety and that the raid was necessary to enforce the law.", "feedback": "You've defended the Province's enforcement actions, but consider the Sparrow Test carefully. The failure to consult before conducting a raid is a significant gap in the Crown's justification. Even if the Province had a valid objective, the Sparrow framework requires that less intrusive options be considered first. Negotiation or co-regulation would have been less impairing alternatives."}}}, "CALEB (BALL)": {"name": "Caleb", "pin": "BALL", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "I think this because they are giving the rights to sell the skins, feathers, fowl, fish and any other thing they have to sell. Because of that I think that's its no question that they should be able to sell cannabis.", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "Again I think this in a no brainer that the Indigenous people are upset because the quite literally have the right to sell anything they have. The product is also safe to consume under law.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "The Sacred Fire is a legal boundary because Indigenous peoples have protected rights to use it for ceremonies and spiritual things.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "CROWN", "rationale": "The Musket argument says that if Europeans accepted trade items like muskets from Indigenous peoples then Indigenous peoples also had the right to accept and use European ideas or tools in their own way.  It is valid but I think that it is different than muskets.", "feedback": "You've identified a distinction between historical musket trade and modern cannabis regulation. However, consider the counter-argument: the Crown accepted musket trade in 1760 despite genuine safety concerns, which suggests that treaty trade was never limited by safety standards. The musket analogy demonstrates that the Crown has historically accepted Indigenous trade in goods it considered dangerous."}}}, "CLARA JONES (CLAR)": {"name": "Clara Jones", "pin": "CLAR", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "I think Leo is right because the 1752 treaty was meant to protect MiÆkmaq trading rights, not limit them. The ôLiving Treeö idea means those rights can change and grow over time. Wampum Belts also show the MiÆkmaq and British were equals, so the MiÆkmaq should be able to trade on their own land without needing permission.", "feedback": "Strong use of the Living Tree Doctrine. You correctly identify that treaty interpretation should evolve with the times. To strengthen your analysis, reference how the Supreme Court applied this in R v Marshall - the Court noted that treaty rights must be interpreted in a way that reconciles Indigenous and Crown interests over time. Consider also what the Crown might argue about the original intent of the treaty makers."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "I think Leo is right because the lab tests showed the product was safe, so there wasnÆt a real public safety problem. He was also following a Band Council Resolution, which means his community allowed it. The real issue seems to be who has control over the business, not safety.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "CROWN", "rationale": "I think the Crown is more right legally because provincial law still applies and police can enforce it. But I also think the defence makes a strong point because the Sacred Fire is really important in MiÆkmaq culture and crossing it is seen as disrespectful and harmful. So overall, it feels like a conflict between the law and Indigenous culture/rights.", "feedback": "You've identified the tension between Indigenous spiritual practices and Canadian law enforcement. However, Canadian courts have increasingly recognized Indigenous legal traditions as relevant to legal proceedings. The Supreme Court has acknowledged that the Honour of the Crown requires sensitivity to Indigenous perspectives. While the Sacred Fire may not be a formal legal boundary under Canadian statute, it represents a legitimate expression of Mi'kmaw law that courts are increasingly willing to consider."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "CROWN", "rationale": "I think the Crown is more right legally because old agreements about trading weapons donÆt automatically apply to modern things like cannabis. The ôMusketö argument is more of a comparison, not solid legal proof.\n\nBut the defence still makes a good point that the treaty was meant to support trade and relationships, so those rights should still matter today.", "feedback": "You've identified a distinction between historical musket trade and modern cannabis regulation. However, consider the counter-argument: the Crown accepted musket trade in 1760 despite genuine safety concerns, which suggests that treaty trade was never limited by safety standards. The musket analogy demonstrates that the Crown has historically accepted Indigenous trade in goods it considered dangerous."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "The Province says Leo winning could cause chaos and unsafe shops, so they need to protect the public. But a memo shows they focus on shutting down shops to protect the system, and NSLC sales dropped because LeoÆs prices are cheaper without tax. I think it looks more like itÆs about money than safety, so LeoÆs side seems stronger.", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "CROWN", "rationale": "I think the Crown is more right legally because the ôFrozen Rightsö idea says treaty rights should only include what was actually agreed to in 1752, and cannabis wasnÆt part of it in cases like R. v. Googoo. But the defence still makes a strong point because Section 35 rights are supposed to be living and change over time, not stay stuck in the past.", "feedback": "You've identified the Crown's concern about expanding treaty rights. However, the 'Frozen Rights' approach has been consistently criticized by the Supreme Court. In R v Marshall, the Court explicitly rejected the idea that treaty rights are limited to the specific practices of 1752. The Living Tree Doctrine recognizes that treaty provisions must be interpreted in light of changing circumstances."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "I think Leo is more right because ômoderate livelihoodö isnÆt clearly defined, so it can include a modern economy that supports the community. The Crown has a stricter view, but LeoÆs fits better with todayÆs needs.", "feedback": "Strong application of the R v Marshall precedent. The Supreme Court's definition of 'moderate livelihood' as encompassing necessities supplemented by amenities is deliberately flexible. Leo's argument that his business supports community members and funds services fits well within this framework. The Court in Marshall rejected limiting treaty rights to subsistence-level activities."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "I think Leo is more right here because the Province didnÆt consult the Chief before the raid, which they were supposed to do under Section 35 and the Honour of the Crown. Since there didnÆt seem to be a real safety issue, LeoÆs argument is stronger in this step.", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "DAVE (ABBA)": {"name": "DAVE", "pin": "ABBA", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "CROWN", "rationale": "sfhgmngc,cdghmgdhmhmdghm", "feedback": "You've articulated the Crown's position on treaty interpretation. Your concern about the scope of 'any  the times. To strengthen your analysis, reference how the Supreme Court applied this in R v Marshall - the Court noted that treaty rights must be interpreted in a way that reconciles Indigenous and Crown interests over time. Consider also what the Crown might argue about the original intent of the treaty makers."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "The government's \"Public Safety\" argument is not valid as an independent lab report finds \"Pesticides (None), Mould (None), THC (Accurate)\" . The government is defying the Band's \"right to manage its own economy\" by disallowing them from selling a product with cultural significance.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "The Sacred Fire is a legal boundary because it is a spiritual and cultural boundary and by ignoring it the government is saying \"We do not respect your right to your culture\" . The government claims to be doing this for \"Public Safety\" but ignores the problem of violence toward Indigenous women.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "The \"Frozen Rights\" argument treats people as \"museum pieces\" by treating \"Treaty rights like a museum exhibit [20] rather than a living law\". It treats people like they are \"museum pieces\" by assuming that they cannot or should not change since the treaty rights were decided. If the treaty rights only apply to what they were doing when the rights were decided then they can no longer change and grow as a culture without defying the treaty rights.", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "Leo's business qualifies as a \"Moderate Livelihood\" because the cost of living has gone up considerably and it is not just Leo's livelihood. It is the livelihood of the community and \"to fix a community's schools, you need a modern economy, not just enough to buy bread\".", "feedback": "Strong application of the R v Marshall precedent. The Supreme Court's definition of 'moderate livelihood' as encompassing necessities supplemented by amenities is deliberately flexible. Leo's argument that his business supports community members and funds services fits well within this framework. The Court in Marshall rejected limiting treaty rights to subsistence-level activities."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "The Crown did not use \"Minimal Impairment\" as they needlessly defied multiple treaty rights. There was no dialog with the Chief before the raid which goes against \"Step 3 of the Sparrow Test: Was there consultation?\". ¿ Under the Honour of the Crown, the government must speak to its partners first ¿ and they did not speak with the Chief, treating them like they are not in fact partners.", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "HALA (HAED)": {"name": "HALA", "pin": "HAED", "block": "D Block (Hargreaves)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "I side with the Defense because Article 4 says the MiÆkmaq could trade ôany other thingö they had to sell at the truckhouse. This shows the treaty was not limited to only one product. Since Leo is arguing that this created a permanent right to trade, cannabis could be seen as a modern item included under ôany other thing.ö", "feedback": "Excellent work connecting the Living Tree Doctrine to the Truckhouse provision. You've identified the core tension - whether 'any other thing' can evolve to include modern goods. To deepen your thinking: consider how the Crown might use the ejusdem generis rule to argue that 'any other thing' should only include items similar to skins, feathers, and fish. Anticipating this counter-argument would make your position even stronger."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "I support the Defense because the laboratory report found no pesticides, no mould, and accurate THC levels in the products. This weakens the ProvinceÆs claim that the raid was necessary for public safety. If the products were not shown to be unsafe, the government has less justification for shutting down the business", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "I support the Defense because many community members gathered around the Sacred Fire to oppose the raid. The Sacred Fire is an important spiritual and cultural symbol. The standoff showed that the issue was not only about cannabis but also about Indigenous rights, self-government, and respect for MiÆkmaq traditions.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "I support the Defense because treaty rights should be interpreted as living rights that adapt to modern conditions. Leo argues that the treaty protected trade, not just specific products. If the right existed in the past, it should continue to apply to modern forms of commerce today.", "feedback": "Good engagement with the historical analogy argument. The key insight is that the Crown cannot selectively apply safety standards - if dangerous goods were acceptable in 1760, the Crown needs a principled reason why cannabis is different today. Consider how this connects to the Living Tree Doctrine: just as muskets were the dangerous goods of their era, cannabis is a regulated good of ours."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "I support the Defense because the evidence suggests that the Province was concerned about protecting the regulated cannabis market and tax revenue. While governments have an interest in regulation, economic concerns alone should not override treaty rights. Indigenous rights must be seriously considered before government action is taken.", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "I support the Defense because the Frozen Rights approach assumes treaty rights are limited to activities that existed in 1752. This interpretation is too narrow. Indigenous communities live in the modern world and need access to modern economic opportunities. Treaty rights should evolve as society changes.", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "The Marshall decision recognized that Mi'kmaq treaty rights include earning a moderate livelihood. Leo argues that running a cannabis business is a modern way of earning income and supporting his community. Since the Supreme Court accepted that treaty rights can support economic activity, Leo's argument is strengthened by the Marshall case.", "feedback": "Strong application of the R v Marshall precedent. The Supreme Court's definition of 'moderate livelihood' as encompassing necessities supplemented by amenities is deliberately flexible. Leo's argument that his business supports community members and funds services fits well within this framework. The Court in Marshall rejected limiting treaty rights to subsistence-level activities."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "Under the Sparrow Test, the Crown must prove that any limit on treaty rights is justified. The evidence suggests that the Province did not fully respect Indigenous concerns before taking action against Leo's business. Because treaty rights receive constitutional protection, the burden is on the Crown to justify its actions.", "feedback": "Good analysis of the Sparrow Test application. The Province's failure to consult with the Mi'kmaq before the raid is a significant weakness in their position. To strengthen your analysis, explicitly walk through each element of the Sparrow Test and identify where the Crown's case falls short."}}}, "HARJAS (COLD)": {"name": "HARJAS", "pin": "COLD", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "CROWN", "rationale": "I side with the crown because the treaty should be followed and understood the way it was meant in 1752. During that time people traded \"Fish, Fowl, Feathers, skin etc\" listed in article 4, were common items to trade. Which displays When \"any other thing\" was stated in the treaty they may have been referring to common goods similar to what they used, not modern products like cannabis. Additionally, article 8 states that any arguments and disputes were to be handled in a british court meaning trades would have to be done following their law and rules and regulation. Hence leading the crown to argue that people would need a license to sell cannabis, as it is a controlled substance.", "feedback": "You've articulated the Crown's position on treaty interpretation. Your concern about the scope of 'any other thing' is a legitimate legal argument. However, the Supreme Court has consistently ruled that treaties should be interpreted as the Indigenous signatories would have understood them, not through a narrow legalistic lens. The Mi'kmaq oral tradition and Wampum records suggest they understood this as a broad trade guarantee."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "I side with the defense as the argument about \"public safety\" created by the crown is weak, as in the lab there was no evidence found of mould, pesticides and the THC levels were accurate so that means the cannabis products were safe for consumers.This may indicate that the raid may not have been only for the purpose of public safety. Leo had the support of the band council resolution, which said the community could regulate on its own land. UNDRIP article 3 states that indegenous people have the right to self govern themselves. Which then the defence could argue that the raid was disrespectful to the indegenious authourity and community and had more of a focus towards on provincial control rather than public safety", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "I side with the defense because this situation is a lot more than just cannabis laws. It involves treaty rights and relationships , indegenious self government, and cultural rights overall. To begin with, the Sacred fire is a spiritual boundary and crossing it during a raid was seen as a serious act of disrespect[12]. Which turned the situation from a simple canabis raid to a larger indigenous rights issue. Not only that but a key portion was the about the red dresses as they represented the missing and murdered indigenenous women and it displays the neglect of police to investigate and help those women properly but they are super quick to raid indigenous businesses[13].", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}}}, "HARRISON (YNPH)": {"name": "HARRISON", "pin": "YNPH", "block": "A Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "The document clearly states the Sacred Fire is a ôspiritual boundaryö and that crossing it is a ôprofound desecration.ö This shows that it is more than symbolic and represents an important boundary in MiÆkmaw law. It also says it ôturned a legal raid into a human rights crisis,ö which supports the idea that this boundary should be respected.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "The evidence shows the Province is concerned with the market, not just safety. The line ôPublic confidence in the regulated market must be maintainedö and the fact that LeoÆs product is cheaper because ôhe doesn't pay provincial taxö suggest the focus is on protecting the NSLC. The document also states the Province is ôusing police force to crush a business competitor,ö which supports that the issue is sorounding profits not ppeoples rotection.", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "The crown states the ôæFrozen RightsÆ approach, treats Treaty rights like a museum exhibit,ö meaning it keeps rights focused on the past. This is a problem because it only looks at what the MiÆkmaq did in 1752 and ignores how the people have changed.Protesters protesting that ôthe law must evolve,ö helps to shed light on the idea that rights should grow over time to prevent killing any new indigenous businesses.", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "The definition of ôænecessariesÆ like food, clothing, and housing but not unlimited wealthö is described as vague in the document, since ôæModerateÆ was left vague by the government.ö Because of this uncertainty, Treaties should be interpreted in a way that allows communities to build a sustainable economy, not just survive.", "feedback": "Good engagement with the moderate livelihood question. The R v Marshall decision is central - the Court recognized that treaty rights include the ability to earn a moderate livelihood, not just bare subsistence. To strengthen your analysis, consider how the scale of the operation matters and what 'moderate' means in the context of the modern economy."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "The evidence shows the Crown failed the justification requirements. The document states ôthe Province never called the Chief before the raid,ö meaning there was no consultation, and ôthey just sent tactical units,ö which fails the requirement for minimal impairment. It also says the Crown focused on ôprotecting the NSLC tax monopoly rather than safety,ö showing they did not properly prioritize Indigenous rights over government interests.", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "HARRISON SLADE (YNPH)": {"name": "Harrison slade", "pin": "YNPH", "block": "A Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "Article 4 states the MiÆkmaq can sell ôskins, feathers, fowl, fish or ANY OTHER THING they have to sell.ö This wording is very broad and not limited to specific goods. The defense also argues that rights should not be ôfrozenö in 1752, meaning the right to trade should still apply today. the phrase ôANY OTHER THINGö  and that the rights aren't frozen supports the idea that modern goods like cannabis can be included.", "feedback": "Strong use of the Living Tree Doctrine. You correctly identify that treaty interpretation should evolve with the times. To strengthen your analysis, reference how the Supreme Court applied this in R v Marshall - the Court noted that treaty rights must be interpreted in a way that reconciles Indigenous and Crown interests over time. Consider also what the Crown might argue about the original intent of the treaty makers."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "The evidence shows ôPesticides (None), Mould (None), THC (Accurate)ö, which indicates the product was not harmful. Since the CrownÆs argument is based on ôPublic Safety,ö but the findings show no health hazards, the justification for the seizure is not supported by the lab results and public safety.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}}}, "ISABELLE (BLEH)": {"name": "ISABELLE", "pin": "BLEH", "block": "D Block (Hargreaves)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "According to article 4, \"ANY OTHER THING\" does indeed refer to cannabis, because when you look back to the legal analysis, it says: \"...then 'Skins' must include 'Cannabis.'...\"", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "No, the \"Public Safety\" argument was not valid. The lab report proves that there was nothing ammiss with the cannibis.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "The 'Sacred Fire' is a legal boundary because it is a spiritual boundary that represents a phsical line of defense.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}}}, "ISABELLA BECK (BELL)": {"name": "Isabella Beck", "pin": "BELL", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "CROWN", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "CROWN", "rationale": "From the CrownÆs point of view, ôany other thingö does not include cannabis. They would argue the treaty should be understood based on what people meant in 1752, so it refers to natural goods like animals and fish, not modern substances. Since cannabis is now regulated by Canadian law, it would not fall under Article 4.", "feedback": "You've articulated the Crown's position on treaty interpretation. Your concern about the scope of 'any other thing' is a legitimate legal argument. However, the Supreme Court has consistently ruled that treaties should be interpreted as the Indigenous signatories would have understood them, not through a narrow legalistic lens. The Mi'kmaq oral tradition and Wampum records suggest they understood this as a broad trade guarantee."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "CROWN", "rationale": "The Crown would say the ôpublic safetyö reason still makes sense because cannabis is regulated by law, so it must be controlled and sold through legal channels. Even though the lab report shows the product is safe, it doesnÆt change the fact that it was being sold without proper licensing.", "feedback": "You've raised valid concerns about regulation and public safety. However, consider this tension: if the treaty protects the right to trade, and the product is demonstrably safe, does the Province's interest in regulation outweigh a constitutionally protected treaty right? The Sparrow Test requires the Crown to show that their infringement is justified - not just that regulation is preferable."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "The ôSacred Fireö is being used as a cultural and spiritual boundary, showing the community is asserting Indigenous law and rights. That supports the idea that the situation is about human rights and Indigenous sovereignty, not just a police enforcement issue, which is the Defence argument.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "CROWN", "rationale": "The Crown would say the ôMusket analogyö is not a valid legal argument because trading muskets in 1760 does not mean all modern goods, like cannabis, are automatically protected. Laws have changed over time, and dangerous weapons or controlled substances today are regulated differently for public safety. So historical trade does not override current Canadian law.", "feedback": "You've identified a distinction between historical musket trade and modern cannabis regulation. However, consider the counter-argument: the Crown accepted musket trade in 1760 despite genuine safety concerns, which suggests that treaty trade was never limited by safety standards. The musket analogy demonstrates that the Crown has historically accepted Indigenous trade in goods it considered dangerous."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "CROWN", "rationale": "The Crown would argue that Fiduciary Duty is being used to protect people, not profits. They would say the province has a responsibility to keep the cannabis market regulated to ensure safety and prevent illegal or unsafe sales. Even if legal shops like NSLC lose money, the main goal is still public protection and control of the system.", "feedback": "You've defended the Province's regulatory role. However, consider the evidence: the lab reports show no safety issues, and the NSLC sales data suggests economic motives. The Sparrow Test requires the Crown to demonstrate that its actions serve a compelling public purpose, not just protect government revenue."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "The Defence would say the ôFrozen Rightsö approach does treat Indigenous people like museum pieces because it locks their rights in the past. The text even says it treats treaty rights like a ômuseum exhibit,ö which ignores how communities need to grow and change today. This makes it harder for Indigenous people to develop their economy in modern times.", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "CROWN", "rationale": "The Crown would argue that LeoÆs business does not qualify as a ômoderate livelihoodö because the Donald Marshall Jr. decision defined it as covering basic needs like food, clothing, and housing, not large-scale commercial profit. Since intelligence reports describe LeoÆs shop as a growing business that competes with the regulated market, it goes beyond what is considered ômoderate.ö", "feedback": "You've raised the question of whether Leo's business exceeds 'moderate livelihood.' However, the Supreme Court in R v Marshall specifically rejected limiting treaty rights to subsistence activities. What constitutes 'reasonable' must be understood in contemporary economic terms."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "CROWN", "rationale": "The Crown would argue they did use minimal impairment because the Cannabis Control Act requires enforcement when businesses operate outside the legal system. From their point of view, a raid is necessary to protect the regulated market and public safety. They would say consultation is not required before every enforcement action if laws are being broken.", "feedback": "You've defended the Province's enforcement actions, but consider the Sparrow Test carefully. The failure to consult before conducting a raid is a significant gap in the Crown's justification. Even if the Province had a valid objective, the Sparrow framework requires that less intrusive options be considered first. Negotiation or co-regulation would have been less impairing alternatives."}}}, "JAMES (JAME)": {"name": "JAMES", "pin": "JAME", "block": "D Block (Hargreaves)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "article 4 states that 'shall have free liberty to bring for sale... skins, feathers, foul, fish or ANY OTHER THING they have to sell.' the 'any other thing' to sell could and probably would include cannabis\n\nwampum belts would declare that this is legal if the mi'kmaq nation is their own nation, meaning Leo would now have two pieces of evidence supporting him", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "operation high tide was a unjustified raid on indigenous land they are legally allowed to trade at their trading post, \n\nbased on article 3 the band is allowed to self government on their land, and if they are an independent nation then they can do what they want on their land\n\nbased off the lab report there was no pesticides, no mould, only THC(the main thing found in cannabis plants), which if they have the right to sell whatever they want at trading posts, then they can legagally sell cannabis and not get in trouble for it\n\nthe raid was most likely an attempt to protect the provices tax monopoly, because there was nothing danggourus at the trading post that could cause a massive or really any impact to public health", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "stepping over the spiritual fire is considered a great desercreation in mikmaq religion, and its still on there land implying that they can still do whatever they want on their land\n\nthe dresses in the trees do symbolize the murdered and missing indiggenous women and girls, which the police still mostly choose to ignore but that's the media, yes they have been ignoring it, I will ngive you that much, and yes this could be seen as a part of a larger history of colonial violence, because they were once again on their land meaning they do not have to follow with the federal governments rules, as they have the right to self-govern\n\nthe sacred fire is a legal boundry as much as a spiritual boundry, and going past the sacred fire would violate the mi'kmaqs religion and could be considered a human rights violation", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "the musket argument is a valid argument for a few reasons, if the crown back in 1760 supported trading firearms and guns that could kill a person in one shot and take a persons life and supported trading them with the mi'kmaq, then a little bit of cannabis today which is not nearly as dangourus or deadly as a musket or firearm, then there is no reason that the mi'kmaq should get in trouble for trading it on their land", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "so on the claim that 'unregulated shops' could become an issue if Leo wins, the mi'kmaq can sell whatever they want on their land as they are on technicallity an independent nation\n\nand on the Armstrong directive it would seem that the crown cares more about their bank accounts then the public health as they are using police force to crush a business that is a competitor to their 'NSLC' in order to protect profits", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "the frozen rights argument does treat people as if they were musium peices and based off the fact that the government could technically just say to almost anyone even in like 100 years or more could just be like 'oh yeah, that human rights stuff that was in the 1960s, yeah that's frozen in place we don't need to follow that, old stuff' so in the case of the frozen rights arument it is not a valid arument", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "leo's businness could count as a moderate livilyhood depending on several varing factors, one being how much his bisness makes, two being the cost of everything and three how much it would cost to maintain a 'moderate livlihood'\n\non the crowns claim that leos shop is too to big for a 'moderate livlihood' a moderate livlihood was never officially defined, it just says 'but not unlimited wealth', and meaning where it is undefined as to how much is a 'moderate livlihood' Leo's claims are still valid", "feedback": "Strong application of the R v Marshall precedent. The Supreme Court's definition of 'moderate livelihood' as encompassing necessities supplemented by amenities is deliberately flexible. Leo's argument that his business supports community members and funds services fits well within this framework. The Court in Marshall rejected limiting treaty rights to subsistence-level activities."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "the crown by all accounts failed the sparrow test(spifically step 2)by failing to talk to anyone on the reserve before launching a raid, their claim to public safety also was found to not be valid in the case of project 'high tide'. addtionally they failed to prioritize indigenous rights over their NSLC monopoly and project 'high tide' was believed to have been an attempt to crush competition. they also could have checked lab results or sent someone undercover or something similar instead of launching a full tactical raid, so the crown not only missed a part of step two in the sparrow process, but they skipped the entirety of step two", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "JESSE (LOUP)": {"name": "JESSE", "pin": "LOUP", "block": "A Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "Any other thing can include cannabis, but the right to trade it is not unlimited and will be regulated.", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "If the lab didnÆt show anything dangerous, then the public safety excuse isnÆt strong. It just looks like the government is enforcing rules, not actually protecting people.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "the Sacred Fire should be treated as a boundary because it represents protected cultural and spiritual rights, even if itÆs not written as a formal law.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "CROWN", "rationale": "For the crown in strict legal terms, but the defense raises a strong constitutional and historical critique of how rights are recognized.", "feedback": "You've identified a distinction between historical musket trade and modern cannabis regulation. However, consider the counter-argument: the Crown accepted musket trade in 1760 despite genuine safety concerns, which suggests that treaty trade was never limited by safety standards. The musket analogy demonstrates that the Crown has historically accepted Indigenous trade in goods it considered dangerous."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "unless the Crown can prove actual public safety risks, the ôFiduciary Dutyö argument looks more like protecting regulatory control than direct
