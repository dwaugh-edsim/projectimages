Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "The thing about public confidence in the regulated market and the drop in NSLC sales suggests the shutdown may also be about protecting government cannabis sales, not just public safety.", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "Yes it can treat Indigenous rights as stuck in the past, like a museum exhibit, by refusing to allow those rights to grow or to modern economic life.", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "Under r v marshall Leo can argue his business fits a moderate livelihood because it just needs to cover basic things like food, housing, and bills in todayÆs world. Since the Court didnÆt limit it to small or old-style trading he can say his cannabis shop is simply a modern way to earn enough to live.", "feedback": "Strong application of the R v Marshall precedent. The Supreme Court's definition of 'moderate livelihood' as encompassing necessities supplemented by amenities is deliberately flexible. Leo's argument that his business supports community members and funds services fits well within this framework. The Court in Marshall rejected limiting treaty rights to subsistence-level activities."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "Under the defense view using r v sparrow the crown likely failed minimal impairment because they used a police raid instead of trying to talk or work out rules first. If they could have dealt with safety by negotiating instead of shutting the business down then the raid was not the least harmful option.", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "SEOK (SEOK)": {"name": "SEOK", "pin": "SEOK", "block": "D Block (Hargreaves)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "Leo argued that the 1752 Peace and Friendship Treaty gave the Mi'kmaq a permanent right to trade. The treaty included a Truckhouse which was the government trading post where Mi'kmaq people could exchange goods without being cheated. I stand on the defense side, because confirmed promises should last long until both sides choose to eliminate it.", "feedback": "Excellent work connecting the Living Tree Doctrine to the Truckhouse provision. You've identified the core tension - whether 'any other thing' can evolve to include modern goods. To deepen your thinking: consider how the Crown might use the ejusdem generis rule to argue that 'any other thing' should only include items similar to skins, feathers, and fish. Anticipating this counter-argument would make your position even stronger."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "I stand for the defense side because they are not off the law and was trading.\nUnder UNDRIP Article 3, the Band has the right to manage its own economy. Which means that the government cannot invade their right to trade and seize their products, and arrest them.", "feedback": "You've identified key issues with the Crown's public safety argument. To strengthen your position, connect this more explicitly to the Sparrow Test - the Crown must show both a valid objective AND that their actions minimally impair the treaty right. If the product is safe, it's hard to argue that a police raid was the least intrusive option."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "CROWN", "rationale": "I stand for the crown (NS) side, because they entered for law enforcement purposes, and a sacred fire cannot be considered as an official no-entry zone under Canadian law. According to the Mi'kmaq spirit, \"The sacred fire is a very important symbol in Aboriginal culture\". Which means that this is just  a spiritual symbol.", "feedback": "You've identified the tension between Indigenous spiritual practices and Canadian law enforcement. However, Canadian courts have increasingly recognized Indigenous legal traditions as relevant to legal proceedings. The Supreme Court has acknowledged that the Honour of the Crown requires sensitivity to Indigenous perspectives. While the Sacred Fire may not be a formal legal boundary under Canadian statute, it represents a legitimate expression of Mi'kmaw law that courts are increasingly willing to consider."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "The British have already traded deadly weapons like gunpowder, lead, and muskets with the Mi'kmaq back in 1760. There for, the argument that the government's logic of \"safety\"lacks consistency. According to CIRNAC treaty document, It does not mention of a ban on marijuana trading. Indigenous rights have no legal effect until recognized by the courts.", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "CROWN", "rationale": "I stand for the Crown (NS), because according to the government of Canada, treaty rights limit and the government can regulate trade to protect public safety, taxation, and the legal market.", "feedback": "You've defended the Province's regulatory role. However, consider the evidence: the lab reports show no safety issues, and the NSLC sales data suggests economic motives. The Sparrow Test requires the Crown to demonstrate that its actions serve a compelling public purpose, not just protect government revenue."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "From Leo's perspective, the \"Frozen Rights\" approach wrongly locks treaty rights in the past, treating them like museum pieces instead of living law. I support living law because the economic structure changes over time.", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "The Donald Marshall Jr. decision shows that treaty rights are living law that still apply today, even when they override provincial regulations.", "feedback": "Strong application of the R v Marshall precedent. The Supreme Court's definition of 'moderate livelihood' as encompassing necessities supplemented by amenities is deliberately flexible. Leo's argument that his business supports community members and funds services fits well within this framework. The Court in Marshall rejected limiting treaty rights to subsistence-level activities."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "The province fails the  sparrow test because it never consulted the Mi'kmaq and used a tactical raid instead of less aggressive options. (the canadian encyclopedia)", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "SONJA (ROSE)": {"name": "Sonja", "pin": "ROSE", "block": "A Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "CROWN", "rationale": "They shouldn't be allowed to sell anything because they could sell guns or worse even if they just start with Cannabis then they could make lots of profit. Then government knows what is going into the NSLC but they don't know what's going into the Truckhouse, therefore it could be bad things for people who shouldn't have it.", "feedback": "You've identified an important concern about public safety and regulation. However, consider this: the Living Tree Doctrine and cases like R v Marshall have established that treaty rights can override provincial regulations. The key question isn't whether cannabis is dangerous, but whether the Province has a compelling and justified reason to infringe on a treaty right. Think about what level of evidence the Crown would need to meet the Sparrow Test."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "CROWN", "rationale": "The Public Safety is valid because it was to help individuals out and make sure they're not getting stuff that had bad stuff in it. Both sides did labs test but both got different answers, therefore one of them is lying but we don't know which one. But I believe that the argument is valid.", "feedback": "You've raised valid concerns about regulation and public safety. However, consider this tension: if the treaty protects the right to trade, and the product is demonstrably safe, does the Province's interest in regulation outweigh a constitutionally protected treaty right? The Sparrow Test requires the Crown to show that their infringement is justified - not just that regulation is preferable."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "CROWN", "rationale": "This argument is on MIssing and Murdered Indigenous Women, this has nothing to do with the raid. They're trying to make the government look bad and like they don't care, but there are so many missing reports for everyone and they don't have time for all of them. They using some of the money", "feedback": "You've identified the tension between Indigenous spiritual practices and Canadian law enforcement. However, Canadian courts have increasingly recognized Indigenous legal traditions as relevant to legal proceedings. The Supreme Court has acknowledged that the Honour of the Crown requires sensitivity to Indigenous perspectives. While the Sacred Fire may not be a formal legal boundary under Canadian statute, it represents a legitimate expression of Mi'kmaw law that courts are increasingly willing to consider."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "CROWN", "rationale": "They have the rights to sell guns but they don't have the right to sell weed because they're two different things. Also, just because guns are more deadly it still doesn't  mean that weed is okay to sell if it's less deadly.", "feedback": "You've identified a distinction between historical musket trade and modern cannabis regulation. However, consider the counter-argument: the Crown accepted musket trade in 1760 despite genuine safety concerns, which suggests that treaty trade was never limited by safety standards. The musket analogy demonstrates that the Crown has historically accepted Indigenous trade in goods it considered dangerous."}}}, "SOPHIE (QASW)": {"name": "Sophie", "pin": "QASW", "block": "A Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "CROWN", "rationale": "Yes  it does include Cannabis because of Art 4 states \"the said Indians shall have free liberty to bring for Sale to Halifax or any other Settlement... Skins, feathers, fowl, fish or ANY OTHER THING they have to sell.\"", "feedback": "You've articulated the Crown's position on treaty interpretation. Your concern about the scope of 'any other thing' is a legitimate legal argument. However, the Supreme Court has consistently ruled that treaties should be interpreted as the Indigenous signatories would have understood them, not through a narrow legalistic lens. The Mi'kmaq oral tradition and Wampum records suggest they understood this as a broad trade guarantee."}}}, "SOULIN (SOUL)": {"name": "SOULIN", "pin": "SOUL", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "I sided with Leo, because the words \"ANY OTHER THING\" in Article 4 should include cannabis. The treaty says Mi'kmaq have the right to sell \"skins, feather, fowl, fish or ANY OTHER THING they have to sell,\" which is very broad language. Using the \"living Tree\" idea, laws should grow and adapt over time, so modern products like cannabis can be included. Also, the tuckhouse system shows the British agreed to fair trade, not limited trade.", "feedback": "Strong use of the Living Tree Doctrine. You correctly identify that treaty interpretation should evolve with the times. To strengthen your analysis, reference how the Supreme Court applied this in R v Marshall - the Court noted that treaty rights must be interpreted in a way that reconciles Indigenous and Crown interests over time. Consider also what the Crown might argue about the original intent of the treaty makers."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "I am with the defense, since the public safety argument is weak because the lab report  shows the product is safe. There were no pesticides or mould, and THC levels were accurate. This means the product did not pose a health risk. Since the Crown claims the raid was for safety, but the evidence shows the cannabis was safe, it suggests the real reason may have been to protect the province's taxe instead.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "I sided with Leo's point of view because the Sacred Fire is a legal and spiritual boundary in Mi'kmaw law and culture. It represents, protection, and the authority of the community over their land, and stepping over it is considered a serious violation of Mi'kmaw traditions. This supports the argument hat the Mi'kmaq have the right to self-government and to make rules on their own territory under their own laws. While the Crown may see it as only symbolic and not legally binding under Canadian law, the defense argues that it is still valid boundary under indigenous law and treaties.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "The musket argument is strong, that's why I am sided with Leo. The British allowed the Mi'kmaq to trade weapons like muskets, which are more dangerous than cannabis. Of dangerous goods were allowed under treaty trade before, then it is inconsistent to ban cannabis today for safety reasons. This shows that the Crown may be using safety as an excuse rather than a real concern.", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "The evidence suggests the Crown is protecting profits more than people. The Armstrong Directive says \"public confidence in the regulated market must be maintained,\" Which points to economic concerns. Also, the NSLC lost sales because Leo's prices were cheaper. Combined with the sale lab results, this shows the raid was likely about protecting the government revenue, not public health.", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "Yes, the \"Frozen Rights\" argument treats Indigenous people like museum pieces. It says rights only apply to what existed in 1752, meaning they cannot grow or change. This ignores modern reality and limits Indigenous economic development. The \"Living tree\" approach is more fair because it allows rights to evolve over time.", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "CROWN", "rationale": "Leo's business does not qualify as a moderate livelihood. The Supreme Court defined moderate livelihood as enough to meet basic need, not to run large businesses. A cannabis shop generating significant profit which goes beyond what is necessary for basic living. Therefore, it exceeds the limits of treaty-protected rights.", "feedback": "You've raised the question of whether Leo's business exceeds 'moderate livelihood.' However, the Supreme Court in R v Marshall specifically rejected limiting treaty rights to subsistence activities. What constitutes 'reasonable' must be understood in contemporary economic terms."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "The Crown failed the Sparrow Test,especially Step 2. First, while they may claim a valid goal of a public safety the lab report shows no real danger. Second, there was no proper consultation with the Mi'kmaq community before the raid. Third, they did not prioritize Indigenous rights over government interests like tax revenue. Finally, the use of a tactical raid was not minimal impairment, they could have used less force. Because of these failures, the crowns actions were not justified.", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "SYDNEY (SYDS)": {"name": "SYDNEY", "pin": "SYDS", "block": "D Block (Hargreaves)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "In 1752, when the treaty was signed Cannabis wasn't in the picture very much, if at all. So obviously it doesn't explicitly state yes or no, but it does say \"any other thing they have to sell.\" The argument about telegraphs turning into internet is valid just as say tobacco could turn into cannabis. The treaty says, \"if they think a truckhouse is needful...\" and who is to say what another person deems necessary. I think that any other thing includes cannabis because times evolve and the treaty is worded to be adaptable with time.", "feedback": "Excellent work connecting the Living Tree Doctrine to the Truckhouse provision. You've identified the core tension - whether 'any other thing' can evolve to include modern goods. To deepen your thinking: consider how the Crown might use the ejusdem generis rule to argue that 'any other thing' should only include items similar to skins, feathers, and fish. Anticipating this counter-argument would make your position even stronger."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "The argument for Public Safety is not valid because the lab report says, \"Pesticides (None), Mould (None), THC (Accurate).\" Meaning that the product was in a clean environment, produced correctly and not laced with outside substances. This shows that it was not a safety concern and was raided for different reasons, in this case protecting the Province Tax Monopoly.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "The Sacred Fire in Mi'kmaq culture means more than just a fire, they view it as a \"spiritual boundary. And stepping over it is a \"profound desecration,\" which escalates issues to a greater scale. Mi'kmaq also use sacred fires as boundaries for territories and should be respected by the Crown. Though not everyone understands the significance of the Sacred Fire, it is part of a colonial agreement to respect the culture of the Mi'kmaq.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "CROWN", "rationale": "The musket argument is valid because it provides a historical example/comparison to something that happened in the past to the present. I think that the comparison of a musket and cannabis is pretty far off but also valid because both can be dangerous in their own way, both could kill someone. Although they might be using it as an excuse to ban competition, there is a point there.", "feedback": "You've identified a distinction between historical musket trade and modern cannabis regulation. However, consider the counter-argument: the Crown accepted musket trade in 1760 despite genuine safety concerns, which suggests that treaty trade was never limited by safety standards. The musket analogy demonstrates that the Crown has historically accepted Indigenous trade in goods it considered dangerous."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "The \"Fiduciary Duty\" is being used as a protection of profits more than people. The loss in sales near Millbrook is what bothers the government the most, because consumers can get products cheaper in another place. \"Public confidence in the regulated market must be maintained,\" suggests the Crown isn't in it for the right reasons so to speak.", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "Yes it does. Because just as was stated earlier with the telegrams to internet, things change and the language was written in a way that can be adaptable with time change. Using the phrase \" that because the Mi'kmaq didn't trade cannabis in 1752, they have no right to trade it today.\" Is stupid because cannabis wasn't a big thing then, but like some of the things that were traded in 1752 would never be traded now because time changes things and their need.", "feedback": "Good understanding of the tension between frozen and evolving interpretations. The key insight is that freezing rights at 1752 creates an absurd outcome: Indigenous peoples would be denied the ability to participate in the modern economy. The Supreme Court has consistently rejected this approach in cases like R v Marshall."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "Yes, his cannabis business was proven not to be a violation of public safety. His revenue is creating completion with the Crown but not taking all their business and it was done legally and on treaty land.", "feedback": "Good engagement with the moderate livelihood question. The R v Marshall decision is central - the Court recognized that treaty rights include the ability to earn a moderate livelihood, not just bare subsistence. To strengthen your analysis, consider how the scale of the operation matters and what 'moderate' means in the context of the modern economy."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "No  the Crown failed to meet the requirements for justification because the raid of the cannabis was unannounced. They lose a lot of  credit with this because it already seems that their priority is the money that they used to bring in before there was an un-taxed supply available. Step 2 says \"did they talk to the community first\" and that didn't happen, making the process less credible.", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "SAM (QWER)": {"name": "Sam", "pin": "QWER", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "Yes, because cannabis is a natural resource, similar to things like animal skins, feathers and other traditional idems. If people have the right to sell and use those resources, then they should also have the right to sell cannabis too.", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "if the cannabis is tested and shown to be safe, then there is no real public safety risk. Without that risk, they did not have a reason to take it from tehm. so  the raid was been unlawful", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "CROWN", "rationale": "They are using their spiritual boundaries to try to defend against the rules and the law, but that cannot be treated as a proven legal fact on its own. while those beliefs may be important to their community, they would still need good evidence and legal reasoning to support their position.", "feedback": "You've identified the tension between Indigenous spiritual practices and Canadian law enforcement. However, Canadian courts have increasingly recognized Indigenous legal traditions as relevant to legal proceedings. The Supreme Court has acknowledged that the Honour of the Crown requires sensitivity to Indigenous perspectives. While the Sacred Fire may not be a formal legal boundary under Canadian statute, it represents a legitimate expression of Mi'kmaw law that courts are increasingly willing to consider."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "CROWN", "rationale": "They could of used the muskets for hunting or selfdefecne and due to the fact of the lack of evidenc, so it wouold make it so the muskets are seen as a weapon for hunting and protecting. also they cant use religous reasoning as a form of defence.", "feedback": "You've identified a distinction between historical musket trade and modern cannabis regulation. However, consider the counter-argument: the Crown accepted musket trade in 1760 despite genuine safety concerns, which suggests that treaty trade was never limited by safety standards. The musket analogy demonstrates that the Crown has historically accepted Indigenous trade in goods it considered dangerous."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "as long as the shops stay on the reserves it is up to the mikmaw what happens to their shops but if their shops start too spread that will start to become a problem because this will increase the amount of uffregulated weed coming to NS which can cause a big health risks.", "feedback": "Good analysis of the Crown's motivations. The evidence of economic protectionism is significant because it undermines the Crown's claimed public safety objective. Under the Sparrow framework, the Crown must demonstrate a compelling and substantial objective - protecting government revenue from competition doesn't qualify."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "In reality culture naturally changes over time. So saying  the rights are frozen ignores modern developments and can limit Indigenous peoples from practise  rights in todayÆs world.", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "as if only itÆs a small scale and supports a reasonable living, not large commercial business. meaning people can earn a reasonable living but not make operation with unlimated profit.", "feedback": "Good engagement with the moderate livelihood question. The R v Marshall decision is central - the Court recognized that treaty rights include the ability to earn a moderate livelihood, not just bare subsistence. To strengthen your analysis, consider how the scale of the operation matters and what 'moderate' means in the context of the modern economy."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "no becaues if they didnÆt try negotiation first ten they likely failed minimal impairment because they used stronger actions than necessary and they could of talked first before doing anyting else.", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "SOULIN SHEHAB (SOUL)": {"name": "Soulin Shehab", "pin": "SOUL", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "After analyzing all the articles, I agree with the Defense that \"any other thing\" includes cannabis. Article 4 clearly gives the Mi'kmaq the \"free liberty\" to sell goods, including \"any other thing they shall have to sell,\" which it doesn't put any limitation to specific items.  In addition, the articles show the relationship is based on friendship, support and mutual benefits rather than strict control, suggesting Mi'kmaq kept important rights. Using the Living Tree Doctrine, treaty rights should grow and adapt over time, meaning modern goods like cannabis can be included. Therefore the treaty supports the idea that the Mi'kmaq  have the right to trace cannabis today.", "feedback": "Strong use of the Living Tree Doctrine. You correctly identify that treaty interpretation should evolve with the times. To strengthen your analysis, reference how the Supreme Court applied this in R v Marshall - the Court noted that treaty rights must be interpreted in a way that reconciles Indigenous and Crown interests over time. Consider also what the Crown might argue about the original intent of the treaty makers."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "I am siding with the Defense because the public safety argument is not strongly supported by the evidence in Exhibit C. The independent lab reports show that the cannabis had no pesticides, no mould and accurate THC levels, which means there is no clear health risk to consumers. If the product was actually unsafe, then the Crown's claim would make sense, but the results show it meets safety standards. Because of this, the raid does not appear to be about protecting public health. Instead, the evidence shows that the action may be more about controlling over market and protecting the Province's tax system. Therefore, based on the lab findings, the \"Public Safety\" justification is not valid.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "I sided with Leo's point of view because the Sacred Fire is a legal and spiritual boundary in Mi'kmaw law and culture. It represents respect, protection and the authority of the community over their land, and stepping over it is considered a serious violation of Mi'kmaw legal traditions. This supports the argument that the Mi'kmaq have the right to self-government and to make rules on their own territory. While the crown may see it as only symbolic and not legally binding under Canadian law, the defense argues that it is still valid boundary under Indigenous law.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "I sided with Leo,  The \"Musket\" argument is a valid legal analogy because it shows that treaties protected Mi'kmaw trade, even for items that were dangerous at the time, like weapons. This shows that the Crown accepted Indigenous economic activity. If their argument was true, then saying cannabis is \"too dangerous\" seems inconsistent. The Crown is using \"safety\" as an excuse to control Indigenous trading and limit them from making money.", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}}}, "SUKHBIR (NICE)": {"name": "Sukhbir", "pin": "NICE", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "Since the Treaty is still being used to this day, they should be allowed to sell Canabis since it states they are allowed to sell any other thing. They are also given benefits and privileges", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "In the findings, the only thing that came back as true was THC, and that should be correct since the shops have Weed signs on them. And making arrests and taking thousands in product without warning is unfair since they are essentially allowed to sell.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "I am for Leo on this one. People should be allowed to advocate for themselves and bring attention to others about their situation. Also many people will be out of jobs and wont be able to provide for their loved ones if they find him guilty.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "CROWN", "rationale": "Although many back in 1760s traded much more dangerous items, it was seen as regular since they werent as strict. Cannabis is very easy to receive to the youth and can be very harmful. Also using a feather as an arguement is effective, trying to get a judge on this oath over a feather isn't enough.", "feedback": "You've identified a distinction between historical musket trade and modern cannabis regulation. However, consider the counter-argument: the Crown accepted musket trade in 1760 despite genuine safety concerns, which suggests that treaty trade was never limited by safety standards. The musket analogy demonstrates that the Crown has historically accepted Indigenous trade in goods it considered dangerous."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "CROWN", "rationale": "In Nova Scotia, they have the highest rates of Canabis in youth, amongst all of Canada. Although it may seem they are trying to make profit to boost NSLC, that company is a multi-million dollar company and does not need more money. However the youth is the future and Canabis has a very effective affect on a youths mind.", "feedback": "You've defended the Province's regulatory role. However, consider the evidence: the lab reports show no safety issues, and the NSLC sales data suggests economic motives. The Sparrow Test requires the Crown to demonstrate that its actions serve a compelling public purpose, not just protect government revenue."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "Even though people didn't sell Canabis in the past doesn't mean they shouldnt be allowed to sell it now. They are given treaty rights to do so and Canabis is legal in Canada. Also, saying that a section is not valid until they are proven is stupid, imagine saying a law isn't there until it you commit that 'crime'.", "feedback": "Good understanding of the tension between frozen and evolving interpretations. The key insight is that freezing rights at 1752 creates an absurd outcome: Indigenous peoples would be denied the ability to participate in the modern economy. The Supreme Court has consistently rejected this approach in cases like R v Marshall."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "NSLC goes to the government, and that money from their Canabis profit and others go to building schools and roads. However NS has a very high tax rate for those items, the government has so much money for these things and aren't using it. Instead choosing to take money from people who work hard and sell things that are needed.", "feedback": "Good engagement with the moderate livelihood question. The R v Marshall decision is central - the Court recognized that treaty rights include the ability to earn a moderate livelihood, not just bare subsistence. To strengthen your analysis, consider how the scale of the operation matters and what 'moderate' means in the context of the modern economy."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "If they had consulted with the Chief this might have been prevented. If the Mi'kmaq have their own government, why does the province think they can just do what they want without speaking to the others. They could have talked and made this much easier.", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "TRENT (TTTT)": {"name": "TRENT", "pin": "TTTT", "block": "D Block (Hargreaves)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "leo is right because the Mi'kma'ki, signed a peace and friendship treaty of 1752 which says they can exchange goods, so hes not wrong the\" right to trade\" still applies.", "feedback": "Strong use of the Living Tree Doctrine. You correctly identify that treaty interpretation should evolve with the times. To strengthen your analysis, reference how the Supreme Court applied this in R v Marshall - the Court noted that treaty rights must be interpreted in a way that reconciles Indigenous and Crown interests over time. Consider also what the Crown might argue about the original intent of the treaty makers."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "Leo is in the clear again because Leo was authorized by indigenous law. if your approved by the chief, the province has its act, but the band has its inherent right to self-government", "feedback": "Good point about Band Council authority and self-government. The right of Indigenous communities to regulate their own economic activities is supported by UNDRIP Article 3. Consider also how this connects to the broader question: if the Band Council has authorized the sale and the product is safe, what legitimate interest does the Province have in shutting it down?"}}}, "WILL (ABCD)": {"name": "WILL", "pin": "ABCD", "block": "D Block (Hargreaves)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "Based on what's said and the documents saying that Mik'maq had the right to trade whatever they want, without being cheated.", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "If the band has it's inherent right to self government, they can sell cannabis if they want. There were no health concerns with the testing of the cannabis. It just seems like government overreach to me.", "feedback": "Good point about Band Council authority and self-government. The right of Indigenous communities to regulate their own economic activities is supported by UNDRIP Article 3. Consider also how this connects to the broader question: if the Band Council has authorized the sale and the product is safe, what legitimate interest does the Province have in shutting it down?"}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "CROWN", "rationale": "You cant just have a fire in a doorway and claim its sacred and you cant walk over it. it will be abused, and they used certain words to tie this raid to the governments and mik'maqi's past bad relations and prosecution of mik'maq children", "feedback": "You've identified the tension between Indigenous spiritual practices and Canadian law enforcement. However, Canadian courts have increasingly recognized Indigenous legal traditions as relevant to legal proceedings. The Supreme Court has acknowledged that the Honour of the Crown requires sensitivity to Indigenous perspectives. While the Sacred Fire may not be a formal legal boundary under Canadian statute, it represents a legitimate expression of Mi'kmaw law that courts are increasingly willing to consider."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "There is a play on words here for the defense trying to make it something bigger than it is, but it is true that cannabis is a relatively safe drug, and if the British can trade gunpowder, lead, and muskets. If they can trade dealy weapons, cannabis is more than okay to sell.", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "it's a case of government overreach here. The government wants to ban the use and sale of cannabis for no good reason, and then legalize it and only allow the NSLC to sell cannabis legally. it's ridiculous and the government should not have as much control over things like this as they do. They upcharge a large amount, and places like ones on reserves give a half honest price and they want to shut it down cause they dont own it. so what If there would be a load of stores opening with less regulation, cannabis is safer than cigarettes and they are sold everywhere. they should allow the people to own whatever store they want without paying absurd amounts for approval and licenses", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "Well I don't think the government was selling cannabis in 1752 either, why can they sell it now? They want control of the market and will do whatever to make sure it stays that way, and they can rake in all the profits", "feedback": "Good understanding of the tension between frozen and evolving interpretations. The key insight is that freezing rights at 1752 creates an absurd outcome: Indigenous peoples would be denied the ability to participate in the modern economy. The Supreme Court has consistently rejected this approach in cases like R v Marshall."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "It just seems the government doesnt want the mik'maq people to earn a good income. Growing weed doesnt hurt anyone, and he should be able to grow and sell however much he wants to. If the government can earn a butt load of money off the cannabis industry after legalizing it, anyone should have the right to.", "feedback": "Good engagement with the moderate livelihood question. The R v Marshall decision is central - the Court recognized that treaty rights include the ability to earn a moderate livelihood, not just bare subsistence. To strengthen your analysis, consider how the scale of the operation matters and what 'moderate' means in the context of the modern economy."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "If the government can change the law and sell something and earn a lot of money of something that wasn't sold hundreds of years ago by Europeans than why couldnt mik'maq people. The government wanted to protect the very large cash flow from NSLC, by being very unreasonable and shutting down an honest business. if the government can benefit from the sale of cannabis, mik'maq people should be able to capatilize off it too.", "feedback": "Good analysis of the Sparrow Test application. The Province's failure to consult with the Mi'kmaq before the raid is a significant weakness in their position. To strengthen your analysis, explicitly walk through each element of the Sparrow Test and identify where the Crown's case falls short."}}}, "YISHAN (LYSS)": {"name": "YISHAN", "pin": "LYSS", "block": "D Block (Hargreaves)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "CROWN", "rationale": "The provision states: ôAnimal skins, feathers, poultry, fish, or any other items for sale\n\nôAny other items for saleö\n= Limited to similar natural trade goods\n\nDoes not include cannabis (which does not fall under similar trade goods and does not fit the original context)", "feedback": "You've articulated the Crown's position on treaty interpretation. Your concern about the scope of 'any other thing' is a legitimate legal argument. However, the Supreme Court has consistently ruled that treaties should be interpreted as the Indigenous signatories would have understood them, not through a narrow legalistic lens. The Mi'kmaq oral tradition and Wampum records suggest they understood this as a broad trade guarantee."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "CROWN", "rationale": "For the public safety argument to hold, ôpublic safety enforcementö typically requires:\n\n* A real health risk (contamination, toxicity, non-compliant processing)\n* Or an uncontrollable hazard (e.g., adulteration, unknown ingredients)\n\nHowever, in this case:\n\n* Risk factors are eliminated (zero pesticides/mold)\n* Ingredients are clearly identified (THC is known)\n\n The public safety argument lacks direct evidence to support it", "feedback": "You've raised valid concerns about regulation and public safety. However, consider this tension: if the treaty protects the right to trade, and the product is demonstrably safe, does the Province's interest in regulation outweigh a constitutionally protected treaty right? The Sparrow Test requires the Crown to show that their infringement is justified - not just that regulation is preferable."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "The Sacred Fire is regarded as a boundary in a legal sense because communities use it to demarcate their spiritual space, autonomy, and treaty relationships; while it may not be a formal boundary recognized under Canadian law, it holds significant legal and cultural importance in Indigenous claims.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "The ôguns argumentö is a persuasive but not conclusive legal analogy. It seeks to demonstrate that if the trade in firearmsùwhich posed obvious dangersùwas permitted during the era of the treaty, there may be a logical inconsistency in the governmentÆs current prohibition of the cannabis trade solely on the grounds of ôsafety.ö However, the Crown could counter that the historical trade in firearms and modern cannabis regulation operate under different legal contexts, and therefore the analogy does not hold entirely.", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "This is because the evidence and arguments presented in the existing literature all support the view that ôfreezing rights would fix Indigenous rights at a specific point in history, effectively æmuseumifyingÆ them.ö", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "1. Failure to engage in consultation;\n2. Failure to adopt measures that cause the least harm;\n3. Potential primary motivation based on economic interests rather than public safety.", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "YUSEF (YSAS)": {"name": "YUSEF", "pin": "YSAS", "block": "D Block (Hargreaves)", "project": "Leo 1752 Simulation", "verdict": "0", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "Any other thing\" legally includes cannabis(ANY OTHER THING they have to sell), and the Treaty of 1752 allows this . The defense relies on a legal concept called the \"living tree doctrine. In addition, the term \" any other thing \"wasn't further specified and is a broad term, and from the context from atricle 4, it mentions organic products, which cannabis falls into, strengthening Leo's claim.", "feedback": "Strong use of the Living Tree Doctrine. You correctly identify that treaty interpretation should evolve with the times. To strengthen your analysis, reference how the Supreme Court applied this in R v Marshall - the Court noted that treaty rights must be interpreted in a way that reconciles Indigenous and Crown interests over time. Consider also what the Crown might argue about the original intent of the treaty makers."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "The raid does not correlate with actual public safety, since the cannabis did not posses and pesticides, mould, or THC, so there was no legal point in initiating such a raid, unless the goal was for enforcing bias provincial rules on the sale of cannabis.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "The sacred fire is indeed a legal boundary; celebrating or performing a ritual is a human right. And initiating a raid that disrupted the peaceful people from doing so is a violation not only of their human rights but also of the sacred covenant.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "The evidence shows that in 1760 the British traded ôgunpowder, lead, and musketsö with the MiÆkmaq. I think the muskets argument is a strong comparison. Since muskets were clearly dangerous weapons, it seems inconsistent to argue that cannabis is too dangerous to be traded today. This supports LeoÆs point that the Crown may be using ôsafetyö as an excuse to restrict trade that could still be protected under treaty rights.", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "It is being used to prioritize profits rather than protecting people. The CrownÆs claim that it is acting compassionately to protect the public is contradicted by NSLC financial data and the Armstrong Directive. In addition, these documents tie police raids to declining provincial profits and show that market control is prioritized more than public health (Public confidence in the regulated market must be maintained.'* This suggests the Crown cares more about its bank account (the NSLC) than the public's health.)", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "The Frozen Rights arguments do indeed treat the indigenous people and their long-term trades overall as museum pieces. The R.v. Googoo is an unjust precedent  stating that", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}}}, "ZAYDEN (ABCD)": {"name": "ZAYDEN", "pin": "ABCD", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "Yes because cannabis is is a natural resource like animal skins, feathers and many other traditional items. If people have the right to sell and use those resources , then they should be able to sell and use cannabis aswell.", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "If the cannabis is proved to be safe, then there is no risk. Without a risk, they don't have any reasons to take it away from them, which makes the raid unlawful.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "CROWN", "rationale": "They are using their spiritual boundaries to try to defend agaisnt the rules and law, but can't be proven to be a legal fact, even though those beliefs may be important to them and their community, they still need good evidence to support their reasoning.", "feedback": "You've identified the tension between Indigenous spiritual practices and Canadian law enforcement. However, Canadian courts have increasingly recognized Indigenous legal traditions as relevant to legal proceedings. The Supreme Court has acknowledged that the Honour of the Crown requires sensitivity to Indigenous perspectives. While the Sacred Fire may not be a formal legal boundary under Canadian statute, it represents a legitimate expression of Mi'kmaw law that courts are increasingly willing to consider."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "CROWN", "rationale": "They could have used the muskets for hunting and self defence because of the lack of evidence, so it would make it seem like the muskets are used for protection and not able to use religious reasonings as an excuse for defence.", "feedback": "You've identified a distinction between historical musket trade and modern cannabis regulation. However, consider the counter-argument: the Crown accepted musket trade in 1760 despite genuine safety concerns, which suggests that treaty trade was never limited by safety standards. The musket analogy demonstrates that the Crown has historically accepted Indigenous trade in goods it considered dangerous."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "If the shops remain on the reserves then it is up to the mikmaw aboiut what happens to them, but if they aren't on the reserve and start to spread then it becomes a problem which leads to the growing amount of weed coming to NS that can cause a health risk.", "feedback": "Good analysis of the Crown's motivations. The evidence of economic protectionism is significant because it undermines the Crown's claimed public safety objective. Under the Sparrow framework, the Crown must demonstrate a compelling and substantial objective - protecting government revenue from competition doesn't qualify."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "Culture changes all the time. So saying the rights are frozen ignores modern day developments and can lead to limiting indigenous peoples right to practice their traditions.", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "It isn't a large commercial business and only supports reasonable living, meaning people can have a reasonable living without making unlimited money.", "feedback": "Good engagement with the moderate livelihood question. The R v Marshall decision is central - the Court recognized that treaty rights include the ability to earn a moderate livelihood, not just bare subsistence. To strengthen your analysis, consider how the scale of the operation matters and what 'moderate' means in the context of the modern economy."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "No because if they didn't try negotiation first then they likely failed minimal impairment because they used stronger actions than necessary and they could have just talked before starting something", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chief or Band Council is a significant breach of the Honour of the Crown. Under Sparrow, the Crown must show a valid objective, consistency with fiduciary duty (including consultation), and minimal impairment."}}}, "ZAID (ZAID)": {"name": "Zaid", "pin": "ZAID", "block": "C Block (Waugh)", "project": "Leo 1752 Simulation", "verdict": "DEFENSE", "feedback": {"slide_1": {"question": "Exhibit A - Treaty Text & \"Any Other Thing\"", "verdict": "DEFENSE", "rationale": "In the 1752 treaty, the Mi'kmaq and the government agreed that the Mi'kmaq could sell whatever they brought, including skins, feathers, fish, or any other goods they liked. In the text, they used \"any other thing,\" meaning they could sell whatever they wanted, and no one would have a problem with it. This deal never ended and should be used in this case, making it legal for the Mi'kmaq to sell cannabis because it was a part of the agreement to sell whatever they like, and there would be no issue.", "feedback": "You've taken a clear position on the treaty interpretation question. To strengthen your analysis, consider incorporating the Living Tree Doctrine, which the Supreme Court has used to interpret treaty rights as evolving over time. Also think about how the phrase 'any other thing' would have been understood by the Mi'kmaq negotiators in 1752 versus how courts interpret it today."}, "slide_2": {"question": "Exhibit B - Public Safety & Lab Reports", "verdict": "DEFENSE", "rationale": "i go for the defense on this one because the crown saying it was for public saftey was a fake excuse because the lab report proves that the product is safe.i think its all just about the province wanting to control the money and taxes.And also the band has their own right to manage their own land.", "feedback": "Excellent analysis of the lab report evidence. You correctly identify that the absence of contaminants undermines the Crown's public safety justification. This connects directly to the Sparrow Test - if there's no actual health risk, can the Province claim a 'compelling and substantial objective' for infringing on treaty rights? The evidence suggests the raid was more about protecting the NSLC monopoly than protecting public health."}, "slide_3": {"question": "Exhibit C - Sacred Fire & Community Response", "verdict": "DEFENSE", "rationale": "In Mi'kmaw culture, the fire serves as a spiritual boundary. The raid violated this boundary, turning a deeply meaningful symbol into a human rights crisis because people crossed the fire without respect for its significance. Additionally, Leo's shop not only offers jobs and cares for the elderly, but its closure would spread alarming news and potentially cause a larger crisis across the Atlantic region.", "feedback": "Strong recognition of the Sacred Fire as both a spiritual and legal boundary. You understand that this elevates the case beyond a simple regulatory dispute into questions of cultural rights and reconciliation. Consider also how the Royal Proclamation of 1763 and the Honour of the Crown require respect for Indigenous legal traditions. The fact that the raid crossed this spiritual boundary transforms it from law enforcement into a potential violation of cultural rights."}, "slide_4": {"question": "Exhibit D - Musket Trade Historical Analogy", "verdict": "DEFENSE", "rationale": "a long time ago the british trade muskets and gunpowder with the mi'kmaq,and it say cannabis is dangerous when they used to trade gunpowder and muskets which are way more dangerous than cannabis is ridicules.Leo using a feather to swear in matter because it shows he's telling the truth in his cultural.This just shows how greedy the crown are being and why i take leos side on this", "feedback": "Excellent use of the musket analogy. The historical evidence that the British traded weapons with the Mi'kmaq is a powerful argument against the Crown's safety-based restrictions. If gunpowder and muskets were protected treaty trade goods, then the Crown's argument that cannabis is 'too dangerous' becomes inconsistent. This analogy effectively exposes the double standard in the Crown's position."}, "slide_5": {"question": "Exhibit E - Fiduciary Duty & Economic Motives", "verdict": "DEFENSE", "rationale": "the nslc is losing money because of leos stuff being cheaper so they shut it down it just looks like to me they are being greedy and want their companies to look better by shutting down others shops like leo to get rid of a competition. it also shows that the government is using  fiduciary duty to protect profits instead of people.", "feedback": "Sharp analysis of the economic motives behind the raid. The Armstrong Directive and NSLC sales data provide compelling evidence that the Province's actions were driven by revenue protection rather than genuine public safety. This directly undermines the Crown's position under the Sparrow Test, which requires a valid public purpose. Consider also how this connects to the fiduciary duty - the Crown has an obligation to act in the best interests of Indigenous peoples, not against them for economic gain."}, "slide_6": {"question": "Exhibit F - Frozen Rights vs Living Tree Doctrine", "verdict": "DEFENSE", "rationale": "the frozen rights basically say if the mi'kmaq people didn't do anything a  long time ago you can't just change your mind and do it now.It making them sound like they are museum pieces that are old history and cannot be changed.leo has  stronger arguments", "feedback": "Excellent critique of the Frozen Rights approach. The 'museum pieces' metaphor is powerful and accurate - treating Indigenous rights as frozen in 1752 denies Indigenous peoples the same capacity for economic evolution that all other Canadians enjoy. Consider also the 'Empty Box' versus 'Full Box' theory: Leo's position is that his box is full - his rights exist independently of court recognition."}, "slide_7": {"question": "Exhibit G - Moderate Livelihood (R v Marshall)", "verdict": "DEFENSE", "rationale": "yes because leo is using his store to support himself and his people to give everyone a living and that's very moderate.", "feedback": "Good engagement with the moderate livelihood question. The R v Marshall decision is central - the Court recognized that treaty rights include the ability to earn a moderate livelihood, not just bare subsistence. To strengthen your analysis, consider how the scale of the operation matters and what 'moderate' means in the context of the modern economy."}, "slide_8": {"question": "Exhibit H - Sparrow Test & Duty to Consult", "verdict": "DEFENSE", "rationale": "the crown could have just used the less option with the most trouble but they didn't instead they decided to raid them instead of just talking and having the problem solved.if they expanded their options instead of picking the one that would cause the most attention and trouble they could have maybe found a solution.", "feedback": "Excellent identification of the Crown's failure to consult as a critical flaw. The Sparrow Test requires that the Crown demonstrate minimal impairment of the treaty right - and consultation is fundamental to this. The Province's raid without prior discussion with the Chie
