<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>COMMANDER DASHBOARD | LEO 1752</title>
    <!-- TEACHER: Use your same API URL here -->
    <script>const API_URL = "https://script.google.com/macros/s/AKfycbyBPWdBC7xpPzE7nuZH1_P6GSJXAeKhlKFVVPW-QHAf7Gwr6Rxvc6uOjdw2CCLic4GB/exec";</script>
    
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Roboto:wght@400;700&family=Courier+Prime&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0c0c0c;
            --accent: #FFD700;
            --text: #e0e0e0;
            --card-bg: #1a1a1a;
            --border: #333;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Roboto', sans-serif;
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Merriweather', serif;
            color: var(--accent);
            margin: 0;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            gap: 15px;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: #888;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .filter-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(255, 215, 0, 0.1);
        }

        .download-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'Courier Prime', monospace;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            text-align: left;
            padding: 15px;
            background: #222;
            color: var(--accent);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        tr:hover {
            background: #252525;
        }

        .progress-bar {
            height: 6px;
            background: #333;
            border-radius: 3px;
            width: 100px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
        }

        .verdict-tag {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .verdict-CROWN { background: #442222; color: #ff8888; }
        .verdict-DEFENSE { background: #224422; color: #88ff88; }

        #stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
        }

        .stat-val { font-size: 1.5rem; font-weight: bold; color: var(--accent); }
        .stat-label { font-size: 0.7rem; color: #888; text-transform: uppercase; margin-top: 5px; }

        .loading {
            text-align: center;
            padding: 50px;
            color: var(--accent);
            font-family: 'Courier Prime', monospace;
        }

        .text-view-container {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
        }

        .text-view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .text-view-header h2 {
            margin: 0;
            color: var(--accent);
            font-family: 'Merriweather', serif;
        }

        .block-section {
            margin-bottom: 30px;
        }

        .block-title {
            font-family: 'Merriweather', serif;
            color: var(--accent);
            font-size: 1.1rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .student-card {
            background: #222;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 3px solid var(--accent);
        }

        .student-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .student-name {
            font-weight: bold;
            color: var(--accent);
            font-size: 1rem;
        }

        .student-meta {
            font-size: 0.75rem;
            color: #888;
        }

        .exhibit-entry {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #333;
        }

        .exhibit-entry:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .exhibit-label {
            font-weight: bold;
            color: var(--accent);
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        .exhibit-decision {
            font-family: 'Courier Prime', monospace;
            color: #fff;
            margin-bottom: 4px;
        }

        .exhibit-rationale {
            color: #aaa;
            font-size: 0.85rem;
            line-height: 1.5;
            padding-left: 10px;
            border-left: 2px solid #444;
        }

        .student-verdict {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }

        .verdict-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
        }

        .verdict-value {
            font-weight: bold;
            font-size: 0.9rem;
        }

        .verdict-CROWN-text { color: #ff8888; }
        .verdict-DEFENSE-text { color: #88ff88; }
        .verdict-progress-text { color: #888; }

        select.assignment-dropdown {
            background: #1a1a1a;
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.8rem;
            transition: 0.3s;
            font-family: 'Roboto', sans-serif;
            font-weight: bold;
            outline: none;
            max-width: 280px;
        }
        select.assignment-dropdown:focus {
            border-color: var(--accent);
            background: rgba(255, 215, 0, 0.1);
        }
        select.assignment-dropdown option {
            background: #1a1a1a;
            color: #e0e0e0;
        }
        .verdict-IN_PROGRESS { background: #333; color: #aaa; }
        .verdict-SUBMITTED { background: #224422; color: #88ff88; }
    </style>
</head>
<body>

    <div class="header">
        <h1>COMMANDER DASHBOARD</h1>
        <div class="controls">
            <select id="assignment-select" class="assignment-dropdown" onchange="changeAssignment(this.value)">
                <option value="LOADING">LOADING PROJECTS...</option>
            </select>
            <button class="filter-btn active" onclick="filterClass('ALL')">ALL BLOCKS</button>
            <button class="filter-btn" onclick="filterClass('A Block (Waugh)')">A BLOCK</button>
            <button class="filter-btn" onclick="filterClass('C Block (Waugh)')">C BLOCK</button>
            <button class="filter-btn" onclick="filterClass('D Block (Hargreaves)')">D BLOCK</button>
            <button class="download-btn" onclick="downloadCSV()">DOWNLOAD CSV</button>
            <button class="download-btn" onclick="showTextView()">TEXT VIEW</button>
        </div>
    </div>

    <div id="stats">
        <div class="stat-card"><div id="stat-total" class="stat-val">0</div><div id="stat-total-label" class="stat-label">Total Agents</div></div>
        <div class="stat-card"><div id="stat-active" class="stat-val">0</div><div id="stat-active-label" class="stat-label">Active This Hour</div></div>
        <div class="stat-card"><div id="stat-guilty" class="stat-val">0</div><div id="stat-third-label" class="stat-label">Crown Verdicts</div></div>
        <div class="stat-card"><div id="stat-innocent" class="stat-val">0</div><div id="stat-fourth-label" class="stat-label">Defense Verdicts</div></div>
    </div>

    <div id="loading" class="loading">ESTABLISHING SECURE CONNECTION...</div>
    
    <div id="text-view" class="text-view-container" style="display:none;">
        <div class="text-view-header">
            <h2>STUDENT RESPONSES</h2>
            <button class="download-btn" onclick="downloadTXT()">DOWNLOAD TXT</button>
        </div>
        <div id="text-content"></div>
    </div>
    
    <table id="dash-table" style="display:none;">
        <thead>
            <tr>
                <th id="table-header-agent">Agent</th>
                <th>Block</th>
                <th>Progress</th>
                <th id="table-header-decision">Last Decision</th>
                <th id="table-header-verdict">Final Verdict</th>
                <th>Timestamp</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>

    <script>
        let allData = [];
        let currentFilter = 'ALL';
        let selectedAssignment = '';

        async function refreshData() {
            try {
                const response = await fetch(`${API_URL}?action=get_dashboard&version=2`);
                allData = await response.json();
                document.getElementById('loading').style.display = 'none';
                
                // Update assignment select list if not already populated or if assignments changed
                updateAssignmentList();
                
                if (document.getElementById('text-view').style.display !== 'none') {
                    renderTextView();
                } else {
                    document.getElementById('dash-table').style.display = 'table';
                    renderTable();
                }
            } catch (e) {
                document.getElementById('loading').innerText = "CONNECTION FAILED. CHECK API URL.";
            }
        }

        function updateAssignmentList() {
            const select = document.getElementById('assignment-select');
            
            // Extract unique assignment titles
            const uniqueAssignments = [...new Set(allData.map(d => d.missionTitle).filter(Boolean))];
            
            // Sort assignments, putting Leo first if it exists
            uniqueAssignments.sort((a, b) => {
                const aLeo = a.toLowerCase().includes('leo');
                const bLeo = b.toLowerCase().includes('leo');
                if (aLeo && !bLeo) return -1;
                if (!aLeo && bLeo) return 1;
                return a.localeCompare(b);
            });
            
            // If no assignments found, show fallback
            if (uniqueAssignments.length === 0) {
                select.innerHTML = '<option value="">No Assignments Found</option>';
                return;
            }
            
            // Save current selection to restore it
            const prevSelection = selectedAssignment;
            
            select.innerHTML = '';
            uniqueAssignments.forEach(title => {
                const opt = document.createElement('option');
                opt.value = title;
                opt.textContent = title.toUpperCase();
                select.appendChild(opt);
            });
            
            // If previous selection is still valid, select it; otherwise select the first option
            if (uniqueAssignments.includes(prevSelection)) {
                select.value = prevSelection;
                selectedAssignment = prevSelection;
            } else {
                select.value = uniqueAssignments[0];
                selectedAssignment = uniqueAssignments[0];
            }
        }

        function changeAssignment(val) {
            selectedAssignment = val;
            
            // Update table headers dynamically based on assignment
            const isLeo = selectedAssignment.toLowerCase().includes('leo');
            document.getElementById('table-header-agent').innerText = isLeo ? 'Agent' : 'Student';
            document.getElementById('table-header-decision').innerText = isLeo ? 'Last Decision' : 'Status';
            document.getElementById('table-header-verdict').innerText = isLeo ? 'Final Verdict' : 'Submission';

            if (document.getElementById('text-view').style.display !== 'none') {
                renderTextView();
            } else {
                renderTable();
            }
        }

        function getFilteredData() {
            return allData.filter(d => {
                const matchBlock = (currentFilter === 'ALL' || d.block === currentFilter);
                const matchAssignment = (d.missionTitle === selectedAssignment);
                return matchBlock && matchAssignment;
            });
        }

        function filterClass(block) {
            currentFilter = block;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(block.split(' ')[0]) || (block === 'ALL' && btn.innerText === 'ALL BLOCKS'));
            });
            if (document.getElementById('text-view').style.display !== 'none') {
                renderTextView();
            } else {
                renderTable();
            }
        }

        function togglePin(id) {
            const el = document.getElementById('pin-' + id);
            el.style.display = el.style.display === 'none' ? 'inline' : 'none';
        }

        function renderTable() {
            const body = document.getElementById('table-body');
            body.innerHTML = '';
            
            const filtered = getFilteredData();
            
            // Stats
            document.getElementById('stat-total').innerText = filtered.length;
            
            const isLeo = selectedAssignment.toLowerCase().includes('leo');
            
            // Group by student (get latest entry for each)
            const latestByStudent = {};
            filtered.forEach(d => {
                if (!latestByStudent[d.codename] || new Date(d.timestamp) > new Date(latestByStudent[d.codename].timestamp)) {
                    latestByStudent[d.codename] = d;
                }
            });

            // Calculate stats
            document.getElementById('stat-total-label').innerText = isLeo ? 'Total Agents' : 'Total Students';
            document.getElementById('stat-third-label').innerText = isLeo ? 'Crown Verdicts' : 'Submitted';
            document.getElementById('stat-fourth-label').innerText = isLeo ? 'Defense Verdicts' : 'In Progress';
            
            const latestStudents = Object.values(latestByStudent);
            
            const isFinalSubmission = (student) => {
                const status = (student.verdict || student.status || '').toUpperCase();
                return status.includes('FINAL') || status.includes('SUBMIS');
            };

            if (isLeo) {
                document.getElementById('stat-guilty').innerText = filtered.filter(d => d.verdict === 'CROWN').length;
                document.getElementById('stat-innocent').innerText = filtered.filter(d => d.verdict === 'DEFENSE').length;
            } else {
                const submittedCount = latestStudents.filter(isFinalSubmission).length;
                document.getElementById('stat-guilty').innerText = submittedCount;
                document.getElementById('stat-innocent').innerText = latestStudents.length - submittedCount;
            }
            
            // Find recent activity (last hour)
            const oneHourAgo = new Date(Date.now() - 3600000);
            document.getElementById('stat-active').innerText = filtered.filter(d => new Date(d.timestamp) > oneHourAgo).length;

            const getCleanKeys = (obj) => {
                if (!obj || typeof obj !== 'object') return [];
                return Object.keys(obj).filter(k => 
                    !k.startsWith('_') && 
                    !['timestamp', 'action', 'studentName', 'studentPin', 'classCode'].includes(k)
                );
            };

            // Calculate total steps/keys for this assignment
            let maxKeys = 0;
            latestStudents.forEach(student => {
                const keyCount = getCleanKeys(student.choices).length;
                if (keyCount > maxKeys) maxKeys = keyCount;
            });
            const totalSteps = isLeo ? 9 : (maxKeys || 1);

            latestStudents.sort((a,b) => {
                const progressA = getCleanKeys(a.choices).length;
                const progressB = getCleanKeys(b.choices).length;
                if (progressA !== progressB) return progressB - progressA;
                return new Date(b.timestamp) - new Date(a.timestamp);
            }).forEach(student => {
                const cleanChoices = getCleanKeys(student.choices).length;
                const isFinal = isFinalSubmission(student);
                
                let progressPct = (cleanChoices / totalSteps) * 100;
                if (isFinal) {
                    progressPct = 100;
                } else {
                    progressPct = Math.min(100, progressPct);
                }
                
                // Extract the PIN for the reveal feature
                const pinPart = (student.codename.match(/\(([^)]+)\)/) || [])[1] || "****";
                const displayName = student.codename.split('(')[0].trim();
                
                let progressText = `${cleanChoices}/${totalSteps} `;
                if (isLeo) {
                    progressText += 'EXHIBITS';
                } else {
                    const keys = getCleanKeys(student.choices);
                    const hasSlides = keys.some(k => k.toLowerCase().includes('slide'));
                    const hasQuestions = keys.some(k => k.toLowerCase().includes('q') || k.toLowerCase().includes('quest'));
                    if (hasSlides) {
                        progressText += 'SLIDES';
                    } else if (hasQuestions) {
                        progressText += 'QUESTIONS';
                    } else {
                        progressText += 'FIELDS';
                    }
                }

                let verdictBadge = '---';
                let lastDecisionText = '';
                
                if (isLeo) {
                    lastDecisionText = student.verdict || 'IN PROGRESS';
                    if (student.verdict) {
                        verdictBadge = `<span class="verdict-tag verdict-${student.verdict}">${student.verdict}</span>`;
                    }
                } else {
                    lastDecisionText = isFinal ? 'SUBMITTED' : 'IN PROGRESS';
                    const statusClass = isFinal ? 'verdict-SUBMITTED' : 'verdict-IN_PROGRESS';
                    const statusText = isFinal ? 'SUBMITTED' : 'IN PROGRESS';
                    verdictBadge = `<span class="verdict-tag ${statusClass}">${statusText}</span>`;
                }
                
                const finalRationale = isLeo && student.rationales && student.rationales['final_rationale'] ? student.rationales['final_rationale'] : '';

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="font-weight:bold; color:var(--accent);">
                        ${displayName} 
                        <span class="pin-display" id="pin-${student.codename.replace(/\W/g,'')}" style="display:none; color:#888; font-family:'Courier Prime'; font-size:0.7rem; margin-left:10px;">(${pinPart})</span>
                        <button onclick="togglePin('${student.codename.replace(/\W/g,'')}')" style="background:none; border:none; color:#555; cursor:pointer; font-size:0.8rem; padding:0 5px;" title="Reveal Code">👁️</button>
                    </td>
                    <td><span style="font-size:0.7rem; color:#888;">${student.block}</span></td>
                    <td>
                        <div class="progress-bar"><div class="progress-fill" style="width:${progressPct}%"></div></div>
                        <div style="font-size:0.6rem; margin-top:4px;">${progressText}</div>
                    </td>
                    <td><span style="font-family:'Courier Prime'; font-size:0.7rem;">${lastDecisionText}</span></td>
                    <td>
                        ${verdictBadge}
                        ${finalRationale ? `<div style="font-size:0.75rem; color:#aaa; margin-top:5px; max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${finalRationale.replace(/"/g, '&quot;')}">${finalRationale}</div>` : ''}
                    </td>
                    <td style="font-size:0.7rem; color:#666;">${new Date(student.timestamp).toLocaleString()}</td>
                `;
                body.appendChild(row);
            });
        }

        function downloadCSV() {
            const filtered = getFilteredData();
            if (filtered.length === 0) {
                alert('No data to export.');
                return;
            }

            const isLeo = selectedAssignment.toLowerCase().includes('leo');
            let csv = "";
            
            if (isLeo) {
                csv = "Timestamp,Block,Student,Decisions,Rationales,FinalVerdict,FinalRationale\n";
                filtered.forEach(d => {
                    const finalRationale = d.rationales ? (d.rationales['final_rationale'] || '') : '';
                    csv += `"${d.timestamp}","${d.block}","${d.codename}","${JSON.stringify(d.choices).replace(/"/g, '""')}","${JSON.stringify(d.rationales).replace(/"/g, '""')}","${d.verdict}","${finalRationale.replace(/"/g, '""')}"\n`;
                });
            } else {
                csv = "Timestamp,Block,Student,Status,Responses\n";
                filtered.forEach(d => {
                    csv += `"${d.timestamp}","${d.block}","${d.codename}","${d.verdict}","${JSON.stringify(d.choices).replace(/"/g, '""')}"\n`;
                });
            }

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', `${selectedAssignment.replace(/\W/g,'_')}_Progress_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function showTextView() {
            const textView = document.getElementById('text-view');
            const dashTable = document.getElementById('dash-table');
            
            if (textView.style.display === 'none') {
                textView.style.display = 'block';
                dashTable.style.display = 'none';
                renderTextView();
            } else {
                textView.style.display = 'none';
                dashTable.style.display = 'table';
            }
        }

        function renderTextView() {
            const filtered = getFilteredData();
            const textContent = document.getElementById('text-content');
            
            if (filtered.length === 0) {
                textContent.innerHTML = '<p style="color:#888; text-align:center; padding:40px;">No data available.</p>';
                return;
            }

            const latestByStudent = {};
            filtered.forEach(d => {
                if (!latestByStudent[d.codename] || new Date(d.timestamp) > new Date(latestByStudent[d.codename].timestamp)) {
                    latestByStudent[d.codename] = d;
                }
            });

            const byBlock = {};
            Object.values(latestByStudent).forEach(d => {
                if (!byBlock[d.block]) byBlock[d.block] = [];
                byBlock[d.block].push(d);
            });

            const isLeo = selectedAssignment.toLowerCase().includes('leo');
            
            const isFinalSubmission = (student) => {
                const status = (student.verdict || student.status || '').toUpperCase();
                return status.includes('FINAL') || status.includes('SUBMIS');
            };

            const getCleanKeys = (obj) => {
                if (!obj || typeof obj !== 'object') return [];
                return Object.keys(obj).filter(k => 
                    !k.startsWith('_') && 
                    !['timestamp', 'action', 'studentName', 'studentPin', 'classCode'].includes(k)
                );
            };

            function formatKeyName(key) {
                let formatted = key
                    .replace(/^ans-/, '')
                    .replace(/_/g, ' ')
                    .replace(/-/g, ' ')
                    .replace(/\b\w/g, c => c.toUpperCase());
                return formatted;
            }

            function formatValue(val) {
                if (val === null || val === undefined) return 'N/A';
                if (typeof val === 'string') {
                    try {
                        if (val.trim().startsWith('{') || val.trim().startsWith('[')) {
                            const parsed = JSON.parse(val);
                            return formatValue(parsed);
                        }
                    } catch (e) {}
                    return val;
                }
                if (typeof val === 'object') {
                    if (Array.isArray(val)) {
                        return val.map(item => formatValue(item)).join(', ');
                    }
                    return Object.entries(val)
                        .map(([k, v]) => `<div style="margin-top: 4px;"><strong>${formatKeyName(k)}:</strong> ${formatValue(v)}</div>`)
                        .join('');
                }
                return String(val);
            }

            let html = '';
            Object.keys(byBlock).sort().forEach(block => {
                html += `<div class="block-section">`;
                html += `<div class="block-title">${block}</div>`;

                byBlock[block].sort((a, b) => a.codename.localeCompare(b.codename)).forEach(student => {
                    const displayName = student.codename.split('(')[0].trim();
                    const choices = student.choices || {};
                    const rationales = student.rationales || {};
                    
                    const isFinal = isFinalSubmission(student);
                    const verdictText = isLeo ? (student.verdict || 'IN PROGRESS') : (isFinal ? 'SUBMITTED' : 'IN PROGRESS');
                    
                    let verdictClass = 'verdict-progress-text';
                    if (isLeo) {
                        verdictClass = student.verdict === 'CROWN' ? 'verdict-CROWN-text' : student.verdict === 'DEFENSE' ? 'verdict-DEFENSE-text' : 'verdict-progress-text';
                    } else {
                        verdictClass = isFinal ? 'verdict-DEFENSE-text' : 'verdict-progress-text';
                    }

                    html += `<div class="student-card">`;
                    html += `<div class="student-header">`;
                    html += `<span class="student-name">${displayName}</span>`;
                    html += `<span class="student-meta">${student.block} | ${new Date(student.timestamp).toLocaleString()}</span>`;
                    html += `</div>`;

                    if (isLeo) {
                        Object.keys(choices).sort().forEach(exhibit => {
                            const decision = choices[exhibit] || 'N/A';
                            const rationale = rationales[exhibit] || '';
                            
                            html += `<div class="exhibit-entry">`;
                            html += `<div class="exhibit-label">EXHIBIT ${exhibit}</div>`;
                            html += `<div class="exhibit-decision">${decision}</div>`;
                            if (rationale) {
                                html += `<div class="exhibit-rationale">${rationale}</div>`;
                            }
                            html += `</div>`;
                        });

                        const finalRationale = rationales['final_rationale'] || '';
                        html += `<div class="student-verdict">`;
                        html += `<span class="verdict-label">Final Verdict: </span>`;
                        html += `<span class="verdict-value ${verdictClass}">${verdictText}</span>`;
                        if (finalRationale) {
                            html += `<div class="exhibit-rationale" style="margin-top: 10px; font-style: italic;"><strong>Closing Statement:</strong> ${finalRationale}</div>`;
                        }
                        html += `</div>`;
                    } else {
                        // Render generic student payload
                        const cleanKeys = getCleanKeys(choices).sort();
                        cleanKeys.forEach(key => {
                            const val = choices[key];
                            html += `<div class="exhibit-entry">`;
                            html += `<div class="exhibit-label">${formatKeyName(key)}</div>`;
                            html += `<div class="exhibit-decision" style="font-family:inherit; color:#fff;">${formatValue(val)}</div>`;
                            html += `</div>`;
                        });

                        html += `<div class="student-verdict">`;
                        html += `<span class="verdict-label">Status: </span>`;
                        html += `<span class="verdict-value ${verdictClass}">${verdictText}</span>`;
                        html += `</div>`;
                    }

                    html += `</div>`;
                });

                html += `</div>`;
            });

            textContent.innerHTML = html;
        }

        function downloadTXT() {
            const filtered = getFilteredData();
            
            if (filtered.length === 0) {
                alert('No data to export.');
                return;
            }

            const latestByStudent = {};
            filtered.forEach(d => {
                if (!latestByStudent[d.codename] || new Date(d.timestamp) > new Date(latestByStudent[d.codename].timestamp)) {
                    latestByStudent[d.codename] = d;
                }
            });

            const byBlock = {};
            Object.values(latestByStudent).forEach(d => {
                if (!byBlock[d.block]) byBlock[d.block] = [];
                byBlock[d.block].push(d);
            });

            const isLeo = selectedAssignment.toLowerCase().includes('leo');
            
            const isFinalSubmission = (student) => {
                const status = (student.verdict || student.status || '').toUpperCase();
                return status.includes('FINAL') || status.includes('SUBMIS');
            };

            const getCleanKeys = (obj) => {
                if (!obj || typeof obj !== 'object') return [];
                return Object.keys(obj).filter(k => 
                    !k.startsWith('_') && 
                    !['timestamp', 'action', 'studentName', 'studentPin', 'classCode'].includes(k)
                );
            };

            function formatKeyName(key) {
                return key
                    .replace(/^ans-/, '')
                    .replace(/_/g, ' ')
                    .replace(/-/g, ' ')
                    .replace(/\b\w/g, c => c.toUpperCase());
            }

            function formatValueText(val, depth = 0) {
                if (val === null || val === undefined) return 'N/A';
                const indent = '  '.repeat(depth);
                if (typeof val === 'string') {
                    try {
                        if (val.trim().startsWith('{') || val.trim().startsWith('[')) {
                            const parsed = JSON.parse(val);
                            return formatValueText(parsed, depth);
                        }
                    } catch (e) {}
                    return val;
                }
                if (typeof val === 'object') {
                    if (Array.isArray(val)) {
                        return val.map(item => formatValueText(item, depth)).join(', ');
                    }
                    return Object.entries(val)
                        .map(([k, v]) => `\n${indent}    * ${formatKeyName(k)}: ${formatValueText(v, depth + 1)}`)
                        .join('');
                }
                return String(val);
            }

            let txt = `${selectedAssignment.toUpperCase()} - STUDENT RESPONSES\n`;
            txt += `Generated: ${new Date().toLocaleString()}\n`;
            txt += '='.repeat(50) + '\n\n';

            Object.keys(byBlock).sort().forEach(block => {
                txt += `BLOCK: ${block}\n`;
                txt += '-'.repeat(50) + '\n\n';

                byBlock[block].sort((a, b) => a.codename.localeCompare(b.codename)).forEach(student => {
                    const displayName = student.codename.split('(')[0].trim();
                    const choices = student.choices || {};
                    const rationales = student.rationales || {};
                    
                    const isFinal = isFinalSubmission(student);
                    const verdictText = isLeo ? (student.verdict || 'IN PROGRESS') : (isFinal ? 'SUBMITTED' : 'IN PROGRESS');

                    txt += `  ${displayName}\n`;
                    txt += `  Block: ${student.block} | Time: ${new Date(student.timestamp).toLocaleString()}\n`;
                    txt += '\n';

                    if (isLeo) {
                        Object.keys(choices).sort().forEach(exhibit => {
                            const decision = choices[exhibit] || 'N/A';
                            const rationale = rationales[exhibit] || '';
                            
                            txt += `    EXHIBIT ${exhibit}: ${decision}\n`;
                            if (rationale) {
                                txt += `    > ${rationale}\n`;
                            }
                            txt += '\n';
                        });

                        const finalRationale = rationales['final_rationale'] || '';
                        txt += `  VERDICT: ${verdictText}\n`;
                        if (finalRationale) {
                            txt += `  CLOSING STATEMENT: ${finalRationale}\n`;
                        }
                    } else {
                        const cleanKeys = getCleanKeys(choices).sort();
                        cleanKeys.forEach(key => {
                            const val = choices[key];
                            txt += `    ${formatKeyName(key)}: ${formatValueText(val, 2)}\n`;
                        });
                        txt += `\n  STATUS: ${verdictText}\n`;
                    }
                    txt += '\n' + '='.repeat(50) + '\n\n';
                });
            });

            const blob = new Blob([txt], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', `${selectedAssignment.replace(/\W/g,'_')}_Responses_${new Date().toISOString().split('T')[0]}.txt`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        refreshData();
        setInterval(refreshData, 30000); // Auto-refresh every 30 seconds
    </script>
</body>
</html>
