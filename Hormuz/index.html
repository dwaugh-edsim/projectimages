<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NS Advisor Network | Secure Login</title>
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #020617 url('hormuz_splash.png') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .login-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(2, 6, 23, 0.4), rgba(2, 6, 23, 0.9));
            z-index: 1;
        }

        .login-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem;
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
            text-align: center;
            position: relative;
            z-index: 2;
            animation: fadeInScale 0.8s ease-out;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .seal-large {
            width: 120px;
            height: 120px;
            background-image: url('premier_office_seal.png');
            background-size: contain;
            background-repeat: no-repeat;
            margin: 0 auto 2rem auto;
            filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.5));
        }

        .login-card h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 0.2em;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-card h2 {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            letter-spacing: 0.2em;
            font-family: var(--font-mono);
            text-transform: uppercase;
        }

        .input-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .input-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 0.75rem;
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .input-help {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
            display: block;
            line-height: 1.4;
        }

        #pin {
            font-family: var(--font-mono);
            letter-spacing: 0.5em;
            font-size: 1.5rem;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="login-overlay"></div>
    <div class="login-card">
        <div class="seal-large"></div>
        <h1>HORMUZ</h1>
        <h2>SECURE ADVISOR UPLINK</h2>

        <form id="login-form">
            <div class="input-group">
                <label>Advisor Credentials</label>
                <input type="text" id="name" required placeholder="IDENTIFY (e.g. ADVISOR SMITH)" autocomplete="off">
            </div>

            <div class="input-group">
                <label>Secure Access PIN</label>
                <input type="password" id="pin" required maxlength="4" pattern="[0-9]{4}" placeholder="••••"
                    inputmode="numeric">
                <span class="input-help">Choice of 4 digits. Required for session restoration.</span>
            </div>

            <div style="display: grid; grid-template-columns: 1fr; gap: 1rem; margin-top: 2.5rem;">
                <button type="submit" class="submit-btn" id="login-btn">
                    <span class="btn-text">INITIALIZE UPLINK</span>
                </button>
                <a href="slides.html" class="tool-btn"
                    style="text-decoration: none; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.05);">
                    STRATEGIC BRIEFING
                </a>
            </div>
        </form>
        <div style="margin-top: 2rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 1rem; text-align: center;">
            <a href="leaderboard.html" style="color: var(--text-secondary); text-decoration: none; font-size: 0.65rem; font-family: var(--font-mono); letter-spacing: 0.1em; opacity: 0.4; transition: opacity 0.3s;">LOGISTICS // VIEW SITUATION ROOM</a>
        </div>
    </div>

    <!-- Need the API file imported before our script -->
    <script src="api.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const pin = document.getElementById('pin').value;
            const btn = document.getElementById('login-btn');

            if (pin.length !== 4) {
                alert("PIN must be exactly 4 digits.");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<span class="btn-text">CONNECTING...</span>`;

            const res = await API.login(name, pin);

            if (res.status === 'success') {
                Session.setPin(pin);
                Session.setName(res.name);

                if (res.stage === 'completed') {
                    alert("This PIN has already submitted a final briefing.");
                    btn.disabled = false;
                    btn.innerHTML = `<span class="btn-text">INITIALIZE SECURE UPLINK</span>`;
                    return;
                }

                // Route to correct page based on saved state
                if (res.stage === 'practice') {
                    window.location.href = 'practice.html';
                } else if (res.stage === 'dashboard') {
                    window.location.href = 'dashboard.html';
                } else {
                    window.location.href = 'practice.html'; // Fallback
                }
            } else {
                alert(res.message || "Connection failed. Check network or PIN.");
                btn.disabled = false;
                btn.innerHTML = `<span class="btn-text">INITIALIZE SECURE UPLINK</span>`;
            }
        });
    </script>
</body>

</html>
