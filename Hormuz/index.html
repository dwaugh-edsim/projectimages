<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NS Advisor Network | Secure Login</title>
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        .login-wrapper {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-dark);
            background-image:
                radial-gradient(circle at center, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .seal-large {
            width: 64px;
            height: 64px;
            background: var(--accent);
            border-radius: 50%;
            margin: 0 auto 1.5rem auto;
            position: relative;
        }

        .seal-large::after {
            content: '';
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            border: 1px solid var(--accent);
            border-radius: 50%;
            opacity: 0.3;
        }

        .login-card h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: 0.05em;
        }

        .login-card h2 {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            letter-spacing: 0.1em;
        }

        .input-group {
            text-align: left;
        }

        .input-help {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
            display: block;
        }

        #pin {
            font-family: var(--font-mono);
            letter-spacing: 0.5em;
            font-size: 1.25rem;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="seal-large"></div>
            <h1>OFFICE OF THE PREMIER</h1>
            <h2>Economic Advisory Council</h2>

            <form id="login-form">
                <div class="input-group">
                    <label>Advisor Name(s)</label>
                    <input type="text" id="name" required placeholder="e.g. Smith & Jones" autocomplete="off">
                </div>

                <div class="input-group" style="margin-top: 1.5rem;">
                    <label>Access PIN</label>
                    <input type="password" id="pin" required maxlength="4" pattern="[0-9]{4}" placeholder="••••"
                        inputmode="numeric">
                    <span class="input-help">Choose any 4 numbers. Use this to resume your work tomorrow.</span>
                </div>

                <div style="display: grid; grid-template-columns: 1fr; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="submit-btn" id="login-btn">
                        <span class="btn-text">INITIALIZE SECURE UPLINK</span>
                    </button>
                    <a href="slides.html" class="tool-btn"
                        style="text-decoration: none; display: flex; align-items: center; justify-content: center;">
                        VIEW STRATEGIC BRIEFING
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Need the API file imported before our script -->
    <script src="api.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const pin = document.getElementById('pin').value;
            const btn = document.getElementById('login-btn');

            if (pin.length !== 4) {
                alert("PIN must be exactly 4 digits.");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<span class="btn-text">CONNECTING...</span>`;

            const res = await API.login(name, pin);

            if (res.status === 'success') {
                Session.setPin(pin);
                Session.setName(res.name);

                if (res.stage === 'completed') {
                    alert("This PIN has already submitted a final briefing.");
                    btn.disabled = false;
                    btn.innerHTML = `<span class="btn-text">INITIALIZE SECURE UPLINK</span>`;
                    return;
                }

                // Route to correct page based on saved state
                if (res.stage === 'practice') {
                    window.location.href = 'practice.html';
                } else if (res.stage === 'dashboard') {
                    window.location.href = 'dashboard.html';
                } else {
                    window.location.href = 'practice.html'; // Fallback
                }
            } else {
                alert("Connection failed. Check network or PIN.");
                btn.disabled = false;
                btn.innerHTML = `<span class="btn-text">INITIALIZE SECURE UPLINK</span>`;
            }
        });
    </script>
</body>

</html>
