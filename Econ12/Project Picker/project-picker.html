<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECON 12 | 2026 INQUIRY PROJECTS</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #000000;
            --muted: #666666;
            --border: #000000;
            --accent: #0000ff; /* Classic blue for accents */
            --highlight: #ffff00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.4;
            padding: 40px 20px;
        }

        header {
            max-width: 1000px;
            margin: 0 auto 60px auto;
            border-bottom: 4px solid var(--border);
            padding-bottom: 20px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .phase-indicator {
            display: inline-block;
            margin-top: 20px;
            padding: 5px 15px;
            background-color: var(--text);
            color: var(--bg);
            font-weight: bold;
            text-transform: uppercase;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 40px;
        }

        .card {
            border: 2px solid var(--border);
            padding: 30px;
            display: flex;
            flex-direction: column;
            position: relative;
            background: white;
            transition: box-shadow 0.2s;
        }

        .card-image {
            width: 100%;
            height: 200px;
            background: #eee;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(120%);
        }

        .card:hover {
            box-shadow: 10px 10px 0px var(--border);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border: 2px solid var(--border);
            filter: grayscale(100%) contrast(110%);
            margin-bottom: 20px;
        }

        .card-tag {
            font-weight: bold;
            text-decoration: underline;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .card-title {
            font-size: 1.6rem;
            font-weight: 900;
            margin-bottom: 20px;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .card-description {
            font-size: 1rem;
            margin-bottom: 25px;
            border-left: 3px solid var(--border);
            padding-left: 15px;
        }

        .card-examples {
            font-size: 0.9rem;
            background: #f0f0f0;
            padding: 15px;
            margin-bottom: 20px;
        }

        .card-examples h4 {
            text-transform: uppercase;
            font-size: 0.8rem;
            margin-bottom: 10px;
            text-decoration: overline underline;
        }

        .example-item {
            margin-bottom: 8px;
        }

        .card-footer {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn {
            font-family: 'Courier New', Courier, monospace;
            padding: 10px 20px;
            border: 2px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.1s;
        }

        .btn:hover {
            background: var(--text);
            color: var(--bg);
        }

        .btn-danger {
            background: #ff0000;
            color: white;
            margin-top: 15px;
            width: 100%;
        }

        .status-badge {
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .status-taken { color: #ff0000; text-decoration: line-through; }
        .status-available { color: #00aa00; }

        /* Secret Admin Trigger */
        .admin-trigger {
            position: fixed;
            top: 0; left: 0; width: 40px; height: 40px;
            cursor: crosshair;
            z-index: 9999;
        }

        /* Admin Panel */
        .admin-panel {
            position: fixed;
            top: 0; right: 0; width: 400px; height: 100vh;
            background: #eee;
            border-left: 4px solid #000;
            padding: 30px;
            z-index: 10000;
            display: none;
            overflow-y: auto;
        }

        .admin-panel.open { display: block; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9);
            display: none;
            align-items: center; justify-content: center;
            z-index: 5000;
        }

        .modal {
            border: 4px solid #000;
            background: #fff;
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        .fab {
            position: fixed; bottom: 40px; right: 40px;
            width: 60px; height: 60px;
            background: #000; color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; font-weight: bold;
            border-radius: 50%; cursor: pointer;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.2);
        }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="admin-trigger" id="adminTrigger"></div>

    <header>
        <h1>ECON 12 | 2026 INQUIRY PROJECTS</h1>
        <p class="subtitle">CASE STUDY DOSSIER: 18 CRITICAL ECONOMIC SHIFTS</p>
        <div class="phase-indicator" id="phaseIndicator">PHASE 1: INQUIRY & ANALYSIS</div>
    </header>

    <div class="container">
        <div class="grid" id="topicsGrid">
            <!-- Content will be injected here -->
        </div>
    </div>

    <div class="fab" id="suggestBtn" title="SUBMIT NEW TOPIC">+</div>

    <!-- Suggestion Modal -->
    <div class="modal-overlay" id="suggestModal">
        <div class="modal">
            <h2 style="margin-bottom: 20px;">SUBMIT NEW INQUIRY</h2>
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; font-size: 0.8rem;">YOUR NAME:</label>
                <input type="text" id="suggestStudentName" style="width: 100%; padding: 10px; border: 2px solid #000; font-family: inherit; text-transform: uppercase;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; font-size: 0.8rem;">PROPOSED TOPIC TITLE:</label>
                <input type="text" id="suggestTitle" style="width: 100%; padding: 10px; border: 2px solid #000; font-family: inherit; text-transform: uppercase;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; font-size: 0.8rem;">DESCRIPTION / HOOK:</label>
                <textarea id="suggestDescription" style="width: 100%; padding: 10px; border: 2px solid #000; font-family: inherit; height: 100px; resize: none;"></textarea>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn" id="submitSuggestion" style="flex: 1; background: #000; color: #fff;">SUBMIT DOSSIER</button>
                <button class="btn" id="closeSuggest">CANCEL</button>
            </div>
        </div>
    </div>

    <!-- Claim Modal -->
    <div class="modal-overlay" id="claimModal">
        <div class="modal">
            <h2 style="margin-bottom: 20px;">CLAIM DOSSIER</h2>
            <p id="claimTopicTitle" style="font-weight: bold; margin-bottom: 20px; text-transform: uppercase; border-bottom: 1px solid #000; padding-bottom: 10px;"></p>
            <div style="margin-bottom: 20px; display: flex; gap: 15px;">
                <div style="flex: 1;">
                    <label style="display: block; font-weight: bold; font-size: 0.8rem;">FIRST NAME:</label>
                    <input type="text" id="claimFirstName" style="width: 100%; padding: 10px; border: 2px solid #000; font-family: inherit; text-transform: uppercase;">
                </div>
                <div style="flex: 1;">
                    <label style="display: block; font-weight: bold; font-size: 0.8rem;">LAST NAME:</label>
                    <input type="text" id="claimLastName" style="width: 100%; padding: 10px; border: 2px solid #000; font-family: inherit; text-transform: uppercase;">
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn" id="submitClaim" style="flex: 1; background: #000; color: #fff;">CONFIRM CLAIM</button>
                <button class="btn" id="closeClaim">CANCEL</button>
            </div>
        </div>
    </div>

    <!-- Admin Panel -->
    <div class="admin-panel" id="adminPanel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 style="font-weight: 900;">TEACHER CMD</h2>
            <button class="btn" id="closeAdmin">X</button>
        </div>
        <div style="margin-bottom: 30px; border: 2px solid #000; padding: 15px; background: #f9f9f9;">
            <label style="font-weight: bold; display: block; margin-bottom: 10px;">SYSTEM PHASE CONTROLLER:</label>
            <select id="phaseSelect" style="width: 100%; padding: 10px; border: 2px solid #000; font-family: inherit; font-weight: bold; cursor: pointer;">
                <option value="browse">PHASE 1: INQUIRY (CATALOG MODE)</option>
                <option value="selection">PHASE 2: SELECTION (STUDENT CHOICE)</option>
            </select>
            <p style="font-size: 0.7rem; margin-top: 10px; color: #666;">Changing this updates the live database instantly.</p>
        </div>
        <h3>PENDING INTAKE</h3>
        <div id="adminSuggestions" style="margin-top: 20px;"></div>
    </div>

    <script>
        const WEB_APP_URL = 'YOUR_APPS_SCRIPT_URL_HERE';
        let currentState = { topics: [], session: {} };
        let isAdminLoggedIn = false;
        let selectedTopicId = null;

        async function fetchData() {
            try {
                if (WEB_APP_URL === 'YOUR_APPS_SCRIPT_URL_HERE') { simulateData(); return; }
                const resp = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ type: 'get_data' }) });
                const data = await resp.json();
                render(data);
            } catch (e) { simulateData(); }
        }

        function render(data) {
            currentState = data;
            const grid = document.getElementById('topicsGrid');
            const phaseLabel = document.getElementById('phaseIndicator');
            const phaseSelect = document.getElementById('phaseSelect');
            
            phaseLabel.innerText = data.session.phase === 'browse' ? 'PHASE 1: INQUIRY & ANALYSIS' : 'PHASE 2: TOPIC SELECTION';
            phaseSelect.value = data.session.phase || 'browse';
            
            grid.innerHTML = data.topics.map(t => `
                <div class="card">
                    <div class="card-tag">${t.curriculum}</div>
                    ${t.image ? `<img src="${t.image}" alt="${t.title}">` : ''}
                    <div class="card-title">${t.title}</div>
                    <div class="card-description">${t.description}</div>
                    <div class="card-examples">
                        <h4>Areas to look into:</h4>
                        ${t.examples.split('*').filter(s => s.trim()).map(s => `
                            <div class="example-item">>> ${s.trim()}</div>
                        `).join('')}
                    </div>
                    
                    <div class="card-footer">
                        ${data.session.phase === 'selection' ? `
                            <span class="status-badge ${t.status === 'taken' ? 'status-taken' : 'status-available'}">
                                ${t.status === 'taken' ? 'STRIKE: CLAIMED BY ' + t.owner : 'STATUS: AVAILABLE'}
                            </span>
                            ${t.status !== 'taken' ? `<button class="btn" onclick="openClaim('${t.id}', '${t.title}')">CLAIM</button>` : ''}
                        ` : `
                            <span class="status-badge">FILE NO: ${t.id}</span>
                            <span style="font-weight: bold; text-transform: uppercase;">[INQUIRY MODE]</span>
                        `}
                    </div>
                    ${isAdminLoggedIn ? `<button class="btn" style="margin-top: 10px; width: 100%; border-color: red; color: red;" onclick="deleteTopic('${t.id}')">ELIMINATE TOPIC</button>` : ''}
                </div>
            `).join('');
        }

        function openClaim(id, title) {
            selectedTopicId = id;
            document.getElementById('claimTopicTitle').innerText = title;
            document.getElementById('claimModal').style.display = 'flex';
        }

        document.getElementById('submitClaim').onclick = async () => {
            const firstName = document.getElementById('claimFirstName').value.trim();
            const lastName = document.getElementById('claimLastName').value.trim();
            
            if (!firstName || !lastName) return alert("ACCESS DENIED: Both First and Last names are required for the dossier.");
            
            if (WEB_APP_URL === 'YOUR_APPS_SCRIPT_URL_HERE') {
                alert("DEMO MODE: Topic claimed by " + firstName + " " + lastName);
                document.getElementById('claimModal').style.display = 'none';
                return;
            }

            const resp = await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({
                    type: 'claim_topic',
                    topicId: selectedTopicId,
                    firstName: firstName,
                    lastName: lastName
                })
            });
            const res = await resp.json();
            alert(res.message);
            if (res.status === 'success') {
                document.getElementById('claimModal').style.display = 'none';
                fetchData();
            }
        };

        document.getElementById('phaseSelect').onchange = async (e) => {
            const newVal = e.target.value;
            if (!isAdminLoggedIn) return;
            
            if (WEB_APP_URL === 'YOUR_APPS_SCRIPT_URL_HERE') {
                alert("DEMO MODE: Phase flipped to " + newVal);
                fetchData(); // Refresh UI in demo mode
                return;
            }

            const resp = await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({
                    type: 'admin_action',
                    action: 'set_phase',
                    value: newVal,
                    pin: '9999'
                })
            });
            const res = await resp.json();
            alert(res.message);
            fetchData();
        };

        async function deleteTopic(id) {
            if (!confirm("Confirm elimination of File No: " + id + "?")) return;
            if (WEB_APP_URL === 'YOUR_APPS_SCRIPT_URL_HERE') {
                alert("DEMO MODE: Topic deleted.");
                return;
            }
            const resp = await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({
                    type: 'admin_action',
                    action: 'delete_topic',
                    topicId: id,
                    pin: '9999'
                })
            });
            const res = await resp.json();
            alert(res.message);
            fetchData();
        }

        function simulateData() {
            const mock = {
                session: { phase: document.getElementById('phaseSelect').value || 'browse' },
                topics: [
                    {id: '1', title: 'Trade War or Takeover? Canada\'s U.S. Dilemma', curriculum: 'SCO 4.1', description: 'What do you do when your biggest buyer starts calling the shots—on your jobs, your prices, your future? We\'re talking about a total loss of economic sovereignty.', examples: '25% Tariff Shock: Who actually pays that tax? * Energy Dependence: If Canada\'s just the U.S. gas station, who\'s driving?', status: 'available', image: 'images/topic_1.png'},
                    {id: '2', title: 'AI vs. Your Career: Innovation or Job Killer?', curriculum: 'SCO 5.3', description: 'AI can do your homework, your art, maybe even your future job. Cool tool—or quiet takeover? Savior or doom?', examples: 'Automation Wave: Which jobs might vanish? * The Data Center Boom: Why AI is bringing coal plants back online.', status: 'available', image: 'images/topic_2.png'},
                    {id: '3', title: 'The Housing Crisis: Why Renting Feels Permanent', curriculum: 'SCO 5.1', description: 'You were told: work hard, save up, get your place. Then you saw the rent. Now "moving out" feels like a fairy tale.', examples: 'Halifax\'s Rent Surge: What $2,800/month actually costs your dreams. * Corporate Takeover: Billionaires buying whole neighbourhoods.', status: 'available', image: 'images/topic_3.png'},
                    {id: '4', title: 'Canada\'s Secret Trade War: Province vs. Province', curriculum: 'SCO 4.1', description: 'Try selling your product, moving for work, or even buying beer across borders. Suddenly, Canada feels… fractured.', examples: 'Credential Chaos: Why your nursing license works here—but not 20 minutes away. * Border Barriers: The hidden cost of internal trade rules.', status: 'available', image: 'images/topic_4.png'},
                    {id: '5', title: 'The Immigration Tightrope: Growth vs. Infrastructure', curriculum: 'SCO 4.5', description: 'Canada hit pause on immigration to ease the housing crunch. But now the strawberries are rotting and the care homes are short-staffed.', examples: 'Labour Shortages: Why farms are struggling. * The Growth Paradox: Can an economy grow without growing its population?', status: 'available', image: 'images/topic_5.png'},
                    {id: '6', title: 'EV Tariffs: Protecting Jobs or Punishing Buyers?', curriculum: 'SCO 4.1', description: 'You see a $15K electric car online. Then you learn it\'s banned in Canada. Are we protecting workers—or just making clean tech a luxury?', examples: 'The Tariff Wall: How blocking cheap imports changes what you can afford. * Factory Bailouts: The real price of keeping old-school plants alive.', status: 'available', image: 'images/topic_6.png'},
                    {id: '7', title: 'Dynamic Pricing: Is the Counter Watching You?', curriculum: 'SCO 5.3', description: 'The price on the screen just changed. Did it go up because you looked interested? Welcome to pricing that knows you better than you know yourself.', examples: 'Surge Pricing in Retail: Why your groceries cost more at 5 PM. * Personalized Tags: When apps charge you more based on your data.', status: 'available', image: 'images/topic_7.png'},
                    {id: '8', title: 'The Great Wealth Transfer: Born Rich or Just Lucky?', curriculum: 'SCO 5.1', description: 'What if your financial future depends less on your grades—and more on whether your grandparents owned a house?', examples: 'The Down Payment Advantage: How family help is reshaping who gets to buy. * Inheritance Tax Debate: Should wealth passed down fund schools?', status: 'available', image: 'images/topic_8.png'},
                    {id: '9', title: 'The 4-Day Workweek: Productivity Hack or Risk?', curriculum: 'SCO 5.3', description: 'Imagine getting paid for 40 hours but working 32. Sounds amazing. But what if your boss says "no" because competitors won\'t?', examples: 'The Productivity Boost: Why output went up during trials. * The Global Lag: Could working less mean losing contracts to teams that never log off?', status: 'available', image: 'images/topic_9.jpg'},
                    {id: '10', title: 'Arctic Shortcut: Shipping Route or Crisis?', curriculum: 'SCO 4.1', description: 'The ice is melting. A new shortcut opens. But if Canada doesn\'t control it, will someone else profit from our changing North?', examples: 'The Northwest Passage: Could this become Canada\'s "Suez Canal"? * Sovereignty Stakes: What it really costs to defend Canada\'s claim.', status: 'available', image: 'images/topic_10.jpg'},
                    {id: '11', title: 'Universal Basic Services: Cash or Infrastructure?', curriculum: 'SCO 5.1', description: 'Instead of a monthly check, what if your internet, bus ride, and basics were just… free? Would that change your life more than cash?', examples: 'The Digital Floor: How free broadband transformed a rural town. * Fare-Free Transit: What happens when bus fares drop to zero.', status: 'available', image: 'images/topic_11.jpg'},
                    {id: '12', title: 'Return-to-Office: Saving Cities or Fighting the Future?', curriculum: 'SCO 5.1', description: 'Your boss says "office," you say "home." If offices stay empty, the cities die. Is your commute a "tax" you pay to save the downtown sandwich shop?', examples: 'The Downtown Crunch: How remote work hits small businesses. * The Flexibility Fight: Why companies are losing talent to remote-first rivals.', status: 'available', image: 'images/topic_12.jpg'},
                    {id: '13', title: 'Fare-Free Transit: Public Good or Budget Trap?', curriculum: 'SCO 5.1', description: 'What if the bus was free? But what if "free" means it comes once an hour… and breaks down? Is free worth it if it doesn\'t work?', examples: 'The Luxembourg Experiment: How tax-funded transit changed movement. * The Funding Gap: When fare revenue disappears, where does the money come from?', status: 'available', image: 'images/topic_13.jpg'},
                    {id: '14', title: 'The Green Energy Cost: Leader or Priced Out?', curriculum: 'SCO 5.2', description: 'Nova Scotia is betting on wind. The U.S. is doubling down on coal. Can we afford to lead if everyone else cuts corners?', examples: 'The Atlantic Loop: A $10B clean grid vs. your hydro bill. * Industrial Flight: Moving factories to cross-border locations with cheaper power.', status: 'available', image: 'images/topic_14.jpg'},
                    {id: '15', title: 'Degree Inflation: Is University Still Worth It?', curriculum: 'SCO 5.1', description: 'You\'re told: go to university, get ahead. Then you see a welder making $100K—and a grad with $50K debt. Did the rules change?', examples: 'The Trades Premium: Why skilled workers are out-earning degree-holders. * The ROI Reality: Student debt vs. AI-replaced entry-level roles.', status: 'available', image: 'images/topic_15.jpg'},
                    {id: '16', title: 'Right to Repair: Good for Planet, Bad for GDP?', curriculum: 'SCO 5.2', description: 'New laws blowing up "Planned Obsolescence." This is great for the planet, but it’s a nightmare for economic growth (GDP).', examples: 'The Repair Boom: How community fix-it hubs cut waste. * The GDP Trade-off: Can an economy thrive on "enough" instead of "more"?', status: 'available', image: 'images/topic_16.jpg'},
                    {id: '17', title: 'The Attention Economy: Is Viral a Real Career?', curriculum: 'SCO 5.1', description: '1% of creators make 99% of the money. We’re moving away from making things and toward making noise. Is this sustainable or a pyramid scheme?', examples: 'The Influencer Tax: CRA demanding taxes on "free" gifts. * Virtual Influencers: Why brands are hiring AI over real people.', status: 'available', image: 'images/topic_17.jpg'},
                    {id: '18', title: 'The Side Hustle Trap: Freedom or Burnout?', curriculum: 'SCO 5.1', description: 'When does "extra cash" become a second full-time job—with no benefits? Is flexibility worth the financial insecurity?', examples: 'The Gig Math: After gas and fees, what\'s your actual hourly wage? * The Benefits Gap: No sick days, no pension, no EI.', status: 'available', image: 'images/topic_18.png'}
                ]
            };
            render(mock);
        }

        // Event Listeners
        document.getElementById('suggestBtn').onclick = () => {
            document.getElementById('suggestModal').style.display = 'flex';
        };
        document.getElementById('closeSuggest').onclick = () => {
            document.getElementById('suggestModal').style.display = 'none';
        };
        document.getElementById('submitSuggestion').onclick = async () => {
            const name = document.getElementById('suggestStudentName').value.trim();
            const title = document.getElementById('suggestTitle').value.trim();
            const desc = document.getElementById('suggestDescription').value.trim();
            
            if (!name || !title || !desc) return alert("ACCESS DENIED: All dossier fields are mandatory.");
            
            if (WEB_APP_URL === 'YOUR_APPS_SCRIPT_URL_HERE') {
                alert("DEMO MODE: Suggestion logged for " + name);
                document.getElementById('suggestModal').style.display = 'none';
                return;
            }

            const resp = await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({
                    type: 'suggest_topic',
                    studentName: name,
                    title: title,
                    description: desc
                })
            });
            const res = await resp.json();
            alert(res.message);
            document.getElementById('suggestModal').style.display = 'none';
            document.getElementById('suggestStudentName').value = '';
            document.getElementById('suggestTitle').value = '';
            document.getElementById('suggestDescription').value = '';
        };

        document.getElementById('closeClaim').onclick = () => document.getElementById('claimModal').style.display = 'none';
        
        // Admin Trigger
        document.getElementById('adminTrigger').onclick = () => {
            const pin = prompt("ENTER ACCESS CODE:");
            if (pin === '9999') {
                isAdminLoggedIn = true;
                fetchData();
                document.getElementById('adminPanel').classList.add('open');
            }
        };
        document.getElementById('closeAdmin').onclick = () => {
            isAdminLoggedIn = false;
            fetchData();
            document.getElementById('adminPanel').classList.remove('open');
        };

        fetchData();
    </script>
</body>
</html>
