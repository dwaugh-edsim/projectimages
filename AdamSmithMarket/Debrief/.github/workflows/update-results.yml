name: Update Student Results

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  update-results:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          cd projectimages/AdamSmithMarket/Debrief/scripts
          npm install
      
      - name: Generate updated results
        run: |
          cd projectimages/AdamSmithMarket/Debrief/scripts
          node update-results.js
      
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add projectimages/AdamSmithMarket/Debrief/answerresults.html
          git add projectimages/AdamSmithMarket/Debrief/stuwork3-28
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update student results $(date '+%Y-%m-%d %H:%M')"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
