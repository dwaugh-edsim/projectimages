<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphing Debug Utility | Operation Hormuz</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: #020617;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            text-align: center;
        }

        .debug-container {
            background: #0f172a;
            padding: 3rem;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 0 50px rgba(59, 130, 246, 0.2);
            max-width: 600px;
            width: 90%;
        }

        h1 {
            color: #3b82f6;
            margin-bottom: 0.5rem;
            font-size: 2rem;
            letter-spacing: -0.02em;
        }

        p {
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        .debug-btn {
            background: #1e293b;
            color: white;
            border: 1px solid #334155;
            padding: 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .debug-btn:hover {
            background: #1d4ed8;
            border-color: #3b82f6;
            transform: translateY(-2px);
        }

        .debug-btn span {
            font-size: 0.8rem;
            font-weight: 400;
            opacity: 0.7;
        }

        .btn-danger {
            margin-top: 2rem;
            background: transparent;
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-danger:hover {
            background: #ef4444;
            color: white;
        }
    </style>
</head>

<body>
    <div class="debug-container">
        <h1>GRAPHING TEST PORTAL</h1>
        <p>Bypass briefing and login for rapid simulation testing.</p>

        <div class="btn-grid">
            <a href="practice.html" class="debug-btn" onclick="initDebugSession()">
                TEST TRAINING SIMULATOR
                <span>7 Stages / Socratic Checks / AI Hints</span>
            </a>
            <a href="dashboard.html" class="debug-btn" onclick="initDebugSession()">
                TEST LIVE DASHBOARD
                <span>Crisis Modeling / Supply Shock / Final Briefing</span>
            </a>
        </div>

        <button class="btn-danger" onclick="clearSession()">RESET DEBUG STATE</button>
    </div>

    <script>
        function initDebugSession() {
            sessionStorage.setItem('hormuz_pin', '9999');
            sessionStorage.setItem('hormuz_name', 'Test Advisor');
            console.log("Debug session initialized: Advisor 9999");
        }

        function clearSession() {
            sessionStorage.clear();
            alert("Session cleared.");
        }
    </script>
</body>

</html>
