# Render Blueprint config for the Risk multiplayer server.
# Deploys a single free-tier Node.js Web Service that serves the static client
# and runs the WebSocket game server. The repo root is `projectimages`, and the
# server lives at Risk/server, so this service uses that as its root.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: risk-multiplayer
    runtime: node
    rootDir: Risk/server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 18.0.0
