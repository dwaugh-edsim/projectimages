<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NS Supreme Court Simulation - Progress</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a2a3a, #2c3e50);
            color: white;
            min-height: 100vh;
            overflow: hidden;
        }
        .header {
            text-align: center;
            padding: 10px;
            background: rgba(0,0,0,0.4);
            border-bottom: 3px solid #d4af37;
        }
        .header img {
            max-height: 80px;
            width: auto;
            margin-bottom: 5px;
        }
        .header h1 {
            font-size: 2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .section-toggle {
            text-align: center;
            padding: 10px;
        }
        .section-toggle button {
            padding: 10px 25px;
            margin: 0 10px;
            font-size: 1.3em;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }
        .section-toggle button.active {
            background: #e67e22;
        }
        .status {
            text-align: center;
            padding: 8px;
            font-size: 1.2em;
            background: rgba(0,0,0,0.5);
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1800px;
            margin: 10px auto;
            padding: 0 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: 200px repeat(6, 1fr);
            gap: 4px;
        }
        .header-row, .student-row > div {
            padding: 12px;
            text-align: center;
            background: rgba(255,255,255,0.08);
            font-size: 1.2em;
        }
        .header-row {
            background: #8b4513;
            font-weight: bold;
            font-size: 1.3em;
        }
        .name-cell {
            text-align: left !important;
            font-weight: bold;
            border-right: 3px solid #d4af37;
            padding-left: 15px;
        }
        .complete {
            color: #2ecc71;
            font-size: 1.7em;
            animation: glow 1.5s ease-in-out infinite alternate;
        }
        .incomplete {
            color: #e74c3c;
            font-size: 1.5em;
        }
        @keyframes glow {
            from { text-shadow: 0 0 8px #2ecc71; }
            to { text-shadow: 0 0 20px #2ecc71; }
        }
        .last-update {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: rgba(0,0,0,0.7);
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 1.1em;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
</head>
<body>

    <div class="header">
        <img src="header.png" alt="Courtroom Header">
        <h1>Nova Scotia Supreme Court Simulation</h1>
    </div>

    <div class="section-toggle">
        <button id="sectionA" class="active">Section A</button>
        <button id="sectionB">Section B</button>
    </div>

    <div class="status" id="status">Loading progress...</div>

    <div class="grid-container" id="gridContainer"></div>

    <div class="last-update" id="lastUpdate">Last update: never</div>

    <script>
        // ====================== CONFIGURATION ======================
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbz5wqHHqb86akk2MFchOzr2qEGDct29HlwyuVE1vBR2nbXavdH6JZOMwBNpP-fBD6J_/exec';

        const CONFIG = {
            stages: ['A', 'B', 'C', 'D', 'E', 'FINAL_VERDICT'],
            stageDisplayNames: ['A', 'B', 'C', 'D', 'E', 'Final Verdict'],
            nameColumnIndex: 2,
            stageColumnIndex: 3,
            refreshInterval: 10000
        };
        // ===========================================================

        let submissions = [];
        let rosterA = [];
        let rosterB = [];
        let currentSection = 'A';

        const fuseOptions = { includeScore: true, threshold: 0.4, keys: ['name'] };

        async function fetchData() {
            try {
                const response = await fetch(WEB_APP_URL + '?t=' + Date.now());
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();

                submissions = data.submissions ? data.submissions.slice(1) : [];
                rosterA = data.sectionA || [];
                rosterB = data.sectionB || [];

                renderGrid();
                document.getElementById('status').textContent = `Loaded ${submissions.length} submissions`;
            } catch (e) {
                document.getElementById('status').textContent = 'Error loading data';
                console.error(e);
            }
            document.getElementById('lastUpdate').textContent = `Last update: ${new Date().toLocaleTimeString()}`;
        }

        function renderGrid() {
            const roster = currentSection === 'A' ? rosterA : rosterB;
            const fuse = new Fuse(roster.map(name => ({name: name.trim()})), fuseOptions);

            const progress = {};
            roster.forEach(name => {
                const trimmed = name.trim();
                progress[trimmed] = CONFIG.stages.reduce((obj, stage) => ({...obj, [stage]: false}), {});
            });

            // Use a set to track completed stage per student to avoid duplicates
            const completed = new Set();

            submissions.forEach(row => {
                if (row.length < 4) return;

                let stageLetter = row[CONFIG.stageColumnIndex]?.toString().trim().toUpperCase();
                if (!CONFIG.stages.includes(stageLetter)) return;

                const submittedNameRaw = row[CONFIG.nameColumnIndex];
                if (!submittedNameRaw) return;

                const submittedName = submittedNameRaw.toString().trim();
                const firstName = submittedName.split(' ')[0];

                const searchResult = fuse.search(firstName);
                let matchedName = null;
                if (searchResult.length > 0 && searchResult[0].score < 0.5) {
                    matchedName = searchResult[0].item.name.trim();
                }

                if (matchedName && progress[matchedName]) {
                    const key = matchedName + '|' + stageLetter;
                    if (!completed.has(key)) {
                        progress[matchedName][stageLetter] = true;
                        completed.add(key);
                    }
                }
            });

            const sortedStudents = Object.keys(progress).map(name => ({
                name,
                progress: progress[name],
                completedCount: Object.values(progress[name]).filter(v => v).length
            })).sort((a, b) => b.completedCount - a.completedCount || a.name.localeCompare(b.name));

            const mid = Math.ceil(sortedStudents.length / 2);
            const leftColumn = sortedStudents.slice(0, mid);
            const rightColumn = sortedStudents.slice(mid);

            const container = document.getElementById('gridContainer');
            container.innerHTML = '';

            [leftColumn, rightColumn].forEach(column => {
                const grid = document.createElement('div');
                grid.className = 'grid';

                const header = document.createElement('div');
                header.className = 'header-row';
                header.style.display = 'contents';
                header.innerHTML = `<div class="name-cell">Student</div>${CONFIG.stageDisplayNames.map(s => `<div>${s}</div>`).join('')}`;
                grid.appendChild(header);

                column.forEach(student => {
                    const row = document.createElement('div');
                    row.style.display = 'contents';

                    const nameCell = document.createElement('div');
                    nameCell.className = 'name-cell';
                    nameCell.textContent = student.name;
                    row.appendChild(nameCell);

                    CONFIG.stages.forEach(stage => {
                        const cell = document.createElement('div');
                        cell.innerHTML = student.progress[stage] ? '✓' : '✗';
                        cell.classList.add(student.progress[stage] ? 'complete' : 'incomplete');
                        row.appendChild(cell);
                    });

                    grid.appendChild(row);
                });

                container.appendChild(grid);
            });
        }

        document.getElementById('sectionA').onclick = () => {
            currentSection = 'A';
            document.getElementById('sectionA').classList.add('active');
            document.getElementById('sectionB').classList.remove('active');
            renderGrid();
        };

        document.getElementById('sectionB').onclick = () => {
            currentSection = 'B';
            document.getElementById('sectionB').classList.add('active');
            document.getElementById('sectionA').classList.remove('active');
            renderGrid();
        };

        fetchData();
        setInterval(fetchData, CONFIG.refreshInterval);
    </script>
</body>
</html>
