<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Student 3-Letter PIN Cards & Class Rosters | Room 8</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Roboto+Slab:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #ffffff;
            --text-main: #3d4449;
            --text-heading: #2e3842;
            --text-muted: #7f888f;
            --border: #e5e5e5;
            --border-hr: #d2d7d9;
            --accent: #1e40af;
            --accent-light: #f0f4fa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: "Open Sans", sans-serif;
            font-size: 11pt;
            line-height: 1.5;
            padding: 24px;
        }

        .wrapper {
            max-width: 1040px;
            margin: 0 auto;
        }

        .no-print-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent);
            color: #ffffff;
            border: solid 2px var(--accent);
            border-radius: 4px;
            font-family: "Roboto Slab", Georgia, serif;
            font-size: 0.75em;
            font-weight: 700;
            padding: 0.4em 1em;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-heading);
            border: solid 2px var(--text-heading);
        }

        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-btn {
            background: #f1f5f9;
            border: 1px solid var(--border-hr);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-heading);
        }

        .filter-btn.active {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        /* Card Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .pin-card {
            border: 1.5px dashed #94a3b8;
            border-radius: 6px;
            padding: 10px 12px;
            background: #ffffff;
            position: relative;
            page-break-inside: avoid;
        }

        .pin-card-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.72em;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .student-name {
            font-family: "Roboto Slab", Georgia, serif;
            font-size: 0.95em;
            font-weight: 700;
            color: var(--text-heading);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pin-display {
            background: #f8fafc;
            border: 1px solid var(--border-hr);
            border-radius: 4px;
            padding: 4px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
        }

        .pin-code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 1.25em;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 0.1em;
        }

        .pin-meta {
            font-size: 0.7em;
            color: var(--text-muted);
            text-align: right;
        }

        /* Table View */
        .roster-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88em;
            margin-bottom: 30px;
        }

        .roster-table th {
            background: #f8fafc;
            border: 1px solid var(--border-hr);
            padding: 8px 10px;
            font-family: "Roboto Slab", serif;
            text-align: left;
            font-size: 0.85em;
            text-transform: uppercase;
        }

        .roster-table td {
            border: 1px solid var(--border);
            padding: 6px 10px;
        }

        .roster-table tr:nth-child(even) {
            background: #fafafa;
        }

        .badge-pin {
            font-family: monospace;
            font-weight: 700;
            background: #eff6ff;
            color: #1e40af;
            border: 1px solid #bfdbfe;
            padding: 2px 6px;
            border-radius: 3px;
        }

        @media print {
            body { padding: 0; font-size: 9pt; }
            .no-print-bar, .filter-bar { display: none; }
            .cards-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
            .pin-card { border: 1px dashed #666; }
        }
    </style>
</head>
<body>

    <div class="wrapper">

        <div class="no-print-bar">
            <div>
                <strong style="font-size: 1.1em; color: var(--text-heading);">Room 8 — Student 3-Letter PIN Directory</strong>
                <div style="font-size: 0.85em; color: var(--text-muted);">198 Students &bull; Grades 8 & 9 &bull; Bicentennial Jr High</div>
            </div>
            <div style="display: flex; gap: 8px;">
                <a href="../Day1_Deliverables/index.html" class="btn btn-secondary">&larr; Materials Hub</a>
                <button class="btn" onclick="window.print()">Print Cards (8.5&times;11)</button>
            </div>
        </div>

        <div class="filter-bar">
            <span style="font-weight: 700; font-size: 0.85em;">Filter by Class:</span>
            <button class="filter-btn active" onclick="filterClass('ALL')">All Classes (198)</button>
            <button class="filter-btn" onclick="filterClass('801')">HE 801 (28)</button>
            <button class="filter-btn" onclick="filterClass('802')">HE 802 (28)</button>
            <button class="filter-btn" onclick="filterClass('803')">HE 803 (28)</button>
            <button class="filter-btn" onclick="filterClass('804')">HE 804 (28)</button>
            <button class="filter-btn" onclick="filterClass('901')">Cit/HL 901 (28)</button>
            <button class="filter-btn" onclick="filterClass('902')">Cit/HL 902 (29)</button>
            <button class="filter-btn" onclick="filterClass('903')">Cit/HL 903 (29)</button>
            <input type="text" id="searchInput" placeholder="Search name or PIN..." onkeyup="searchStudents()" style="padding: 6px 10px; border: 1px solid var(--border-hr); border-radius: 4px; font-size: 0.85em; margin-left: auto;">
        </div>

        <!-- Student Cards Grid -->
        <div class="cards-grid" id="cardsGrid">
            <!-- Populated via JS -->
        </div>

    </div>

    <script>
        let students = [];

        async function loadData() {
            try {
                const res = await fetch('students_roster.json');
                students = await res.json();
                renderCards(students);
            } catch (e) {
                console.error("Failed to load roster:", e);
            }
        }

        function renderCards(list) {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';
            list.forEach(s => {
                const card = document.createElement('div');
                card.className = 'pin-card';
                card.dataset.homeroom = s.homeroom;
                card.dataset.search = `${s.first_name} ${s.last_name} ${s.pin} ${s.student_id}`.toLowerCase();
                
                card.innerHTML = `
                    <div class="pin-card-header">
                        <span>Room 8 &bull; ${s.homeroom}</span>
                        <span>Gr ${s.grade}</span>
                    </div>
                    <div class="student-name" title="${s.first_name} ${s.last_name}">${s.first_name} ${s.last_name}</div>
                    <div style="font-size: 0.72em; color: var(--accent); font-weight: 600; margin-bottom: 4px;">
                        ${s.course_label || (s.grade === 9 ? 'Citizenship 9 & Healthy Living 9' : 'Healthy Living 8')}
                    </div>
                    <div class="pin-display">
                        <div class="pin-code">${s.pin}</div>
                        <div class="pin-meta">
                            <div>PIN CODE</div>
                            <div style="font-size:0.85em; opacity:0.8;">ID: ...${s.student_id.slice(-4)}</div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterClass(hr) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            
            if (hr === 'ALL') {
                renderCards(students);
            } else {
                const filtered = students.filter(s => s.homeroom === hr);
                renderCards(filtered);
            }
        }

        function searchStudents() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = students.filter(s => {
                return `${s.first_name} ${s.last_name} ${s.pin} ${s.homeroom}`.toLowerCase().includes(q);
            });
            renderCards(filtered);
        }

        window.onload = loadData;
    </script>
</body>
</html>
