<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Room 8 — Teacher PIN Kiosk & Student Lookup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Roboto+Slab:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #0f172a;
            --surface: #1e293b;
            --surface-card: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.2);
            --gold: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: "Open Sans", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
            user-select: none;
            -webkit-user-select: none;
        }

        .header-bar {
            background: var(--surface);
            border-radius: 12px;
            padding: 14px 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border: 1px solid #475569;
        }

        .header-title {
            font-family: "Roboto Slab", Georgia, serif;
            font-size: 1.15em;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-title span {
            color: var(--accent);
        }

        .controls-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        select {
            background: var(--surface-card);
            color: #ffffff;
            border: 1.5px solid #64748b;
            padding: 10px 14px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }

        select:focus {
            border-color: var(--accent);
        }

        /* Main Kiosk Layout */
        .kiosk-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 16px;
            flex: 1;
        }

        /* Left Student List Drawer */
        .roster-drawer {
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid #475569;
            padding: 12px;
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 120px);
        }

        .drawer-search {
            width: 100%;
            background: var(--surface-card);
            border: 1px solid #64748b;
            border-radius: 6px;
            padding: 8px 12px;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .drawer-search:focus { outline: none; border-color: var(--accent); }

        .student-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .student-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95em;
            border: 1px solid transparent;
        }

        .student-item:hover {
            background: var(--surface-card);
        }

        .student-item.active {
            background: var(--accent);
            color: #ffffff;
            font-weight: 700;
        }

        /* Big Stage Card */
        .stage-card {
            background: var(--surface);
            border-radius: 16px;
            border: 2px solid #475569;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .badge-homeroom {
            background: rgba(59, 130, 246, 0.15);
            color: #93c5fd;
            border: 1px solid #3b82f6;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }

        .stage-name {
            font-family: "Roboto Slab", Georgia, serif;
            font-size: 3.2em;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 6px;
            color: #ffffff;
            letter-spacing: -0.01em;
        }

        .stage-courses {
            font-size: 1.15em;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        /* Giant PIN Box */
        .pin-box {
            background: #0f172a;
            border: 3px solid var(--accent);
            border-radius: 16px;
            padding: 24px 60px;
            margin-bottom: 28px;
            box-shadow: 0 0 40px var(--accent-glow);
            cursor: pointer;
            transition: transform 0.15s;
        }

        .pin-box:hover {
            transform: scale(1.02);
        }

        .pin-label {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 700;
        }

        .giant-pin {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 5.5em;
            font-weight: 900;
            letter-spacing: 0.18em;
            color: #38bdf8;
            line-height: 1;
        }

        /* Navigation Arrows for Walking Classroom */
        .nav-buttons {
            display: flex;
            gap: 16px;
            width: 100%;
            max-width: 480px;
        }

        .nav-btn {
            flex: 1;
            background: var(--surface-card);
            border: 2px solid #64748b;
            color: #ffffff;
            padding: 14px;
            border-radius: 10px;
            font-family: "Roboto Slab", serif;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
        }

        .nav-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .nav-btn:active {
            transform: scale(0.97);
        }

        @media (max-width: 768px) {
            .kiosk-container { grid-template-columns: 1fr; }
            .roster-drawer { max-height: 200px; }
            .stage-name { font-size: 2.2em; }
            .giant-pin { font-size: 4em; }
            .pin-box { padding: 18px 30px; }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="header-title">
            🔒 Room 8 <span>Teacher PIN Kiosk</span>
        </div>
        <div class="controls-group">
            <select id="classSelect" onchange="onClassChange()">
                <option value="ALL">All Classes (198)</option>
                <option value="801">HE 801 (28)</option>
                <option value="802">HE 802 (28)</option>
                <option value="803">HE 803 (28)</option>
                <option value="804">HE 804 (28)</option>
                <option value="901">CIT / HL 901 (28)</option>
                <option value="902">CIT / HL 902 (29)</option>
                <option value="903" selected>CIT / HL 903 (29)</option>
            </select>

            <select id="studentSelect" onchange="onStudentDropdownChange()" style="max-width: 260px;">
                <!-- Populated dynamically -->
            </select>
        </div>
    </div>

    <div class="kiosk-container">

        <!-- Left Drawer -->
        <div class="roster-drawer">
            <input type="text" id="searchInput" class="drawer-search" placeholder="Search student name..." onkeyup="filterRosterList()">
            <div class="student-list" id="studentList">
                <!-- Populated dynamically -->
            </div>
        </div>

        <!-- Big Display Stage -->
        <div class="stage-card" id="stageCard">
            <div class="badge-homeroom" id="stageBadge">Room 8 &bull; Homeroom 903</div>
            <div class="stage-name" id="stageName">Select a Student</div>
            <div class="stage-courses" id="stageCourses">Citizenship 9 &bull; Healthy Living 9</div>

            <div class="pin-box" onclick="flashPin()">
                <div class="pin-label">Student 3-Letter PIN</div>
                <div class="giant-pin" id="stagePin">---</div>
            </div>

            <div class="nav-buttons">
                <button class="nav-btn" onclick="prevStudent()">&larr; Previous</button>
                <button class="nav-btn" onclick="nextStudent()">Next Student &rarr;</button>
            </div>
        </div>

    </div>

    <script>
        let allStudents = [];
        let filteredStudents = [];
        let currentIndex = 0;

        async function loadData() {
            try {
                const res = await fetch('students_roster.json');
                allStudents = await res.json();
                onClassChange();
            } catch (e) {
                console.error("Failed to load student roster:", e);
            }
        }

        function onClassChange() {
            const hr = document.getElementById('classSelect').value;
            if (hr === 'ALL') {
                filteredStudents = [...allStudents];
            } else {
                filteredStudents = allStudents.filter(s => s.homeroom === hr);
            }
            populateDropdown();
            renderDrawerList();
            if (filteredStudents.length > 0) {
                selectStudent(0);
            }
        }

        function populateDropdown() {
            const sel = document.getElementById('studentSelect');
            sel.innerHTML = '';
            filteredStudents.forEach((s, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.innerText = `${s.first_name} ${s.last_name}`;
                sel.appendChild(opt);
            });
        }

        function renderDrawerList() {
            const listEl = document.getElementById('studentList');
            listEl.innerHTML = '';
            filteredStudents.forEach((s, idx) => {
                const item = document.createElement('div');
                item.className = `student-item ${idx === currentIndex ? 'active' : ''}`;
                item.id = `item-${idx}`;
                item.innerHTML = `
                    <span>${s.first_name} ${s.last_name}</span>
                    <span style="font-family: monospace; opacity: 0.8;">${s.pin}</span>
                `;
                item.onclick = () => selectStudent(idx);
                listEl.appendChild(item);
            });
        }

        function filterRosterList() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            filteredStudents.forEach((s, idx) => {
                const el = document.getElementById(`item-${idx}`);
                if (el) {
                    const match = `${s.first_name} ${s.last_name} ${s.pin}`.toLowerCase().includes(q);
                    el.style.display = match ? 'flex' : 'none';
                }
            });
        }

        function selectStudent(idx) {
            if (idx < 0 || idx >= filteredStudents.length) return;
            currentIndex = idx;
            const s = filteredStudents[idx];

            document.getElementById('stageBadge').innerText = `Room 8 • Homeroom ${s.homeroom} • Grade ${s.grade}`;
            document.getElementById('stageName').innerText = `${s.first_name} ${s.last_name}`;
            document.getElementById('stageCourses').innerText = s.course_label || (s.grade === 9 ? 'Citizenship 9 & Healthy Living 9' : 'Healthy Living 8');
            document.getElementById('stagePin').innerText = s.pin;

            document.getElementById('studentSelect').value = idx;

            document.querySelectorAll('.student-item').forEach(el => el.classList.remove('active'));
            const activeItem = document.getElementById(`item-${idx}`);
            if (activeItem) {
                activeItem.classList.add('active');
                activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        function onStudentDropdownChange() {
            const idx = parseInt(document.getElementById('studentSelect').value, 10);
            selectStudent(idx);
        }

        function nextStudent() {
            if (currentIndex < filteredStudents.length - 1) {
                selectStudent(currentIndex + 1);
            }
        }

        function prevStudent() {
            if (currentIndex > 0) {
                selectStudent(currentIndex - 1);
            }
        }

        function flashPin() {
            const el = document.getElementById('stagePin');
            el.style.color = '#f59e0b';
            setTimeout(() => el.style.color = '#38bdf8', 300);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextStudent();
            if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevStudent();
        });

        window.onload = loadData;
    </script>
</body>
</html>
