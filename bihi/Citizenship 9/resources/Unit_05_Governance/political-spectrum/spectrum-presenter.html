<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizenship 9 | Political Spectrum Presenter</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
</head>

<body id="presenter-body">

    <div class="presenter-container">

        <div id="counter" class="counter">Question 1 of 20</div>

        <div id="statement-card" class="statement-card fade-in">
            <h1 id="statement-text" class="statement-text">Ready to begin the Political Spectrum activity?</h1>

            <div id="alignment-reveal" class="alignment-reveal">
                <div id="reveal-left" class="reveal-side reveal-left">LEFT</div>
                <div id="reveal-right" class="reveal-side reveal-right">RIGHT</div>
            </div>

            <div id="vote-controls" class="vote-controls">
                <button id="disagree-btn" class="vote-btn disagree-btn" style="display: none;">
                    <span class="arrow">←</span>
                    <span class="label">DISAGREE<br><small>Move LEFT</small></span>
                </button>
                <button id="agree-btn" class="vote-btn agree-btn" style="display: none;">
                    <span class="label">AGREE<br><small>Move RIGHT</small></span>
                    <span class="arrow">→</span>
                </button>
            </div>
        </div>

        <div class="controls">
            <button id="prev-btn" class="btn-secondary" style="display: none;">Previous</button>
            <button id="reveal-btn" class="btn-primary" style="display: none;">Reveal Alignment</button>
            <button id="next-btn" class="btn-primary">Start Activity</button>
        </div>

    </div>

    <!-- Navigation to HQ -->
    <a href="election-hq.html"
        style="position: fixed; bottom: 2rem; left: 2rem; color: var(--text-muted); text-decoration: none; font-size: 0.8rem; opacity: 0.5;">Switch
        to Election HQ</a>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
        // Specific init for Presenter
        document.addEventListener('DOMContentLoaded', () => {
            initPresenter();
        });
    </script>
</body>

</html>
