<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizenship 9 — Heritage Minutes Live Leaderboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            padding: 2rem;
        }

        .lcd-container {
            max-width: 1800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: 900;
            text-transform: uppercase;
            color: #f59e0b;
            letter-spacing: -2px;
            text-shadow: 0 0 60px rgba(245, 158, 11, 0.4);
        }

        .header .subtitle {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(1rem, 2.5vw, 1.8rem);
            font-weight: 700;
            text-transform: uppercase;
            color: #3b82f6;
            margin-top: 0.5rem;
            letter-spacing: 4px;
        }

        .stats-row {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .stat-box {
            text-align: center;
            background: rgba(255,255,255,0.05);
            border: 2px solid #f59e0b;
            padding: 1.5rem 3rem;
            min-width: 180px;
        }

        .stat-number {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 900;
            color: #f59e0b;
            line-height: 1;
        }

        .stat-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(0.7rem, 1.2vw, 1rem);
            text-transform: uppercase;
            color: #94a3b8;
            margin-top: 0.5rem;
        }

        .leaderboard-grid {
            display: grid;
            gap: 1rem;
        }

        .lb-row {
            display: grid;
            grid-template-columns: 80px 1fr 150px 150px 150px 200px;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.5rem;
            background: #1e293b;
            border: 2px solid #475569;
            transition: all 0.3s;
        }

        .lb-row.top-1 {
            border-color: #f59e0b;
            background: linear-gradient(90deg, rgba(245, 158, 11, 0.1), transparent);
        }

        .lb-row.top-2 {
            border-color: #94a3b8;
            background: linear-gradient(90deg, rgba(148, 163, 184, 0.1), transparent);
        }

        .lb-row.top-3 {
            border-color: #b45309;
            background: linear-gradient(90deg, rgba(180, 83, 9, 0.1), transparent);
        }

        .lb-rank {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2rem;
            font-weight: 900;
            text-align: center;
        }

        .lb-name {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .lb-score {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 900;
            color: #f59e0b;
            text-align: center;
        }

        .lb-answered {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            color: #94a3b8;
            text-align: center;
        }

        .lb-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            color: #3b82f6;
            text-align: center;
        }

        .lb-progress-track {
            height: 16px;
            background: #334155;
            border-radius: 8px;
            overflow: hidden;
        }

        .lb-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #f59e0b, #3b82f6);
            transition: width 1s ease;
            border-radius: 8px;
        }

        .lb-header {
            background: #334155;
            border-color: #475569;
        }

        .lb-header div {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #94a3b8;
            text-align: center;
        }

        .lb-header div:first-child,
        .lb-header div:nth-child(2) {
            text-align: left;
        }

        .refresh-info {
            text-align: center;
            margin-top: 2rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: #64748b;
        }

        .live-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #10b981;
            border-radius: 50%;
            margin-right: 8px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .no-data {
            text-align: center;
            padding: 4rem;
            font-size: 1.5rem;
            color: #64748b;
        }

        @media (max-width: 1200px) {
            .lb-row {
                grid-template-columns: 60px 1fr 100px 100px;
            }
            .lb-row > :nth-child(5),
            .lb-row > :nth-child(6) {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="lcd-container">
        <div class="header">
            <h1>Heritage Minutes Challenge</h1>
            <p class="subtitle">Citizenship 9 — Live Leaderboard</p>
        </div>

        <div class="stats-row">
            <div class="stat-box">
                <div class="stat-number" id="activePlayers">0</div>
                <div class="stat-label">Active Players</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="totalAnswers">0</div>
                <div class="stat-label">Total Answers</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="highScore">0</div>
                <div class="stat-label">High Score</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="totalQuestions">22</div>
                <div class="stat-label">Questions</div>
            </div>
        </div>

        <div class="leaderboard-grid" id="leaderboardGrid">
            <div class="lb-row lb-header">
                <div>Rank</div>
                <div>Student</div>
                <div>Score</div>
                <div>Answered</div>
                <div>Time</div>
                <div>Progress</div>
            </div>
        </div>

        <div class="refresh-info">
            <span class="live-dot"></span> Auto-refreshing every 10 seconds — data from local storage
        </div>
    </div>

    <script>
        const TOTAL_QUESTIONS = 22;

        function loadLeaderboard() {
            const data = JSON.parse(localStorage.getItem('heritage_leaderboard') || '{}');
            const sorted = Object.entries(data).sort((a, b) => b[1].score - a[1].score);

            document.getElementById('activePlayers').textContent = sorted.length;

            let totalAnswers = 0;
            let highScore = 0;

            sorted.forEach(([_, d]) => {
                totalAnswers += d.answered || 0;
                if (d.score > highScore) highScore = d.score;
            });

            document.getElementById('totalAnswers').textContent = totalAnswers;
            document.getElementById('highScore').textContent = highScore;

            const grid = document.getElementById('leaderboardGrid');
            const header = grid.querySelector('.lb-header');
            grid.innerHTML = '';
            grid.appendChild(header);

            if (sorted.length === 0) {
                grid.innerHTML += '<div class="no-data">No players yet — waiting for submissions...</div>';
                return;
            }

            sorted.forEach(([name, d], i) => {
                const rank = i + 1;
                const mins = Math.floor((d.time || 0) / 60);
                const secs = (d.time || 0) % 60;
                const progress = Math.round(((d.answered || 0) / TOTAL_QUESTIONS) * 100);

                let rankClass = '';
                if (rank === 1) rankClass = 'top-1';
                else if (rank === 2) rankClass = 'top-2';
                else if (rank === 3) rankClass = 'top-3';

                const row = document.createElement('div');
                row.className = `lb-row ${rankClass}`;
                row.innerHTML = `
                    <div class="lb-rank">${rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank}</div>
                    <div class="lb-name">${name}</div>
                    <div class="lb-score">${d.score}</div>
                    <div class="lb-answered">${d.answered}/${TOTAL_QUESTIONS}</div>
                    <div class="lb-time">${mins}:${String(secs).padStart(2, '0')}</div>
                    <div class="lb-progress-track">
                        <div class="lb-progress-fill" style="width: ${progress}%"></div>
                    </div>
                `;
                grid.appendChild(row);
            });
        }

        loadLeaderboard();
        setInterval(loadLeaderboard, 10000);
    </script>
</body>
</html>
