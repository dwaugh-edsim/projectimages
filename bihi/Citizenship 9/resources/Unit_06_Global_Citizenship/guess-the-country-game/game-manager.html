<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Country - Game Manager</title>
    <script src="https://accounts.google.com/gsi/client" onload="initGSI()" async defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --bg-card: #12121a;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #e5e7eb;
            --text-muted: #6b7280;
            --border: #1f2937;
            --font-main: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Header */
        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        /* Tabs */
        .tabs {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 0 30px;
            display: flex;
            gap: 5px;
        }

        .tab {
            padding: 15px 25px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: var(--font-main);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab:hover {
            color: var(--text);
        }

        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        /* Main Content */
        .main {
            padding: 30px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* Forms */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .form-input,
        .form-textarea,
        .form-select {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: var(--font-main);
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* Buttons */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-family: var(--font-main);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: var(--border);
            color: var(--text);
        }

        .btn-secondary:hover {
            background: #374151;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Image Generation Grid */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }

        .image-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .image-preview {
            width: 100%;
            aspect-ratio: 16/9;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-status {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--border);
        }

        .image-status.ready {
            background: var(--success);
            color: white;
        }

        .image-status.generating {
            background: var(--warning);
            color: white;
        }

        .image-status.error {
            background: var(--danger);
            color: white;
        }

        .image-info {
            padding: 15px;
        }

        .image-prompt {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .image-actions {
            display: flex;
            gap: 8px;
        }

        .image-actions .btn {
            flex: 1;
            justify-content: center;
            font-size: 0.8rem;
            padding: 8px 12px;
        }

        /* Country List */
        .country-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .country-item {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            display: grid;
            grid-template-columns: 200px 1fr auto;
            gap: 20px;
            align-items: start;
        }

        .country-image {
            width: 200px;
            height: 112px;
            background: #1a1a2e;
            border-radius: 6px;
            overflow: hidden;
        }

        .country-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .country-details h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .clues-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .clue-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .clue-number {
            width: 24px;
            height: 24px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .clue-text {
            flex: 1;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .country-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 25px;
            background: var(--accent);
            color: white;
            border-radius: 8px;
            font-weight: 500;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-close:hover {
            color: var(--text);
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
            }

            .country-item {
                grid-template-columns: 1fr;
            }

            .image-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">
            <div class="logo-icon">🌍</div>
            Guess the Country
            <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: 400;">Manager</span>
        </div>
        <div class="header-actions">
            <button class="btn btn-secondary" onclick="exportGameData()">
                📥 Export Game Data
            </button>
            <button class="btn btn-primary" onclick="openImportModal()">
                📤 Import Game Data
            </button>
            <button class="btn btn-success" onclick="openGame()">
                🎮 Open Game
            </button>
        </div>
    </header>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab active" onclick="switchTab('generation')">🖼️ Image Generation</button>
        <button class="tab" onclick="switchTab('countries')">🌎 Countries & Clues</button>
        <button class="tab" onclick="switchTab('preview')">👁️ Preview & Test</button>
        <button class="tab" onclick="switchTab('settings')">⚙️ Settings</button>
    </div>

    <!-- Main Content -->
    <main class="main">
        <!-- Image Generation Tab -->
        <div id="tab-generation" class="tab-content active">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">API Configuration</h2>
                    <button class="btn btn-secondary" onclick="googleLogin()" id="google-login-btn">🔑 Login with
                        Google</button>
                </div>
                <div class="form-group">
                    <label class="form-label">Google API Key (optional if using OAuth)</label>
                    <input type="password" class="form-input" id="api-key"
                        placeholder="Enter your Google AI Studio API key">
                </div>
                <div class="form-group">
                    <label class="form-label">Model</label>
                    <select class="form-select" id="model-select">
                        <option value="gemini-2.0-flash-exp">Gemini 2.0 Flash (Experimental)</option>
                        <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                        <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                    </select>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Load Prompts</h2>
                </div>
                <div class="form-group">
                    <label class="form-label">Paste CSV Prompts</label>
                    <textarea class="form-textarea" id="csv-input" placeholder="Paste CSV content here..."></textarea>
                </div>
                <button class="btn btn-primary" onclick="parseCSV()">📋 Parse CSV</button>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">AI Prompt Generator</h2>
                </div>
                <div class="form-group">
                    <label class="form-label">Country Name</label>
                    <input type="text" class="form-input" id="ai-prompt-country" placeholder="e.g., Japan">
                </div>
                <div class="form-group">
                    <label class="form-label">Scene Type</label>
                    <select class="form-select" id="ai-prompt-scene">
                        <option value="street">Street Scene</option>
                        <option value="landscape">Natural Landscape</option>
                        <option value="market">Local Market</option>
                        <option value="coastal">Coastal/Beach</option>
                        <option value="mountain">Mountain/Rural</option>
                        <option value="urban">Urban/Cityscape</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Time of Day</label>
                    <select class="form-select" id="ai-prompt-time">
                        <option value="golden hour">Golden Hour</option>
                        <option value="morning">Morning</option>
                        <option value="midday">Midday</option>
                        <option value="sunset">Sunset</option>
                        <option value="evening">Evening</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="generatePromptWithAI()">🤖 Generate Prompt</button>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Generated Images</h2>
                    <div>
                        <button class="btn btn-secondary" onclick="generateAll()">⚡ Generate All</button>
                        <button class="btn btn-success" onclick="uploadAllToR2()">☁️ Upload All to R2</button>
                    </div>
                </div>
                <div class="image-grid" id="image-grid">
                    <!-- Image cards will be generated here -->
                </div>
            </div>
        </div>

        <!-- Countries & Clues Tab -->
        <div id="tab-countries" class="tab-content">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Countries</h2>
                    <button class="btn btn-primary" onclick="openCountryModal()">➕ Add Country</button>
                </div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="total-countries">0</div>
                        <div class="stat-label">Total Countries</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="with-images">0</div>
                        <div class="stat-label">With Images</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="with-clues">0</div>
                        <div class="stat-label">With Clues</div>
                    </div>
                </div>
                <div class="country-list" id="country-list">
                    <!-- Country items will be generated here -->
                </div>
            </div>
        </div>

        <!-- Preview & Test Tab -->
        <div id="tab-preview" class="tab-content">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Game Preview</h2>
                    <button class="btn btn-primary" onclick="startPreview()">▶️ Start Preview</button>
                </div>
                <div id="preview-container">
                    <p style="text-align: center; color: var(--text-muted); padding: 40px;">
                        Click "Start Preview" to test the game with your current data
                    </p>
                </div>
            </div>
        </div>

        <!-- Settings Tab -->
        <div id="tab-settings" class="tab-content">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Game Settings</h2>
                </div>
                <div class="form-group">
                    <label class="form-label">Game Title</label>
                    <input type="text" class="form-input" id="game-title" value="Guess the Country">
                </div>
                <div class="form-group">
                    <label class="form-label">Default Game Mode</label>
                    <select class="form-select" id="default-mode">
                        <option value="classic">Classic Mode</option>
                        <option value="time-attack">Time Attack</option>
                        <option value="streak">Streak Mode</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Clue Reveal Timing (seconds)</label>
                    <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;">
                        <input type="number" class="form-input" id="clue-1-time" value="0" min="0">
                        <input type="number" class="form-input" id="clue-2-time" value="10" min="0">
                        <input type="number" class="form-input" id="clue-3-time" value="20" min="0">
                        <input type="number" class="form-input" id="clue-4-time" value="30" min="0">
                        <input type="number" class="form-input" id="clue-5-time" value="45" min="0">
                    </div>
                </div>
                <button class="btn btn-primary" onclick="saveSettings()">💾 Save Settings</button>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">R2 Configuration</h2>
                </div>
                <div class="form-group">
                    <label class="form-label">R2 Worker URL</label>
                    <input type="text" class="form-input" id="r2-url"
                        value="https://proud-tooth-42cf.icumusicvideo.workers.dev">
                </div>
                <button class="btn btn-primary" onclick="saveR2Config()">💾 Save R2 Config</button>
            </div>
        </div>
    </main>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Country Modal -->
    <div class="modal" id="country-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title">Add Country</h3>
                <button class="modal-close" onclick="closeCountryModal()">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label">Country Name</label>
                <input type="text" class="form-input" id="country-name" placeholder="e.g., Japan">
            </div>
            <div class="form-group">
                <label class="form-label">Image URL</label>
                <input type="text" class="form-input" id="country-image-url" placeholder="https://...">
            </div>
            <div class="form-group">
                <label class="form-label">Clue 1 (Immediate)</label>
                <textarea class="form-textarea" id="clue-1" placeholder="Atmospheric description..."></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Clue 2 (10 seconds)</label>
                <textarea class="form-textarea" id="clue-2" placeholder="Cultural/historical reference..."></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Clue 3 (20 seconds)</label>
                <textarea class="form-textarea" id="clue-3" placeholder="Specific photo detail..."></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Clue 4 (30 seconds)</label>
                <textarea class="form-textarea" id="clue-4" placeholder="Geographical/climate hint..."></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Clue 5 (45 seconds)</label>
                <textarea class="form-textarea" id="clue-5" placeholder="Nearly direct hint..."></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Difficulty</label>
                <select class="form-select" id="country-difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-primary" onclick="saveCountry()">💾 Save Country</button>
                <button class="btn btn-secondary" onclick="generateCluesWithAI()">🤖 AI Generate Clues</button>
            </div>
        </div>
    </div>

    <!-- Import Modal -->
    <div class="modal" id="import-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Import Game Data</h3>
                <button class="modal-close" onclick="closeImportModal()">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label">Paste JSON Game Data</label>
                <textarea class="form-textarea" id="import-json" style="min-height: 200px;"
                    placeholder='{"countries": [...]}'></textarea>
            </div>
            <button class="btn btn-primary" onclick="importGameData()">📥 Import</button>
        </div>
    </div>

    <script>
        // State
        let CONFIG = {
            apiKey: '',
            model: 'gemini-2.0-flash-exp',
            glToken: '',
            r2Url: 'https://proud-tooth-42cf.icumusicvideo.workers.dev'
        };

        let gameData = {
            title: 'Guess the Country',
            defaultMode: 'classic',
            clueTimings: [0, 10, 20, 30, 45],
            countries: []
        };

        let imagePrompts = [];
        let generatedImages = {};
        let editingCountryId = null;
        let tokenClient;

        // Initialize
        function init() {
            loadFromStorage();
            renderImageGrid();
            renderCountryList();
            updateStats();
        }

        function loadFromStorage() {
            const saved = localStorage.getItem('GUESS_COUNTRY_CONFIG');
            if (saved) {
                const loaded = JSON.parse(saved);
                Object.assign(CONFIG, loaded);
                document.getElementById('api-key').value = CONFIG.apiKey || '';
                document.getElementById('model-select').value = CONFIG.model || 'gemini-2.0-flash-exp';
                document.getElementById('r2-url').value = CONFIG.r2Url || '';
            }

            const savedData = localStorage.getItem('GUESS_COUNTRY_DATA');
            if (savedData) {
                gameData = JSON.parse(savedData);
                document.getElementById('game-title').value = gameData.title || '';
                document.getElementById('default-mode').value = gameData.defaultMode || 'classic';
                if (gameData.clueTimings) {
                    document.getElementById('clue-1-time').value = gameData.clueTimings[0] || 0;
                    document.getElementById('clue-2-time').value = gameData.clueTimings[1] || 10;
                    document.getElementById('clue-3-time').value = gameData.clueTimings[2] || 20;
                    document.getElementById('clue-4-time').value = gameData.clueTimings[3] || 30;
                    document.getElementById('clue-5-time').value = gameData.clueTimings[4] || 45;
                }
            }

            if (CONFIG.glToken) {
                document.getElementById('google-login-btn').innerText = '✅ Google Logged In';
                document.getElementById('google-login-btn').style.background = 'var(--success)';
            }
        }

        function saveToStorage() {
            localStorage.setItem('GUESS_COUNTRY_CONFIG', JSON.stringify(CONFIG));
            localStorage.setItem('GUESS_COUNTRY_DATA', JSON.stringify(gameData));
        }

        // Tabs
        function switchTab(tabName) {

        async function callGoogleAPI(prompt, idx) {
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                    responseModalities: ["TEXT", "IMAGE"],
                    candidateCount: 1
                }
            };

            const url = `https://generativelanguage.googleapis.com/v1beta/models/${CONFIG.model}:generateContent`;
            const res = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${CONFIG.glToken}`
                },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            if (data.candidates) {
                return handleGeminiResponse(data);
            }
            if (data.error) {
                throw new Error(data.error.message);
            }
            throw new Error('No image data in response');
        }

        async function callGoogleAPIKey(prompt, idx) {
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                    responseModalities: ["TEXT", "IMAGE"],
                    candidateCount: 1
                }
            };

            const url = `https://generativelanguage.googleapis.com/v1beta/models/${CONFIG.model}:generateContent?key=${CONFIG.apiKey}`;
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            if (data.candidates) {
                return handleGeminiResponse(data);
            }
            if (data.error) {
                throw new Error(data.error.message);
            }
            throw new Error('No image data in response');
        }

        function handleGeminiResponse(data) {
            if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
                const parts = data.candidates[0].content.parts;
                const imgPart = parts.find(p => p.inlineData || p.inline_data);
                if (imgPart) {
                    const dataObj = imgPart.inlineData || imgPart.inline_data;
                    const mime = dataObj.mimeType || dataObj.mime_type || 'image/png';
                    const base64 = dataObj.data;
                    return `data:${mime};base64,${base64}`;
                }
                const textPart = parts.find(p => p.text);
                if (textPart) throw new Error("Refusal: " + textPart.text);
            }
            throw new Error("No image data in response");
        }

        // R2 Upload
        async function uploadToR2(idx) {
            const item = imagePrompts[idx];
            const imageData = generatedImages[item.id];
            if (!imageData) return;

            try {
                showToast(`Uploading ${item.name} to R2...`);

                // Convert to JPG
                const img = new Image();
                img.crossOrigin = "anonymous";
                await new Promise((resolve, reject) => {
                    img.onload = resolve;
                    img.onerror = reject;
                    img.src = imageData.url;
                });

                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
                const jpgData = canvas.toDataURL('image/jpeg', 0.85);

                const filename = `guess-country_${item.name.toLowerCase().replace(/\s+/g, '_')}_${Date.now()}.jpg`;
                const res = await fetch(`${CONFIG.r2Url}?filename=${encodeURIComponent(filename)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: jpgData })
                });

                const data = await res.json();
                if (!data.success) throw new Error(data.error);

                generatedImages[item.id].r2Url = data.url;
                showToast(`${item.name} uploaded to R2!`);
            } catch (e) {
                showToast(`Upload failed: ${e.message}`);
                console.error(e);
            }
        }

        async function callGeminiTextAPI(prompt) {
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                    temperature: 0.7,
                    topK: 40,
                    topP: 0.95,
                    maxOutputTokens: 1024
                }
            };

            const url = `https://generativelanguage.googleapis.com/v1beta/models/${CONFIG.model}:generateContent`;
            const res = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${CONFIG.glToken}`
                },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
                const text = data.candidates[0].content.parts[0].text;
                return parseCluesFromResponse(text);
            }
            if (data.error) {
                throw new Error(data.error.message);
            }
            throw new Error('No text in response');
        }

        async function callGeminiTextAPIKey(prompt) {
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                    temperature: 0.7,
                    topK: 40,
                    topP: 0.95,
                    maxOutputTokens: 1024
                }
            };

            const url = `https://generativelanguage.googleapis.com/v1beta/models/${CONFIG.model}:generateContent?key=${CONFIG.apiKey}`;
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
                const text = data.candidates[0].content.parts[0].text;
                return parseCluesFromResponse(text);
            }
            if (data.error) {
                throw new Error(data.error.message);
            }
            throw new Error('No text in response');
        }

        function parseCluesFromResponse(text) {
            // Try to parse as JSON array
            try {
                const jsonMatch = text.match(/\[[\s\S]*\]/);
                if (jsonMatch) {
                    const clues = JSON.parse(jsonMatch[0]);
                    if (Array.isArray(clues) && clues.length === 5) {
                        return clues;
                    }
                }
            } catch (e) {
                // JSON parsing failed, try extracting clues manually
            }

            // Fallback: extract clues from numbered list
            const clues = [];
            const lines = text.split('\n');
            for (const line of lines) {
                const match = line.match(/^\d+\.\s*(.+)$/);
                if (match) {
                    clues.push(match[1].trim());
                }
                if (clues.length === 5) break;
            }

            if (clues.length === 5) {
                return clues;
            }

            throw new Error('Could not parse clues from response');
        }

                        ${randomCountry.imageUrl ? `<img src="${randomCountry.imageUrl}" style="width: 100%; height: 100%; object-fit: cover;">` : '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);">No image</div>'}
                    </div>
                    <div style="background: var(--bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border);">
                        <h3 style="margin-bottom: 15px;">${randomCountry.name}</h3>
                        <div style="display: flex; flex-direction: column; gap: 10px;">
                            ${randomCountry.clues.map((clue, i) => clue ? `
                                <div style="display: flex; gap: 10px; align-items: start;">
                                    <span style="background: var(--accent); color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem;">${i + 1}</span>
                                    <span>${clue}</span>
                                </div>
                            ` : '').join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // Open Game
        function openGame() {
            window.open('game.html', '_blank');
        }

        // Initialize on load
        init();
    </script>
</body>

</html>
