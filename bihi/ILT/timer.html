<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silent Debate — Rotation Timer</title>
<style>
  :root { --bg:#2E383E; --ink:#3D4449; --accent:#F56A6A; --muted:#AEB6BD; --amber:#F0B45B; --hot:#FF7A70; }
  * { margin:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background:var(--bg); color:#fff; font-family:Arial, Helvetica, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    user-select:none; overflow:hidden;
  }
  .brand { position:fixed; top:26px; left:38px; font-size:clamp(11px,1.4vw,16px); letter-spacing:.28em;
           color:var(--muted); font-weight:bold; }
  #round { position:fixed; top:22px; right:38px; font-size:clamp(13px,1.7vw,20px); font-weight:bold;
           color:#fff; background:rgba(255,255,255,.10); padding:.45em 1em; border-radius:999px; cursor:pointer; }
  #clock { font-size:min(34vw,52vh); font-weight:bold; line-height:1; font-variant-numeric:tabular-nums;
           font-feature-settings:"tnum"; letter-spacing:-.01em; }
  #clock.amber { color:var(--amber); }
  #clock.hot   { color:var(--hot); animation:pulse 1s steps(1) infinite; }
  @keyframes pulse { 50% { opacity:.45; } }
  #hint { margin-top:3.5vh; font-size:clamp(12px,1.5vw,17px); color:var(--muted); letter-spacing:.06em; }
  #controls { position:fixed; bottom:4.5vh; display:flex; gap:18px; }
  .btn { padding:.7em 1.9em; border-radius:12px; border:2px solid var(--accent); background:transparent;
         color:#fff; font-family:inherit; font-weight:bold; font-size:clamp(15px,2vw,21px); cursor:pointer; }
  .btn.primary { background:var(--accent); }
  .btn:hover { filter:brightness(1.12); }
  #overlay { position:fixed; inset:0; background:rgba(31,39,44,.97); display:flex; flex-direction:column;
             align-items:center; justify-content:center; gap:2vh; }
  #overlay.hidden { display:none; }
  #ovTitle { font-size:min(20vw,34vh); font-weight:bold; color:var(--accent); line-height:1;
             animation:pulse .9s steps(1) infinite; }
  #ovSub { font-size:clamp(16px,2.6vw,30px); color:#fff; }
  #ovHint { font-size:clamp(12px,1.5vw,17px); color:var(--muted); margin-top:1vh; }
</style>
</head>
<body>
  <div class="brand">SILENT DEBATE · ROTATION TIMER</div>
  <div id="round" title="Click to reset the round counter">Round 1 of 7</div>
  <div id="clock">3:00</div>
  <div id="hint">SPACE start / pause &nbsp;·&nbsp; R reset &nbsp;·&nbsp; M sound &nbsp;·&nbsp; F fullscreen</div>
  <div id="controls">
    <button class="btn primary" id="startBtn">START</button>
    <button class="btn" id="resetBtn">RESET</button>
    <button class="btn" id="soundBtn">SOUND: ON</button>
  </div>
  <div id="overlay" class="hidden">
    <div id="ovTitle">MOVE →</div>
    <div id="ovSub">Round 2 of 7 — next station, clockwise.</div>
    <div id="ovHint">SPACE start the next round &nbsp;·&nbsp; R reset</div>
  </div>

<script>
  const qs = new URLSearchParams(location.search);
  const DURATION = Math.min(3600, Math.max(1, parseFloat(qs.get('t')) || 180)) * 1000;
  const TOTAL_ROUNDS = 7;

  let remaining = DURATION, endAt = 0, running = false, rounds = 0, muted = false, lastWhole = null;

  const $ = id => document.getElementById(id);
  const clock = $('clock'), round = $('round'), overlay = $('overlay'),
        ovTitle = $('ovTitle'), ovSub = $('ovSub'), startBtn = $('startBtn');

  const fmt = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

  function render() {
    clock.textContent = fmt(remaining);
    clock.classList.toggle('amber', running && remaining <= 60000 && remaining > 10000);
    clock.classList.toggle('hot', running && remaining <= 10000 && remaining > 0);
    startBtn.textContent = running ? 'PAUSE' : (remaining <= 0 ? 'START NEXT ROUND' : 'START');
  }

  function setRound() {
    round.textContent = rounds >= TOTAL_ROUNDS ? 'Round 7 of 7 ✓' : 'Round ' + (rounds + 1) + ' of 7';
  }

  function loop() {
    if (!running) return;
    remaining = endAt - performance.now();
    const whole = Math.ceil(remaining / 1000);
    if (whole !== lastWhole) { lastWhole = whole; if (whole > 0 && whole <= 3) tick(); }
    if (remaining <= 0) { complete(); return; }
    render();
    requestAnimationFrame(loop);
  }

  function start() {
    if (running) { running = false; remaining = Math.max(0, endAt - performance.now()); render(); return; }
    if (remaining <= 0) { remaining = DURATION; overlay.classList.add('hidden'); }
    ac();                                  // unlock audio inside the user gesture
    running = true; lastWhole = null;
    endAt = performance.now() + remaining;
    render(); loop();
  }

  function reset() {
    running = false; remaining = DURATION;
    overlay.classList.add('hidden');
    render();
  }

  function complete() {
    running = false; remaining = 0; render();
    chime();
    rounds++; setRound();
    if (rounds >= TOTAL_ROUNDS) {
      ovTitle.textContent = 'VERDICT TIME';
      ovSub.textContent = 'Back to your home sheets — crown a winning argument.';
    } else {
      ovTitle.textContent = 'MOVE →';
      ovSub.textContent = 'Round ' + (rounds + 1) + ' of 7 — next station, clockwise.';
    }
    overlay.classList.remove('hidden');
  }

  // sound
  let actx = null;
  const ac = () => { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return actx; };
  function tone(freq, at, dur, vol = 0.22, type = 'sine') {
    if (muted || !ac()) return;
    const t = actx.currentTime + at;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  const chime = () => { tone(880, 0, 0.4); tone(1174.7, 0.22, 0.6); };
  const tick  = () => tone(1250, 0, 0.05, 0.10, 'square');

  // controls
  startBtn.addEventListener('click', () => { start(); startBtn.blur(); });
  $('resetBtn').addEventListener('click', () => { reset(); $('resetBtn').blur(); });
  $('soundBtn').addEventListener('click', () => {
    muted = !muted;
    $('soundBtn').textContent = 'SOUND: ' + (muted ? 'OFF' : 'ON');
    $('soundBtn').blur();
  });
  round.addEventListener('click', () => { rounds = 0; setRound(); });
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); start(); }
    else if (e.key === 'r' || e.key === 'R') reset();
    else if (e.key === 'm' || e.key === 'M') $('soundBtn').click();
    else if (e.key === 'f' || e.key === 'F') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  });

  setRound(); render();
</script>
</body>
</html>
