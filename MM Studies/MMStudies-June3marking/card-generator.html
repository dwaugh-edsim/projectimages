<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Independent Project Card Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1814;
    --ink-soft: #4a443c;
    --paper: #f7f3e9;
    --paper-2: #efe9d8;
    --rule: #1a1814;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #cfc7b3; color: var(--ink); }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    line-height: 1.55;
    padding: 32px 20px 80px;
  }

  /* Input form */
  .input-panel {
    max-width: 980px;
    margin: 0 auto 36px;
    background: var(--paper);
    border: 1px solid var(--ink);
    padding: 24px 28px;
  }
  .input-panel h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 1.8rem;
    margin: 0 0 4px;
  }
  .input-panel p { margin: 0; color: var(--ink-soft); font-style: italic; font-family: 'Cormorant Garamond', serif; }
  .input-group { margin-top: 18px; }
  .input-group label {
    display: block;
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 6px;
    color: var(--ink-soft);
  }
  .input-group input, .input-group textarea {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    padding: 10px 12px;
    border: 1px solid var(--ink);
    background: #fff;
    color: var(--ink);
    resize: vertical;
  }
  .input-group textarea { min-height: 160px; }
  .input-group input:focus, .input-group textarea:focus {
    outline: none;
    border-color: var(--ink-soft);
    box-shadow: 0 0 0 2px rgba(26, 24, 20, 0.08);
  }
  .input-actions {
    margin-top: 18px;
    display: flex;
    gap: 12px;
  }
  .btn {
    font-family: 'Inter', sans-serif;
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    padding: 9px 16px;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .btn:hover { background: var(--ink); color: var(--paper); }
  .btn-primary {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .btn-primary:hover { background: var(--ink-soft); border-color: var(--ink-soft); }

  /* Cards display */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(440px, 1fr));
    gap: 32px;
    max-width: 1240px;
    margin: 0 auto;
  }

  /* The gallery card */
  .card {
    background: var(--paper);
    color: var(--ink);
    position: relative;
    padding: 0;
    break-inside: avoid;
    page-break-inside: avoid;
  }
  .card-frame {
    border: 1px solid var(--ink);
    padding: 14px;
    height: 100%;
  }
  .card-frame-inner {
    border: 0.5px solid var(--ink);
    padding: 38px 34px 26px;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .eyebrow {
    text-align: center;
    font-size: 0.66rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 500;
  }
  .fleuron {
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    color: var(--ink);
    margin: 8px 0 14px;
    letter-spacing: 0.4em;
  }

  .title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 1.7rem;
    line-height: 1.18;
    text-align: center;
    margin: 0 0 4px;
    letter-spacing: 0.2px;
  }
  .title em { font-style: italic; color: var(--ink-soft); }

  .byline {
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.02rem;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .divider-thin {
    width: 28px;
    height: 1px;
    background: var(--ink);
    margin: 14px auto 16px;
  }

  .description {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.92rem;
    line-height: 1.45;
    text-align: left;
    flex: 1;
    white-space: pre-wrap;
    overflow: hidden;
    color: var(--ink);
    column-count: 2;
    column-gap: 22px;
    column-rule: 0.5px solid var(--ink-soft);
  }

  .card-footer {
    margin-top: 22px;
    padding-top: 12px;
    border-top: 0.5px solid var(--ink);
    display: flex;
    justify-content: space-between;
    font-size: 0.62rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 500;
  }

  .card .remove-btn {
    position: absolute;
    top: 4px;
    right: 4px;
    font-size: 0.6rem;
    padding: 3px 6px;
    background: var(--paper-2);
    border: 0.5px solid var(--ink);
    cursor: pointer;
    z-index: 10;
    opacity: 0.8;
  }
  .card .remove-btn:hover { opacity: 1; background: #e0d8c0; }

  /* Print */
  @page { size: letter; margin: 0.5in; }
  @media print {
    body { background: #fff; padding: 0; }
    .input-panel, .card .remove-btn { display: none !important; }
    .cards {
      max-width: none;
      grid-template-columns: 1fr;
      gap: 0;
    }
    .card {
      width: 7.5in;
      height: 5in;
      margin: 0 auto;
      page-break-after: always;
      box-shadow: none;
      overflow: hidden;
    }
    .card:last-child { page-break-after: auto; }
    .card-frame { padding: 0.12in; }
    .card-frame-inner { padding: 0.28in 0.35in 0.2in; }
    .description { font-size: 0.82rem; line-height: 1.38; column-gap: 0.22in; }
    .title { font-size: 1.45rem; }
  }

  /* Preview modes */
  body.preview-single .input-panel { display: none; }
  body.preview-single .cards { grid-template-columns: 1fr; max-width: none; gap: 0.4in; }
  body.preview-single .card { width: 7.5in; height: 5in; margin: 0 auto; overflow: hidden; }

  body.preview-two .input-panel { display: none; }
  body.preview-two .cards { grid-template-columns: 1fr; max-width: 7.5in; margin: 0 auto; gap: 0.2in; }
  body.preview-two .card { width: 7.5in; height: 4.85in; margin: 0 auto; overflow: hidden; }
  body.preview-two .description { font-size: 0.78rem; line-height: 1.34; }
  body.preview-two .title { font-size: 1.35rem; }

  @media print {
    body.print-two .card {
      height: 4.85in;
      margin: 0 auto 0.2in;
    }
    body.print-two .card:nth-of-type(2n) { page-break-after: always; }
    body.print-two .card:nth-of-type(2n+1) { page-break-after: auto; }
    body.print-two .card:last-child { page-break-after: auto; }
    body.print-two .description { font-size: 0.78rem; line-height: 1.34; }
    body.print-two .title { font-size: 1.35rem; }
  }
</style>
</head>
<body>

<section class="input-panel">
  <h1>Independent Project Card Generator</h1>
  <p>Add new proposals as they come in — same gallery style</p>

  <div class="input-group">
    <label>Student name</label>
    <input type="text" id="studentName" placeholder="e.g., Alexa Johnson">
  </div>

  <div class="input-group">
    <label>Project title (optional)</label>
    <input type="text" id="projectTitle" placeholder="e.g., A Journey Through Time">
  </div>

  <div class="input-group">
    <label>Description</label>
    <textarea id="projectDesc" placeholder="Paste the full description text here..."></textarea>
  </div>

  <div class="input-actions">
    <button class="btn btn-primary" onclick="addCard()">Add Card</button>
    <button class="btn" onclick="clearForm()">Clear</button>
    <button class="btn" onclick="printCards()">Print</button>
    <button class="btn" onclick="setMode('single')">One per page</button>
    <button class="btn" onclick="setMode('two')">Two per page</button>
  </div>
</section>

<div class="cards" id="cardsContainer"></div>

<script>
let cards = [];

function esc(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fallbackTitle(title, desc){
  if (!title || !title.trim()) {
    const first = (desc||'').split(/\\n+/).map(l=>l.trim()).find(Boolean) || '';
    return first.length > 80 ? first.slice(0,77)+'…' : first;
  }
  return title;
}

function addCard(){
  const student = document.getElementById('studentName').value.trim();
  const title = document.getElementById('projectTitle').value.trim();
  const desc = document.getElementById('projectDesc').value.trim();

  if (!student) {
    alert('Please enter a student name');
    return;
  }

  const displayTitle = fallbackTitle(title, desc);

  cards.push({ student, title: displayTitle, desc });
  renderCards();
  clearForm();
}

function removeCard(index){
  cards.splice(index, 1);
  renderCards();
}

function clearForm(){
  document.getElementById('studentName').value = '';
  document.getElementById('projectTitle').value = '';
  document.getElementById('projectDesc').value = '';
}

function printCards(){
  window.print();
}

function setMode(mode){
  document.body.classList.remove('preview-single','preview-two','print-two');
  if (mode === 'single') document.body.classList.add('preview-single');
  if (mode === 'two') {
    document.body.classList.add('preview-two');
    document.body.classList.add('print-two');
  }
}

function renderCards(){
  const container = document.getElementById('cardsContainer');
  let html = '';
  cards.forEach((card, index) => {
    const titleHtml = card.title ? esc(card.title) : '<em>(untitled)</em>';
    html += `
      <article class="card">
        <button class="remove-btn" onclick="removeCard(${index})">×</button>
        <div class="card-frame">
          <div class="card-frame-inner">
            <div class="eyebrow">Independent Project · Mi'kmaw Studies 11</div>
            <div class="fleuron">— ❦ —</div>
            <h2 class="title">${titleHtml}</h2>
            <div class="byline">${esc(card.student)}</div>
            <div class="divider-thin"></div>
            <div class="description">${esc(card.desc)}</div>
            <div class="card-footer">
              <span></span>
              <span>Spring · 2026</span>
            </div>
          </div>
        </div>
      </article>`;
  });
  container.innerHTML = html;
}

// Load from localStorage on page load
window.onload = function(){
  const saved = localStorage.getItem('independentCards');
  if (saved) {
    try {
      cards = JSON.parse(saved);
      renderCards();
    } catch(e) {}
  }
};

// Save to localStorage on each change
const originalAdd = addCard;
addCard = function(){
  originalAdd();
  localStorage.setItem('independentCards', JSON.stringify(cards));
};

const originalRemove = removeCard;
removeCard = function(index){
  originalRemove(index);
  localStorage.setItem('independentCards', JSON.stringify(cards));
};
</script>
</body>
</html>
