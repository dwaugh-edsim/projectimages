<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Independent Project Descriptions — Mi’kmaw Studies 11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1814;
    --ink-soft: #4a443c;
    --paper: #f7f3e9;
    --paper-2: #efe9d8;
    --rule: #1a1814;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #cfc7b3; color: var(--ink); }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    line-height: 1.55;
    padding: 48px 20px 80px;
  }

  /* Screen controls */
  .toolbar {
    max-width: 980px;
    margin: 0 auto 36px;
    background: var(--paper);
    border: 1px solid var(--ink);
    padding: 22px 28px;
  }
  .toolbar h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 1.9rem;
    margin: 0 0 4px;
    letter-spacing: 0.3px;
  }
  .toolbar p { margin: 0; color: var(--ink-soft); font-size: 0.9rem; font-style: italic; font-family: 'Cormorant Garamond', serif; }
  .toolbar .controls { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .toolbar button {
    font-family: 'Inter', sans-serif;
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    padding: 7px 14px;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .toolbar button:hover { background: var(--ink); color: var(--paper); }
  .toolbar .hint { font-size: 0.78rem; color: var(--ink-soft); margin-top: 10px; }

  .block-header {
    max-width: 1180px;
    margin: 44px auto 18px;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 1.4rem;
    color: var(--ink-soft);
    letter-spacing: 0.5px;
  }
  .block-header::before, .block-header::after {
    content: "·";
    margin: 0 14px;
    color: var(--ink);
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(440px, 1fr));
    gap: 32px;
    max-width: 1240px;
    margin: 0 auto;
  }

  /* The gallery card */
  .card {
    background: var(--paper);
    color: var(--ink);
    position: relative;
    padding: 0;
    break-inside: avoid;
    page-break-inside: avoid;
  }
  /* Outer thin border + inner hairline = classic museum frame */
  .card-frame {
    border: 1px solid var(--ink);
    padding: 14px;
    height: 100%;
  }
  .card-frame-inner {
    border: 0.5px solid var(--ink);
    padding: 38px 34px 26px;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .eyebrow {
    text-align: center;
    font-size: 0.66rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 500;
  }
  .fleuron {
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    color: var(--ink);
    margin: 8px 0 14px;
    letter-spacing: 0.4em;
  }

  .title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 1.7rem;
    line-height: 1.18;
    text-align: center;
    margin: 0 0 4px;
    letter-spacing: 0.2px;
  }
  .title em { font-style: italic; color: var(--ink-soft); }

  .byline {
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.02rem;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .divider-thin {
    width: 28px;
    height: 1px;
    background: var(--ink);
    margin: 14px auto 16px;
  }

  .description {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.92rem;
    line-height: 1.45;
    text-align: left;
    flex: 1;
    white-space: pre-wrap;
    overflow: hidden;
    color: var(--ink);
    column-count: 2;
    column-gap: 22px;
    column-rule: 0.5px solid var(--ink-soft);
  }
  .description > * { margin: 0; }

  .card-footer {
    margin-top: 22px;
    padding-top: 12px;
    border-top: 0.5px solid var(--ink);
    display: flex;
    justify-content: space-between;
    font-size: 0.62rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 500;
  }

  /* PRINT — landscape card per page (7.5 x 5 in) */
  @page { size: letter; margin: 0.5in; }
  @media print {
    body { background: #fff; padding: 0; }
    .toolbar, .block-header, .no-print { display: none !important; }
    .cards {
      max-width: none;
      grid-template-columns: 1fr;
      gap: 0;
    }
    .card {
      width: 7.5in;
      height: 5in;
      margin: 0 auto;
      page-break-after: always;
      box-shadow: none;
      overflow: hidden;
    }
    .card:last-child { page-break-after: auto; }
    .card-frame { padding: 0.12in; }
    .card-frame-inner { padding: 0.28in 0.35in 0.2in; }
    .description { font-size: 0.82rem; line-height: 1.38; column-gap: 0.22in; }
    .title { font-size: 1.45rem; }
  }

  /* Two per page in print — two stacked cards share a page */
  @media print {
    body.print-two .card {
      height: 4.85in;
      margin: 0 auto 0.2in;
    }
    body.print-two .card:nth-of-type(2n) { page-break-after: always; }
    body.print-two .card:nth-of-type(2n+1) { page-break-after: auto; }
    body.print-two .card:last-child { page-break-after: auto; }
    body.print-two .description { font-size: 0.78rem; line-height: 1.34; }
    body.print-two .title { font-size: 1.35rem; }
  }

  /* Preview modes */
  body.preview-single .toolbar, body.preview-single .block-header { display: none; }
  body.preview-single .cards { grid-template-columns: 1fr; max-width: none; gap: 0.4in; }
  body.preview-single .card { width: 7.5in; height: 5in; margin: 0 auto; overflow: hidden; }

  body.preview-two .toolbar, body.preview-two .block-header { display: none; }
  body.preview-two .cards { grid-template-columns: 1fr; max-width: 7.5in; margin: 0 auto; gap: 0.2in; }
  body.preview-two .card { width: 7.5in; height: 4.85in; margin: 0 auto; overflow: hidden; }
  body.preview-two .description { font-size: 0.78rem; line-height: 1.34; }
  body.preview-two .title { font-size: 1.35rem; }

  body.gallery .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
</style>
</head>

    "description": "The porcupine is a delicate and defensive creature who walks their land. To the Mi’Kmaq people the porcupine represents strength and self protection because the porcupine is a kind, harmless animal equipped with a shield of quills for protection. Quill drop earrings aren’t just a way to show off indigenous culture, identity, and story telling but it connects the person wearing them to the ground they live on and the strength and worth they hold inside of themself. \n\nTraditionally Mi’Kmaq quill drop earrings were made from birch bark and porcupine quills that have been gathered after porcupine shed. They would start by cleaning the quills to remove all dirt and oils then the quills would have been boiled with roots, flowers or other types of organic dies. From there they would be flattened between finger nails or teeth, making them flexible so they could thread the end into tiny holes already made in the birch bark, fold the ends on the other side so when the bark completely dried they are secured and will not fall out. \n\nAs traditional clothing evolved, so did the jewelry and earrings. Quill drop earrings began to involve bright colored seed beads making the earrings easier to stitch and more desirable to practice. This change of medium made the materials more excessable, the process less labor intensive, much easier and faster and more detailed and  intricate designs could be achieved with these beads. This allowed Mi’Kmaq people to express their culture and stories in a much more effective and enjoyable way but that does not mean the traditional process is still not used today."

maw people."

const groups = DATA.reduce((acc, e) => {
  (acc[e.block] = acc[e.block] || []).push(e);
  return acc;
}, {});

function esc(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fallbackTitle(e){
  if (!e.title) {
    const first = (e.description||'').split(/\n+/).map(l=>l.trim()).find(Boolean) || '';
    return first.length > 80 ? first.slice(0,77)+'…' : first;
  }
  return e.title;
}

function render(){
  const root = document.getElementById('root');
  let html = '';
  for (const block of Object.keys(groups)) {
    html += `<div class="block-header">${esc(block)}</div>`;
    html += `<div class="cards">`;
    for (const e of groups[block]) {
      const title = esc(fallbackTitle(e));
      const student = esc(e.student);
      const desc = esc(e.description);
      const titleHtml = title ? title : '<em>(untitled)</em>';
      html += `
        <article class="card">
          <div class="card-frame">
            <div class="card-frame-inner">
              <div class="eyebrow">Independent Project · Mi’kmaw Studies 11</div>
              <div class="fleuron">— ❦ —</div>
              <h2 class="title">${titleHtml}</h2>
              <div class="byline">${student}</div>
              <div class="divider-thin"></div>
              <div class="description">${desc}</div>
              <div class="card-footer">
                <span></span>
                <span>Spring · 2026</span>
              </div>
            </div>
          </div>
        </article>`;
    }
    html += `</div>`;
  }
  root.innerHTML = html;
}

function setMode(mode){
  document.body.classList.remove('gallery','preview-single','preview-two','print-two');
  if (mode === 'gallery') document.body.classList.add('gallery');
  if (mode === 'single') document.body.classList.add('preview-single');
  if (mode === 'two') {
    document.body.classList.add('preview-two');
    document.body.classList.add('print-two');
  }
}

render();
</script>
</body>
</html>
