<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>May 22 — Mi'kmaw Studies ICA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --crimson:   #c0392b;
            --amber:     #e8a020;
            --cream:     #f0ebe0;
            --deep:      #0c0a08;
            --surface:   rgba(255,255,255,0.04);
            --border:    rgba(255,255,255,0.07);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            background: var(--deep);
            font-family: 'Inter', sans-serif;
            color: var(--cream);
            overflow: hidden;
            cursor: pointer;
            user-select: none;
        }

        /* ── Aurora background ── */
        #aurora {
            position: fixed; inset: 0; z-index: 0; overflow: hidden;
            pointer-events: none;
        }
        .blob {
            position: absolute; border-radius: 50%;
            filter: blur(110px); opacity: 0;
            animation: drift 22s ease-in-out infinite alternate;
            transition: opacity 1.5s ease;
        }
        .blob-1 { width: 700px; height: 700px; background: radial-gradient(circle, #8b1a1a, transparent 70%); top: -200px; left: -200px; animation-duration: 22s; }
        .blob-2 { width: 580px; height: 580px; background: radial-gradient(circle, #904808, transparent 70%); bottom: -150px; right: -150px; animation-duration: 28s; animation-delay: -9s; }
        .blob-3 { width: 350px; height: 350px; background: radial-gradient(circle, #3d2000, transparent 70%); top: 40%; left: 55%; animation-duration: 16s; animation-delay: -4s; }
        .blob.on { opacity: 0.2; }

        @keyframes drift {
            0%   { transform: translate(0,0) scale(1); }
            50%  { transform: translate(50px,35px) scale(1.1); }
            100% { transform: translate(-30px,55px) scale(0.93); }
        }

        /* ── Progress bar ── */
        #progress {
            position: fixed; top: 0; left: 0; right: 0; height: 2px;
            background: rgba(255,255,255,0.05); z-index: 50;
            opacity: 0; transition: opacity 0.5s;
        }
        #progress.on { opacity: 1; }
        #progress-fill {
            height: 100%;
            background: linear-gradient(to right, var(--crimson), var(--amber));
            width: 0%; transition: width 0.6s cubic-bezier(0.16,1,0.3,1);
            box-shadow: 0 0 10px rgba(192,57,43,0.7);
        }

        /* ── Header strip ── */
        #header {
            position: fixed; top: 2px; left: 0; right: 0; z-index: 40;
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 44px;
            background: rgba(12,10,8,0.7); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            opacity: 0; transform: translateY(-100%);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        #header.on { opacity: 1; transform: translateY(0); }

        .hdr-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem; font-style: italic;
            color: rgba(240,235,224,0.5);
            letter-spacing: 1px;
        }
        #hdr-counter {
            font-size: 0.72rem; font-weight: 700;
            letter-spacing: 3px; text-transform: uppercase;
            color: var(--amber);
        }

        /* ── START SCREEN ── */
        #start-screen {
            position: fixed; inset: 0; z-index: 30;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            gap: 20px; text-align: center; padding: 40px;
            transition: opacity 0.6s ease;
        }
        .eyebrow {
            font-size: 0.65rem; font-weight: 900;
            letter-spacing: 5px; text-transform: uppercase;
            color: var(--amber);
        }
        #start-screen h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3rem, 7vw, 6rem);
            font-weight: 300; line-height: 1.05;
            color: var(--cream);
        }
        #start-screen h1 em { font-style: italic; color: var(--amber); }
        .start-sub {
            font-size: 0.95rem; font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            color: rgba(240,235,224,0.45); margin-top: 4px;
        }
        .pulse-row {
            display: flex; align-items: center; gap: 12px; margin-top: 20px;
            font-size: 0.62rem; letter-spacing: 3px; text-transform: uppercase;
            color: rgba(240,235,224,0.3);
        }
        .pulse-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--crimson);
            animation: pulsate 2s ease-in-out infinite;
        }
        @keyframes pulsate {
            0%,100% { box-shadow: 0 0 0 0 rgba(192,57,43,0.7); }
            50%      { box-shadow: 0 0 0 10px rgba(192,57,43,0); }
        }

        /* ── ROLLING WINDOW ── */
        #quiz-stage {
            position: fixed; inset: 0; z-index: 20;
            display: flex; flex-direction: column;
            justify-content: flex-start; align-items: center;
            padding: 62px 8% 80px;
            pointer-events: none; opacity: 0;
            transition: opacity 0.5s ease;
        }
        #quiz-stage.on { opacity: 1; pointer-events: all; }

        /* The 3-slot window */
        #window {
            width: 100%; max-width: 900px;
            display: flex; flex-direction: column;
            gap: 0;
        }

        .q-slot {
            width: 100%; overflow: hidden;
            transition: all 0.65s cubic-bezier(0.16,1,0.3,1);
        }

        /* Slot states: ghost-2 (oldest shown), ghost-1 (middle), active */
        .q-slot.ghost-2 {
            opacity: 0.18;
            transform: scale(0.82) translateX(-8px);
            transform-origin: left center;
            margin-bottom: 8px;
        }
        .q-slot.ghost-1 {
            opacity: 0.42;
            transform: scale(0.91) translateX(-4px);
            transform-origin: left center;
            margin-bottom: 16px;
        }
        .q-slot.active-slot {
            opacity: 1;
            transform: scale(1);
        }

        .q-inner {
            padding: 28px 36px 30px;
            background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid var(--border);
            border-left: 3px solid var(--crimson);
            border-radius: 3px;
            position: relative;
            overflow: hidden;
        }
        .q-slot.active-slot .q-inner {
            border-left-color: var(--amber);
            background: linear-gradient(135deg, rgba(232,160,32,0.06) 0%, rgba(192,57,43,0.04) 100%);
            box-shadow: 0 4px 40px rgba(192,57,43,0.15), 0 0 0 1px rgba(232,160,32,0.12);
        }

        .q-num-badge {
            font-size: 0.6rem; font-weight: 900; letter-spacing: 3px;
            text-transform: uppercase; color: var(--crimson);
            margin-bottom: 10px; display: block;
        }
        .q-slot.active-slot .q-num-badge { color: var(--amber); }

        .q-slot.ghost-2 .q-text,
        .q-slot.ghost-1 .q-text { font-size: 1rem; color: var(--cream); }

        .q-slot.active-slot .q-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.6rem, 3vw, 2.8rem);
            font-weight: 300; line-height: 1.35;
        }
        .q-text { transition: font-size 0.5s ease; color: var(--cream); }

        /* Slide-in animation for new question */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .q-slot.entering { animation: slideIn 0.55s cubic-bezier(0.16,1,0.3,1) forwards; }

        /* ── Nav hint ── */
        #nav-hint {
            position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
            z-index: 40;
            display: flex; gap: 8px; align-items: center;
            font-size: 0.6rem; letter-spacing: 2.5px; text-transform: uppercase;
            color: rgba(240,235,224,0.2);
            opacity: 0; transition: opacity 0.5s ease;
            pointer-events: none;
        }
        #nav-hint.on { opacity: 1; }
        #nav-hint kbd {
            border: 1px solid rgba(240,235,224,0.15);
            border-radius: 3px; padding: 1px 7px;
            font-family: inherit; font-size: 0.58rem;
        }

        /* ── FINAL LIST ── */
        #final-screen {
            position: fixed; inset: 0; z-index: 25;
            display: flex; flex-direction: column;
            overflow: hidden;
            opacity: 0; pointer-events: none;
            transition: opacity 0.7s ease;
        }
        #final-screen.on { opacity: 1; pointer-events: all; }

        #final-header {
            flex-shrink: 0;
            padding: 22px 50px;
            background: rgba(12,10,8,0.9); backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: baseline;
        }
        #final-header h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem; font-style: italic; font-weight: 300;
            color: var(--amber);
        }
        #final-header span {
            font-size: 0.65rem; letter-spacing: 3px; text-transform: uppercase;
            color: rgba(240,235,224,0.3);
        }

        #final-list {
            flex: 1; overflow-y: auto; padding: 40px 8%;
            scrollbar-width: thin;
            scrollbar-color: rgba(192,57,43,0.3) transparent;
        }

        .final-item {
            display: flex; gap: 28px; align-items: flex-start;
            padding: 24px 30px;
            border-left: 2px solid rgba(192,57,43,0.3);
            margin-bottom: 12px;
            background: rgba(255,255,255,0.02);
            border-radius: 0 3px 3px 0;
            opacity: 0; transform: translateX(-16px);
            transition: opacity 0.5s ease, transform 0.5s ease, border-color 0.3s;
        }
        .final-item:hover { border-left-color: var(--amber); background: rgba(232,160,32,0.04); }
        .final-item.visible { opacity: 1; transform: translateX(0); }

        .final-num {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem; font-style: italic; font-weight: 300;
            color: rgba(192,57,43,0.5); line-height: 1; min-width: 40px;
            flex-shrink: 0;
        }

        .final-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.35rem; font-weight: 300; line-height: 1.4;
            color: var(--cream); padding-top: 4px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .q-slot.active-slot .q-text { font-size: 1.4rem; }
            #quiz-stage { padding: 80px 5% 70px; }
            .final-text { font-size: 1.1rem; }
            #final-list { padding: 30px 5%; }
        }
    </style>
</head>
<body>

    <div id="aurora">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div id="progress"><div id="progress-fill"></div></div>

    <div id="header">
        <div class="hdr-title">Mi'kmaw Studies 11 — ICA &nbsp;·&nbsp; May 22, 2026</div>
        <div id="hdr-counter">Q <span id="hdr-q">1</span> / 10</div>
    </div>

    <!-- START SCREEN -->
    <div id="start-screen">
        <div class="eyebrow">Mi'kmaw Studies 11 &nbsp;·&nbsp; May 22, 2026</div>
        <h1>In-Class<br><em>Assessment</em></h1>
        <p class="start-sub">Sugar Falls · Outside Circle · Residential Schools · IRSSA</p>
        <div class="pulse-row">
            <div class="pulse-dot"></div>
            Click or press Space to begin
        </div>
    </div>

    <!-- ROLLING WINDOW (3 slots) -->
    <div id="quiz-stage">
        <div id="window">
            <!-- slots injected by JS -->
        </div>
    </div>

    <!-- FINAL LIST SCREEN -->
    <div id="final-screen">
        <div id="final-header">
            <h2>All Questions</h2>
            <span>Mi'kmaw Studies 11 — ICA — May 22</span>
        </div>
        <div id="final-list">
            <!-- items injected by JS -->
        </div>
    </div>

    <div id="nav-hint">
        <kbd>Space</kbd><kbd>→</kbd><kbd>Click</kbd> — next question
    </div>

    <script>
    const questions = [
        "What failed 1940s federal policy forced Nova Scotia's Mi'kmaq people off traditional lands and into two central reserves?",
        "What term refers to the mass removal of Indigenous children into foster care and adoption systems during the 1960s to 1980s?",
        "What is the name of the 78-day land dispute in 1990 involving Mohawk people?",
        "The dispute in Question 3 was about the proposed expansion of something. What?",
        "What was the name of the only residential school that operated in the Maritime Provinces?",
        "The largest Mi'kmaw community in Nova Scotia, Eskasoni, is located on an island. What is the name of that island?",
        "What was the name of the federal commission that traveled Canada from 2008 to 2015 to document the history of residential schools?",
        "How many \"Calls to Action\" did that commission issue?",
        "What cultural ceremony does Betty Ross perform with the students before telling her story in Sugar Falls?",
        "What 1876 federal legislation remains the foundational piece of discriminatory policy governing bands, reserves, and status?"
    ];

    const TOTAL = questions.length;
    let current = -1; // -1 = start screen
    let transitioning = false;

    const startScreen   = document.getElementById('start-screen');
    const quizStage     = document.getElementById('quiz-stage');
    const finalScreen   = document.getElementById('final-screen');
    const windowEl      = document.getElementById('window');
    const progressFill  = document.getElementById('progress-fill');
    const progressEl    = document.getElementById('progress');
    const headerEl      = document.getElementById('header');
    const hdrQ          = document.getElementById('hdr-q');
    const navHint       = document.getElementById('nav-hint');
    const finalList     = document.getElementById('final-list');
    const blobs         = document.querySelectorAll('.blob');

    // Max 3 slots visible at once
    const SLOTS = 3;
    let slotEls = []; // [oldest_shown, middle, newest] — length 1-3

    function makeSlot(idx, slotClass) {
        const slot = document.createElement('div');
        slot.className = `q-slot ${slotClass}`;
        slot.innerHTML = `
            <div class="q-inner">
                <span class="q-num-badge">Question ${idx + 1}</span>
                <div class="q-text">${questions[idx]}</div>
            </div>`;
        return slot;
    }

    function renderWindow() {
        // Determine which questions to show
        const toShow = [];
        if (current >= 2) toShow.push({ idx: current - 2, cls: 'ghost-2' });
        if (current >= 1) toShow.push({ idx: current - 1, cls: 'ghost-1' });
        toShow.push({ idx: current, cls: 'active-slot' });

        // Clear and rebuild
        windowEl.innerHTML = '';
        toShow.forEach(({ idx, cls }) => {
            const slot = makeSlot(idx, cls);
            windowEl.appendChild(slot);
        });

        // Animate newest in
        const newest = windowEl.querySelector('.active-slot');
        if (newest) {
            newest.classList.add('entering');
            setTimeout(() => newest.classList.remove('entering'), 700);
        }
    }

    function updateUI() {
        progressFill.style.width = `${((current + 1) / TOTAL) * 100}%`;
        hdrQ.textContent = current + 1;
    }

    function showFinalList() {
        quizStage.style.opacity = '0';
        quizStage.style.pointerEvents = 'none';
        headerEl.classList.remove('on');
        navHint.classList.remove('on');
        progressEl.classList.remove('on');

        // Build final list
        questions.forEach((q, i) => {
            const item = document.createElement('div');
            item.className = 'final-item';
            item.innerHTML = `
                <div class="final-num">${i + 1}</div>
                <div class="final-text">${q}</div>`;
            finalList.appendChild(item);
        });

        finalScreen.classList.add('on');

        // Staggered reveal
        setTimeout(() => {
            const items = finalList.querySelectorAll('.final-item');
            items.forEach((item, i) => {
                setTimeout(() => item.classList.add('visible'), i * 90);
            });
        }, 400);
    }

    function advance() {
        if (transitioning) return;

        // START → quiz
        if (current === -1) {
            transitioning = true;
            current = 0;

            startScreen.style.opacity = '0';
            setTimeout(() => { startScreen.style.display = 'none'; }, 600);

            blobs.forEach(b => b.classList.add('on'));
            headerEl.classList.add('on');
            progressEl.classList.add('on');
            navHint.classList.add('on');
            quizStage.classList.add('on');

            renderWindow();
            updateUI();

            setTimeout(() => { transitioning = false; }, 700);
            return;
        }

        // Last question already shown → final list
        if (current >= TOTAL - 1) {
            showFinalList();
            return;
        }

        // Next question
        transitioning = true;
        current++;
        renderWindow();
        updateUI();
        setTimeout(() => { transitioning = false; }, 700);
    }

    function goBack() {
        if (transitioning) return;
        // Can't go back before first question or from start screen
        if (current <= 0) return;
        // Can't go back once on the final list
        if (current >= TOTAL) return;
        transitioning = true;
        current--;
        renderWindow();
        updateUI();
        setTimeout(() => { transitioning = false; }, 700);
    }

    document.addEventListener('click', advance);
    document.addEventListener('keydown', e => {
        if (['Space','ArrowRight','Enter','ArrowDown'].includes(e.code)) {
            e.preventDefault();
            advance();
        }
        if (['ArrowLeft','ArrowUp','Backspace'].includes(e.code)) {
            e.preventDefault();
            goBack();
        }
    });
    </script>
</body>
</html>
