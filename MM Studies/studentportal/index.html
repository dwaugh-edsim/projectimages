<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKS-11 | Student Progress Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --accent: #e11d48;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --ring: rgba(37, 99, 235, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.03) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(225, 29, 72, 0.03) 0px, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #loginGate {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        #loginGate.hidden { display: none; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .login-box {
            background: var(--card-bg);
            border-radius: 2rem;
            padding: 3rem;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            text-align: center;
        }

        .login-logo {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .login-field {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        .login-field label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .login-field input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid var(--border);
            border-radius: 0.75rem;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }

        .login-field input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--ring);
        }

        .login-field input.error {
            border-color: #ef4444;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
        }

        .login-error {
            color: #ef4444;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 0.5rem;
            display: none;
        }

        .login-error.show { display: block; }

        .btn-login {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }

        .btn-login:hover { background: #1d4ed8; transform: scale(1.02); }

        .login-note {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 1.5rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 4rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -0.05em;
            text-transform: uppercase;
            color: var(--text);
            margin-bottom: 0.5rem;
            line-height: 1;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: #fff;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.5rem 1.5rem;
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-top: 1rem;
        }

        .status-badge strong {
            color: var(--primary);
        }

        .btn-switch {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.35rem 0.75rem;
            border-radius: 99px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn-switch:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .progress-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 2.5rem;
            border-radius: 2rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 1rem;
        }

        .progress-label {
            font-weight: 800;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .progress-percent {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            line-height: 1;
            color: var(--primary);
        }

        .progress-bar-bg {
            height: 16px;
            background: #f1f5f9;
            border-radius: 8px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #60a5fa);
            width: 0%;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .activity-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .activity-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 2rem;
            border-radius: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .activity-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: 0 25px 30px -10px rgba(0, 0, 0, 0.1);
        }

        .activity-card.completed {
            background: #f0fdf4;
            border-color: #10b981;
        }

        .activity-thumb {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 0.75rem;
            margin-bottom: 1.25rem;
            border: 1px solid var(--border);
        }

        .activity-card h3 {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }

        .activity-card h2 {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: var(--text);
            line-height: 1.2;
        }

        .activity-card p {
            font-size: 0.85rem;
            line-height: 1.5;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .checkbox {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            width: 28px;
            height: 28px;
            border: 2px solid var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            background: white;
        }

        .completed .checkbox {
            background: #10b981;
            border-color: #10b981;
        }

        .completed .checkbox::after {
            content: '✓';
            color: white;
            font-size: 18px;
            font-weight: 900;
        }

        .mission-link {
            text-decoration: none;
            background: #f1f5f9;
            color: var(--text);
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .mission-link:hover {
            background: var(--text);
            color: white;
        }

        .reflection-zone {
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 2rem;
            border: 1px solid var(--border);
            margin-bottom: 5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .reflection-label {
            font-weight: 800;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            display: block;
            margin-bottom: 1rem;
        }

        textarea {
            width: 100%;
            background: #f8fafc;
            border: 2px solid var(--border);
            border-radius: 1rem;
            padding: 1.5rem;
            color: var(--text);
            font-family: inherit;
            font-size: 1.1rem;
            resize: vertical;
            min-height: 150px;
            transition: all 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px var(--ring);
        }

        .btn-sync {
            background: var(--text);
            color: white;
            border: none;
            padding: 1.25rem;
            border-radius: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            width: 100%;
            margin-top: 1.5rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .btn-sync:hover {
            background: #000;
            transform: scale(1.01);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .btn-sync:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #syncStatus {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .mission-link {
            text-decoration: none;
            color: var(--primary);
            font-weight: 700;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            margin-top: 1rem;
            padding: 0.5rem 0.75rem;
            background: rgba(37, 99, 235, 0.05);
            border-radius: 8px;
            transition: all 0.2s;
        }

        .mission-link:hover {
            background: rgba(37, 99, 235, 0.15);
            transform: translateX(4px);
        }
    </style>
</head>
<body>

    <div id="loginGate">
        <div class="login-box">
            <div class="login-logo">MKS-11 Portal</div>
            <p class="login-subtitle">Enter your credentials to access your missions</p>
            
            <div class="login-field">
                <label for="studentName">Your Name</label>
                <input type="text" id="studentName" placeholder="e.g. Jordan" maxlength="30" autocomplete="off">
            </div>
            
            <div class="login-field">
                <label for="studentPin">Secret PIN (1-99)</label>
                <input type="number" id="studentPin" placeholder="e.g. 42" min="1" max="99" autocomplete="off">
            </div>
            
            <div class="login-error" id="loginError">Please enter both your name and a PIN between 1-99.</div>
            
            <button class="btn-login" onclick="handleLogin()">Enter Portal</button>
            
            <p class="login-note">
                Your name + PIN creates a unique ID. Use the same combo each time to restore your saved work.
            </p>
        </div>
    </div>

    <div class="container" id="mainContent" style="display: none;">
        <header>
            <h1>Student Mission Control</h1>
            <div class="status-badge">
                Agent: <strong id="agentDisplay">---</strong> | Spring 2026
                <button class="btn-switch" onclick="switchStudent()">Switch</button>
            </div>
        </header>

        <div class="progress-container">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: 700; font-size: 0.9rem;">Course Progress</span>
                <span id="progressText" style="color: var(--primary); font-weight: 900;">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div id="progressBar" class="progress-bar-fill"></div>
            </div>
        </div>

        <div class="activity-grid" id="activityGrid">
        </div>

        <div class="reflection-zone">
            <label style="font-weight: 700; color: #94a3b8; text-transform: uppercase; font-size: 0.8rem;">Daily Mission Report</label>
            <textarea id="reflection" placeholder="What did you work on today? Any thoughts?"></textarea>
            <div style="margin-top: 1.5rem;">
                <button id="syncBtn" class="btn-sync">
                    <span>📡 Sync to Command Center</span>
                </button>
                <p id="syncStatus"></p>
            </div>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbxg2PJjjedeu_wvSjxxII0aEqusA9-kvXF9or9RhKc_bwsyqC4ZGnV-6DA0Xng6xLOMiQ/exec';
        
        let currentStudentId = null;
        let currentStudentName = null;

        function getStudentId() {
            return currentStudentId;
        }

        function initStudent() {
            const saved = localStorage.getItem('mks_current_student');
            if (saved) {
                const data = JSON.parse(saved);
                currentStudentId = data.id;
                currentStudentName = data.name;
                document.getElementById('loginGate').classList.add('hidden');
                document.getElementById('mainContent').style.display = '';
                document.getElementById('agentDisplay').textContent = currentStudentName.toUpperCase();
                return true;
            }
            return false;
        }

        function migrateOldData() {
            const migrations = [];
            
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                
                // Case 1: Broken migrated keys (e.g., mks_MKS11-DRAEDEN-10_MKS-11-ALPHA_m1_grid)
                const brokenPrefix = 'mks_' + currentStudentId + '_MKS-11-ALPHA_';
                if (key.startsWith(brokenPrefix)) {
                    const suffix = key.substring(brokenPrefix.length);
                    migrations.push({
                        oldKey: key,
                        newKey: 'mks_' + currentStudentId + '_' + suffix
                    });
                    continue;
                }
                
                // Case 2: Old default student keys (e.g., mks_MKS-11-ALPHA_m1_grid)
                const alphaPrefix = 'mks_MKS-11-ALPHA_';
                if (key.startsWith(alphaPrefix)) {
                    const suffix = key.substring(alphaPrefix.length);
                    migrations.push({
                        oldKey: key,
                        newKey: 'mks_' + currentStudentId + '_' + suffix
                    });
                    continue;
                }
                
                // Case 3: Legacy keys without student prefix (e.g., mks_m1_grid, mks_completed)
                // But avoid migrating keys of OTHER logged-in students (which start with mks_MKS11-)
                if (key.startsWith('mks_') && 
                    !key.startsWith('mks_' + currentStudentId + '_') && 
                    key !== 'mks_current_student') {
                    
                    // Check if it belongs to another student login (starts with mks_MKS11- or mks_MKS-11-)
                    // If it does, do not touch it.
                    if (key.startsWith('mks_MKS11-') || key.startsWith('mks_MKS-11-')) {
                        continue;
                    }
                    
                    const suffix = key.replace('mks_', '');
                    migrations.push({
                        oldKey: key,
                        newKey: 'mks_' + currentStudentId + '_' + suffix
                    });
                }
            }
            
            if (migrations.length === 0) return false;
            
            migrations.forEach(({ oldKey, newKey }) => {
                const value = localStorage.getItem(oldKey);
                if (value !== null) {
                    // Only copy if the new key doesn't already have data, or if we are fixing a broken key
                    if (!localStorage.getItem(newKey) || oldKey.includes('MKS-11-ALPHA')) {
                        localStorage.setItem(newKey, value);
                    }
                    localStorage.removeItem(oldKey);
                }
            });
            
            return true;
        }

        function handleLogin() {
            const nameInput = document.getElementById('studentName');
            const pinInput = document.getElementById('studentPin');
            const errorEl = document.getElementById('loginError');
            
            const name = nameInput.value.trim();
            const pin = parseInt(pinInput.value);
            
            if (!name || !pin || pin < 1 || pin > 99) {
                errorEl.classList.add('show');
                if (!name) nameInput.classList.add('error');
                if (!pin || pin < 1 || pin > 99) pinInput.classList.add('error');
                return;
            }
            
            errorEl.classList.remove('show');
            nameInput.classList.remove('error');
            pinInput.classList.remove('error');
            
            currentStudentName = name;
            currentStudentId = 'MKS11-' + name.replace(/\s+/g, '').toUpperCase() + '-' + String(pin).padStart(2, '0');
            
            const migrated = migrateOldData();
            
            localStorage.setItem('mks_current_student', JSON.stringify({
                id: currentStudentId,
                name: currentStudentName
            }));
            
            document.getElementById('loginGate').classList.add('hidden');
            document.getElementById('mainContent').style.display = '';
            document.getElementById('agentDisplay').textContent = currentStudentName.toUpperCase();
            
            if (migrated) {
                alert('Welcome back! Your previous work has been restored.');
            }
            
            initPortal();
        }

        function switchStudent() {
            if (confirm('Switch to a different student? Your current progress is saved.')) {
                localStorage.removeItem('mks_current_student');
                location.reload();
            }
        }

        document.getElementById('studentPin').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        document.getElementById('studentName').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('studentPin').focus();
        });

        const activities = [
            { id: 1, title: 'Mission: Silent Wampum', desc: 'Tell a story of peace using only symbols.', url: 'missions/m1.html', thumb: 'missions/assets/wampum_belt.png' },
            { id: 2, title: 'Mission: Modern Petroglyph', desc: 'Design symbols for life in 2026.', url: 'missions/m2.html', thumb: 'missions/assets/m2_thumb.png' },
            { id: 3, title: 'Mission: The Hero\'s Virtue', desc: 'Connect the 7 Sacred Teachings to a leader.', url: 'missions/m3.html', thumb: 'missions/assets/m3_thumb.png' },
            { id: 4, title: 'Mission: Dream School', desc: 'Design a safe space for learning.', url: 'missions/m4.html', thumb: 'missions/assets/m4_thumb.png' },
            { id: 5, title: 'Mission: Storyboard of Life', desc: 'Draw the 6 stages of the Creation Story.', url: 'missions/m5.html', thumb: 'missions/assets/m5_thumb.png' },
            { id: 6, title: 'Mission: The Secret Path', desc: 'Map Chanie Wenjack\'s journey.', url: 'missions/m6.html', thumb: 'missions/assets/m6_thumb.png' },
            { id: 7, title: 'Mission: TRC Report Card', desc: 'Rank the 10 most important changes.', url: 'missions/m7.html', thumb: 'missions/assets/m7_thumb.png' },
            { id: 8, title: 'Mission: Medal of Friendship', desc: 'Design a modern Treaty Medal.', url: 'missions/m8.html', thumb: 'missions/assets/m8_thumb.png' },
            { id: 9, title: 'Mission: Ipperwash Ticker', desc: 'Create headlines for the news.', url: 'missions/m9.html', thumb: 'missions/assets/m9_thumb.png' },
            { id: 10, title: 'Mission: The Justice Circle', desc: 'Map out a circle of healing.', url: 'missions/m10.html', thumb: 'missions/assets/m10_thumb.png' },
            { id: 11, title: 'Mission: Myth vs. Truth', desc: 'Compare Pocahontas to Sarah.', url: 'missions/m11.html', thumb: 'missions/assets/m11_thumb.png' },
            { id: 12, title: 'Mission: 2050 Vision', desc: 'Draw the future of the community.', url: 'missions/m12.html', thumb: 'missions/assets/m12_thumb.png' },
            { id: 13, title: 'Mission: The Eight-Point Path', desc: 'Create a balanced design with the Symmetry Weaver.', url: 'missions/m13.html', thumb: 'missions/assets/m13_thumb.png' },
            { id: 14, title: 'Mission: The Ash Basket Weaver', desc: 'Weave a checkerboard pattern using the Pattern Coder.', url: 'missions/m14.html', thumb: 'missions/assets/m14_thumb.png' },
            { id: 15, title: 'Mission: The Salmon Ladder Engineer', desc: 'Build a fish ladder to help salmon get home.', url: 'missions/m15.html', thumb: 'missions/assets/m15_thumb.png' }
        ];

        let completedIds = [];

        function getStorageKey(base) {
            return 'mks_' + currentStudentId + '_' + base;
        }

        function initPortal() {
            completedIds = JSON.parse(localStorage.getItem(getStorageKey('completed')) || '[]');
            updateUI();
        }

        function updateUI() {
            const grid = document.getElementById('activityGrid');
            grid.innerHTML = '';
            
            activities.forEach(act => {
                const isDone = completedIds.includes(act.id);
                const card = document.createElement('div');
                card.className = `activity-card ${isDone ? 'completed' : ''}`;
                card.innerHTML = `
                    <div class="checkbox"></div>
                    <img src="${act.thumb}" alt="${act.title}" class="activity-thumb">
                    <h3>Mission ${act.id}</h3>
                    <h2>${act.title}</h2>
                    <p>${act.desc}</p>
                    <a href="${act.url}" target="_blank" class="mission-link">
                        Open Mission Briefing ➔
                    </a>
                `;
                card.querySelector('.checkbox').onclick = (e) => {
                    e.stopPropagation();
                    toggleActivity(act.id);
                };
                grid.appendChild(card);
            });

            const percent = Math.round((completedIds.length / activities.length) * 100);
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressText').innerText = percent + '%';
        }

        function toggleActivity(id) {
            if (completedIds.includes(id)) {
                completedIds = completedIds.filter(i => i !== id);
            } else {
                completedIds.push(id);
            }
            localStorage.setItem(getStorageKey('completed'), JSON.stringify(completedIds));
            updateUI();
        }

        document.getElementById('syncBtn').onclick = async () => {
            const btn = document.getElementById('syncBtn');
            const status = document.getElementById('syncStatus');
            const reflection = document.getElementById('reflection').value;

            btn.disabled = true;
            status.innerText = '🛰️ Transmitting...';

            const payload = {
                studentId: currentStudentId,
                studentName: currentStudentName,
                timestamp: new Date().toISOString(),
                completedCount: completedIds.length,
                completedList: completedIds.join(', '),
                reflection: reflection
            };

            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                status.innerText = '🚀 Data successfully synced to Command Center!';
            } catch (err) {
                status.innerText = '❌ Transmission Error. Try again.';
                console.error(err);
            } finally {
                setTimeout(() => btn.disabled = false, 2000);
            }
        };

        if (!initStudent()) {
            document.getElementById('studentName').focus();
        } else {
            initPortal();
        }
    </script>
</body>
</html>
