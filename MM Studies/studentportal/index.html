<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKS-11 | Student Progress Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --accent: #e11d48;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --ring: rgba(37, 99, 235, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.03) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(225, 29, 72, 0.03) 0px, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 4rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -0.05em;
            text-transform: uppercase;
            color: var(--text);
            margin-bottom: 0.5rem;
            line-height: 1;
        }

        .status-badge {
            display: inline-block;
            background: #fff;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.5rem 1.5rem;
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-top: 1rem;
        }

        .status-badge strong {
            color: var(--primary);
        }

        .progress-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 2.5rem;
            border-radius: 2rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 1rem;
        }

        .progress-label {
            font-weight: 800;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .progress-percent {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            line-height: 1;
            color: var(--primary);
        }

        .progress-bar-bg {
            height: 16px;
            background: #f1f5f9;
            border-radius: 8px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #60a5fa);
            width: 0%;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .activity-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .activity-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 2rem;
            border-radius: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .activity-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: 0 25px 30px -10px rgba(0, 0, 0, 0.1);
        }

        .activity-card.completed {
            background: #f0fdf4;
            border-color: #10b981;
        }

        .activity-card h3 {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }

        .activity-card h2 {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: var(--text);
            line-height: 1.2;
        }

        .activity-card p {
            font-size: 0.85rem;
            line-height: 1.5;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .checkbox {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            width: 28px;
            height: 28px;
            border: 2px solid var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            background: white;
        }

        .completed .checkbox {
            background: #10b981;
            border-color: #10b981;
        }

        .completed .checkbox::after {
            content: '✓';
            color: white;
            font-size: 18px;
            font-weight: 900;
        }

        .mission-link {
            text-decoration: none;
            background: #f1f5f9;
            color: var(--text);
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .mission-link:hover {
            background: var(--text);
            color: white;
        }

        .reflection-zone {
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 2rem;
            border: 1px solid var(--border);
            margin-bottom: 5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .reflection-label {
            font-weight: 800;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            display: block;
            margin-bottom: 1rem;
        }

        textarea {
            width: 100%;
            background: #f8fafc;
            border: 2px solid var(--border);
            border-radius: 1rem;
            padding: 1.5rem;
            color: var(--text);
            font-family: inherit;
            font-size: 1.1rem;
            resize: vertical;
            min-height: 150px;
            transition: all 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px var(--ring);
        }

        .btn-sync {
            background: var(--text);
            color: white;
            border: none;
            padding: 1.25rem;
            border-radius: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            width: 100%;
            margin-top: 1.5rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .btn-sync:hover {
            background: #000;
            transform: scale(1.01);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .btn-sync:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #syncStatus {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .mission-link {
            text-decoration: none;
            color: var(--primary);
            font-weight: 700;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            margin-top: 1rem;
            padding: 0.5rem 0.75rem;
            background: rgba(37, 99, 235, 0.05);
            border-radius: 8px;
            transition: all 0.2s;
        }

        .mission-link:hover {
            background: rgba(37, 99, 235, 0.15);
            transform: translateX(4px);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Draeden's Mission Control</h1>
            <div class="status-badge">Agent: <strong>Draeden</strong> | Sector: MKS-11-SPRING</div>
        </header>

        <div class="progress-container">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: 700; font-size: 0.9rem;">Course Progress</span>
                <span id="progressText" style="color: var(--primary); font-weight: 900;">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div id="progressBar" class="progress-bar-fill"></div>
            </div>
        </div>

        <div class="activity-grid" id="activityGrid">
            <!-- Activities will be injected here -->
        </div>

        <div class="reflection-zone">
            <label style="font-weight: 700; color: #94a3b8; text-transform: uppercase; font-size: 0.8rem;">Daily Mission Report</label>
            <textarea id="reflection" placeholder="What did you work on today? Any thoughts?"></textarea>
            <div style="margin-top: 1.5rem;">
                <button id="syncBtn" class="btn-sync">
                    <span>📡 Sync to Command Center</span>
                </button>
                <p id="syncStatus"></p>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURATION
        const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbxg2PJjjedeu_wvSjxxII0aEqusA9-kvXF9or9RhKc_bwsyqC4ZGnV-6DA0Xng6xLOMiQ/exec';
        
        const activities = [
            { id: 1, title: 'Mission: Silent Wampum', desc: 'Tell a story of peace using only symbols.', url: 'missions/m1.html' },
            { id: 2, title: 'Mission: Modern Petroglyph', desc: 'Design symbols for life in 2026.', url: 'missions/m2.html' },
            { id: 3, title: 'Mission: The Hero’s Virtue', desc: 'Connect the 7 Sacred Teachings to a leader.', url: 'missions/m3.html' },
            { id: 4, title: 'Mission: Dream School', desc: 'Design a safe space for learning.', url: 'missions/m4.html' },
            { id: 5, title: 'Mission: Storyboard of Life', desc: 'Draw the 6 stages of the Creation Story.', url: 'missions/m5.html' },
            { id: 6, title: 'Mission: The Secret Path', desc: 'Map Chanie Wenjack’s journey.', url: 'missions/m6.html' },
            { id: 7, title: 'Mission: TRC Report Card', desc: 'Rank the 10 most important changes.', url: 'missions/m7.html' },
            { id: 8, title: 'Mission: Medal of Friendship', desc: 'Design a modern Treaty Medal.', url: 'missions/m8.html' },
            { id: 9, title: 'Mission: Ipperwash Ticker', desc: 'Create headlines for the news.', url: 'missions/m9.html' },
            { id: 10, title: 'Mission: The Justice Circle', desc: 'Map out a circle of healing.', url: 'missions/m10.html' },
            { id: 11, title: 'Mission: Myth vs. Truth', desc: 'Compare Pocahontas to Sarah.', url: 'missions/m11.html' },
            { id: 12, title: 'Mission: 2050 Vision', desc: 'Draw the future of the community.', url: 'missions/m12.html' }
        ];

        let completedIds = JSON.parse(localStorage.getItem('mks_completed') || '[]');

        function updateUI() {
            const grid = document.getElementById('activityGrid');
            grid.innerHTML = '';
            
            activities.forEach(act => {
                const isDone = completedIds.includes(act.id);
                const card = document.createElement('div');
                card.className = `activity-card ${isDone ? 'completed' : ''}`;
                card.innerHTML = `
                    <div class="checkbox"></div>
                    <h3>Mission ${act.id}</h3>
                    <h2>${act.title}</h2>
                    <p>${act.desc}</p>
                    <a href="${act.url}" target="_blank" class="mission-link">
                        Open Mission Briefing ➔
                    </a>
                `;
                // Keep the checkbox toggle but allow the link to work separately
                card.querySelector('.checkbox').onclick = (e) => {
                    e.stopPropagation();
                    toggleActivity(act.id);
                };
                grid.appendChild(card);
            });

            const percent = Math.round((completedIds.length / activities.length) * 100);
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressText').innerText = percent + '%';
        }

        function toggleActivity(id) {
            if (completedIds.includes(id)) {
                completedIds = completedIds.filter(i => i !== id);
            } else {
                completedIds.push(id);
            }
            localStorage.setItem('mks_completed', JSON.stringify(completedIds));
            updateUI();
        }

        document.getElementById('syncBtn').onclick = async () => {
            const btn = document.getElementById('syncBtn');
            const status = document.getElementById('syncStatus');
            const reflection = document.getElementById('reflection').value;

            btn.disabled = true;
            status.innerText = '🛰️ Transmitting...';

            const payload = {
                studentId: 'Draeden',
                timestamp: new Date().toISOString(),
                completedCount: completedIds.length,
                completedList: completedIds.join(', '),
                reflection: reflection
            };

            try {
                // If no URL is provided yet, we mock the success
                if (WEBHOOK_URL.includes('YOUR_GOOGLE_SHEET')) {
                    console.log('Mock sync payload:', payload);
                    setTimeout(() => {
                        status.innerText = '✅ Progress saved locally! (Add Webhook URL for real-time sync)';
                        btn.disabled = false;
                    }, 1000);
                    return;
                }

                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Standard for Google Apps Script webhooks
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                status.innerText = '🚀 Data successfully synced to Command Center!';
            } catch (err) {
                status.innerText = '❌ Transmission Error. Try again.';
                console.error(err);
            } finally {
                setTimeout(() => btn.disabled = false, 2000);
            }
        };

        updateUI();
    </script>
</body>
</html>
