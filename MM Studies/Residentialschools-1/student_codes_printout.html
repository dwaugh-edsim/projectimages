<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENT ACCESS CODES | IRSSA DOSSIER</title>
    <style>
        body {
            font-family: 'Tahoma', sans-serif;
            padding: 20px;
            background: #fff;
            color: #000;
            font-size: 12px;
        }
        .header {
            text-align: center;
            border: 2px solid #000;
            padding: 15px;
            margin-bottom: 30px;
            position: relative;
        }
        .header::after {
            content: 'CONFIDENTIAL: FOR INSTRUCTOR USE ONLY';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            padding: 0 10px;
            font-weight: bold;
            font-size: 10px;
        }
        h1 {
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 1.4rem;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .block-section {
            border: 1px solid #000;
            display: flex;
            flex-direction: column;
        }
        .block-title {
            background: #000;
            color: #fff;
            padding: 8px;
            text-align: center;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 6px 12px;
            border-bottom: 1px solid #eee;
        }
        th {
            font-size: 0.7rem;
            background: #f4f4f4;
            color: #333;
            text-transform: uppercase;
            border-bottom: 1px solid #000;
        }
        .code {
            font-weight: bold;
            color: #d35400;
            font-size: 13px;
        }
        .footer {
            margin-top: 30px;
            font-size: 9px;
            color: #888;
            text-align: center;
            text-transform: uppercase;
        }
        @media print {
            .no-print { display: none; }
            body { padding: 0; }
            .container { gap: 10px; }
            .block-section { page-break-inside: avoid; }
        }
        .btn-print {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #000;
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 1000;
        }
    </style>
</head>
