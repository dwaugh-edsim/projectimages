<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugar Falls: Chapter 1 Display</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&family=Special+Elite&display=swap');
        
        :root {
            --bg: #0a0a0a;
            --accent: #c0392b;
            --text: #e0e0e0;
            --panel-bg: #1a1a1a;
            --nav-bg: rgba(26, 26, 26, 0.8);
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 10px 30px;
            background: rgba(0,0,0,0.9);
            border-bottom: 2px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        h1 {
            font-family: 'Special Elite', cursive;
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: var(--accent);
        }

        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0 80px; /* Space for side buttons */
        }

        .nav-side {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.3s;
            z-index: 20;
            user-select: none;
        }

        .nav-side:hover {
            background: rgba(255,255,255,0.05);
        }

        .nav-side.left { left: 0; border-right: 1px solid rgba(255,255,255,0.05); }
        .nav-side.right { right: 0; border-left: 1px solid rgba(255,255,255,0.05); }

        .nav-arrow {
            font-family: 'Special Elite', cursive;
            font-size: 3rem;
            color: var(--text);
            opacity: 0.3;
            transition: all 0.2s;
        }

        .nav-side:hover .nav-arrow {
            opacity: 1;
            color: var(--accent);
            transform: scale(1.2);
        }

        .nav-side.disabled {
            pointer-events: none;
            opacity: 0.1;
        }

        .viewer-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
        }

        .panel-image {
            max-width: 100%;
            max-height: 90vh;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 2px solid #333;
            border-radius: 4px;
            transition: opacity 0.2s ease;
        }

        .panel-counter {
            background: var(--nav-bg);
            padding: 5px 20px;
            border-radius: 0 0 15px 15px;
            font-family: 'Special Elite', cursive;
            font-size: 1rem;
            border: 1px solid #333;
            border-top: none;
        }

        .footer {
            position: fixed;
            bottom: 10px;
            right: 20px;
            font-size: 0.7rem;
            opacity: 0.4;
            pointer-events: none;
        }

        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }
    </style>
</head>
<body>

    <header>
        <h1>SUGAR FALLS: CHAPTER 1</h1>
        <div class="panel-counter">Panel <span id="currentNum">1</span> / 24</div>
        <div id="status" style="font-size: 0.8rem; opacity: 0.6;">Visual Narrative Archive</div>
    </header>

    <div class="main-container">
        <div class="nav-side left" id="prevBtn" onclick="changePanel(-1)">
            <span class="nav-arrow">&lsaquo;</span>
        </div>

        <div class="viewer-container">
            <img id="panelDisplay" src="SF-ch1/sf1.jpg" alt="Panel Display" class="panel-image">
        </div>

        <div class="nav-side right" id="nextBtn" onclick="changePanel(1)">
            <span class="nav-arrow">&rsaquo;</span>
        </div>
    </div>

    <div class="footer">
        USE SIDE ARROWS OR KEYBOARD (LEFT/RIGHT)
    </div>

    <script>
        let currentPanel = 1;
        const totalPanels = 24;
        const display = document.getElementById('panelDisplay');
        const counter = document.getElementById('currentNum');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        function changePanel(delta) {
            const newNum = currentPanel + delta;
            if (newNum >= 1 && newNum <= totalPanels) {
                currentPanel = newNum;
                updateDisplay();
            }
        }

        function updateDisplay() {
            display.style.opacity = '0.3';
            
            // Set source
            display.src = `SF-ch1/sf${currentPanel}.jpg`;
            
            display.onload = () => {
                display.style.opacity = '1';
                counter.innerText = currentPanel;
                
                // Update buttons
                if (currentPanel === 1) prevBtn.classList.add('disabled');
                else prevBtn.classList.remove('disabled');

                if (currentPanel === totalPanels) nextBtn.classList.add('disabled');
                else nextBtn.classList.remove('disabled');
            };

            // Update URL hash for bookmarking/refreshing
            window.location.hash = currentPanel;
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') changePanel(-1);
            if (e.key === 'ArrowRight') changePanel(1);
        });

        // Handle initial hash
        window.addEventListener('load', () => {
            const hash = window.location.hash.substring(1);
            if (hash && !isNaN(hash)) {
                const num = parseInt(hash);
                if (num >= 1 && num <= totalPanels) {
                    currentPanel = num;
                }
            }
            updateDisplay();
        });
    </script>
</body>
</html>
