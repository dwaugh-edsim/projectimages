<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugar Falls: Chapter 1 Display</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&family=Special+Elite&display=swap');
        
        :root {
            --bg: #0a0a0a;
            --accent: #c0392b;
            --text: #e0e0e0;
            --panel-bg: #1a1a1a;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 15px 30px;
            background: rgba(0,0,0,0.8);
            border-bottom: 2px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        h1 {
            font-family: 'Special Elite', cursive;
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--accent);
        }

        .viewer-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .panel-image {
            max-width: 100%;
            max-height: 85vh;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 4px solid #333;
            border-radius: 4px;
            transition: opacity 0.3s ease;
        }

        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            align-items: center;
            background: rgba(0,0,0,0.8);
            padding: 10px 25px;
            border-radius: 50px;
            border: 1px solid #444;
            backdrop-filter: blur(10px);
            z-index: 20;
        }

        .btn {
            background: transparent;
            border: 2px solid var(--text);
            color: var(--text);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .panel-counter {
            font-family: 'Special Elite', cursive;
            font-size: 1.2rem;
            min-width: 120px;
            text-align: center;
        }

        .instructions {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 0.7rem;
            opacity: 0.5;
        }

        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }
    </style>
</head>
<body>

    <header>
        <h1>SUGAR FALLS: CHAPTER 1</h1>
        <div id="status">Visual Narrative Archive</div>
    </header>

    <div class="viewer-container">
        <div id="loading" class="loading-overlay">Loading Panel...</div>
        <img id="panelDisplay" src="SF-ch1/sf1.jpg" alt="Panel Display" class="panel-image">
    </div>

    <div class="controls">
        <button class="btn" id="prevBtn" onclick="changePanel(-1)">Previous</button>
        <div class="panel-counter">Panel <span id="currentNum">1</span> / 23</div>
        <button class="btn" id="nextBtn" onclick="changePanel(1)">Next</button>
    </div>

    <div class="instructions">
        USE ARROW KEYS TO NAVIGATE
    </div>

    <script>
        let currentPanel = 1;
        const totalPanels = 24;
        const display = document.getElementById('panelDisplay');
        const counter = document.getElementById('currentNum');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        function changePanel(delta) {
            const newNum = currentPanel + delta;
            if (newNum >= 1 && newNum <= totalPanels) {
                currentPanel = newNum;
                updateDisplay();
            }
        }

        function updateDisplay() {
            display.style.opacity = '0.5';
            
            // Set source
            display.src = `SF-ch1/sf${currentPanel}.jpg`;
            
            display.onload = () => {
                display.style.opacity = '1';
                counter.innerText = currentPanel;
                
                // Update buttons
                prevBtn.disabled = (currentPanel === 1);
                nextBtn.disabled = (currentPanel === totalPanels);
            };

            // Update URL hash for bookmarking/refreshing
            window.location.hash = currentPanel;
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') changePanel(-1);
            if (e.key === 'ArrowRight') changePanel(1);
        });

        // Handle initial hash
        window.addEventListener('load', () => {
            const hash = window.location.hash.substring(1);
            if (hash && !isNaN(hash)) {
                const num = parseInt(hash);
                if (num >= 1 && num <= totalPanels) {
                    currentPanel = num;
                    updateDisplay();
                }
            }
            updateDisplay();
        });
    </script>
</body>
</html>
