<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Economics 12 - Conflict List">
  <title>Economics 12 Conflict List — Mr. Waugh</title>
  
  <!-- Premium Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #fafafa;
      --text: #1a1a1a;
      --text-muted: #555555;
      --border: #cccccc;
    }

    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.3;
      padding: 40px 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px 40px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid #eaeaea;
    }

    /* Header Panel */
    .header {
      border-bottom: 2px solid #222222;
      padding-bottom: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .header-title h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #111111;
      letter-spacing: -0.5px;
    }

    .header-title p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 500;
    }

    /* Print Button (Hidden on Print) */
    .print-btn-container {
      margin-bottom: 15px;
      text-align: right;
    }

    .btn {
      padding: 8px 16px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #111111;
      color: #ffffff;
      border: none;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #333333;
    }

    /* Class List Table */
    .attendance-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      margin-top: 10px;
    }

    .attendance-table th {
      border-bottom: 2px solid #222222;
      padding: 10px 12px;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .attendance-table td {
      padding: 12px 12px;
      border-bottom: 1px solid #e5e5e5;
      font-size: 0.95rem;
      vertical-align: middle;
    }

    /* Checkmark Column styling */
    .check-col {
      width: 80px;
      text-align: center;
    }

    .check-box-placeholder {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 1.5px solid #444444;
      border-radius: 3px;
      vertical-align: middle;
    }

    /* Print adjustments */
    @media print {
      @page {
        size: letter portrait;
        margin: 0.5in;
      }

      body {
        background: #ffffff !important;
        padding: 0 !important;
      }
      
      .container {
        box-shadow: none !important;
        border: none !important;
        padding: 0 !important;
        max-width: 100% !important;
      }

      .print-btn-container {
        display: none !important;
      }

      .header {
        border-bottom: 2px solid #000000 !important;
        padding-bottom: 6px !important;
        margin-bottom: 15px !important;
      }

      .header-title h1 {
        font-size: 16pt !important;
      }

      .header-title p {
        font-size: 9pt !important;
      }

      .attendance-table th {
        border-bottom: 2px solid #000000 !important;
        padding: 8px 10px !important;
        font-size: 8.5pt !important;
      }

      .attendance-table td {
        border-bottom: 1px solid #dddddd !important;
        padding: 8px 10px !important;
        font-size: 9pt !important;
      }

      .check-box-placeholder {
        width: 14px !important;
        height: 14px !important;
        border: 1.2px solid #000000 !important;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Action Button (hidden in print) -->
    <div class="print-btn-container">
      <button class="btn" onclick="window.print()">
        <svg width="12" height="12" fill="currentColor" viewBox="0 0 16 16">
          <path d="M2.5 8a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1z"/>
          <path d="M5 1a2 2 0 0 0-2 2v2H2a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1v1a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-1h1a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1V3a2 2 0 0 0-2-2H5zM4 3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2H4V3zm1 5a2 2 0 0 0-2 2v1H2a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v-1a2 2 0 0 0-2-2H5zm7 2v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1z"/>
        </svg>
        Print Conflict List
      </button>
    </div>

    <!-- Header Block -->
    <header class="header">
      <div class="header-title">
        <h1>Economics 12 Conflict List — Mr. Waugh</h1>
        <p>June 23, GYM • 1:00 PM</p>
      </div>
    </header>

    <!-- Roster Table -->
    <table class="attendance-table">
      <thead>
        <tr>
          <th style="width: 70%;">Student Name</th>
          <th class="check-col" style="width: 30%;">Present</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Efe Alp</td>
          <td class="check-col"><span class="check-box-placeholder"></span></td>
        </tr>
        <tr>
          <td>Ana Amiree</td>
          <td class="check-col"><span class="check-box-placeholder"></span></td>
        </tr>
      </tbody>
    </table>

  </div>

</body>
</html>
