<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HALIFAX WEST 2026 | Official Party Gallery</title>
    <link rel="stylesheet" href="styles.css">
    <script src="data.js"></script>
</head>
<body id="gallery-view">

    <div class="container" style="max-width: 1400px;">
        <header class="animate" style="text-align: center; display: block;">
            <div class="logo" style="font-size: 3.5rem; margin-bottom: 0.5rem;">HALIFAX WEST 2026</div>
            <div class="hero-badge" style="margin-top: 1rem;">OFFICIAL PARTY GALLERY</div>
        </header>

        <div class="gallery" id="gallery">
            <!-- Cards injected dynamically -->
        </div>

        <div class="toast" id="outcome-toast" style="display: block; position: fixed; bottom: 2rem; right: 2rem; background: rgba(16, 185, 129, 0.15);">
            Outcome 5.3: Platform & Policy Advocacy
        </div>
    </div>

    <script>
        async function loadParties() {
            try {
                const response = await fetch(scriptURL);
                const data = await response.json();
                
                // FILTER: Hide test data
                const raw = data.parties.filter(p => 
                    !(p.partyname || p.name || "").toUpperCase().startsWith("TEST") && 
                    !(p.pin || "").toUpperCase().startsWith("T")
                );

                // DEDUPLICATE: Keep only latest for each party name (FUZZY)
                const filtered = [];
                raw.forEach(p => {
                    const name = (p.partyname || p.name || "Unknown").trim();
                    const slogan = (p.slogan || "").trim();
                    const idx = filtered.findIndex(existing => {
                        const exName = (existing.partyname || existing.name).trim();
                        const exSlogan = (existing.slogan || "").trim();
                        // Match if slogan is identical OR names are 85% similar
                        return (slogan.length > 5 && slogan === exSlogan) || 
                               (name.toLowerCase().includes(exName.toLowerCase()) && slogan === exSlogan) ||
                               (exName.toLowerCase().includes(name.toLowerCase()) && slogan === exSlogan);
                    });
                    if (idx > -1) filtered[idx] = p;
                    else filtered.push(p);
                });
                
                renderCards(filtered);
            } catch (err) {
                console.error("Failed to fetch party data", err);
            }
        }

        function renderCards(parties) {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';

            parties.forEach((party, index) => {
                const card = document.createElement('div');
                card.className = 'party-card animate card';
                card.style.animationDelay = `${index * 0.1}s`;
                card.style.minHeight = '420px';
                
                const platforms = (party.platforms || "").split(', ').map(p => `
                    <span class="tag">${p}</span>
                `).join('');

                const pName = party.partyname || party.name;

                card.innerHTML = `
                    <div class="party-accent" style="background: ${party.color}; height: 12px; border-radius: 28px 28px 0 0;"></div>
                    <div class="party-content">
                        <div class="party-name" style="font-size: 2.2rem; font-weight: 800; margin-bottom: 0.5rem; margin-top: 1rem;">${pName}</div>
                        <div class="party-leader" style="font-size: 0.9rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 2rem;">LEADER: ${party.leader}</div>
                        <div class="party-slogan" style="font-size: 1.3rem; font-style: italic; border-left: 3px solid rgba(255,255,255,0.2); padding-left: 1.5rem; margin-bottom: 2rem;">"${party.slogan}"</div>
                        
                        <div class="label" style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem; font-weight: 700;">Platform Focus</div>
                        <div class="tag-list">${platforms}</div>
                        
                        <div style="margin-top: auto; padding-top: 2rem; border-top: 1px solid var(--glass-border);">
                            <div class="label" style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem; font-weight: 700;">Official Roster</div>
                            <div style="font-weight: 600; font-size: 0.95rem;">${party.members}</div>
                        </div>
                    </div>
                `;
                gallery.appendChild(card);
            });
        }

        loadParties();
        setInterval(loadParties, 60000);
    </script>
</body>
</html>
