<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opposition Research Hub | Halifax West 2026</title>
    <!-- Google Fonts: Inter & Bebas Neue -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --primary: #6366f1;
            --accent: #10b981;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                              radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        h1, h2, h3, .slogan {
            font-family: 'Bebas Neue', cursive;
            letter-spacing: 1px;
        }

        header {
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-size: 3rem;
            color: #fff;
            text-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
        }

        .header-sub {
            color: var(--text-muted);
            letter-spacing: 3px;
            font-size: 0.9rem;
            text-transform: uppercase;
            font-weight: 600;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            flex-grow: 1;
            display: flex;
            gap: 2rem;
        }

        /* --- HUB VIEW (Party Cards) --- */
        #hub-view {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            align-content: start;
        }

        .party-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .party-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 6px;
            background: var(--party-color, var(--primary));
        }

        .party-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border-color: rgba(255,255,255,0.2);
        }

        .party-card h2 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            color: var(--party-color, #fff);
        }

        .party-card .leader {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .party-card .slogan {
            font-size: 1.2rem;
            color: #fff;
            opacity: 0.8;
            font-style: italic;
        }

        /* --- PROFILE VIEW --- */
        #profile-view {
            display: none;
            width: 100%;
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--glass-border);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin-bottom: 2rem;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .profile-header {
            margin-bottom: 2rem;
            border-left: 6px solid var(--active-color);
            padding-left: 1.5rem;
        }

        .profile-header h1 {
            font-size: 4rem;
            color: var(--active-color);
            line-height: 1;
        }

        .profile-header .slogan {
            font-size: 1.5rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .platform-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            .platform-grid { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
        }

        .panel h3 {
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .panel p {
            line-height: 1.7;
            color: #cbd5e1;
            margin-bottom: 1rem;
        }
        
        .panel ul {
            list-style-position: inside;
            color: #cbd5e1;
            line-height: 1.7;
            margin-bottom: 1rem;
        }

        /* --- PREP PAD (Interactive Tool) --- */
        .prep-pad {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
            border: 1px solid var(--accent);
            border-radius: 16px;
            padding: 1.5rem;
            margin-top: 2rem;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.1);
            position: sticky;
            top: 120px;
        }

        .prep-pad h3 {
            color: var(--accent);
            border-bottom: none;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 0.75rem;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus, .input-group textarea:focus {
            border-color: var(--accent);
        }

        .input-group textarea {
            resize: vertical;
            min-height: 80px;
        }

    </style>
</head>
<body>

    <header>
        <div class="header-title">THE WAR ROOM</div>
        <div class="header-sub">Halifax West Opposition Research Hub</div>
    </header>

    <div class="container">
        
        <!-- HUB VIEW: List of Cards -->
        <div id="hub-view">
            <!-- Cards generated by JS -->
        </div>

        <!-- PROFILE VIEW: Detailed Platform -->
        <div id="profile-view">
            <button class="back-btn" onclick="showHub()">← Back to War Room</button>
            
            <div class="profile-header" id="ph-container">
                <h1 id="p-name">Party Name</h1>
                <div class="slogan" id="p-slogan">"Slogan goes here"</div>
                <div style="color: var(--text-muted); margin-top: 0.5rem;">Leader: <span id="p-leader" style="color:#fff;"></span></div>
            </div>

            <div class="platform-grid">
                <!-- Left Col: Platform Content -->
                <div>
                    <div class="panel">
                        <h3>📣 Communications Message</h3>
                        <div id="p-comms"></div>
                    </div>
                    
                    <div class="panel">
                        <h3>🛡️ Strategic Policy</h3>
                        <div id="p-strategy"></div>
                    </div>

                    <div class="panel">
                        <h3>💰 Financial Plan</h3>
                        <div id="p-finance"></div>
                    </div>
                </div>

                <!-- Right Col: Prep Pad -->
                <div>
                    <div class="prep-pad">
                        <h3>🎯 Attack Ad Formulation</h3>
                        <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1.5rem;">Draft your respectful, tough question for the Town Hall debate.</p>
                        
                        <div class="input-group">
                            <label>Target Policy/Flaw Identified</label>
                            <input type="text" placeholder="e.g. Where do they find 50k doctors?">
                        </div>
                        
                        <div class="input-group">
                            <label>The Challenge Question</label>
                            <textarea placeholder="Write exactly what you will ask them on stage..."></textarea>
                        </div>
                        
                        <hr style="border:0; border-top: 1px solid var(--glass-border); margin: 1.5rem 0;">
                        
                        <h3>🤝 The Olive Branch</h3>
                        <div class="input-group">
                            <label>Potential Coalition Policy</label>
                            <input type="text" placeholder="e.g. We agree with their transit plan...">
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Party Data based on April 16 Consolidated Records
        const parties = [
            {
                id: 'de-solution',
                name: 'The Party De Solution',
                leader: 'MadhavanK',
                color: '#e2e8f0', // Off-white/slate
                slogan: '"Procrastination is for the weak"',
                comms: '<p>The People of Nova Scotia deserve a government that makes sure that Absolutely NOTHING is procrastinated or put off to a later date. This will lead our schools, our environment, and our community into a happy and fulfilled future that can nurture happy lives that do not get hurt because of cheap things bought in bulk because of bad funding.</p>',
                strategy: '<ul><li>Give schools more funding to get better education (more space, better technology, more extra curriculars) for all students.</li><li>Aquire safer buses for school kids to ride in (actually add seatbelts, etc.)</li><li>Build more specialized in-school nurse\'s offices to have more than ice available, staffed by trained school nurses.</li><li>DO NOT PROCRASTINATE.</li></ul>',
                finance: '<p>There is plenty of ways that we can make money. We will partner with food outlets (like Subway): if a person donates money up to $500, they get a limited time discount on the entire menu, or access to a secret exotic menu proportional to their donation. We will also rely on doing exclusive events for payers, inviting celebrities (e.g. Justin Beiber) and pricing tickets according to hype on social media.</p>'
            },
            {
                id: 'healthier-future',
                name: 'The Healthier Future',
                leader: 'Joshua Abraham',
                color: '#3b82f6', // Blue
                slogan: '"The Path to the Healthy Future starts with a Healthy Body"',
                comms: '<p>The people of Nova Scotia deserve benefits with their free healthcare like not waiting 8 hours for lines to get in while you suffer. My party will with guarantee get those times dropped for you to have a pleasent experience and be in and out of the hospital by at least 1-2 hours using maximum effiecientcy to quickly move those waiting with lower priorities to rooms that are fit for low priority doctors while the higher priorities get the full attention by the best doctors.</p>',
                strategy: '<ul><li>Include upwards of 50,000 doctors, nurses and physicians by reducing the 10 years needed to 5 years to move doctors in and out of medical school.</li><li>Recruit and select more newer Canadians to become family doctors so hospitals don\'t become crowded with minor issues clinics can solve.</li><li>Start modernizing hospitals to speed up diagnosis by uploading secure information and using e-prescriptions.</li></ul>',
                finance: '<p>Many people use "sinful" products like tobacco, alcohol and extremely high sugary drinks. This brings people to the hospital in the first place. We will tax "sinful" products by taxing either 10% and upwards to 50% of the product\'s price to reduce consumption, decreasing issues and increasing efficiency in the hospital to clear waiting rooms.</p>'
            },
            {
                id: 'islamic-assoc',
                name: 'The Islamic Associations of Halifax',
                leader: 'MD Farhan Rahman',
                color: '#1d6825', // Green
                slogan: '"Islam is Peace, Justice and Unity"',
                comms: '<p>The people of Halifax should vote for a Government that puts Ethics Over Profits & People Over Politics. The people should vote for a government that fights corruption, forbids it, and promotes social welfare.</p>',
                strategy: '<ul><li><strong>Humanitarian:</strong> Build homes for people to live. Humanity is obligatory.</li><li><strong>Anti-corruption:</strong> Focus on unity—no sects and no conflicts, just peace and harmony. Honest administration.</li><li><strong>Social welfare:</strong> Build a strong social space for people and protect vulnerable neighbours.</li><li><strong>Economic justice:</strong> Promote fair wealth distribution and interest-free business finance.</li><li><strong>Pluralism:</strong> Respecting differences and sharing power fairly.</li><li><strong>Environment:</strong> Respect wildlife, forests, and marine life to keep HRM non-toxic and clean.</li></ul>',
                finance: '<p>Our funds will be focused on people and the environment. We will create dedicated teams to sustain satisfaction. Budget breakdown: Marine/livestock 1.5%, Court and law 2%, Forest/eco-society 3.5%, Decreasing housing prices 1.3%. The remaining 5.7% goes to Humanitarian needs, ensuring Housing and Eco are the best places for people in poverty and refugees.</p>'
            },
            {
                id: 'niche',
                name: 'The Niche Halligonians',
                leader: 'Lachlan McM',
                color: '#9ca3af', // Gray/Whiteish
                slogan: '"If not now, then when?"',
                comms: '<p>The people of Nova Scotia deserve a government that cares about the people. It needs to provide Health Care—renovate all walk-in clinics, new gear and expanded spaces. Education—building more schools, smaller classrooms (more student-focused). Affordable Housing—individuals who make below a threshold will be eligible for government funds.</p>',
                strategy: '<ul><li>Health Care: renovate all walk-in clinics, new gear and expanded spaces.</li><li>Education: building more schools, smaller schools, smaller classrooms (student-focused).</li><li>Affordable Housing: individuals below a threshold will be eligible for government funds.</li></ul>',
                finance: '<p><em>We rely on creative reallocation.</em> "Well, Santa. Honestlly, we\'re getting into the North Pole business. We provide the toys." We are reallocating certain tuition funds (e.g. military) to directly supply schools and families with what they need, directly out of our "North Pole" workshop of government funds.</p>'
            },
            {
                id: 'team-tomorrow',
                name: 'Team tomorrow',
                leader: 'Laila Awad',
                color: '#f43bf7', // Pink/Magenta
                slogan: '"See you tommorow!"',
                comms: '<p>The people of Nova Scotia deserve a government that puts healthcare, education and affordable housing first. Our party will start to lower the long hours people have to wait to get assistance for health, making mental health care available to everyone. We will reduce tuition costs over a few years and increase financial aid. We will make more affordable housing units and try to limit rent increases so costs stay fair.</p>',
                strategy: '<ul><li>1. Reduce college and university tuition costs by 20% over the next four years and increase financial aid for students who need it.</li><li>2. Make sure everyone has a family doctor by 2030 by hiring more doctors and opening at least 10 new clinics.</li><li>3. Build 5,000 affordable housing units in the next 5 years and limit rent increases to keep housing costs fair.</li></ul>',
                finance: '<p>First, we would work with the federal government to get more funding. Second, we’ll cut waste by making government spending more efficient. Finally, we’ll add small taxes on luxury goods (like expensive cars or high-end items) and also on empty homes kept as investments, raising money without increasing taxes on everyday Nova Scotians.</p>'
            }
        ];

        const hubView = document.getElementById('hub-view');
        const profileView = document.getElementById('profile-view');

        // Render Cards
        parties.forEach(party => {
            const card = document.createElement('div');
            card.className = 'party-card';
            card.style.setProperty('--party-color', party.color);
            card.innerHTML = `
                <h2>${party.name}</h2>
                <div class="leader">Leader: ${party.leader}</div>
                <div class="slogan">${party.slogan}</div>
            `;
            card.onclick = () => showProfile(party);
            hubView.appendChild(card);
        });

        function showProfile(party) {
            hubView.style.display = 'none';
            profileView.style.display = 'block';

            document.getElementById('ph-container').style.setProperty('--active-color', party.color);
            document.getElementById('p-name').textContent = party.name;
            document.getElementById('p-leader').textContent = party.leader;
            document.getElementById('p-slogan').textContent = party.slogan;
            
            document.getElementById('p-comms').innerHTML = party.comms;
            document.getElementById('p-strategy').innerHTML = party.strategy;
            document.getElementById('p-finance').innerHTML = party.finance;
            
            // clear inputs
            const inputs = document.querySelectorAll('input, textarea');
            inputs.forEach(i => i.value = '');
            
            window.scrollTo(0, 0);
        }

        function showHub() {
            profileView.style.display = 'none';
            hubView.style.display = 'grid';
        }
    </script>
</body>
</html>
